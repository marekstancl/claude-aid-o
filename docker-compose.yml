# AID Orchestrator — Docker Compose
#
# Usage:
#   docker compose up --build        # Build and start
#   docker compose up -d             # Start in background
#   docker compose down              # Stop
#
# GUI:  http://localhost:3911
# API:  http://localhost:3911/api/projects
# WS:   ws://localhost:3911/ws

services:
  aid-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-orchestrator
    ports:
      - "${AID_PORT:-3911}:3911"
    volumes:
      # Cross-project discovery root — every project with an .aid-o/ workspace.
      # Read-write: the cockpit writes ideas, decisions and schedule into .aid-o/
      - ${AID_HOST_ROOT:-/opt/eco/projects}:/projects
      # Mount Claude credentials for AI Companion (AI SDK + CLI fallback)
      # Read-write needed: Agent SDK writes debug logs to ~/.claude/debug/
      - ${HOME}/.claude:/root/.claude
    environment:
      - AID_PORT=3911
      - AID_HOST=0.0.0.0
      # Container-side discovery root + its host equivalent, so emitted links
      # and evidence paths translate back to real host paths
      - AID_PROJECTS_ROOT=/projects
      - AID_HOST_ROOT=${AID_HOST_ROOT:-/opt/eco/projects}
      - AID_CORS_ORIGINS=*
      # Whisper přes LiteLLM proxy (D-082) — dedikovaný virtual key, ne přímo OpenAI
      - LITELLM_API_KEY=${AID_LITELLM_KEY:-}
      - WHISPER_API_URL=http://svc-litellm:8830/v1/audio/transcriptions
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    networks:
      - default
      - shared-infra  # dosah na svc-litellm:8830 (D-082)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3911/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  shared-infra:
    external: true
