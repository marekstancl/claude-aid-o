# AID Orchestrator — Docker Compose
#
# Usage:
#   docker compose up --build        # Build and start
#   docker compose up -d             # Start in background
#   docker compose down              # Stop
#
# GUI:  http://localhost:3911
# API:  http://localhost:3911/api/projects
# WS:   ws://localhost:3911/ws

services:
  aid-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aid-orchestrator
    ports:
      - "${AID_PORT:-3911}:3911"
    volumes:
      # Mount the project directory so the server can read .aid-o/
      - .:/project:ro
      # Mount .aid-o/ read-write for ideas, decisions, schedule writes
      - ./.aid-o:/project/.aid-o
      # Mount Claude credentials for AI Companion (AI SDK + CLI fallback)
      # Read-write needed: Agent SDK writes debug logs to ~/.claude/debug/
      - ${HOME}/.claude:/root/.claude
    environment:
      - AID_PORT=3911
      - AID_HOST=0.0.0.0
      - AID_PROJECT_ROOT=/project
      - AID_CORS_ORIGINS=*
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3911/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
