# Knowledge Base — Per-Project Reference Index
# See: skills/knowledge-acquisition.md for protocol details
#
# This file tracks which documentation sources are relevant to THIS project.
# It is an index of references — actual documentation content lives in Qdrant.
#
# Location in target projects: .aid-o/work/knowledge-base.yaml
# Template source: defaults/templates/knowledge-base.yaml
#
# IMPORTANT: This file is AI-managed. Do not edit manually.
# AID populates it during /aid-setup (onboarding) and /aid-research (on-demand).
# The knowledge_research() protocol maintains all entries automatically.

knowledge_base:
  # ISO 8601 timestamp — updated each time any source entry changes
  last_updated: null

  # Whether Context7 MCP is available for this environment
  # Set during /aid-setup based on MCP tool detection
  context7_available: false

  # Primary research source for new frameworks
  # Values: context7 | websearch
  # "context7" when Context7 MCP is installed; "websearch" otherwise
  primary_source: "websearch"

  # List of documentation sources relevant to this project.
  # Each entry represents one framework/library whose documentation
  # has been researched and stored in Qdrant.
  # See: skills/knowledge-acquisition.md "Per-Project Reference Index" for full field documentation.
  #
  # Example entry:
  #   - id: "kb-001"
  #     framework: "FastAPI"
  #     version: "0.115.x"
  #     type: "official_docs"              # official_docs | manual | community
  #     source: "context7"                 # context7 | websearch | manual
  #     library_id: "/tiangolo/fastapi"    # Context7 ID (null if source != context7)
  #     url: "https://fastapi.tiangolo.com/"
  #     indexed_at: "2026-02-20"
  #     valid_until: "2026-05-20"          # indexed_at + 90 days TTL
  #     status: "active"                   # active | stale | invalid | pending_index
  #     depth: "quick"                     # quick (5-15 chunks) | deep (20-50 chunks)
  #     chunks_in_qdrant: 12
  #     confidence: "high"                 # high | medium | low
  #
  sources: []
