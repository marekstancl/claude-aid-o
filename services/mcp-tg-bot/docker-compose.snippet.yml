# P032 Step 6 — svc-mcp-tg-bot service block.
#
# This file is NOT a complete docker-compose.yml — it's a copy-paste snippet
# for /opt/eco/services/docker-compose.yml on eco-dev (10.20.20.22) and
# eco-prod (10.20.20.21). The aid-orchestrator git repo cannot ship the
# eco-services docker-compose directly because it lives in a separate
# tree (/opt/eco/services/) maintained by the PM out-of-band.
#
# To deploy:
#   1. Append the `svc-mcp-tg-bot:` block below into the `services:` map
#      of /opt/eco/services/docker-compose.yml on each host.
#   2. Adjust `build:` context if the aid-orchestrator checkout lives
#      elsewhere (default assumes ./aid-orchestrator/services/mcp-tg-bot
#      relative to /opt/eco/services/).
#   3. cd /opt/eco/services && docker compose up -d --build svc-mcp-tg-bot
#   4. curl -fsS http://127.0.0.1:8818/health
#
# Token + chat ID live in /opt/eco/services/.env (per ekosystem convention,
# NOT committed). See services/mcp-tg-bot/.env.example for the template.

services:
  svc-mcp-tg-bot:
    build: ../projects/aid-orchestrator/services/mcp-tg-bot
    container_name: svc-mcp-tg-bot
    env_file: /opt/eco/services/.env
    environment:
      # Bind to 127.0.0.1 explicitly even though network_mode: host already
      # exposes the port. Defense-in-depth against future compose edits that
      # might flip the network back to bridge mode (plan §S.2 audit step).
      - MCP_HTTP_HOST=127.0.0.1
      - MCP_HTTP_PORT=8818
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8818/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
