name: CI
# Runs on a dedicated self-hosted runner (eco-dev-aid-orchestrator, registered
# only to this repo) instead of GitHub-hosted ubuntu-latest — GitHub-hosted
# queue/execution time on this repo's growing bats portfolio had become the
# dominant part of every PR's turnaround (2026-08-02).
#
# Security note: this repo is PUBLIC. Self-hosted runners on public repos are
# a real attack surface — GitHub's platform-level mitigation is that workflow
# runs from first-time outside contributors require a maintainer's manual
# approval before anything executes (this is NOT configurable off; it is the
# baseline behavior for all public repos, self-hosted or not). There is
# currently no history of external contributors on this repo. If that
# changes, re-evaluate whether PR-triggered jobs should stay on this runner
# or move back to a GitHub-hosted runner for `pull_request` specifically,
# since the approval gate only covers a contributor's FIRST run, not every
# subsequent one, and a self-hosted runner's state persists across jobs
# (no per-run VM reset the way GitHub-hosted runners get).
on:
  push:
    branches: [main]
    # Plan text and review evidence change nothing this workflow can verify.
    # Measured 2026-08-11: of 14 runs stacked in a stuck queue, most were
    # `plan:`/`docs:` commits. `.aid-o/plans` and `.aid-o/work` are read by NO
    # suite against the real repository — every suite that mentions them builds
    # its own fixture under TEST_PROJECT_ROOT (checked file by file).
    # `docs/**` is deliberately NOT ignored: test-deferred-work-registration
    # reads the real `docs/plans/2026-06-29-BACKLOG.md` at line 35.
    paths-ignore:
      - '.aid-o/plans/**'
      - '.aid-o/work/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.aid-o/plans/**'
      - '.aid-o/work/**'

# One in-flight run per ref. Without this, a burst of pushes queues a run per
# commit and they all verify supersededed trees — on 2026-08-11 fourteen were
# waiting behind a dead runner, the oldest 17 hours old, testing versions of
# main that no longer existed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-tests:
    runs-on: [self-hosted, eco-dev]
    steps:
      - uses: actions/checkout@v5
      - name: Install jq + bats + yq
        # bats is required for the FSM / release / integration suites; without it
        # run-all-tests.sh silently SKIPS them (they look green but never run).
        # yq is required for dg12-authority.sh to parse YAML authority files.
        run: |
          command -v jq >/dev/null 2>&1 && command -v bats >/dev/null 2>&1 && command -v yq >/dev/null 2>&1 || {
            sudo apt-get install -y jq bats
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }
          # test-aid-test-catalog-schema.bats/test-execution-unit-receipt-schema.bats
          # each skip (not fail) their assertions when python3-jsonschema is
          # absent — install it so a lost package reads as a red build, not a
          # silently growing skip count (P075 Step 4).
          python3 -c 'import jsonschema' >/dev/null 2>&1 || sudo apt-get install -y python3-jsonschema
      - name: Run bash test suite
        # 2026-08-02: this job's own real CI run only reached suite 53/131 in
        # its 20-minute budget (last measured a while ago at a much smaller
        # suite count) — WHILE running concurrently with 3 sibling jobs on
        # the same self-hosted host, which may have slowed it further via
        # disk/CPU contention (still being measured in isolation to get a
        # clean number). 60 min is a wide, non-final safety margin — revisit
        # once a clean, uncontended local measurement exists.
        # P081 whole-diff review fix: this job is the REAL merge gate on
        # GitHub. Converting only the AID gate layer (execution.yaml) left the
        # whole portfolio running here, in front of every merge — the exact
        # thing the pilot exists to end, and nightly-tests.yml already claimed
        # was done. The merge path is T0 + T1; the rest runs nightly.
        run: |
          chmod +x plugins/aid-orchestrator/scripts/tests/run-all-tests.sh
          plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t0 --verbose
          plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t1 --verbose
        # 30, AND A DECLARED DEBT. The nightly's first real portfolio measurement
        # (2026-08-15) puts the merge path at 20.3 min — T0 2.3 (budget 2) and
        # T1 18.0 (budget 10) — so a 20-minute ceiling cancelled the job and CI
        # went red for a cost nobody had chosen. Raising it unblocks work; it
        # does NOT make the merge path affordable, and this comment exists so
        # the number is not mistaken for a budget later.
        #
        # The standard's answer is that something leaves the merge path: the six
        # most expensive T1 suites are 9.6 of those 18 minutes, and moving them
        # to the nightly puts the path back near 10. That is a coverage
        # decision, taken deliberately, not under a red build (PM, 2026-08-15).
        timeout-minutes: 30

  # ---------------------------------------------------------------------------
  # Shadow run of the merge path on a GitHub-hosted runner.
  #
  # This is a MEASUREMENT, not a gate: continue-on-error means it can never
  # block a merge. It exists to answer one question with evidence instead of
  # opinion — does the merge path pass off this machine?
  #
  # Why it might not: T0 and T1 are defined as touching no service and no
  # network, so in principle they need nothing local. In practice a suite can
  # quietly depend on a path, an installed tool or a shared directory that only
  # exists on eco-dev. Such a suite passes at home and fails here, and that
  # divergence is the finding.
  #
  # Free here: this repository is public, so GitHub-hosted minutes cost nothing
  # (verified 2026-08-11). Private eco repos keep everything self-hosted.
  #
  # Exit criterion: once this job matches `bash-tests` on two consecutive runs,
  # the merge path moves here for real and the self-hosted host keeps only the
  # nightly T2 portfolio, which genuinely needs local infrastructure.
  # See /ecosystem/specs/test-standard → "Kde která patra běží".
  merge-path-hosted-shadow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install jq + bats + yq + jsonschema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq bats python3-jsonschema
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Merge path (T0 + T1) on a hosted runner
        run: |
          chmod +x plugins/aid-orchestrator/scripts/tests/run-all-tests.sh
          plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t0 --verbose
          plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t1 --verbose
        timeout-minutes: 30
  # ── The five T2 suites no longer have jobs here (2026-08-14) ─────────────
  # test-aid-plan-final-boundary, test-aid-plan-release-boundary,
  # test-aid-service, test-service-lifecycle and test-owned-jobs-integration
  # each had a dedicated job on every push and PR. All five are tagged
  # `# aid-tier: t2`, and the ecosystem test standard is explicit: T2 runs in
  # the nightly cron and NEVER on the merge path — "uzavření plánu ani merge
  # nikdy nečeká na T2".
  #
  # How the contradiction happened, since it will otherwise happen again: the
  # jobs were added 2026-07-25 (P068), when the heaviest of them took ~22 min
  # and tiers did not exist. Tiers arrived 2026-08-11 (P081) and stamped the
  # tags, which changed what the RUNNER selects — not what GitHub schedules.
  # Nothing compared the two. By 2026-08-14 the suite needed ~199 min against
  # this file's 35-minute limit, so the job could not go green at all, and had
  # not for days: a permanently red merge path that no longer meant anything.
  #
  # The five suites now run in the nightly full portfolio, and
  # scripts/tests/test-tier-ci-topology.sh fails if a T2 suite is ever named on
  # a push/PR-triggered job again.

  vitest:
    runs-on: [self-hosted, eco-dev]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Build @aid/contract (required by aid-gui tests)
        run: npm run build -w @aid/contract
      - run: npm test
        timeout-minutes: 10

  build-check:
    needs: [vitest]
    runs-on: [self-hosted, eco-dev]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build -w @aid/contract
      - run: npm run build
        working-directory: packages/aid-gui
        timeout-minutes: 10

  security-regression:
    runs-on: [self-hosted, eco-dev]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node scripts/check-path-validation.js
        timeout-minutes: 2

  # ── P089 Step 9: the release-scope verdict, in a log that is read ─────────
  # A NOTICE, NOT A GATE. The facade always exits 0 — the pre-push hook is the
  # place that blocks, and a second blocker over one question would just be a
  # second thing to argue with. What this step buys is that the decision, and
  # the commits behind it, are visible after the fact.
  #
  # `fetch-depth: 0` is load-bearing: the range starts at the last version tag,
  # and a shallow checkout carries no tags at all — the facade would report
  # every commit in history as unreleased.
  #
  # This step is also the reference a consumer copies into their own workflow.
  release-scope:
    runs-on: [self-hosted, eco-dev]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Release scope for this range
        run: bash plugins/aid-orchestrator/scripts/aid-release-check.sh
        timeout-minutes: 2
