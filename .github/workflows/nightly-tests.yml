name: Nightly tests
# P081 Step 7 — the full portfolio, off the merge path.
#
# THE POINT OF THIS FILE: `ci.yml` used to be where the whole 3 h 23 min
# portfolio sat, in front of every merge. It now runs T0+T1 there and the WHOLE
# portfolio runs HERE, once a night, where it delays nobody. Before this file
# the repo had no `schedule:` trigger at all.
#
# The whole portfolio and not just T2: re-running T0+T1 costs ~12 minutes at
# 21:00 UTC and buys two things a T2-only run cannot — one place where the entire
# suite is proved green together, and a `--timing` pass that refreshes EVERY
# tier's durations, which is what lets the lint catch a T0 suite that has grown
# into T1 territory.
#
# 21:00 UTC (23:00 Prague) is AID's own slot. The self-hosted runner is shared across the
# ecosystem and cannot carry six portfolios at once, so each adopting project
# gets a different hour — this one is AID's, and a project adopting the
# standard later picks another.
#
# `workflow_dispatch` is not decoration: the pilot's own acceptance depends on
# running this configuration on demand and reading the artifact it produced
# from a developer's checkout.
on:
  schedule:
    # 21:00 UTC = 23:00 Prague (CEST) / 22:00 (CET). The PM goes to bed early
    # and starts early, so the run must FINISH before the working day, not
    # during it: at ~3.5 h it lands around 00:30-01:30 local, and the result is
    # already waiting in /aid-status and (if red) on Telegram at breakfast.
    # GitHub cron is UTC and does not follow DST — in winter this is 22:00
    # local, which is still comfortably before the morning.
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  nightly-portfolio:
    runs-on: [self-hosted, eco-dev]
    steps:
      - uses: actions/checkout@v5
        with:
          # FULL history, not a window. Two things here read the past: the
          # selector honesty check replays the last merge's changed paths (which
          # a depth of 50 covered), and test-watchdog-stall pins a behaviour to
          # `git show f007069:…` — 203 commits back, so it failed every night
          # with "invalid object name" while passing on any developer's full
          # clone. A depth chosen for one reader silently breaks the next one;
          # 0 has no such edge.
          fetch-depth: 0

      - name: Install jq + bats + yq
        run: |
          command -v jq >/dev/null 2>&1 && command -v bats >/dev/null 2>&1 && command -v yq >/dev/null 2>&1 || {
            sudo apt-get install -y jq bats
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }
          python3 -c 'import jsonschema' >/dev/null 2>&1 || sudo apt-get install -y python3-jsonschema

      - name: Run the whole portfolio with timing
        # The durations journal goes to the SHARED HOST path, not under
        # .aid-o/ — that directory is gitignored and thrown away with this
        # checkout every run, which is why it sat three days stale while the
        # merge path nearly doubled.
        env:
          AID_DURATIONS_DIR: /opt/eco/data/aid-nightly/aid-orchestrator
        id: portfolio
        # Generous, because this job blocks nobody. `--timing` refreshes the
        # durations journal every night, which is what keeps tier assignments
        # honest without ever needing a special measurement campaign again.
        # `continue-on-error`: a red portfolio is the REPORT's subject, not a
        # reason to skip writing the report.
        continue-on-error: true
        run: |
          chmod +x plugins/aid-orchestrator/scripts/tests/run-all-tests.sh
          set +e
          # No --tier: an untiered run IS the full portfolio. (It used to also
          # pass --include-delegated; delegation was removed 2026-08-14 and the
          # flag is now a deprecated no-op.)
          plugins/aid-orchestrator/scripts/tests/run-all-tests.sh \
            --timing --verbose > nightly-run.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        # 480, not 300: the portfolio measured 7 h on 2026-08-11 and the old
        # 300-minute cap cut it off three nights running — and because the
        # REPORTER is what announces a bad night, the silence looked exactly
        # like health. The cap is not the fix; the fix is the 199-minute suite
        # (47% of the portfolio, see /aid/testing). Until that lands, a night
        # that finishes and tells the truth beats a night that is killed.
        timeout-minutes: 480

      # The merge path, timed as TWO REAL RUNS — the standard's own rule is
      # that a tier budget is verified by a run, never by summing suites
      # (2 s/suite runner overhead makes a sum lie). This is what nobody was
      # doing: between 2026-08-11 and 08-14 the merge path grew from 42 suites
      # and 13 min to 72 and 18 min, both tiers over budget, and no surface
      # said so. Costs ~18 min inside a 7-hour job.
      - name: Measure each tier of the merge path
        id: tiers
        continue-on-error: true
        run: |
          set +e
          _t0_start=$(date +%s)
          plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t0 >/dev/null 2>&1
          echo "t0_seconds=$(( $(date +%s) - _t0_start ))" >> "$GITHUB_OUTPUT"
          _t1_start=$(date +%s)
          plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t1 >/dev/null 2>&1
          echo "t1_seconds=$(( $(date +%s) - _t1_start ))" >> "$GITHUB_OUTPUT"
        timeout-minutes: 90

      - name: Write the result and report it
        # The artifact lands on a shared HOST path, never under `.aid-o/` —
        # that directory is gitignored, so a file written there in this
        # checkout could never be read from anyone else's.
        run: |
          bash plugins/aid-orchestrator/scripts/aid-nightly-report.sh \
            --runner-log nightly-run.log \
            --exit-code "${{ steps.portfolio.outputs.exit_code }}" \
            --t0-seconds "${{ steps.tiers.outputs.t0_seconds }}" \
            --merge-path-suites "$(plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t0 --list 2>/dev/null | sed -n 's/^[A-Z]*: \([^ ]*\).*/\1/p'; plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t1 --list 2>/dev/null | sed -n 's/^[A-Z]*: \([^ ]*\).*/\1/p')" \
            --t1-seconds "${{ steps.tiers.outputs.t1_seconds }}" \
            --log-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Check the selector's honesty
        # A gap is REPORTED, never a job failure: the finding is about the
        # merge-path selector, and failing this job would only teach people to
        # ignore it.
        continue-on-error: true
        run: bash plugins/aid-orchestrator/scripts/aid-selector-honesty-check.sh --repo .

      - name: Attach the night's artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-result
          path: |
            nightly-run.log
            /opt/eco/data/aid-nightly/aid-orchestrator/*.json
          if-no-files-found: warn

  # ── Its own job, and this is why ──────────────────────────────────────────
  # The isolation run started life as a step of nightly-portfolio and cancelled
  # the whole job on its first night (2026-08-15): portfolio 285 min + tiers
  # 21 + report 2 + isolation 50 = 358, and GitHub cancels a job at 360. The
  # step's own `timeout-minutes: 120` was never reached — the JOB ran out of
  # time, which reads as "cancelled", not as "this check is too slow".
  #
  # A separate job has its own six hours and does not depend on the portfolio's
  # result: it re-runs ONE suite in a permuted case order, so the only thing it
  # needs is a checkout.
  isolation-permuted-order:
    runs-on: [self-hosted, eco-dev]
    steps:
      - uses: actions/checkout@v5
      - name: Install jq + bats + yq
        run: |
          command -v jq >/dev/null 2>&1 && command -v bats >/dev/null 2>&1 && command -v yq >/dev/null 2>&1 || {
            sudo apt-get install -y jq bats
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }
      - name: Isolation — the snapshot suite in a permuted case order
        # IMP-505 made two suites build their fixture ONCE per file and restore a
        # copy per case. That is fast and it is also the classic way to make a
        # suite quietly order-dependent: shared state looks green until the day
        # it doesn't. bats 1.8.2 has no shuffle, so the order is permuted
        # mechanically (the tool proves its output is a permutation of the input
        # before writing it) and the suite is run again in that order.
        #
        # The seed is the run number: a different order every night, and the
        # exact failing order reproducible from the log by anyone.
        #
        # REPORTED, never a job failure — same discipline as the honesty check
        # below. A contamination finding is a real bug worth a message, but
        # failing the nightly on it would bury the portfolio result underneath.
        continue-on-error: true
        run: |
          set -e
          suite=plugins/aid-orchestrator/scripts/tests/bats/test-aid-plan-final-boundary.bats
          perm="$(plugins/aid-orchestrator/scripts/tests/aid-bats-permute.sh "$suite" "${GITHUB_RUN_NUMBER:-1}")"
          echo "permuted order, seed ${GITHUB_RUN_NUMBER:-1}: $perm"
          bats "$perm" || {
            echo "::warning::the plan-final suite behaves differently in a permuted case order (seed ${GITHUB_RUN_NUMBER:-1}) — fixture isolation regression"
            exit 1
          }
        timeout-minutes: 120
