version: '1.0'
generated_by: manual override for E-035-1_2 (P035 Phase 1)
gates:
  bats_fsm:
    command: bats plugins/aid-orchestrator/scripts/tests/bats/test-aid-fsm.bats
    required: true
    timeout_seconds: 300
    max_retries: 1
  bats_all:
    # QUARANTINE LIFTED (P071 E-071-1_1 Step 3, 2026-08-02): the 2026-07-23
    # quarantine (below, kept for history) blocked the monolithic aggregate
    # after two overlapping E-064-2_2 runs shared the live repository and
    # cost 50-95 minutes of untrustworthy evidence. P071 replaced the blanket
    # `bats plugins/aid-orchestrator/scripts/tests/bats/` invocation with a
    # partitioned run (everything except the 2 known-slow boundary files
    # below). P078 removed the parallel lane wrapper that once performed that
    # partition; the partition stays, now as the plain globbed-and-filtered
    # bats invocation in `command:` above.
    #
    # CP2 fix (2026-08-02): this gate ONLY runs the pool phase now, split out
    # from the 2 boundary files (see gate:bats_boundary below) — an earlier
    # version ran both phases under ONE required:true gate with
    # timeout_seconds:1800, but test-aid-plan-final-boundary.bats alone is
    # known (this session's diagnostic work) to potentially exceed 3600s+
    # without completing, which would have made this required gate fail from
    # a plain timeout kill on essentially every real invocation, until Step 4
    # fixes that file's speed — a real regression vs. the quarantine stub it
    # replaced. Splitting keeps this gate real, required, and fast; the 2
    # slow boundary files get their own separate, non-required gate instead.
    #
    # Original 2026-07-23 quarantine record (history only, no longer active):
    #   authorized_by: "PM 2026-07-23"
    #   tracked_by: "P066"
    #   original_command: "bats plugins/aid-orchestrator/scripts/tests/bats/"
    # P078 (2026-08-10): parallelism removed — plain sequential bats over the
    # suite directory, still excluding the 2 slow boundary files (they keep
    # their own gate:bats_boundary below; the exclusion predates parallelism
    # and survives it — it is about budget isolation, not pooling).
    #
    # P081 Step 6 (2026-08-10): THIS GATE IS NOW T0+T1, NOT THE PORTFOLIO.
    # The old command was a glob with a hand-maintained negative filter naming
    # the two boundary suites. Tier filtering plus the delegation map express
    # the same partition declaratively, so the filter is REMOVED rather than
    # translated — and the partition is now derived from measured cost instead
    # of from whichever files somebody remembered to exclude. The gate keeps
    # its NAME so every profile, registry row and historical baseline that
    # references it stays valid. What used to run here now runs nightly
    # (gate:shell_pipeline_smoke below, .github/workflows/nightly-tests.yml).
    command: "bash -c 'plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t0 && plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t1'"
    required: true
    timeout_seconds: 900   # the standard's own budgets — T0 ≤ 2 min, T1 ≤ 10 min
                           # — plus headroom. aid-test-tier-assign.sh ENFORCES
                           # those budgets by demoting the most expensive member
                           # while a tier overflows, so this cap is bounded by
                           # construction rather than by hope. The previous
                           # 2400s stood over an UNBACKED 1556s estimate for a
                           # whole-portfolio run this gate no longer performs.
    # P076 Step 1 (2026-08-09): supervised background job via aid-job.sh.
    # Rationale, stated honestly. An earlier version of this comment called
    # the 1556s figure above "measured, not guessed". It is not: the repo's
    # own test audit TAUD-20260806-0440 (content-scan.json ->
    # checks.fabricated_measured) records gate:bats_all as
    # {claimed_ms: 1556000, actual_ms: null, "claimed measured, no
    # measurement exists"}. Treat 1556s as an UNBACKED ESTIMATE inherited
    # from the timeout_seconds note above — one alleged uncapped run, never a
    # p95, with no completed-run record behind it.
    # What IS on record is enough on its own: since the P071 quarantine lift
    # this gate has never completed under a 600s cap (censored samples only),
    # so its true cost is unknown and known to be large. A gate of unknown,
    # large cost is exactly the one an interrupted session must not have to
    # restart from zero.
    # Backgrounded, the job is owned by its process group and its result is
    # bound to the start HEAD/tree, so a rerun after a crash re-attaches to
    # the still-live job instead of paying the 26 minutes twice. Failure
    # semantics, required-ness, timeout and retry budget are unchanged.
    run_mode: background
    max_retries: 0
  bats_boundary:
    # P071 E-071-1_1 Step 3 CP2 fix (2026-08-02): the 2 bats files excluded
    # from gate:bats_all's run (test-aid-plan-final-boundary.bats,
    # test-aid-plan-release-boundary.bats) — both create a real git repo per
    # test and run sequentially, never pooled. required:false + a generous
    # timeout because test-aid-plan-final-boundary.bats's own root-cause fix
    # is explicitly P071 Step 4's job, not this gate's; until that lands this
    # gate is advisory (informational signal only, never blocks GATES→DONE).
    # Re-evaluate required:true once Step 4 brings this file's cost down to
    # something a real timeout budget can bound.
    # P078 (2026-08-10): plain sequential bats, same 2 files the lane
    # wrapper used to resolve before P078 deleted it.
    #
    # P081 Step 6 (2026-08-10): OFF THE MERGE PATH. Both suites are T2 by any
    # measurement — each builds a real git repository per test — and a gate
    # with a two-hour ceiling in front of every merge is precisely what this
    # plan exists to remove. The gate definition stays (its two suites still
    # run, in the nightly's T2 selection); it is simply no longer in any
    # merge-path profile.
    command: "bats plugins/aid-orchestrator/scripts/tests/bats/test-aid-plan-final-boundary.bats plugins/aid-orchestrator/scripts/tests/bats/test-aid-plan-release-boundary.bats"
    required: false
    timeout_seconds: 7200
    # P076 Step 1 (2026-08-09): supervised background job via aid-job.sh.
    # This is the longest gate in the repository — the 2 sequential boundary
    # files each build a real git repo per test, and
    # test-aid-plan-final-boundary.bats alone has been observed running past
    # 3600s without completing, which is why the cap is 7200s. A gate with a
    # two-hour ceiling is precisely the one an interrupted auto-mode run must
    # not have to restart: backgrounded, the job survives the interruption
    # and the next run re-attaches by command fingerprint. required:false
    # (advisory) is untouched — backgrounding an advisory gate is legal and
    # changes none of its failure semantics.
    run_mode: background
    max_retries: 0
  shell_pipeline_smoke:
    description: >-
      Despite the name, this is NOT a fast/partial smoke check — it runs the
      FULL aggregate test suite via run-all-tests.sh (timeout_seconds 7200).
      It OVERLAPS gate:bats_all rather than containing it: this gate adds 47
      standalone test-*.sh shell suites bats_all never touches, while bats_all
      covers the bats aggregate this gate partly delegates to CI jobs.
      Neither set contains the other, so neither gate substitutes for the
      other. (P078: the isolation-experiment suite both once referenced was
      deleted with the parallelism machinery.) Its cost under the CURRENT cap is unmeasured:
      gate-runtime-baselines.yaml records 5 non-censored runs (p50 1393316 ms,
      p90/p95/max 1869545 ms), the newest dated 2026-07-15, and every one of
      the 8 samples since is exit 124, censored at the then-1900s cap. bats_all
      has never completed at all (percentiles null), so the two gates have no
      comparable current measurement.
    # Kept the historical key name rather than renaming it (P071 E-071-1_1
    # Step 2, 2026-08-02) — release_quarantine's own reason text (see below)
    # quotes `shell_pipeline_smoke` verbatim, p064-closure's reason text
    # quotes it too, and grep across .aid-o/work/ turns up dozens of evidence
    # plan.json / interim-doc references to this exact string. A rename would
    # require rewriting all of those consistently with no reliable way to
    # confirm every reference was caught, for a gate that has no other active
    # collision. The name's "smoke" implication is corrected via description
    # above instead.
    # P081 Step 6 (2026-08-10): THIS IS THE NIGHTLY'S COMMAND NOW, and it is in
    # NO merge-path profile. The tier work did not make this run cheaper — it
    # moved it to where its cost is free.
    #
    # NO `--tier` HERE, deliberately. An earlier cut ran `--tier t2` — the
    # portfolio minus what the merge path already covered — which sounds
    # efficient and quietly breaks two of this plan's own claims: the full
    # portfolio would never run green in one place, and `--timing` would only
    # ever refresh T2 durations, so a T0 suite that grew into T1 territory
    # could never be caught by the lint that compares a tag against its newest
    # measurement. Re-running 12 minutes of T0+T1 at 02:40 costs nothing.
    # `--include-delegated` because the nightly is the one run that owes every
    # suite a measurement.
    # .github/workflows/nightly-tests.yml runs the same selection, and
    # test-tier-gate-routing.bats asserts the two do not drift apart.
    command: bash plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --timing --include-delegated
    required: false
    # 1900s -> 7200s (2026-08-04). A real audit cut this gate off at 2001s with
    # 73 of 151 suites done, so it had NEVER completed inside its cap — and a
    # gate that always stops a third of the way through verifies nothing while
    # still costing half an hour. It hid a genuine failing case for two commits,
    # exactly as bats_all's own 600s cap did.
    #
    # 7200 is a CEILING chosen to let the gate finish and finally produce a real
    # number, NOT a prediction of how long it takes. No run under the CURRENT cap
    # has completed: the 5 non-censored samples in
    # .aid-o/metrics/gate-runtime-baselines.yaml (p50 1393316 ms, p90/p95/max
    # 1869545 ms) all date from 2026-07-12 to 2026-07-15 and were taken at the
    # then-1900s cap, and
    # every sample since is exit 124. 2001s/73-suites is a lower bound, and
    # scaling it to 151 would be the arithmetic this plan forbids. Note the
    # baseline machinery already derives timeout_recommended_seconds: 2805 and
    # run_mode_recommended: background for this gate from those stale samples —
    # 7200 is ~2.6x that, deliberately, because it is a ceiling and not an
    # estimate. Once one run completes under this cap, set both from the
    # measurement.
    #
    # For scale (P076 Step 7, 2026-08-09): an earlier version of this line said
    # "bats_all measures 1602s". No completed run backs that number. The
    # runtime baseline .aid-o/metrics/gate-runtime-baselines.yaml records
    # gate:bats_all as samples_count 2 / non_censored_samples_count 0, both
    # exit 124 at the 600s cap, with p50/p90/p95/max all null — bats_all has
    # never completed a measured run at all. The figure is not unique to this
    # file: .aid-o/work/evidence/P073/cp1-deep/cp1-lens-L3-enforcement.md:12
    # cites "a 1556-1602s measurement" — but that line sources itself to
    # `.aid-o/config/execution.yaml:36`, i.e. it is review prose quoting this
    # config, not an independent measurement record. 1602s and the 1556s
    # figure above are both unbacked estimates (cf. test audit
    # TAUD-20260806-0440, checks.fabricated_measured).
    #
    # The comparison the line was reaching for survives without a number, but
    # it rests on OVERLAP, not containment: each of the two gates runs work the
    # other never touches, so neither set contains the other and neither gate
    # is redundant or a substitute for the other.
    #   - This gate runs 47 standalone `test-*.sh` shell suites
    #     (plugins/aid-orchestrator/scripts/tests/test-*.sh, none excluded by
    #     the discovery loop). gate:bats_all invokes bats files only and runs
    #     none of them.
    #   - gate:bats_all globs the bats tree and skips only the 2 boundary
    #     files, so it runs every other bats suite inline; this gate skips
    #     whatever DELEGATED_SUITES (run-all-tests.sh) hands to a dedicated
    #     CI job.
    #   - The 2 boundary files (test-aid-plan-final-boundary.bats,
    #     test-aid-plan-release-boundary.bats) are skipped by BOTH gates;
    #     gate:bats_boundary is what runs them.
    # P079 obligation 1 resolution (2026-08-10): cap from the honest measurement
    # on 102a5f3 — 12200 s (3 h 23 min) full portfolio, RC=1 with all failures in
    # the cancelled test-audit line; delegation since REMOVED the three heaviest
    # suites, so 12200 s is a conservative upper bound. max(12200*1.5, +60) =
    # 18300 s. No routine re-measurement — re-derive only when the portfolio
    # grows materially (PM decision 2026-08-10).
    timeout_seconds: 18300
    run_mode: background
    max_retries: 0
  # P081 whole-diff review follow-up (2026-08-11): the tier lint was registered
  # `severity: blocking` and invoked by NOTHING — check 1 (every suite declares
  # a tier) survived only because run-all-tests.sh re-implements it, and checks
  # 2 (no plan number in a filename) and 3 (a tier no cheaper than its newest
  # measurement) had no enforcement path at all. Cheap, seconds, no processes.
  # Check 3 is machine-local until the durations journal has a CI transport;
  # it reports UNVERIFIED rather than failing, which is stated in the script.
  tier_lint:
    command: "bash plugins/aid-orchestrator/scripts/aid-test-tier-lint.sh"
    required: true
    timeout_seconds: 120
    max_retries: 0

  plan_diff:
    note: 'required=false for AID self-host: P037 plan predates plan-level AC convention;
      gate becomes meaningful for P038+'
    description: Plan AC blocks materially satisfied in codebase HEAD
    # timeout_seconds attribution (P071 E-071-1_1 Step 1, 2026-08-02): the
    # p064-closure profile's "34 min of wall clock" note (below) describes
    # plan_diff and shell_pipeline_smoke TOGETHER (both excluded from that
    # profile as a pair) and does not break out a per-gate duration.
    # .aid-o/config/execution.yaml is git-ignored (**/.aid-o/ in .gitignore),
    # so there is no commit history to trace which gate contributed how much
    # of the 34 min — the attribution to plan_diff alone could not be
    # confirmed or ruled out. Falling back to this gate's own historical
