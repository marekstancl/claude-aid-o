    # unbounded/guessed value.
    timeout_seconds: 300
    pass_criteria: exit 0 (all present) or exit 2 (legacy plan / Fast Mode graceful
      skip)
    max_retries: 0
  ui_calibration_result:
    description: "Calibration evidence verified: 5 cases pass/fail, all artifacts present on disk, D-desktop/D-mobile prove real ScreenG capture"
    note: "required=false for post-E7-CAL EPICs: one-time verification done in E-056-2_3; gate is advisory for subsequent runs"
    required: false
    type: deterministic
    command: "bash plugins/aid-orchestrator/scripts/tests/ui-calibration-verify.sh .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json .aid-o/work/evidence/{epic_id}/{run_id}"
    timeout_seconds: 30
    pass_criteria: "exit code 0 (all verification checks pass)"
    max_retries: 0
  ui_calibration_signoff:
    description: "PM has manually signed off on E7-CAL calibration results after reviewing 5-case evidence pack"
    note: "required=false for post-E7-CAL EPICs: signoff was completed in E-056-2_3; advisory for subsequent runs"
    required: false
    type: deterministic
    command: "jq -e '.calibration.pm_signoff.confirmed_by | length > 0' .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json"
    timeout_seconds: 10
    pass_criteria: "exit code 0 (confirmed_by is non-empty string)"
    max_retries: 0
  targeted_tests:
    note: 'P061 EPIC 3 Step 10 — defined but NOT activated in any self-host
      gate_profiles.*.include[] yet (EPIC 4, D1/D3, wires the self-host
      activation); registered here so aid-run-gates.sh can resolve and run it
      on demand ahead of that activation.'
    description: Targeted test selector — maps git-diff changed paths to their
      mapped test(s) via the Initial mapping and runs them for real; an
      unknown production path is a deliberate fail, never a silent skip
      (D-selector-1).
    required: false
    type: deterministic
    command: plugins/aid-orchestrator/scripts/aid-select-tests.sh --base {base_commit}
    timeout_seconds: 600
    pass_criteria: exit 0 (selected tests passed, or nothing selected e.g.
      docs-only change); exit 1 = a selected test failed; exit 3 = unverifiable
      unknown production path (D-selector-1) — both 1 and 3 surface as gate
      result "fail" (any non-zero exit)
    max_retries: 0
  docs_updated:
    description: "Documentation updated for changed APIs/models"
    required: false
    type: deterministic
    command: |
      api_changed=$(git diff --name-only {base_commit}..HEAD | grep -cE 'routes/|api/|endpoints/|models/|schemas/|openapi/' || true)
      doc_changed=$(git diff --name-only {base_commit}..HEAD | grep -cE 'README|docs/|CHANGELOG|\.md$' || true)
      if [[ $api_changed -gt 0 && $doc_changed -eq 0 ]]; then
        echo "WARN: API files changed ($api_changed) but no docs updated"; exit 1
      fi
notifications:
  telegram:
    enabled: false
    chat_id: null
    alert_on_repeated_precondition_fail: true
    alert_threshold: 3
# ─── Which profile runs when (2026-08-11) ────────────────────────────────────
# Until today this key was absent, which means NO profile was passed and every
# gate ran on every phase — including `bats_all`, i.e. the whole T0+T1 merge
# path (13 min) at the end of every single EPIC.
#
# That was left over from before the tier pilot: when the merge path took
# 6 h 49 m nobody would have run it per EPIC, so the question never came up;
# after it dropped to 13 min the profiles were never revisited. The PM caught
# it by asking why an agent was "running everything" on an eight-file change.
#
# The tier standard's own logic settles it: the merge path is a MERGE event.
# An EPIC merges into the plan branch, so it gets `standard` — targeted tests
# for what actually changed, plus the FSM suite and the plan-criteria check.
# The full T0+T1 sweep belongs to plan-final, which `plan_final_profile_floor:
# release` already enforces, and `release` includes `bats_all`.
#
# A step gets `targeted`: CP2 review covers the step's own diff, and a step is
# not a merge into anything.
gate_profile_defaults:
  step: targeted
  epic: standard

gate_profiles:
  # ─── P064 plan Step 8 — the five canonical risk profiles ────────────────
  # These are the names lib/aid-gate-profile.sh's resolver can return
  # (quick < targeted < standard < full < release). Until this block existed,
  # every auto-resolve took aid-fsm.sh's `gate_profile_auto_resolve_skipped`
  # branch and `targeted_tests` was defined but never activated anywhere.
  #
  # `docs_updated` is in EVERY include[] on purpose. plan.json.gates[] is a
  # per-EPIC hard floor enforced at GATES:DONE (`plan_gate_profile_excluded`,
  # aid-fsm.sh), and this repository's own EPICs routinely declare
  # `docs_updated` there — a profile that excluded it would refuse the very
  # EPIC that selected it. The gate costs two `git diff --name-only` calls,
  # so carrying it in the cheapest profile is still cheaper than one skipped
  # doc review. `release` therefore stays a strict superset of `full`.
  #
  # `bats_all` appears only in `full` and `release`: the EPIC boundary can
  # never resolve above `standard` in plan_branch mode, so the broad suite is
  # a plan-final (or PM-exception) act, not a per-EPIC one.
  #
  # `targeted_tests` runs in `targeted` and `standard` but DELIBERATELY NOT in
  # `full`/`release`, so the include lists are not a monotonic chain. This is
  # the one documented exception, raised as CP2 security finding 1 on
  # E-064-2_2 Step 3 and adjudicated here rather than silently.
  #
  # The concern is real in form: the rank order quick < targeted < standard <
  # full < release is consumed as a SAFETY order by aid-fsm.sh's
  # `risk_profile_below_required`, which asserts a higher rank verifies at
  # least as much. The exception is nonetheless correct, because
  # `targeted_tests` is a SELECTOR, not a test suite:
  #
  #   * Coverage is not lost. `aid-select-tests.sh` maps changed paths to a
  #     SUBSET of the suites `bats_all` runs unconditionally at `full`, so at
  #     `full` the selector can only ever pick tests that already ran.
  #   * The one non-redundant signal is exit 3 (unknown production path,
  #     D-selector-1). Its sole wired effect is to raise the plan-final floor
  #     to at least `full` (aid-plan-fsm.sh, epic-complete). At an active
  #     `full` the floor is already there, so the signal has nothing left to
  #     do — it can only restate a conclusion already reached.
  #   * Including it anyway would plant a permanent `fail` row in every `full`
  #     run of this repository: the Initial mapping currently covers none of
  #     `scripts/aid-plan-fsm.sh`, `scripts/lib/aid-queue-write.sh`,
  #     `scripts/lib/aid-gate-profile.sh`, `scripts/aid-queue-add.sh` or
  #     `defaults/enforcement-registry.yaml`, so exit 3 is guaranteed. A red
  #     row that carries no information the run does not already have is
  #     noise, and noise is what makes real red rows get ignored.
  #
  # The genuine fix is to extend the Initial mapping in
  # scripts/aid-select-tests.sh so those five paths resolve to suites. That
  # file is outside every step's allowed paths in this EPIC and is filed as a
  # carried finding instead. When it lands, revisit this exception: with the
  # mapping complete, exit 3 becomes rare and putting `targeted_tests` in
  # every profile costs nothing.
  quick:
    include:
      - tier_lint
      - bats_fsm
      - docs_updated
  targeted:
    include:
      - tier_lint
      - targeted_tests
      - bats_fsm
      - docs_updated
  standard:
    include:
      - tier_lint
      - targeted_tests
      - bats_fsm
      - plan_diff
      - docs_updated
  # bats_fsm is BACK in full and release (P081 whole-diff review, 2026-08-11).
  # It was removed because `bats_all` ran test-aid-fsm.bats in its pool, so
  # including both dispatched the same run unit twice — true until this branch.
  # test-aid-fsm.bats is `# aid-tier: t2` and `bats_all` now resolves to the
  # T0+T1 selection, so it no longer dispatches that suite at all: leaving
  # bats_fsm out left the two heaviest profiles — including the one plan-final
  # runs — with NO FSM coverage. There is no double dispatch to avoid any more.
  # `release_quarantine` gains it for the same reason and to keep the
  # set-equality assertion (release MINUS the quarantined gate) satisfied.
  # P081 Step 6 (2026-08-10) — THE MERGE PATH IS T0 + T1.
  # `bats_all` now resolves to the tier-filtered runner, and the two gates that
  # carried the rest of the portfolio left these profiles entirely:
  #   - shell_pipeline_smoke (the whole portfolio, 3 h 23 min measured) is the
  #     nightly's command;
  #   - bats_boundary (two suites, 7200 s ceiling) is T2 and rides the nightly
  #     with everything else.
  # Neither gate was deleted, and neither stops running: they run at 02:40 UTC
  # instead of in front of a merge.
  full:
    include:
      - tier_lint
      - bats_all
      - bats_fsm
      - plan_diff
      - docs_updated
  release:
    include:
      - tier_lint
      - bats_all
      - bats_fsm
      - plan_diff
      - docs_updated
  bats_all_quarantine:
    reason: >-
      Temporary PM-authorized AID self-host profile while P066 audits and
      repairs the monolithic bats portfolio. It never runs bats_all and is
      never equivalent to full/release. Use only after affected suites have
      separate terminal evidence, then cross GATES:DONE with an explicit
      audited --force reason naming bats_all_quarantine.
    include:
      - tier_lint
      - bats_fsm
      - plan_diff
      - docs_updated
  release_quarantine:
    reason: >-
      P068 Step 2 — THE plan-final substitute for `release` while a release
      gate carries a declared `quarantine:` block (at v2.62.1 that was
      `bats_all`, PM 2026-07-23, tracked by P066; no gate carries an active
      block today). It is `release` MINUS the quarantined gate and NOTHING
      else, and `aid-plan-fsm.sh plan-finalize --stage gates` asserts exactly
      that SET EQUALITY before it will run.
      P081 Step 6 (2026-08-10) — re-pointed with `release`, and the latent
      inconsistency it had carried is closed at the same time. `release` is now
      {bats_all, plan_diff, docs_updated}, so this profile is {plan_diff,
      docs_updated}: `bats_all` is the ONLY test gate `release` has left, which
      means a quarantined `bats_all` leaves this substitute with no test gate
      by construction. That is not an oversight to paper over with `bats_fsm`
      — but that reasoning was written against a `bats_all` that still ran
      test-aid-fsm.bats. It does not: that suite is t2 and `bats_all` is the
      T0+T1 selection. So (2026-08-11) `release` gains `bats_fsm` and this
      profile gains it too, which both restores FSM coverage and keeps the
      set equality exact — this profile is still `release` MINUS `bats_all`. The compensation is the one this profile already
      names: the quarantined gate is never green, it is reported
      profile_excluded/waived, and it must carry its own marked
      targeted-substitute receipt in the report's `quarantine_substitutes[]`.
    include:
      - tier_lint
      - bats_fsm
      - plan_diff
      - docs_updated
  p064-closure:
    reason: >-
