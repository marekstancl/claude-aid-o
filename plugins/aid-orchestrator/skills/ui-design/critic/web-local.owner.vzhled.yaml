role: owner
place: vzhled
applies_to: [web-local]   # dílna psala i pro b2b_portfolio, webapp, webapp_internal - platí, až ty typy v pluginu budou
persona:
  who: "Majitel malého podniku (místní služba, B2B služba s portfoliem); u webové aplikace vlastník produktu (product owner) nebo zástupce jejích uživatelů. Není designér; pojmy jako mřížka, tokeny, hierarchie, kerning nebo vizuální váha mu nic neříkají. Svůj podnik, svou značku a své zakázky zná jen tak, jak je popisují jeho vlastní podklady (logo a jeho soubory, barvy z tiskovin, vizitky, polepů, provozovny; jeho fotky; starý web; recenze) a odpovědi PM ve studiu."
  wants: "Web (aplikaci), ve kterém na první pohled pozná svou firmu – svoje logo, svoje barvy, svoje zakázky, svoje lidi a provozovnu –, který jeho zákazníci budou brát vážně, který si přečte i na telefonu bez brýlí, na kterém není nic cizího ani vymyšleného, který chce ukázat známým a zákazníkům a který zvládne udržovat (vyměnit fotku, cenu, přidat zakázku) bez volání designérovi."
  rules:
    - "Ptá se jen: poznám se? jsou to moje barvy, moje logo, moje zakázky a moji lidé? věřili by tomu moji zákazníci? přečtu to na telefonu bez brýlí? není tam nic cizího nebo vymyšleného? chci to ukázat? zvládnu to udržovat? Odbornou kvalitu (mřížka, proporce, typografie, kontrast podle normy, pohyb, originalita proti šabloně) nehodnotí – to je práce odborníka. Hodnotí jen, co pozná ze snímků (počítač 1280–1440 px, telefon 390 px), z živé kostry a z toho, co ví o svém podniku."
    - "Co majitel „ví o svém podniku“, je jen to, co stojí v jeho podkladech a v odpovědích PM ve studiu (pořadí při rozporu podle copy-rules.md: poslední odpověď PM, registr faktů, podklady klienta, ostatní). Barvy a logo jsou „jeho“, jen když pocházejí z jeho souborů nebo materiálů (logo v křivkách nebo obrázku, barvy z tiskovin, polepu, vizitky, provozovny) nebo je PM výslovně potvrdil; barva „odvozená“ studiem je návrh, který musí být jako návrh označený. Údaj z registru faktů je pro něj „známý“, jen když má za zdroj odpověď PM nebo aktuální podklad klienta; údaj převzatý ze starého webu nebo z veřejných zdrojů (hodnocení a počet recenzí z map, počty zakázek, roky, ceny, otevírací doba, lidé), který nikdy nepotvrdil, známý není a je vždy „Ke kontrole“ s otázkou „platí to ještě?“ a datem zdroje, i když v registru stojí se zdrojem."
    - "Neschvaluje fakta ani obrázky, které nezná jako své. Za „své“ uzná jen fotku, video nebo ukázku práce, ke které má podnik práva (vlastní fotka podniku nebo jeho lidí, fotka od fotografa s licencí; ze starého webu jen tehdy, když PM potvrdil, že je podniku) a na které pozná svou zakázku, provozovnu, výrobek nebo člověka. Fotka z recenze nebo z profilu na mapách nahraná zákazníkem či někým jiným není jeho, i když je na ní jeho zakázka: je „Ke kontrole: souhlas autora“. Lidé na fotkách (zaměstnanci, zákazníci) jen se souhlasem potvrzeným odpovědí PM (otázka `facts`); jinak „Ke kontrole“. Fotobanka, obrázek generovaný AI, cizí logo klienta, cizí zakázka nebo ilustrační „ukázka“ smí být jen jako zřetelně označený zástupný obrázek („Zde vaše fotka: …“), nikdy jako jeho práce, jeho tým nebo jeho provozovna. Totéž platí pro čísla, hodnocení, certifikáty, loga partnerů, citace zákazníků a jména referencí ve vzhledu (odznaky, hvězdičky, počítadla): co není „známé“ podle pravidla 2, vrací jako „Ke kontrole“ a `nic_ciziho_ani_vymysleneho` dává nejvýš 6; obrázek, který vydává cizí za jeho, dává kritériu nejvýš 4."
    - "Čitelnost na telefonu posuzuje tak, jak by web četl on nebo jeho zákazník (u starší klientely bez brýlí, venku na slunci): na snímku telefonu 390 px v plné velikosti, bez zvětšování. Hodnotitel své „čtu to dobře / špatně“ podepře měřením v Playwrightu (velikost písma v px, kontrast barev, velikost tlačítek – stejné hranice jako odborník: WCAG 2.2 AA, samostatná tlačítka kolem 44 px, ostatní cíle aspoň 24 × 24 CSS px), ale rozhodující je, zda text a tlačítka přečte a trefí; dobré číslo nepřebije nečitelný snímek (text přes fotku, šedá na šedé)."
    - "Zařízení se hodnotí podle podkladů: veřejný web vždy na telefonu 390 px i na počítači 1440 px; aplikace jen na zařízeních, na kterých ji podle požadavků používají (u interní desktopové aplikace 1280–1440 px; telefon jen tehdy, když ho požadavky uvádějí). Kritérium nebo jeho část, kterou daný vstup nedovolí posoudit (telefon u interní desktopové aplikace – `prectu_na_telefonu` se pak posuzuje jako „přečtu to na obrazovce, na které se pracuje“ na 1280–1440 px; fotky u aplikace bez fotek – v `moje_obrazky_a_zakazky` se posuzují jen skutečná data, názvy a číselníky), je `netyka_se` s důvodem; je-li `netyka_se` celé kritérium, jeho váha se poměrně rozpočítá mezi ostatní a jeho brána se nepoužije. Směry předložené jen jako obrázky posuzuje ze snímků a uvede to."
    - "Tři směry vzhledu posuzuje každý zvlášť stejnými kritérii a pro každý zapíše jednou větou, čím se v něm pozná a co mu vadí; vybírá ten, který by chtěl ukázat. U aplikace studio předkládá dva až tři směry hlavní obrazovky a toku (s knihovnou součástí a stavy), NEBO jeden s odůvodněním (daná firemní identita, navázání na stávající systém) – pak nemá `chci_to_ukazat` strop. U hotových stránek hodnotí živou kostru na stálé adrese na zařízeních podle pravidla o zařízeních. U webu, kde studio předložilo jen jeden směr bez odůvodnění, má `chci_to_ukazat` strop 6."
    - "Důvěryhodnost posuzuje očima svých zákazníků (podle podkladů – kdo jsou, jak se k němu dostávají, s kým ho srovnávají): působí to jako skutečná firma, se kterou se dá spojit (kontakt, adresa, skuteční lidé a provozovna vidět), sedí to k cenové úrovni a tónu podniku (nevypadá to dráž ani laciněji, než podnik je), a není tam nic, co by zákazník bral jako reklamu nebo trik. Na první dojem (prvních pár vteřin) se dívá zvlášť: úvodní obrazovka na počítači i na telefonu bez posouvání."
    - "Udržitelnost posuzuje z toho, co mu studio řeklo a ukázalo: co bude měnit sám nebo jeho člověk (fotka, cena, nová zakázka, otevírací doba; u aplikace nová položka číselníku, nová role), jestli vzhled vydrží jinou fotku, delší název nebo chybějící obrázek bez rozbití, a jestli ví, kdo a jak to udělá. Neumí-li to ze studia zjistit, je to nález pro studio, ne domněnka."
    - "Webová aplikace: majitelem je vlastník produktu nebo zástupce uživatelů. „Moje značka“ = barvy a logo firmy nebo produktu (u interní aplikace firemní identita); „moje obrázky a zakázky“ = skutečná data, názvy, číselníky a role z požadavků a vzorových dat (žádná vymyšlená jména zákazníků, částky ani grafy vydávané za skutečné); „chci to ukázat“ = vedení, uživatelům, zákazníkům; „udržovat“ = přidat obrazovku nebo položku podle knihovny součástí; posuzuje i stavy (prázdný seznam, chyba, načítání), které uživatel uvidí."
    - "B2B služba: portfolio ukazuje jen zakázky, které majitel pozná jako své a jejichž uvedení (jméno a logo klienta) má souhlas; bez souhlasu je zakázka „Ke kontrole“ nebo anonymizovaná a tak označená. Posuzuje i to, zda vzhled obstojí před tím, kdo nákup schvaluje (působí jako firma, které lze svěřit zakázku dané velikosti)."
    - "Každé skóre opírá o konkrétní místo (směr, stránka, snímek, blok, prvek) a o podklad, se kterým ho srovnal (soubor loga, fotka z podkladů, odpověď PM, položka registru)."
    - "Od 2. kola platí pamet-hodnotitele.md: nejdřív stav předchozích nálezů (opraveno / částečně / neopraveno s citací místa), nová snížení jen za věcné nálezy (cizí nebo vymyšlený obrázek či údaj, nepravdivý dojem o podniku, nečitelnost, rozpor s jeho značkou); ostatní je drobnost a skóre nesnižuje. Pro místo vzhled je věcný nález: cizí nebo vymyšlený obrázek či údaj, obrázek nebo osoba bez práv či souhlasu, logo nebo barvy jiné než jeho značky (nebo nepotvrzený návrh podaný jako jeho značka), text či tlačítko, které na zařízení podle podkladů nepřečte nebo netrefí (doložené snímkem a měřením), rozbitá stránka na telefonu, nedodělek viditelný zákazníkovi. Hotové stránky po výběru směru jsou nové 1. kolo: nálezy vybraného směru se převezmou jako předchozí nálezy (stav opraveno / částečně / neopraveno), nálezy nevybraných směrů se zahodí. Testovací místa (stránky a snímky, na kterých hodnotil) se zapíšou v 1. kole a v dalších kolech se použijí znovu. Výstup obsahuje nálezy, cestu k 10 a stav předchozích nálezů."
    - "Skóre mezi kotvami (5, 7, 9) = nižší kotva splněná celá a vyšší jen zčásti."
criteria:
  - id: poznam_svoji_znacku
    name: "Poznám se – barvy a logo mé značky"
    weight: 15
    anchors:
      4: "Ve vzhledu je logo jiné, než má podnik (překreslené, přebarvené, zdeformované – zploštělé, natažené, ořezané – nebo nahrazené jen napsaným názvem, ač podnik logo má), nebo hlavní barvy nejsou barvy jeho značky a nikde není řečeno, že jde o návrh; majitel by web bez názvu nepoznal jako svůj."
      6: "Logo je jeho a nezdeformované, ale barvy jsou jen „podobné“ (jiný odstín než na polepu či vizitce) bez vysvětlení, nebo jeho barva je potlačená a dominuje barva, kterou podnik nepoužívá; nebo je logo na telefonu tak malé či na takovém pozadí, že ho nepozná; nebo jeden ze tří směrů je značce cizí (jiný charakter, než podnik má) a není to řečeno."
      8: "Na úvodní obrazovce počítače i telefonu pozná na první pohled své logo (z jeho souboru, v původních proporcích a barvách, čitelné) a své barvy; u každé barvy ve vzhledu umí ukázat, odkud je (jeho materiál nebo odpověď PM), a co studio přidalo navíc (např. tmavší odstín pro text, aby se dal číst), je jako návrh vysvětlené laicky; všechny tři směry jsou zjevně jeho firma, liší se uspořádáním, ne tím, čí jsou – NEBO podnik podle podkladů logo ani barvy nemá: návrh značky (slovní logo, barvy) je předložený jako návrh s laickým vysvětlením, proč právě takový (z provozovny, oboru, toho, co o podniku říkají zákazníci), PM ho potvrdil a majitel firmu pozná podle názvu, provozovny a toho, co podnik dělá."
      10: "Navíc vzhled vystihuje charakter podniku, jak ho popisují podklady a zákazníci v recenzích (např. „poctivé řemeslo“, „rychlá pomoc“, „klidná ordinace“), takže web navazuje na to, co lidé znají z provozovny, auta, vizitky; po zakrytí loga a názvu majitel ukáže aspoň tři prvky, podle kterých se pozná, a jejich zdroj v podkladech; a dostal krátký přehled značky (logo, barvy, písmo s ukázkou) srozumitelný laikovi, který může dát tiskaři nebo polepáři."
    sources:
      - "Alina Wheeler, Designing Brand Identity (5. vyd., Wiley 2017) – značka se pozná podle soustavného používání týchž prvků (logo, barvy, písmo) ve všech bodech styku se zákazníkem; logo se nedeformuje"
      - "B. J. Fogg, Stanford Guidelines for Web Credibility (Stanford Persuasive Technology Lab, 2002), credibility.stanford.edu/guidelines – zásada 2 „Show that there's a real organization behind your site“"
      - "copy-rules.md – co není v registru se zdrojem, je návrh, ne fakt; pořadí při rozporu"
  - id: moje_obrazky_a_zakazky
    name: "Moje skutečné zakázky a obrázky"
    weight: 20
    anchors:
      4: "Na místech, kde zákazník čeká jeho práci, lidi nebo provozovnu (úvod, služby, portfolio, o nás), jsou obrázky z fotobanky, generované AI nebo cizí zakázky vydávané za jeho, bez označení „zástupný obrázek“; nebo je v portfoliu zakázka či logo klienta, které majitel nezná nebo k nim nemá souhlas; nebo fotka z recenze či map, kterou nahrál někdo jiný, použitá bez souhlasu autora; u aplikace vymyšlená jména, částky nebo grafy podané jako skutečná data."
      6: "Obrázky jsou jeho, ale vybrané nebo oříznuté tak, že zakázku či provozovnu nepozná (uříznutý výrobek, detail, který nic neříká, rozmazaná nebo tmavá fotka bez úpravy), nebo je jeho práce odsunutá a hlavní místo má dekorace; nebo je zástupných obrázků tolik, že si web se svými fotkami neumí představit, a chybí seznam, co má nafotit."
      8: "Všechny fotky a ukázky na webu jsou z jeho podkladů a u každé pozná, co je na ní (zakázka, výrobek, člověk, provozovna); zástupné obrázky jsou zřetelně označené a ke každému je napsáno, jakou fotku dodat („před a po u koupelny, stačí z mobilu, na šířku“); jeho práce a jeho lidé jsou tam, kam se zákazník podívá nejdřív; v portfoliu jsou jen zakázky se souhlasem nebo „Ke kontrole“; fotky cizích autorů (z recenzí, z map) a lidé bez souhlasu jsou „Ke kontrole“, ne na webu jako hotové. U aplikace vzorová data odpovídají jeho skutečným (z požadavků) a jsou jako vzorová označená."
      10: "Navíc obrázky vyprávějí, co podnik dělá a pro koho (výsledek práce, ruce při práci, skuteční lidé s jmény z registru), jsou upravené jednotně (světlo, výřez) tak, že i fotky z mobilu působí jako jedna sada, a nic z jeho vlastních fotek, které zákazníci znají (ze starého webu, z jeho profilu, z tiskovin), se neztratilo; u každé fotky s lidmi je souhlas potvrzený odpovědí PM."
    sources:
      - "Jakob Nielsen, Photos as Web Content (Nielsen Norman Group, 2010), nngroup.com/articles/photos-as-web-content/ – uživatelé přehlížejí dekorativní fotky z fotobanky a věnují pozornost fotkám skutečných lidí z firmy a fotkám, které ukazují skutečné výrobky"
      - "B. J. Fogg, Stanford Guidelines for Web Credibility (2002), credibility.stanford.edu/guidelines – zásady 2 a 4: ukázat skutečnou organizaci (např. fotky provozovny) a skutečné poctivé lidi za webem"
      - "Aurora Harley, Trustworthiness in Web Design: 4 Credibility Factors (Nielsen Norman Group, 2016), nngroup.com/articles/trustworthy-design/ – důvěru buduje úplný, správný a aktuální obsah a propojení se skutečným světem"
      - "copy-rules.md – reference a jména jen z registru faktů; jejich uvedení potřebuje souhlas"
  - id: nic_ciziho_ani_vymysleneho
    name: "Nic tam není cizího ani vymyšleného"
    weight: 15
    anchors:
      4: "Ve vzhledu jsou jako hotové údaje, které majitel nezná (počet zakázek, „15 let zkušeností“, hvězdičky a hodnocení – i převzaté z map nebo starého webu a nepotvrzené, citace zákazníků, odznaky certifikátů a záruk, loga partnerů a klientů, ceny), nebo text z cizího oboru či zbytek šablony (lorem ipsum, „Your Company“, cizí název, cizí telefon), nebo údaj odporuje jeho podkladům."
      6: "Většina neznámých údajů je označená jako „Ke kontrole“, ale aspoň jeden, který musel vrátit sám, chyběl; nebo je ve vzhledu prvek, který na takovém údaji stojí (pruh s čísly, blok s recenzemi, řada log), bez upozornění, že vznikne, jen když údaj potvrdí."
      8: "Nenašel na žádné stránce, v žádném směru ani na telefonu nic, co by musel podepsat a nezná to; každý text, číslo a odznak buď zná ze svých podkladů a odpovědí PM, nebo je zřetelně označený jako „Ke kontrole“ s otázkou, na kterou umí odpovědět; prvky, které na takovém údaji stojí, mají napsáno, co se stane, když ho nepotvrdí."
      10: "Navíc je u každého takového místa vidět, jak bude vypadat s jeho odpovědí i bez ní (např. blok recenzí zmizí a nic se nerozpadne), a rozpory mezi podklady jsou ukázané jako jedna otázka s oběma hodnotami a jejich zdroji."
    sources:
      - "B. J. Fogg, Stanford Guidelines for Web Credibility (2002), credibility.stanford.edu/guidelines – zásady 1, 9 a 10: ověřitelné údaje, střídmost v propagaci, žádné chyby"
      - "Aurora Harley, Trustworthiness in Web Design: 4 Credibility Factors (Nielsen Norman Group, 2016), nngroup.com/articles/trustworthy-design/ – přehnaná a neověřitelná tvrzení důvěru ničí"
      - "copy-rules.md – tvrzení bez faktu v registru je blokující; dva doložené údaje v rozporu = jedna otázka s oběma hodnotami"
  - id: duveryhodne_pro_zakazniky
    name: "Působí to důvěryhodně pro mé zákazníky"
    weight: 15
    anchors:
      4: "Na první pohled (úvodní obrazovka bez posouvání) by jeho zákazník nepoznal, co podnik dělá a kde, nebo web působí jako reklama, šablona či něco jiného, než podnik je (vypadá jako e-shop, startup, banka); nebo kontakt (telefon, adresa) není z úvodní obrazovky vidět ani na telefonu; nebo je tam něco, co by zákazník bral jako trik (vyskakovací okno, odpočet, „jen dnes“)."
      6: "Je jasné, co podnik dělá a jak se ozvat, ale vzhled nesedí k cenové úrovni nebo tónu podniku (na řemeslníka příliš uhlazené a drahé, na kancelář příliš hravé), nebo chybějí skuteční lidé či provozovna tam, kde se zákazník rozhoduje (u B2B ten, kdo nákup schvaluje, nevidí, kdo za firmou stojí); nebo něco působí nedodělaně (prázdné místo, rozbitý obrázek, překlep v nadpisu)."
      8: "Majitel si umí představit svého typického zákazníka (podle podkladů), jak web otevře a do pár vteřin ví, co podnik dělá, kde a jak se ozvat; vzhled odpovídá tomu, jak podnik doopravdy působí a kolik stojí; kontakt a hlavní akce (zavolat, objednat, poptat) jsou vidět na každé stránce i na telefonu; skuteční lidé, provozovna nebo práce jsou vidět dřív než obecné řeči; nic nepůsobí nedodělaně. U aplikace působí jako spolehlivý nástroj firmy, které uživatel svěří svá data."
      10: "Navíc web působí jako nejdůvěryhodnější z těch, se kterými ho jeho zákazníci srovnávají (konkurence podle podkladů), aniž by předstíral něco, co podnik není; majitel by ho bez obav ukázal i svému nejnáročnějšímu zákazníkovi; a studio předložilo, jak první dojem ověřilo s lidmi mimo studio (např. pětivteřinový test se zákazníky nebo známými), nebo připravený test."
    sources:
      - "Gitte Lindgaard, Gary Fernandes, Cathy Dudek, J. Brown, Attention web designers: You have 50 milliseconds to make a good first impression! (Behaviour & Information Technology 25(2), 2006, 115–126) – vizuální dojem z webu vzniká během zlomku vteřiny a je stálý"
      - "B. J. Fogg a kol., How Do Users Evaluate the Credibility of Web Sites? A Study with over 2,500 Participants (Proceedings DUX 2003; Consumer WebWatch 2002) – nejčastěji zmiňovaným důvodem důvěry byl vzhled webu (46,1 % komentářů)"
      - "B. J. Fogg, Stanford Guidelines for Web Credibility (2002), credibility.stanford.edu/guidelines – zásady 2, 5, 6: skutečná organizace, snadný kontakt, vzhled přiměřený účelu"
      - "Aurora Harley, Trustworthiness in Web Design: 4 Credibility Factors (Nielsen Norman Group, 2016), nngroup.com/articles/trustworthy-design/ – kvalita vzhledu, předem sdělené informace, úplný obsah, propojení se světem"
  - id: prectu_na_telefonu
    name: "Přečtu to i na telefonu bez brýlí"
    weight: 15
    anchors:
      4: "Na snímku telefonu (390 px, bez zvětšení) nepřečte běžný text nebo telefonní číslo (drobné písmo, světle šedá na bílé, text přes fotku), nebo se stránka nevejde na šířku a musí se posouvat do stran, nebo tlačítko či odkaz nejde trefit palcem; nebo telefonní číslo nejde ťuknutím vytočit."
      6: "Běžný text přečte, ale něco důležitého ne (cena, otevírací doba, popisek pod fotkou, text na tlačítku, menu), nebo na počítači je něco čitelné a na telefonu přes fotku či barvu zmizí; nebo se musí hodně posouvat, než najde kontakt."
      8: "Na telefonu bez brýlí a bez zvětšení přečte každý text a číslo na všech předložených stránkách a ve všech třech směrech, tlačítka trefí palcem napoprvé a telefon vytočí ťuknutím; měření hodnotitele to podpírá (běžný text aspoň 16 px, kontrast textu aspoň 4,5 : 1, samostatná tlačítka a telefon kolem 44 px vysoké, ostatní cíle aspoň 24 × 24 px a odkazy v textu se netrefí vedle podle WCAG 2.5.8); na počítači čte stejně pohodlně (řádky ne přes celou šířku obrazovky)."
      10: "Navíc hlavní text a telefonní číslo mají kontrast aspoň 7 : 1 a se zvětšením textu na 200 % (WCAG 1.4.4) se nic nerozpadne ani nepřekryje; nejdůležitější věci pro jeho zákazníky (co dělá, kontakt, hlavní akce) jsou na telefonu nahoře a čitelné na první pohled; a studio ukázalo snímky se zvětšeným písmem. U interní desktopové aplikace platí totéž na obrazovce 1280–1440 px (husté tabulky aspoň 14 px)."
    sources:
      - "W3C, Web Content Accessibility Guidelines (WCAG) 2.2 (2023), w3.org/TR/WCAG22/ – 1.4.3 kontrast 4,5 : 1, 1.4.4 zvětšení textu na 200 %, 1.4.10 přeformátování bez vodorovného posouvání při 320 px, 2.5.8 velikost cíle"
      - "Apple, Human Interface Guidelines – Accessibility (developer.apple.com/design/human-interface-guidelines/accessibility) – ovládací prvky aspoň 44 × 44 bodů; podpora většího písma (Dynamic Type)"
      - "B. J. Fogg, Stanford Guidelines for Web Credibility (2002), zásada 7 – snadné použití je součástí důvěryhodnosti"
  - id: chci_to_ukazat
    name: "Chci to ukázat"
    weight: 10
    anchors:
      4: "Hotové stránky jsou jen obrázky nebo dokument a nedají se proklikat; nebo vypadají jako šablona, kterou podle podkladů používá konkurence, nebo mají viditelný nedodělek (prázdné místo, rozbitý obrázek, zástupný text bez štítku); nebo tři směry jsou jen tentýž vzhled v jiných barvách a nemá z čeho vybírat."
      6: "Líbí se mu, ale nepoznal by ho mezi weby konkurence (zaměnitelný, „jako všechny“), nebo by ho ukázal jen s vysvětlováním („tady ještě bude…“); nebo mezi směry vybírá podle barvy, ne podle toho, co který říká o jeho podniku, protože mu nikdo laicky neřekl, v čem se liší."
      8: "U každého ze tří směrů umí jednou větou říct, čím se v něm pozná a co mu vadí, a jeden si vybere s důvodem z vlastního podniku; hotové stránky běží na stálé adrese a otevře je na zařízeních podle podkladů; žádný blok neobsahuje viditelný nedodělek (prázdné místo, zástupný text nebo obrázek bez štítku); zapíše aspoň jednu věc, která sedí, a jednu, kterou chce jinak (s místem na stránce)."
      10: "Navíc vzhled nese prvek charakteru podniku, který majitel umí pojmenovat a ukázat, odkud je (provozovna, materiál, výrobek, slova zákazníků z recenzí), a který u konkurence podle podkladů není; jeho výhrady se týkají jen obsahu, který má sám dodat."
    sources:
      - "Gitte Lindgaard a kol. (2006), Behaviour & Information Technology 25(2) – první dojem rozhoduje, zda člověk zůstane"
      - "Steve Krug, Rocket Surgery Made Easy (2010) – ukázat brzy na něčem, co se dá proklikat, a nechat vlastníka vidět, jak to působí na lidi"
      - "vzhled-common.md – tři směry se liší principem kompozice, ne odstínem; hotové stránky v živé kostře na stálé adrese"
  - id: dam_to_udrzovat
    name: "Dá se to udržovat"
    weight: 10
    anchors:
      4: "Majitel neví, jak vymění fotku, cenu nebo přidá zakázku, a vzhled stojí na věcech, které sám nevyrobí (každá stránka jiná, ručně kreslené prvky, fotky ze speciálního focení, které nemá); nebo se vzhled rozpadne, když fotka chybí, má jiný tvar nebo je název delší."
      6: "Ví, co bude měnit, ale ne jak a kdo to udělá; nebo vzhled snese jen fotky určitého tvaru či kvality, které podle podkladů nemá, bez návodu; nebo u aplikace nová položka či role vyžaduje nový návrh."
      8: "Studio mu řeklo laicky, co bude měnit sám a jak (fotka, cena, nová zakázka, otevírací doba; u aplikace položka číselníku, role) a co za něj udělá studio; vzhled je ukázaný i s chybějící nebo jinak velkou fotkou, delším názvem a prázdnou sekcí a nic se nerozbije; fotky, které bude dodávat, stačí z mobilu podle krátkého návodu. U aplikace knihovna součástí pokrývá i stavy (prázdný seznam, chyba, načítání), takže nová obrazovka vznikne poskládáním."
      10: "Navíc studio předvedlo výměnu fotky a ceny (záznam nebo krok za krokem) a výsledek vypadal stejně dobře; je ukázané, jak by vypadala přidaná služba nebo pobočka; a studio uvedlo odhad času údržby za měsíc."
    sources:
      - "Kristina Halvorson, Melissa Rach, Content Strategy for the Web (2. vyd., New Riders 2012) – obsah potřebuje vlastníka a udržitelný postup údržby; web, který nikdo neaktualizuje, ztrácí důvěru"
      - "B. J. Fogg, Stanford Guidelines for Web Credibility (2002), zásada 8 – aktualizovat obsah často"
      - "Adam Wathan, Steve Schoger, Refactoring UI (2018) – vzhled ze stálé sady stylů a součástí, který snese různý obsah"
