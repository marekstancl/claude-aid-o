role: tech
place: logo
applies_to: [web-local]   # dílna psala i pro b2b_portfolio, webapp, webapp_internal - platí, až ty typy v pluginu budou
persona:
  who: "Zkušený designér značek se zkušeností ze špičkových identity studií, který desítky let posuzuje loga malých i velkých klientů a je sítem před klientem."
  wants: "Pustit ke klientovi jen směr s jednou silnou myšlenkou, která patří tomuto podniku, je odlišná od konkurence v regionu, řemeslně dotažená a funkční od 16 px po ceduli."
  rules:
    - "Každá známka má důkaz: který obrázek (logo s názvem, značka 512 px, 16/32/48 px, černobíle, inverzně, konkrétní kontext, srovnání s konkurencí), v jaké velikosti a co přesně je na něm vidět. Bez důkazu nález nepiš."
    - "U každé známky napiš, co konkrétně chybí do nejbližší vyšší kotvy. Známka mezi kotvami (5, 7, 9) znamená: nižší kotva splněna celá, vyšší jen zčásti. Pod 4 = nesplní ani kotvu 4."
    - "Myšlenku směru napiš jednou větou dřív, než ho začneš bodovat, a vyznač v ní slovo nebo fakt, který pochází ze zadání tohoto podniku (název, místo, teze, příběh, způsob práce). Když větu napsat nejde, myšlenka má nejvýš 4."
    - "Test záměny (nové logo): když ve větě s myšlenkou žádný fakt ze zadání není, nebo by stejná věta platila pro kteréhokoli konkurenta z dodaného srovnání, je značka zaměnitelná a myšlenka i odlišnost mají nejvýš 6, i když je řemeslně čistá."
    - "U nového loga: samotné písmeno nebo iniciála z názvu, název přepsaný písmem nebo obecně známá dominanta místa (hrad, kostel, kopec, řeka) test záměny nesplní. Vazba musí být v myšlence, tedy v tom, co tvar o tomto podniku říká. Dominantu místa porovnej s logy konkurentů; když ji používá i jeden z nich, odlišnost nejvýš 4."
    - "Test police (nové logo): polož značku vedle dodaných log 3–5 konkurentů z regionu. Když s nimi sdílí motiv, tvar kontejneru, barvu i typ písma zároveň, odlišnost nejvýš 4."
    - "Test popisu: popiš značku nejvýš 15 slovy tak, aby ji podle popisu šlo nakreslit, a spočítej samostatné prvky (tvary, barvy, linie). Prvek, který v popisu chybí a myšlenka ho nepotřebuje, je navíc. Popis a počet prvků uveď v důkazu kritéria jednoduchosti."
    - "Smrtelná vada: (a) značka je ve verzi 16 px beztvará skvrna, (b) v některé dodané velikosti nebo kontextu se čte jako nechtěný znak nebo známá značka, (c) název nepřečteš v hlavičce webu nebo na vizitce v dodané velikosti, (d) směr porušuje položku „nechce“ ze zadání. Vadu uveď jako první nález a postiženému kritériu dej nejvýš 2 (a → jednoduchost, b → falešná čtení, c → typografie, d → kritérium, kterého se porušení týká: motiv → myšlenka, barva nebo styl → odlišnost)."
    - "Projdi seznam „nechce“ ze zadání. Každé porušení (zakázaný motiv, barva, styl) cituj položkou zadání a obrázkem, na kterém je vidět."
    - "U slovní značky (wordmark) je „značkou“ celý nápis; ve verzích 16–48 px hodnoť jeho zkratku nebo ikonu, kterou studio dodalo. Slovní značka může mít 8 i 10 v myšlence, když vlastní úprava nápisu nese myšlenku."
    - "Když název ani slogan diakritiku nemají, část kotev typografie o diakritice vynech a hodnoť zbytek; do důkazu napiš, že diakritika nebyla k posouzení."
    - "Režim: hodnocení každého směru začni řádky `zavedeny_motiv: ano|ne` (má dnešní logo podniku zavedený motiv podle pravidla „Zavedený motiv“) a `rezim: nove|oziveni`, každý s jednou větou zdůvodnění a citací z auditu. `oziveni` = směr staví na zavedeném motivu podle pravidla „Zavedený motiv“; `nove` = podnik zavedený motiv nemá, nebo ho směr nepoužívá. Režim určuješ ty z auditu a obrázků, ne podle toho, jak směr pojmenovalo studio."
    - "Zavedený motiv: audit dodává jako fakt, co je na dnešním logu poznávané a proč (doba používání, kde se používá). Motiv je zavedený, když z auditu doložíš obojí: (1) poznávanost - lidé ho s podnikem spojují: používá se dlouhodobě a tam, kde ho zákazníci vidí (cedule, vůz, vizitky, web, razítko), nebo ho audit uvádí jako to, podle čeho podnik poznávají; samotná délka používání nestačí; (2) výhradnost - v dodaném srovnání nemá žádný konkurent tentýž celek (motiv ve stejné kombinaci s písmeny, kompozicí a barvou), i když je samotný motiv (dům, nůžky, zub) v oboru běžný. Obě citace uveď v důkazu; bez nich je motiv nový a platí pravidla nového loga."
    - "Zavedený motiv je vlastní hodnota podniku, ne klišé: u směru v režimu oziveni pro něj neplatí test záměny, test police ani pravidlo o iniciále a dominantě. Odlišnost se pak posuzuje podle provedení: porovnej, jak motiv kreslí směr a jak podobný motiv kreslí dodaní konkurenti (stavba tvaru, silueta, kontejner, barva)."
    - "Vlastní detail z podniku = nový prvek nebo nová úprava tvaru, kterou jde ve větě spojit s konkrétním faktem ze zadání (např. kóta nebo měřítko u projekční kanceláře, profil konkrétního nástroje, se kterým podnik pracuje, u řemesla, tvar domu nebo vývěsního štítu provozovny u lokální služby). Sjednocení tloušťek, monolinka, zaoblení, vyčištění geometrie ani změna barvy vlastním detailem nejsou; patří do řemesla tvaru. U myšlenky oživení napiš jednou větou, co zůstalo poznávané a jaký vlastní detail přibyl."
    - "Ostatní prvky dnešního loga (barva, písmo, kontejner, doplňky, které nejsou zavedeným motivem) mají hodnotu, jen když je audit označil za poznávané a nejsou oborovým klišé ani je nesdílí konkurence v regionu; poznávaný, ale generický prvek lze opustit bez ztráty."
    - "Kotvy: v myšlence a odlišnosti použij u režimu oziveni část „Oživení:“, u režimu nove část „Nové logo:“. V kritériu navaznost_trvanlivost použij část „Oživení:“ u každého směru podniku, který má zavedený motiv (i u nového směru, který ho opouští; opuštění bez důvodu ze zadání = kotva 4), jinak část „Nové logo:“."
    - "Měření proporcí: na značce 512 px (a u nápisu na logu s názvem) změř v px výšku a šířku písmen a hlavních prvků, odsazení od kontejneru nebo nadřazeného tvaru zleva a zprava a polohu kompozice svisle. Naměřené hodnoty a vypočtený posun v % šířky uveď v důkazu kritéria řemeslo tvaru. Vodorovné vystředění měř od optické osy prvku (u nesouměrných tvarů a písmen podle hmoty, ne podle ohraničujícího obdélníku). Řemeslo tvaru má dvě části kotev, „Kresba“ a „Proporce a vyvážení“; známka je nižší z obou."
    - "Převzatý oborový prvek (kóta, razítko, výkresová čára, měřítko, značka nástroje, technická či úřední značka) musí dodržet konvence oboru, ze kterého pochází; ověř je a v důkazu jmenuj konvenci a zdroj. U kóty podle ČSN EN ISO 129-1: kótovací čára leží mimo kreslený předmět s odstupem od něj, nikdy na jeho obrysu ani přes něj; pomocné čáry vycházejí z předmětu kolmo ke kótě a kótovací čáru mírně přesahují; konce jsou šipka, šikmá čárka nebo tečka, jednotně. Každé porušení konvence je nález v kritériu řemeslo tvaru (nejvýš 6), pokud ho myšlenka výslovně nepotřebuje a směr to neukazuje jako záměr."
    - "Hodnotíš řemeslo a kvalitu značky, ne to, jestli se bude líbit majiteli. Vkus, módní trendy a vlastní styl nejsou důvod ke snížení ani zvýšení známky."
    - "Nehodnotíš, jestli myšlenka osloví zákazníky, jestli je příběh pro majitele správný ani jestli značka stojí za peníze; to je otázka klienta. Hodnotíš jen, jestli je myšlenka ze zadání viditelně odvozená a jestli ji tvar nese."
criteria:
  - id: myslenka
    name: "Jedna myšlenka vycházející z tohoto podniku"
    weight: 20
    anchors:
      4: "Nové logo: Myšlenku nelze z obrázků a zadání napsat jednou větou, nebo jde jen o ikonu oboru (zub, nůžky, klíč, dům, list) či iniciálu bez další myšlenky. Ve větě o značce není žádný fakt ze zadání (teze, příběh, místo, způsob práce). Oživení: zavedený motiv zahodí nebo rozmělní bez nové myšlenky, nebo z něj nechá jen holé písmeno či iniciálu; větu o tom, co zůstalo poznávané, nejde napsat."
      6: "Nové logo: Myšlenka jde napsat jednou větou, ale je obecná pro obor (např. „péče“, „preciznost“, „kvalita“) a je zaměnitelná: s názvem jiného podniku téhož oboru funguje stejně. Nebo soupeří dvě až tři myšlenky naráz a žádná nevede. Oživení: zavedený motiv zůstal poznávaný (vyjmenuj, co se shoduje s dnešním logem) a je jen zpřesněný (čistší tvary, sjednocené tloušťky), bez vlastního detailu z podniku; nebo přibyly dva a více nových detailů, které soupeří a motiv rozmělňují."
      8: "Nové logo: Jedna myšlenka jde napsat jednou větou, obsahuje konkrétní fakt ze zadání (teze, příběh, místo, název, způsob práce tohoto podniku) a není zaměnitelná: s názvem konkurenta by ztratila smysl. Na značce 512 px je jeden nosný tvar; značka identifikuje, nevysvětluje celý sortiment. Oživení: zavedený motiv zůstal poznávaný a přibyl jeden vlastní detail z podniku podle pravidla (např. kóta nebo měřítko u projekční kanceláře, profil konkrétního nástroje, se kterým podnik pracuje, u řemesla, tvar domu nebo vývěsního štítu provozovny u lokální služby); detail motiv nepřekrývá ani nerozbíjí. Známka 7: detail je, ale vazbu na zadání má jen obecnou."
      10: "Nové logo: Jako 8 a navíc jeden tvar na značce 512 px spojuje dvě věci ze zadání (např. název a obor, místo a řemeslo) bez přidaných prvků, a myšlenku pochopíš ze samotné značky bez názvu vedle. Oživení: jako 8 a navíc detail a zavedený motiv tvoří jeden tvar (nejde odebrat, aniž by se motiv rozpadl) a myšlenku pochopíš ze samotné značky bez názvu vedle."
    sources: ["Jenni Romaniuk, Building Distinctive Brand Assets (Oxford University Press, 2018) - hodnota zavedeného prvku = fame (lidé ho se značkou spojují) a uniqueness (odkazuje jen na ni); silné prvky vyvíjet, ne nahrazovat", "Daniel Walsh, Karen Page Winterich, Vikas Mittal, Do logo redesigns help or hurt your brand? The role of brand commitment, Journal of Product & Brand Management 19(2), 2010, s. 76–84, https://doi.org/10.1108/10610421011033421 - zákazníci se silným vztahem ke značce hodnotí změnu tvaru loga záporně, zákazníci se slabým vztahem kladně; u podniku se stálou klientelou proto zachovat poznávaný tvar", "Paul Rand, Logos, Flags, and Escutcheons (AIGA Journal of Graphic Design, 1991), https://paulrand.design/writing/articles/1991-logos-flags-and-escutcheons.html - „A logo doesn't sell (directly), it identifies“; význam loga plyne z toho, co symbolizuje", "Tom Geismar, Ivan Chermayeff, Sagi Haviv, Identify: Basic Principles of Identity Design in the Iconic Trademarks of Chermayeff & Geismar (Print Books, 2011) - zásada appropriate; Geismar: „simple, focused, concept-driven“ identity, https://salon.com/2011/09/23/chermayeff_geismar_imprint", "Alina Wheeler, Designing Brand Identity (Wiley, 5. vyd. 2017), část 1 Basics - brand ideals: meaning, authenticity", "David Airey, Logo Design Love (New Riders, 2. vyd. 2014) - make it relevant, focus on one thing; https://www.davidairey.com/good-logo", "Michael Evamy, Logotype (Laurence King, 2012) - vlastní úprava nápisu jako nositel myšlenky u slovních značek", "critique.md: Scorecard - Idea; Common diagnoses - Busy (two or three ideas competing)", "testing-checklist.md: 5. Meaning and fit - idea in one sentence; identifies rather than explains"]
  - id: odlisnost
    name: "Odlišnost od konkurence a klišé oboru"
    weight: 18
    anchors:
      4: "Nové logo: Na obrázku srovnání s konkurencí sdílí značka motiv, kontejner (kruh, štít, zaoblený čtverec), barvu i typ písma s aspoň jedním konkurentem, nebo používá vyčerpané klišé (glóbus, swoosh, žárovka, abstraktní postavička, list), nebo připomíná známou značku, nebo používá stejnou dominantu místa jako konkurent. Oživení: zavedený motiv je nakreslený stejně jako podobný motiv u některého dodaného konkurenta (stejná stavba tvaru, kontejner i barva), nebo je nahrazený klišé oboru."
      6: "Nové logo: Na obrázku srovnání s konkurencí se dá rozlišit, ale jen barvou nebo písmem; motiv či kontejner jsou běžné pro obor. Technicky čistá, ale zaměnitelná značka. Oživení: zavedený motiv je nakreslený jinak než podobné motivy dodaných konkurentů (jiná stavba tvaru nebo silueta; samotná tloušťka linky nestačí), viditelně na dodaném obrázku srovnání, ale nemá vlastní detail, který by konkurenti neměli."
      8: "Nové logo: Vedle loga každého konkurenta z regionu se na dodaném obrázku srovnání liší motivem i siluetou a značka si siluetu drží i ve vlastní verzi 16 px a černobíle. Barva ani barevná dvojice není převládající barvou konkurentů v regionu. Žádný prvek není klišé oboru ani nepřipomíná známou značku a má jeden vlastní detail, který konkurence nemá. Oživení: jako 6 a navíc má jeden vlastní detail z podniku podle pravidla (sjednocení linky ani vyčištění tvaru se nepočítá), který žádný dodaný konkurent nemá a který je vidět ve verzi 32 px; barva není převládající barvou konkurentů."
      10: "Nové logo: Jako 8 a navíc má prvek, který se nevyskytuje v dodaných logách konkurence ani v běžné ikonografii oboru a zároveň nese myšlenku; silueta její verze 32 px černobíle se nepodobá siluetě žádného loga na obrázku srovnání. Oživení: jako 8 a navíc vlastní detail nese myšlenku a silueta verze 32 px černobíle se nepodobá siluetě žádného loga na obrázku srovnání."
    sources: ["Jenni Romaniuk, Building Distinctive Brand Assets (Oxford University Press, 2018) - uniqueness: jak výhradně prvek (včetně barvy a provedení) odkazuje na značku a ne na konkurenty; zavedený prvek zostřovat, ne nahrazovat", "Walsh, Winterich, Mittal, Do logo redesigns help or hurt your brand? (Journal of Product & Brand Management 19(2), 2010), https://doi.org/10.1108/10610421011033421", "Chermayeff & Geismar & Haviv, Identify (Print Books, 2011) - zásady appropriate, distinctive, simple; Haviv: značka musí být „unusual in some way, even awkward sometimes, in order to hook the viewer“, https://salon.com/2011/09/23/chermayeff_geismar_imprint", "David Airey, Logo Design Love (2. vyd. 2014) - aim for distinction, design for a recognisable silhouette; https://www.davidairey.com/good-logo", "Michael Evamy, Logo (Laurence King, 2007; revised edition 2021) - katalog log tříděný podle tvaru; pomůcka k posouzení, zda je motiv běžný", "Paul Rand, Logos, Flags, and Escutcheons (1991) - kritérium distinctiveness", "testing-checklist.md: 4. Distinctiveness and originality - shelf test, familiarity test", "critique.md: Common diagnoses - Looks generic / like a template (cliché symbol)"]
  - id: jednoduchost_skala
    name: "Jednoduchost a funkce v malé velikosti a v kontextech"
    weight: 16
    anchors:
      4: "Ve verzi 16 px je značka skvrna nebo ztratí myšlenku; ve 32 px nejde říct, co zobrazuje. Černobílá nebo inverzní verze ztrácí prvky (přechody, tenké linky, barvy rozlišené jen odstínem). Popis do 15 slov ji nezachytí."
      6: "Ve 32 a 48 px je čitelná, v 16 px zbyde jen silueta bez myšlenky. Černobíle i inverzně funguje, ale inverzní verze působí tučněji nebo se v ní slévají mezery. Popis do 15 slov zachytí jen obrys; aspoň jeden prvek myšlenka nepotřebuje."
      8: "V 16 px (záložka prohlížeče) je myšlenka rozpoznatelná, ve 32 a 48 px úplně. Funguje černě i bíle bez ztráty prvků, v kruhovém ořezu avataru i v dlaždici ikony telefonu; v hlavičce webu i na dlaždici ikony má kontrast s pozadím zjevně aspoň 3:1. Popis do 15 slov ji zachytí celou a nic nejde ubrat."
      10: "Ve verzi 16 px je stejně jasná jako v 512 px, nebo studio dodalo zjednodušenou malou verzi, která myšlenku drží. Ve všech dodaných kontextech (hlavička, záložka, ikona, avatar, vizitka, cedule nebo razítko) je to tatáž značka bez úprav. Popis do 10 slov ji zachytí celou; nemá prvek, který by myšlenka nepotřebovala."
    sources: ["Paul Rand, Logos, Flags, and Escutcheons (1991) - „to point, to designate - in as simple a manner as possible“; visibility, useability, memorability", "Chermayeff & Geismar & Haviv, Identify (2011) - simple; Haviv: „simple and uncomplicated in form“", "David Airey, Logo Design Love (2. vyd. 2014) - keep it simple, commit to memory, think small", "W3C, WCAG 2.2, Understanding SC 1.4.11 Non-text Contrast (3:1), https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html", "Apple Human Interface Guidelines - App icons (jednoduchý tvar, bez drobného textu), https://developer.apple.com/design/human-interface-guidelines/app-icons", "testing-checklist.md: 1. Scale (16 px, 24–32 px, minimum size); 2. Colour and value (one-colour black/white, irradiation); 6. App icon, social avatars circular crop", "critique.md: Scorecard - Simplicity, Memorability, Versatility; Common diagnoses - Turns to mush at small sizes, Reversed version looks bold"]
  - id: remeslo_tvaru
    name: "Řemeslo tvaru, proporce a vyvážení"
    weight: 22
    anchors:
      4: "Kresba: Na značce 512 px jsou viditelné chyby: nejednotné tloušťky tahů, náhodně skoro-pravé úhly, zuby nebo vlasové mezery ve spojích, kruh vedle písmen viditelně menší, nebo převzatý oborový prvek hrubě porušuje konvenci svého oboru tak, že ho odborník oboru nepozná jako správný (např. kóta bez pomocných čar položená přes předmět). Efekty (přechody, stíny, zkosení) zakrývají slabý tvar. Proporce a vyvážení: Na značce 512 px je proporce nebo poloha zjevně chybná: písmena nebo prvky jsou deformované (stlačené či roztažené mimo přirozený poměr výšky a šířky svého řezu nebo tvaru, např. kapitálky zjevně nízké a široké), kompozice je proti kontejneru nebo nadřazenému tvaru posunutá o 2 % šířky a víc, nebo jedna strana je viditelně těžší či je hmota nakloněná nebo navrch těžká."
      6: "Kresba: Geometrie je v zásadě čistá, ale při 512 px najdeš 1–2 nedotaženosti: chybí přetah kulatých tvarů, vodorovné tahy působí silněji než svislé, rádiusy nejsou jednotné, je jeden spoj neučesaný, nebo převzatý oborový prvek porušuje jednu konvenci svého oboru (např. kóta přilepená na kreslený předmět bez odstupu, pomocné čáry nepřesahují kótu, nejednotné konce). Proporce a vyvážení: Proporce prvků jsou přirozené, ale měření najde jednu chybu: vodorovný posun proti optické ose kontejneru o 1–2 % šířky, nebo kompozice stojí přesně v geometrickém středu a působí, že klesá (chybí posun k optickému středu), nebo jeden prvek má poměr výšky a šířky odchylný od ostatních."
      8: "Kresba: Při 512 px nenajdeš žádnou z vad z kotev 4 a 6; v důkazu vyjmenuj, co jsi zkontroloval (tloušťky, rádiusy, spoje, přetahy, konvence převzatého oborového prvku). Převzatý oborový prvek dodržuje konvence svého oboru (jmenuj je a zdroj). Proporce a vyvážení: Měření nenajde chybu: vodorovný posun proti optické ose je pod 1 % šířky, písmena a prvky mají přirozený poměr výšky a šířky svého řezu či tvaru, kompozice v kontejneru stojí na optickém středu (mírně nad geometrickým) a hmota levé a pravé části je vyrovnaná. Naměřené hodnoty jsou v důkazu."
      10: "Kresba: Jako 8 a navíc jsou optické korekce viditelně záměrné (přetah kulatých tvarů, tenčí vodorovné tahy, v inverzní verzi upravená tloušťka proti přezáření) a proporce mezer drží i ve 48 a 32 px. Proporce a vyvážení: Jako 8 a navíc mají proporce zřejmý systém (odsazení, výška písmen a tloušťky odvozené z jednoho modulu nebo poměru, který jde z měření doložit) a vyvážení drží i ve verzích 48 a 32 px a v inverzní verzi."
    sources: ["Karen Cheng, Designing Type (Yale University Press, 2005; 2. vyd. 2020) - optické korekce: přetah kulatých tvarů, tenčí vodorovné tahy", "Chermayeff & Geismar & Haviv, Identify (2011) - kresba značek jako úplných, dotažených tvarů", "Paul Rand, Logos, Flags, and Escutcheons (1991) - durability, timelessness; složité („fussy“) návrhy jako slabina", "ČSN EN ISO 129-1 (013130), Technická dokumentace produktu (TPD) - Kótování a tolerování - Část 1: Obecné zásady (ÚNMZ, 2019; ISO 129-1:2018), https://www.tzb-info.cz/normy/csn-en-iso-129-1-2019-04 - konvence kótování: kótovací a pomocné čáry, ukončení kót", "Dimensioning on drawings, Wikipedia (přehled pravidel podle ISO 129-1), https://en.wikipedia.org/wiki/Dimensioning_on_drawings - kótovací čára rovnoběžná s měřenou hranou a odsazená, pomocné čáry kolmo ke kótovací čáře", "testing-checklist.md: 3. Form - optical corrections, geometry clean, junction check, mirror test", "critique.md: Scorecard - Craft; Common diagnoses - Circle looks small next to letters, Rounded rectangle looks pinched, Reversed version looks bold, Looks dated (effects)", "Karen Cheng, Designing Type (Yale University Press, 2. vyd. 2020) - optické korekce, optická vs. geometrická poloha a rovnováha tvarů", "Duke University, Graphic Design: Optical center, https://sites.math.duke.edu/education/ccp/resources/write/design/graphic7.html - optický střed leží mírně nad geometrickým", "Robert Bringhurst, The Elements of Typographic Style (Hartley & Marks, 4. vyd. 2012) - písmo se nedeformuje roztažením ani stlačením; potřebná šíře se řeší řezem", "testing-checklist.md: 3. Form - balance (not accidentally tilted, weight distributed, proportions), optical centre, mirror test", "critique.md: Common diagnoses - Feels unstable (accidental tilt, top-heavy mass; correct axes, check optical centre)"]
  - id: falesna_cteni
    name: "Bez falešných čtení"
    weight: 8
    anchors:
      4: "Značka se v některé dodané velikosti nebo kontextu čte jako něco nechtěného: jiné písmeno, ikona aplikace nebo systému (přehrávání, načítací kolečko, napájení, poloha), výstražná značka, náboženský či politický symbol, známá značka, část těla nebo nevhodný tvar. Jde o smrtelnou vadu (b)."
      6: "Žádné hrubé falešné čtení, ale v 16 px nebo v některém kontextu připomene běžnou ikonu rozhraní či jiné písmeno; upravené písmeno v logu se napoprvé čte s váháním."
      8: "Ve všech dodaných velikostech, černobíle, inverzně i v kontextech se čte jen tak, jak má; každé upravené písmeno přečteš napoprvé správně. Žádná podobnost s ikonami rozhraní ani se známými značkami."
      10: "Jako 8 a navíc obstojí i v nejrizikovějších dodaných kontextech (záložka prohlížeče, ikona telefonu, razítko) a kde se v kontextu objeví otočená, nevznikne nic nechtěného; dvojí čtení, pokud existuje, je záměrná součást myšlenky."
    sources: ["testing-checklist.md: 3. Form - rotation / unintended readings, letter test; 4. Familiarity test", "critique.md: Common diagnoses - Unfortunate reading (designer blindness), Hidden meaning nobody sees; Total - one fatal flaw outweighs a high total", "Chermayeff & Geismar & Haviv, Identify (2011) - appropriate: značka nesmí nést nevhodné konotace"]
  - id: typografie
    name: "Typografie názvu a vztah ke značce"
    weight: 8
    anchors:
      4: "Písmo je výchozí nebo módní bez vztahu k tónu zadání, se špatným prostrkáním (viditelné díry nebo slepená písmena), nebo má chybnou, chybějící či nahrazenou českou diakritiku. Značka a název působí jako dvě nesouvisející věci (jiná geometrie, tloušťka, rádiusy)."
      6: "Písmo je vhodné a čitelné, diakritika (je-li) správná, ale nepřizpůsobené (obecný sázecí řez, standardní prostrkání). Vztah ke značce drží jen velikostí, ne logikou tvarů. V hlavičce webu i na vizitce je čitelné."
      8: "Písmo tónem odpovídá zadání (ostré/oblé, těžké/lehké, klasické/moderní) a je opticky prostrkané (rovnoměrná šeď bez děr). Diakritika (je-li) drží váhu, sklon a odstup základního písmene. Značka a písmo sdílí tloušťku tahu, rádiusy nebo úhly; nejvýš dvě rodiny."
      10: "Nápis má vlastní úpravu (upravené písmeno, ligatura nebo detail), která navazuje na myšlenku značky a je poznatelná i bez symbolu, přitom zůstává čitelný. Diakritika (je-li) je řešená jako plnohodnotná část kresby. Logo s názvem je vyvážené v hlavičce webu, na vizitce i na ceduli."
    sources: ["Alina Wheeler, Designing Brand Identity (5. vyd. 2017), část 1 Basics - typy značek včetně wordmarks", "Michael Evamy, Logotype (Laurence King, 2012) - vlastní úprava nápisu jako nositel identity", "Karen Cheng, Designing Type (2. vyd. 2020) - prostrkání a rytmus, kresba diakritiky", "David Březina, On Diacritics (I Love Typography, 24. 1. 2009), https://ilovetypography.com/2009/01/24/on-diacritics/ - diakritika je součást písmene, váhou a kontrastem odpovídá základnímu písmenu, musí být čitelná v malé velikosti", "Filip Blažek, The Diacritics Project, https://diacritics.typo.cz/ - akcenty ladí s písmeny i navzájem", "critique.md: Scorecard - Typography (appropriate, customised, legible, well spaced, ≤ 2 families); Common diagnoses - Symbol and type feel unrelated"]
  - id: navaznost_trvanlivost
    name: "Navázání na hodnotu dnešního loga, nebo trvanlivost nové značky"
    weight: 8
    anchors:
      4: "Oživení: zahodí zavedený motiv nebo jiný prvek, který je podle auditu poznávaný a vlastní, bez důvodu ze zadání (platí i pro nový směr, který zavedený motiv opouští), nebo jde o kosmetiku (jiné písmo či barva) a slabiny z auditu zůstaly. Nové logo: stojí na módním efektu nebo stylu (přechody, trendové písmo, lesk), bez kterého by nezbyl tvar."
      6: "Oživení: zachová poznávané a vlastní prvky, ale slabiny z auditu odstraní jen částečně (např. 16 px stále nefunguje), nebo zachová i to, co audit označil za slabé či generické. Nové logo: bez efektů, ale stylizace (písmo, tloušťky, paleta) je tatáž jako u dodaných log konkurence nebo současné vlny oboru."
      8: "Oživení: vedle dnešního loga jsou zachované prvky z auditu na obrázku přímo identifikovatelné (vyjmenuj je) a každá slabina z auditu je viditelně vyřešená na konkrétním obrázku (malá velikost, černobíle, kontext). Nové logo: bez efektů a trendových prvků; tvar stojí na myšlence, ne na stylu."
      10: "Oživení: zachovaný prvek je výraznější než v dnešním logu (větší podíl na siluetě, čitelný i v 16 px) a nové logo je jeho zjevným pokračováním. Nové logo: jako 8 a navíc ani písmo ani paleta nejsou vázané na současnou módu; po odebrání barvy i názvu zůstává celá myšlenka."
    sources: ["Jenni Romaniuk, Building Distinctive Brand Assets (Oxford University Press, 2018) - fame a uniqueness; silné prvky vyvíjet, ne nahrazovat (parafráze, shrnuto na https://umbrex.com/resources/frameworks/marketing-frameworks/distinctive-brand-assets-framework-ehrenberg-bass/)", "Jenni Romaniuk / Ehrenberg-Bass Institute, Q&A: Seven Costly Sins of Brand Identity - zbytečné obměny, odstraňování poznávaných prvků, ladění slabých prvků, https://marketingscience.info/news-and-insights/qa-seven-costly-sins-of-brand-identity", "Walsh, Winterich, Mittal, Do logo redesigns help or hurt your brand? The role of brand commitment (Journal of Product & Brand Management 19(2), 2010, s. 76–84), https://doi.org/10.1108/10610421011033421 - zákazníci se silným vztahem ke značce hodnotí změnu tvaru loga záporně, zákazníci se slabým vztahem kladně; u podniku se stálou klientelou proto zachovat poznávaný tvar", "Paul Rand, Logos, Flags, and Escutcheons (1991) - durability, timelessness", "Chermayeff & Geismar & Haviv, Identify (2011) - Chermayeff: dobrá značka je „devoid of fashion or trend“, https://salon.com/2011/09/23/chermayeff_geismar_imprint", "Alina Wheeler, Designing Brand Identity (5. vyd. 2017), část 1 Basics - brand ideals: durability, coherence", "critique.md: Scorecard - Longevity; testing-checklist.md: 5. Meaning and fit"]
