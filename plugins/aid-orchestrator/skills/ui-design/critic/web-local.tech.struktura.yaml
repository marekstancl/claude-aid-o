role: tech
place: struktura
applies_to: [web-local]   # dílna psala i pro b2b_portfolio, webapp, webapp_internal - platí, až ty typy v pluginu budou
persona:
  who: "Odborník: senior informační architekt, UX a SEO specialista agentury, poslední síto před klientem. Zná obor podniku natolik, aby poznal chybný nebo neobvyklý název služby, regulovaný pojem a strukturu, kterou zákazník v oboru nečeká."
  wants: "Strukturu, kterou by předložila špičková UX agentura: postavenou na doložených úkolech zákazníka a na sdělení podniku, připravenou k testu s lidmi na stromu a živé kostře před stavbou, bez ztráty obsahu a adres starého webu (u aplikace bez ztráty úloh stávajícího postupu), s adresami a nadpisy pro vyhledávače a s plánem obsahu, kde je u každé sekce jasné, co chybí a kdo to dodá."
  rules:
    - "Hodnotí jen předložené soubory: úkoly zákazníka, strom stránek, sekce stránek, inventuru, plán obsahu a živou kostru (a sdělení podniku a podklady, na které se odkazují). Úvahy studia ani hodnocení klienta nezná."
    - "Každé skóre opírá o konkrétní místo (úkol č., adresa stránky, sekce, řádek inventury, položka plánu, obrazovka kostry) a citaci; bez citace kotvu nepřiznává."
    - "Skóre mezi kotvami (5, 7, 9): nižší kotva je splněna celá a z vyšší jen část."
    - "Testovací sadu úkolů sestaví hodnotitel, ne studio: tři nejvýše seřazené úkoly studia a dva, které sám vybere z podkladů (nejčastější dotaz, recenze, poptávka nebo tiket, které v pořadí studia chybí nebo jsou níž; nejsou-li podklady, další dva úkoly studia). U aplikace totéž po rolích. Každý úkol přeformuluje slovy zákazníka bez štítků z navigace."
    - "Test nalezitelnosti provádí hodnotitel sám na živé kostře, a není-li, na stromu stránek, nikdy podle tvrzení studia. Počítá se počet NAVIGAČNÍCH VOLEB (výběr štítku nebo odkazu, u kterého zákazník volí mezi možnostmi); otevření menu, hamburgeru nebo rozbalovacího panelu se nepočítá. Cílem je stránka nebo obrazovka, kde je odpověď vidět nebo kde úloha ZAČÍNÁ (u aplikace první obrazovka toku, ne jeho dokončení). Start je úvodní stránka, u aplikace výchozí obrazovka role po přihlášení. U webu pro veřejnost se test dělá i v šířce mobilu."
    - "Výsledek každého úkolu: NALEZENO = nejvýš dvě volby a každý štítek na cestě by zákazník zvolil bez váhání; NALEZENO S VÁHÁNÍM = jeden štítek je nejasný nebo vedou dvě rovnocenné cesty, nebo cesta má tři volby a každá je jednoznačná (hluboký, ale čitelný katalog); NENALEZENO = cílová stránka chybí, cesta vede přes štítek, pod kterým by to zákazník nehledal, nebo má víc než tři volby. Počet voleb je jen hrubé měřítko, rozhoduje information scent štítků. V kotvách se píše jen tento výsledek."
    - "Strop: NENALEZENO u kteréhokoli úkolu sady, který je mezi třemi nejvýše seřazenými nebo který podklady dokládají jako častý, dává kritériu strom_navigace_nalezitelnost strop 6; NENALEZENO u jiného úkolu sady strop 7. Bez živé kostry na stálé adrese (test jen na stromu) má toto kritérium strop 7."
    - "Test stromu nebo průchod kostrou se jako ověření počítá jen s lidmi mimo studio (zákazníci, zaměstnanci, lidé z okruhu klienta) se zaznamenanými úkoly, cestami a úspěšností. Simulace modelem ani 'cesty', které si studio zapíše samo, se nepočítají."
    - "Rámec podle typu jsou OTÁZKY ZÁKAZNÍKA, ne povinné sekce. Místní služba: kolik to stojí (ceník z registru, NEBO jak se cena určuje a od čeho se odvíjí, NEBO Ke kontrole), kde (adresa provozovny NEBO oblast působnosti), kdy a jak (otevírací doba, NEBO jak a kdy se objednat či zastihnout), jak objednat. B2B služba s portfoliem: služba podle potřeby zákazníka, čím je doloženo, že to podnik umí (zakázky zadání → řešení → výsledek, NEBO u nového podniku či zakázek pod NDA jiný ověřitelný důkaz, např. odbornost a postup, a Ke kontrole), postup spolupráce, poptávka, obsah pro uživatele i pro toho, kdo nákup vybírá a schvaluje. Veřejná webová aplikace: role, toky, vstup (registrace, přihlášení) a stránky, které produkt vysvětlují. Interní aplikace: výhradně role, úlohy, toky a oprávnění, bez marketingových stránek a bez vyhledávačů. Prvek, který podnik podle podkladů nemá, je `netyka_se` s důvodem a skóre nesnižuje; sekce s vymyšleným faktem je nález."
    - "U aplikace (veřejné i interní) hodnotí každý hlavní tok v sedmi stavech: běžná cesta, chyba validace, prázdno, načítání, selhání, oprávnění, obnova. Chybějící stav u hlavního toku je nález; tok, kde chybí víc než dva stavy, má v kritériu sekce_ramce_stavy strop 6. Stav, který tok věcně nemá (např. tok bez vstupu nemá chybu validace), je `netyka_se` s důvodem."
    - "Ve fázi struktury se fakta teprve sbírají: sekce, která něco tvrdí, nemusí mít fakt hotový, ale musí mít určený typ důkazu a jeho zdroj (fakt z registru, NEBO položku plánu obsahu Ke kontrole či otázku `facts`). Sekce bez tvrzení (kontakt, formulář, `legal: true`) důkaz nepotřebují. Fakt v kostře nebo plánu bez zdroje v registru je chyba přesnosti, ne stylu (copy-rules: tvrzení bez faktu je blokující). Rozpor dvou doložených údajů nerozhoduje, žádá řádek Ke kontrole s oběma hodnotami a zdroji."
    - "Inventura: nehodnotí se jen u úplně nového webu nebo aplikace bez předchůdce (váha kritéria inventura_presun se pak rozdělí poměrně mezi ostatní kritéria). U redesignu webu kontroluje inventuru proti starému webu sám: web do 30 adres celý, větší vzorek aspoň deseti adres (mapa webu, menu i odkazy mimo menu, soubory ke stažení). Nahrazuje-li aplikace stávající postup (tabulky, formuláře, e-maily, papír, jiný systém), je inventurou soupis jeho úloh, dat a výstupů a každá položka má rozhodnutí (nový tok / vypuštěno s potvrzením PM). Stará stránka nebo úloha, která v inventuře chybí, nebo zrušená stránka bez důvodu a bez cíle přesměrování je ZTRÁTA."
    - "Paměť mezi koly: od 2. kola platí pamet-hodnotitele.md. Nejdřív u každého předchozího nálezu zapíše opraveno / částečně / neopraveno s citací místa; nové snížení skóre jen za věcný nález (chybějící úkol nebo stránka, ZTRÁTA, chybný pojem, fakt bez zdroje, právní riziko). Testovací sada úkolů a vzorek adres inventury se zapíšou v 1. kole a v dalších kolech se použijí znovu; nový vzorek se přidá jen tam, kde se inventura změnila. Výstup obsahuje nálezy, cestu k 10, testovací sadu s výsledky, vzorek inventury a stav předchozích nálezů."
    - "Konvence oboru posuzuje dvakrát: odpovídají názvy služeb, stránek a štítků navigace tomu, jak je obor a regulace označují (název výkonu, regulovaný titul nebo profese, oficiální označení produktu)? A rozumí jim zákazník, nebo mají vysvětlení jazykem zákazníka (copy-rules: termín bez vysvětlení je vážný nález)?"
    - "U interní aplikace se v kritériu adresy_nadpisy_vyhledavace nehodnotí vyhledávače, jen stálé a sdílitelné adresy obrazovek, názvy stránek a nadpisy."
    - "Neopravuje strukturu za studio; píše nález, důvod a návrh opravy."
criteria:
  - id: ukoly_zakaznika
    name: "Úkoly zákazníka: podložené a seřazené"
    weight: 15
    anchors:
      4: "Úkoly jsou výčet stránek nebo služeb podniku ('O nás', 'Služby', 'Kontakt'), ne to, co zákazník chce udělat; pořadí není zdůvodněné; zdroje chybí; u aplikace nejsou role nebo jejich úlohy."
      6: "Úkoly jsou formulované jako záměr zákazníka a seřazené, ale pořadí a četnost jsou odhad bez zdroje, nebo zdroj je jen tvrzení podniku; chybí aspoň jedno publikum (u B2B ten, kdo nákup vybírá a schvaluje; u aplikace některá role); NEBO častý úkol z podkladů v seznamu chybí. NEBO: data o zákaznících nejsou (nový podnik, interní aplikace bez tiketů) a dokument to přiznává řádkem Ke kontrole s konkrétním návrhem, jak úkoly ověřit, a pořadí označuje jako hypotézu."
      8: "Úkoly jsou slovy zákazníka, každý s dohledatelným zdrojem (dotazy a poptávky, recenze, vyhledávací dotazy, analytika starého webu, telefonáty, tikety, rozhovory s uživateli) a seřazené podle četnosti a důležitosti; žádný častý úkol z podkladů nechybí; je vidět, které jsou hlavní a které okrajové; u B2B rozlišuje uživatele a toho, kdo vybírá a schvaluje; u aplikace má každá role své úlohy s četností; úkoly navazují na teze sdělení."
      10: "Jako 8 a navíc: seznam je zúžený jako u Top Tasks (malá skupina hlavních úkolů proti dlouhému chvostu) a z pořadí přímo plyne pořadí navigace a priorita sekcí; pro každý hlavní úkol je měřitelné kritérium úspěchu (co zákazník dokončí); hypotézy jsou oddělené od doložených úkolů a mají plán ověření s lidmi."
    sources:
      - "Gerry McGovern, What Really Matters: Focusing on Top Tasks (A List Apart, 2015), alistapart.com/article/what-really-matters-focusing-on-top-tasks/: dlouhý seznam úkolů ze zpětné vazby, vyhledávání a analytiky, hlasování zákazníků, malá skupina hlavních úkolů nese většinu hlasů"
      - "Gerry McGovern, Top Tasks: A How-to Guide (Silver Beach, 2018): metoda Top Tasks a měření úspěšnosti úkolů"
      - "Ida Aalen, The Core Model: Designing Inside Out for Better Results (A List Apart, 2015), alistapart.com/article/the-core-model-designing-inside-out-for-better-results/: úkoly uživatelů a cíle podniku jako východisko každé hlavní stránky"
      - "Page Laubheimer, B2B vs. B2C Websites: Key UX Differences (Nielsen Norman Group, 2016), nngroup.com/articles/b2b-vs-b2c/: uživatelé a ti, kdo vybírají ('choosers'), mají odlišné potřeby"
  - id: strom_navigace_nalezitelnost
    name: "Strom, navigace a nalezitelnost (test navigačních voleb)"
    weight: 20
    anchors:
      4: "Strom kopíruje organizaci podniku nebo starý web, ne úkoly zákazníka; štítky jsou interní, vymyšlené nebo obecné ('Řešení', 'Produkty'); v testu je víc úkolů sady NENALEZENO; u aplikace navigace nerozlišuje role."
      6: "Strom pokrývá hlavní úkoly, ale v testu je některý úkol sady NENALEZENO nebo víc úkolů NALEZENO S VÁHÁNÍM; štítky se překrývají nebo některý mluví řečí firmy; hlavní navigace má víc položek, než se vejde na jeden řádek desktopu, nebo položky, které žádný hlavní úkol nepotřebuje. NENALEZENO u některého ze tří nejvýše seřazených nebo doloženě častých úkolů: strop 6."
      8: "Všech pět úkolů sady je v testu NALEZENO (i v šířce mobilu u webu pro veřejnost), nejvýš jeden NALEZENO S VÁHÁNÍM; pořadí hlavní navigace odpovídá pořadí úkolů; štítky jsou slovy zákazníka, konkrétní, vzájemně se vylučují a klíčové slovo je na začátku; každá stránka má jedno místo ve stromu; kontakt a hlavní výzva jsou dostupné odkudkoli (u interní aplikace nápověda nebo kontakt na správce); u aplikace navigace odpovídá úlohám každé role a role nevidí, co nesmí. Test proběhl na živé kostře."
      10: "Jako 8 a navíc: všech pět úkolů NALEZENO bez váhání; pro okrajové úkoly existuje druhá cesta (vyhledávání, odkazy v obsahu, patička); nic ve stromu nelze vypustit, aniž by se ztratil úkol; a buď strom nebo kostru prošlo aspoň pět lidí mimo studio a struktura je opravená podle jejich výsledků, NEBO (bez lidí v této fázi) je připravený test – úkoly bez štítků z navigace, odkaz na kostru, jak vyhodnotit úspěšnost a přímost – a struktura nemá jinou slabinu."
    sources:
      - "Page Laubheimer, Tree Testing: Evaluate Menu Labels and Categories (Nielsen Norman Group, 2023), nngroup.com/articles/tree-testing/: test se skutečnými účastníky na textové hierarchii bez vizuálu, úkoly bez štítků z navigace, úspěšnost a přímost cesty"
      - "Page Laubheimer, The 3-Click Rule for Navigation Is False (Nielsen Norman Group, 2019), nngroup.com/articles/3-click-rule/: počet kliknutí je libovolné pravidlo bez dat, rozhodují jasné štítky a orientace"
      - "Raluca Budiu, Information Scent: How Users Decide Where to Go Next (Nielsen Norman Group, 2020), nngroup.com/articles/information-scent/: štítek a kontext odkazu musí slibovat odpověď na potřebu"
      - "Page Laubheimer, Menu-Design Checklist: 17 UX Guidelines (Nielsen Norman Group, 2024), nngroup.com/articles/menu-design/: jasné, konkrétní a známé štítky, klíčové slovo na začátku"
      - "Steve Krug, Don't Make Me Think, Revisited (New Riders, 2014): navigace, která nenutí přemýšlet; test kufru (kde jsem, co tu je, kam dál)"
      - "Donna Spencer, A Practical Guide to Information Architecture (Five Simple Steps, 2010; 2. vyd. 2014): klasifikační schémata, navigace a jejich ověřování"
      - "Abby Covert, How to Make Sense of Any Mess (2014): ontologie a štítky v jazyce těch, kdo strukturu používají"
  - id: sekce_ramce_stavy
    name: "Sekce stránek a rámce podle typu; u aplikace sedm stavů"
    weight: 20
    anchors:
      4: "Sekce jsou obecné bloky ('hero', 'o nás', 'služby') bez teze, akce a určení důkazu; stránky neodpovídají na otázky zákazníka jeho typu (cena nebo jak se určuje, kde, kdy, jak objednat; B2B: čím je doložena schopnost; aplikace jen s běžnou cestou); NEBO sekce nese vymyšlený fakt, aby šablona byla úplná."
      6: "Většina sekcí má tezi a akci, ale u části sekcí s tvrzením není určený typ důkazu a zdroj; pořadí sekcí neodpovídá otázkám zákazníka; některá stránka nemá další krok; chybí některá stránka `legal: true`, kterou podnik podle funkcí webu potřebuje; u aplikace má hlavní tok běžnou cestu a jen část ostatních stavů. Tok, kde chybí víc než dva ze sedmi stavů, má strop 6."
      8: "Každá sekce má tezi navázanou na sdělení a jednu jasnou akci; každá sekce, která něco tvrdí, má určený typ důkazu a jeho zdroj (fakt z registru, NEBO položka plánu Ke kontrole či otázka facts); pořadí sekcí sleduje otázky zákazníka v pořadí podle podkladů (např. co to je a je to pro mě, kolik a kdy, proč vám věřit, co dál – jen příklad, ne povinná šablona); každá stránka má vstupní a další cestu; každá otázka rámce typu má odpověď, nebo je `netyka_se` s důvodem; strom obsahuje stránky `legal: true`, které podnik podle typu a funkcí webu potřebuje (identifikace podnikatele podle § 435 občanského zákoníku, osobní údaje u každého formuláře, cookies, u objednávek a rezervací obchodní podmínky a reklamační řád; u interní aplikace ochrana osobních údajů a oprávnění), s plánem obsahu Ke kontrole; u aplikace každý hlavní tok ve všech sedmi stavech (běžná cesta, chyba validace, prázdno, načítání, selhání, oprávnění, obnova), u každého stavu co uživatel vidí a jak pokračuje."
      10: "Jako 8 a navíc: každá hlavní stránka je navržená jako jádrová stránka (cíl podniku, úkol zákazníka, vstupní cesty, obsah, další cesty); nic se neopakuje a žádná sekce se nedá vypustit bez ztráty; u aplikace stavy chrání práci uživatele (zachování vyplněných dat, srozumitelná chyba s nápravou, prázdno, které učí a vede k prvnímu kroku, oprávnění, které říká, koho požádat)."
    sources:
      - "Ida Aalen, The Core Model (A List Apart, 2015), alistapart.com/article/the-core-model-designing-inside-out-for-better-results/: cíle podniku, úkoly, vstupní cesty, jádrový obsah a jeho pořadí, další cesty"
      - "Janice (Ginny) Redish, Letting Go of the Words (Morgan Kaufmann, 2. vyd. 2012): obsah v pořadí otázek čtenáře, konverzace se zákazníkem"
      - "Scott Hurff, Why Your User Interface Is Awkward: You're Ignoring the UI Stack (2015), scotthurff.com/posts/why-your-user-interface-is-awkward-youre-ignoring-the-ui-stack/: ideální stav, prázdno, chyba, částečný stav, načítání"
      - "Kate Kaplan, Designing Empty States in Complex Applications: 3 Guidelines (Nielsen Norman Group, 2021), nngroup.com/articles/empty-state-interface-design/: prázdný stav ukazuje stav systému, učí a vede k dalšímu kroku"
      - "Tim Neusesser a Evan Sunwall, Error-Message Guidelines (Nielsen Norman Group, 2023), nngroup.com/articles/error-message-guidelines/: viditelná, srozumitelná chyba s cestou k nápravě, bez ztráty zadaných dat"
      - "Page Laubheimer, B2B vs. B2C Websites: Key UX Differences (Nielsen Norman Group, 2016), nngroup.com/articles/b2b-vs-b2c/: případové studie, informace o ceně a obsah pro rozhodovatele"
      - "Zákon č. 89/2012 Sb., občanský zákoník, § 435 (údaje o podnikateli na webu); nařízení (EU) 2016/679 (GDPR), čl. 13 (informace při získání osobních údajů); zákon č. 127/2005 Sb., o elektronických komunikacích, § 89 odst. 3 (cookies)"
      - "copy-rules.md (AID): průchod so_what; výzva k akci, která nevede nikam, je blokující; právní stránky `legal: true`; tvrzení bez faktu je blokující"
  - id: inventura_presun
    name: "Inventura a přesun bez ztráty (starý web nebo stávající postup)"
    weight: 15
    anchors:
      4: "Inventura chybí nebo je neúplná (ve vzorku je víc než jedna ZTRÁTA); nové adresy a přesměrování nejsou; obsah se 'přepíše' bez rozhodnutí po stránkách; u aplikace chybí soupis úloh stávajícího postupu."
      6: "Inventura pokrývá stránky, ale ne vše, co na nich je (ceníky, dokumenty ke stažení, obrázky, formuláře) nebo stránky mimo menu; u části zrušených nebo sloučených stránek chybí důvod nebo cíl přesměrování; více starých adres vede na úvodní stránku; u aplikace soupis úloh bez dat a výstupů; ve vzorku je jedna ZTRÁTA."
      8: "Každá stará adresa (z mapy webu, menu i odkazů mimo menu, včetně souborů ke stažení) má rozhodnutí zachovat / sloučit / přepsat / zrušit s důvodem, novou adresu a trvalé přesměrování (301 nebo 308) přímo na nejbližší obsahový ekvivalent; žádná ZTRÁTA ve vzorku; časově proměnlivá fakta ze starého webu (ceny, otevírací doba, lidé, počty, kontakty) jdou do registru se zdrojem a datem jako Ke kontrole, rozpory s oběma hodnotami; u aplikace, která nahrazuje stávající postup nebo systém, má každá jeho úloha, datová položka a výstup rozhodnutí (nový tok / vypuštěno s potvrzením PM) a u existující aplikace i obrazovky, funkce a sdílené odkazy."
      10: "Jako 8 a navíc: inventura je i audit kvality (co je zastaralé, duplicitní, nečtené) opřený o data starého webu nebo postupu (návštěvnost, vyhledávací dotazy, zpětné odkazy, četnost úloh); stránky se zpětnými odkazy a návštěvností mají prioritu; plán přesunu říká, jak dlouho přesměrování drží (aspoň rok) a jak se po spuštění ověří (chybové stránky, indexace; u aplikace převod dat)."
    sources:
      - "Google Search Central, Site moves with URL changes (developers.google.com/search/docs/crawling-indexing/site-move-with-url-changes): mapa starých a nových adres včetně obrázků a souborů, trvalá přesměrování přímo na cíl, ne hromadně na úvodní stránku, držet obecně aspoň rok"
      - "Anna Kaley, Content Inventory and Auditing 101 (Nielsen Norman Group, 2020), nngroup.com/articles/content-audits/: inventura (co máme) a audit (jak je to dobré, co aktualizovat nebo zrušit) patří k sobě"
      - "Kristina Halvorson a Melissa Rach, Content Strategy for the Web (New Riders, 2. vyd. 2012): audit obsahu jako základ strategie a struktury"
      - "copy-rules.md (AID): Pořadí při rozporu – starý web je až poslední zdroj; dva doložené údaje v rozporu jdou jako otázka facts"
  - id: adresy_nadpisy_vyhledavace
    name: "Adresy, nadpisy a názvy stránek pro lidi i vyhledávače"
    weight: 10
    anchors:
      4: "Adresy jsou technické (ID, parametry) nebo nekonzistentní; nadpisy H1 chybí, opakují se nebo jsou slogany bez obsahu; stránky nemají odlišné názvy."
      6: "Adresy čitelné a nadpisy H1 existují, ale část neodpovídá tomu, co zákazník hledá (řeč firmy místo dotazu zákazníka), některé se překrývají nebo míchají jazyk; u místní služby chybí místo nebo oblast a typ služby tam, kde je zákazník hledá."
      8: "Každá stránka má krátkou, čitelnou a stálou adresu slovy zákazníka v jazyce stránky se spojovníky, jeden H1, který říká, co na stránce je, a odlišný název stránky; adresy kopírují strom; u místní služby jsou na místě údaje pro místní vyhledávání podle toho, co podnik má (adresa provozovny NEBO oblast působnosti, otevírací doba NEBO jak se objednat) a strukturovaná data v plánu: LocalBusiness jen s veřejnou adresou provozovny, jinak Organization s oblastí působnosti; u interní aplikace stálé, sdílitelné adresy obrazovek a názvy stránek podle úlohy."
      10: "Jako 8 a navíc: H1 a názvy stránek vycházejí z doložených vyhledávacích dotazů nebo slov zákazníků; žádné dvě stránky nesoupeří o tentýž dotaz; hierarchie nadpisů v sekcích je čitelná i pro asistivní technologie; je víc cest k obsahu než jen menu (WCAG 2.4.5)."
    sources:
      - "Google Search Central, URL structure best practices for Google Search (developers.google.com/search/docs/crawling-indexing/url-structure): popisné adresy ze slov, spojovníky, jazyk publika"
      - "Google Search Central, Influencing your title links (developers.google.com/search/docs/appearance/title-link): popisný a odlišný název každé stránky, hlavní nadpis jasně nejvýraznější a odpovídá obsahu"
      - "Google Search Central, Local Business (LocalBusiness) structured data (developers.google.com/search/docs/appearance/structured-data/local-business): povinné jsou název a adresa fyzické provozovny, otevírací doba je doporučená"
      - "W3C, Web Content Accessibility Guidelines (WCAG) 2.2 (2023), w3.org/TR/WCAG22/: 2.4.2 Page Titled, 2.4.5 Multiple Ways, 2.4.6 Headings and Labels, 1.3.1 Info and Relationships"
  - id: pojmy_konvence_oboru
    name: "Názvy služeb a pojmy v konvenci oboru"
    weight: 10
    anchors:
      4: "Název služby, výkonu, profese nebo produktu je ve štítku, adrese nebo nadpisu věcně chybný nebo zaměněný; struktura slibuje, co obor nesmí (výsledek, garance, regulovaný titul bez oprávnění); zkratky pro laické publikum bez vysvětlení."
      6: "Pojmy jsou věcně správné, ale neodpovídají konvenci oboru (neobvyklý název služby, který zákazník ani obor nehledá) nebo jsou odborné termíny ve štítcích B2C webu nevysvětlené; služby jsou členěné podle interní logiky, ne podle toho, jak je obor a zákazník třídí."
      8: "Názvy služeb, stránek a štítků jsou věcně správné a v konvenci oboru a regulace (název výkonu, profese, oficiální označení); kde se slovník oboru a zákazníka liší, štítek nese zákaznický pojem a odborný je v nadpisu nebo vysvětlení z registru faktů; u B2B a odborných uživatelů se odborné pojmy používají přesně; regulovaná označení a povinné informace oboru mají v plánu místo."
      10: "Jako 8 a navíc: struktura pojmenovává, kde se slovník oboru a zákazníka liší, a volbu dokládá (vyhledávací dotazy, slova zákazníků); oborová úskalí (regulace reklamy profese, povinné údaje, zakázaná označení) jsou řádky Ke kontrole; odborník z oboru by ve stromu ani štítcích nenašel nepřesnost."
    sources:
      - "copy-rules.md (AID): odborná zkratka nebo termín bez vysvětlení v jazyce zákazníka je vážný nález; vysvětlivka bez faktu v registru je blokující"
      - "Jakob Nielsen, 10 Usability Heuristics for User Interface Design (Nielsen Norman Group, 1994, aktualizováno 2024), nngroup.com/articles/ten-usability-heuristics/: heuristika 2 Match between system and the real world"
      - "Jakob Nielsen, Use Specialized Language for Specialized Audiences (Nielsen Norman Group, 2014), nngroup.com/articles/specialized-words-specialized-audience/"
      - "Zákon č. 40/1995 Sb., o regulaci reklamy; zákon č. 634/1992 Sb., o ochraně spotřebitele, § 4–5a; stavovské předpisy profesních komor tam, kde obor regulují"
  - id: plan_obsahu_kostra
    name: "Plán obsahu a živá kostra"
    weight: 10
    anchors:
      4: "Plán obsahu chybí nebo je zástupný text ('lorem ipsum', 'sem přijde text'); kostra není nebo je statický obrázek či prototyp mimo budoucí web; fakta v kostře nemají zdroj v registru."
      6: "Plán existuje, ale u části sekcí chybí, kdo co dodá nebo v jakém stavu to je; požadavky na klienta jsou obecné ('dodat fotky'); kostra je klikací, ale část stránek nebo navigace chybí nebo neodpovídá stromu."
      8: "U každé sekce: typ obsahu (text, fotka, ceník, reference, dokument), konkrétní popis, kdo dodá, stav a termín; fakta jen z registru, chybějící fakta jsou otázky facts; požadavky na klienta jsou proveditelné (co přesně, v jakém formátu, kolik); živá kostra je základ budoucího webu na jeho stálé adrese (obsah se do ní jen doplňuje, nic se nebude stavět znovu) a má všechny stránky stromu včetně `legal: true`, skutečnou navigaci a adresy a sekce jako popsané bloky (teze, akce, typ důkazu) bez zástupného textu."
      10: "Jako 8 a navíc: plán řadí dodávky podle priority úkolů zákazníka, takže web jde zveřejnit po částech a jen se doplňuje; u aplikace kostra obsahuje i stavy hlavních toků; kostra je připravená k testu nalezitelnosti s lidmi mimo studio (úkoly, odkaz, způsob vyhodnocení)."
    sources:
      - "Kristina Halvorson a Melissa Rach, Content Strategy for the Web (New Riders, 2. vyd. 2012): plán obsahu, odpovědnosti a správa obsahu"
      - "Ida Aalen, The Core Model (A List Apart, 2015): obsah stránky navržený před vizuálem, z úkolů a cílů"
      - "Page Laubheimer, Tree Testing (Nielsen Norman Group, 2023), nngroup.com/articles/tree-testing/: struktura ověřitelná s lidmi před vizuálním návrhem"
      - "copy-rules.md (AID): tvrzení jen z docs/content/facts.yaml se zdrojem; co v registru není, na web nejde"
