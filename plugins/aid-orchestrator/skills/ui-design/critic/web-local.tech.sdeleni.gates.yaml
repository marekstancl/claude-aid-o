role: tech
place: sdeleni
gates:
  - criterion: presnost_podlozenost
    min: 7
    why: "Tvrzení bez zdroje nebo hypotéza jako fakt je podle copy-rules blokující; klient fakta neschvaluje, takže chybu musí zachytit odborník."
  - criterion: ostrost_positioningu
    min: 7
    why: "Zaměnitelný positioning má strop 6, takže ho brána spolehlivě zastaví; zadání PM žádá jasný rozdíl proti konkurenci nebo stávajícímu postupu."
  - criterion: pojmy_konvence_oboru
    min: 6
    why: "Chybně použitý odborný pojem nebo slib, který obor nesmí dát, je věcná chyba a právní riziko (klamavá reklama); nevysvětlený termín je vážný nález."
  - criterion: slogany
    min: 7
    why: "Sada, kde nejsou odlišené aspoň tři slogany, má strop 6 a k výběru klientovi nejde. U interní aplikace bez sloganu se nehodnotí."
  - criterion: hlas_zakaznika_jtbd
    min: 6
    why: "Sdělení bez slov a obav zákazníka je domyšlené za něj. Podnik bez recenzí nebo interní aplikace bránu splní, když dokument chybějící hlas přizná, nabídne záložní zdroje nebo otázky pro klienta či uživatele a obavy označí jako hypotézu (kotva 6), takže brána měří práci studia, ne bohatost podkladů."
weighted_min: 7.5
