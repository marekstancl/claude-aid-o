# Canonical gate check names of /aid-ui (P103). The gate (Step 7) implements
# exactly these, the coverage map's script:<name> dispositions may name only
# these, and the gate and `finish` share the matrix axes below.
# Rules FB-1..FB-15 and FB-21..FB-24 of /ecosystem/specs/frontend-build-standard, plus checks
# beyond the FB rules that implement other ecosystem standards (named with their source below;
# P103 extension, rules not yet numbered in the frontend-build standard).
viewports: [390, 768, 1440]
browsers: [chromium, webkit]
warn_only: [lighthouse_mobile]   # measured and reported, never blocks (FB-13)
# where a check applies (default: every page, viewport, browser and flow state); a
# combination outside it needs no row. Keys: browsers and viewports (subsets), flows: false,
# scope: project (one row: the home page, the last viewport, the first browser).
# Glyph data comes from Chrome DevTools, Lighthouse
# drives Chrome, and both read files (pages), not flow states.
applies:
  glyph_coverage: {browsers: [chromium], flows: false}
  lighthouse_mobile: {browsers: [chromium], flows: false}
  ai_search: {browsers: [chromium], viewports: [1440], flows: false}   # reads files, not the rendering
  brand_package: {scope: project}   # one row for the whole project (home page, last viewport, first browser)
  design_standard_doc: {scope: project}
  vision_doc: {scope: project}
  coverage: {scope: project}
  customer_page: {scope: project}
  copy_review: {browsers: [chromium], viewports: [1440], flows: false}
  motion_fidelity: {scope: project}   # the gate observes the home page's motion itself (aid-ui-motion.mjs) and checks it against .aid-ui/motion.json
  safe_area: {browsers: [chromium], viewports: [390], flows: false}
  token_usage: {browsers: [chromium], viewports: [1440]}
  keyboard: {browsers: [chromium], viewports: [1440]}
  reduced_motion: {browsers: [chromium], viewports: [1440]}
  content_without_js: {browsers: [chromium], viewports: [1440]}
  first_paint_visible: {browsers: [chromium], viewports: [1440, 390]}
  form_states: {browsers: [chromium], viewports: [390], flows: false}
  a11y_basics: {browsers: [chromium], viewports: [1440]}
  mobile_native: {browsers: [chromium], viewports: [390]}
  task_test: {scope: project, browsers: [chromium]}   # one row; inside it runs at 1440 and 390
  photo_slots: {browsers: [chromium], viewports: [1440, 390], flows: false}
  form_delivery: {scope: project, browsers: [chromium]}   # one row; inside it the form is sent at 390 px
  privacy_before_consent: {browsers: [chromium], viewports: [1440], flows: false}
  touch_targets: {viewports: [390]}
checks:
  http_200: every page answers HTTP 200 (FB-1)
  glyph_coverage: every character renders in the intended font, Czech diacritics included, no system fallback (FB-2)
  no_overflow: no page scrolls sideways at any viewport (FB-3)
  one_line_controls: buttons and control-styled links do not wrap (FB-4)
  no_placeholders: no lorem ipsum, TODO, invented contact or placeholder image (FB-5)
  facts_match: prices, phones, opening hours, percentages, counted numbers (clients, projects, years) and e-mails on the pages match the facts register; a count needs an entry with the same number and meaning (FB-6; names and references are left to the copy review)
  brand_assets: logo and favicon come from the brand package, nothing drawn outside it (FB-7)
  links_resources: links, images, fonts and scripts all load (FB-8)
  required_files: localised 404 page, favicon set, og image, lang attribute (FB-9)
  axe: axe findings of severity serious and critical = 0 (FB-10); measured after motion_settled, so a reveal through opacity is not a contrast failure
  image_weight: images are WebP or AVIF, each at most 200 kB (FB-12)
  lighthouse_mobile: Lighthouse mobile score measured and reported; warning only (FB-13)
  seo: aid-ui-seo-check.py passes, a BLOCKER finding fails (FB-14)
  brand_package: the brand package holds every part the project uses - derived from the variant, options.identity and the contexts of use in the logo brief; a favicon only without brand work (design-system-standard "Brand balíček", brand-brief template part 2; aid-ui-brand-package.py)
  design_standard_doc: the project design standard (docs/design/design-standard.md, a working document until the PM approves it) has the WAN structure - Značka, Tokeny, Komponenty, Vzory, Obsah a terminologie, Platformní kontrakt, Výjimky, Vynucení - every DESIGN.md colour token, the platform rows and a measured button role (design-system-standard "What"; aid-ui-design-standard.py check)
  token_usage: every colour painted on a page (text, surfaces, borders) is a DESIGN.md colour token (design-system-standard "Tokeny", "Kontrola před nasazením")
  sticky_panels: a sticky or fixed panel taller than the window has its own scroll and keeps it inside (overscroll-behavior); no such panel = N/A (design-system-standard "Scroll a přilepené panely")
  keyboard: Tab reaches every control of the page and the focus is visible on each; no control = N/A (design-system-standard "Přístupnost", "Kontrola před nasazením")
  reduced_motion: nothing animates or transitions over 10 ms under prefers-reduced-motion (design-system-standard "Tokeny - Pohyb")
  content_without_js: with scripts off the page shows every text the scripted page shows after its motion settled and a scroll; a text only a script reveals is named (FB-27)
  first_paint_visible: right after load, before any scroll or motion, the h1 and the first content block are readable and nothing readable is faded; under prefers-reduced-motion nothing stays faded (FB-27)
  form_states: a form never posts to mailto:; sent by script it locks the submit button while sending, shows an error with a clickable phone or e-mail when the endpoint fails and a message of its own when it succeeds (FB-28)
  form_delivery: "the form sent for real through the preview's receiver (.aid-ui/form.json) at 390 px lands in .aid-ui/inbox and the page says so; the receiver refuses an incomplete message (422), drops a filled spam trap, delivers a repeat once; the preview log holds no sent value (P113a AC8; frontend-build-standard FB-28)"
  mobile_native: "hover styles only inside @media (hover: hover), zoom never disabled, form fields at least 16 px (adopted emil-skills/mobile-native; frontend-build-standard FB-33)"
  a11y_basics: "a page with a navigation starts with a skip link to the content, headings never skip a level, the focus ring has at least 3:1 against what is behind the control, and at 320 px (400 % zoom) nothing scrolls sideways (PM 13. 10. 2026, Coufal critic; frontend-build-standard FB-32)"
  text_clearance: "text beside a vertical divider line (a one-sided border of a block, not a control) keeps at least 12 px from it on every page and viewport (PM 13. 10. 2026, Coufal; frontend-build-standard FB-31)"
  photo_slots: "a photo the client still owes has a slot of its exact shape and ratio (docs/content/photos.yaml, data-aid-photo): empty it is aria-hidden with a camera icon, no text, nothing focusable; a test photo put in keeps the slot and the page height (P113a, PM 1A; frontend-build-standard FB-30)"
  task_test: "what a customer comes for (docs/content/tasks.yaml: a price, the opening hours, the booking form; every searched text from the facts register; the critic rubric's task ids all present) is found within two steps from the home page at 1440 and 390 px (P113a; frontend-build-standard FB-29)"
  touch_targets: at phone width every control is at least 44 x 44 px, inline text links excepted (design-system-standard "Co se na platformách liší - Dotyk")
  safe_area: a PWA's fixed panels at a screen edge use env(safe-area-inset-*); not a PWA = N/A (design-system-standard "Systémové okraje")
  privacy_before_consent: before any consent no third-party request, no cookie (public web) and no consent banner over 30 % of the screen (seo-audit-agent-standard "Privacy", seo/technicke-seo)
  vision_doc: docs/product-vision.md has the parts of the product-vision template, FAKT labels, an owner and a date; no vision in the project = N/A (product-vision, templates/product-vision-prompt; aid-ui-vision-check.py)
  coverage: the coverage map still matches the ecosystem standards (aid-ui-coverage.sh check exit 0; frontend-build-standard "Enforcement"); reads the standards from the eco docs tree (/opt/eco/docs/docs), so a host without it gets not_covered
  ai_search: AI search and citation readiness - the PM's AI robot policy in robots.txt, JSON-LD on every indexable page matching the facts register, main text in the HTML, no snippet bans, no llms.txt without a decision (seo-audit-agent-standard §3-4, seo/technicke-seo; aid-ui-seo-check.py --ai)
  app_task_states: an application's task x state scenarios from the task map pass (FB-11)
  no_overlap: no two visible texts, controls or images overlap (FB-21)
  brand_consistency: every text uses a webfont the site declares, and header and footer are the same on every page (FB-22)
  page_weight: a page transfers at most 1 MB, no render-blocking script in head, large raster images have srcset (FB-23)
  business_minimum: the seller is identified (IČO) on every page and a form links to how personal data are processed (FB-24)
  screenshots_reviewed: the PM has reviewed a full-page screenshot of every page at every viewport (FB-15)
  customer_page: the customer page (docs/zakaznik, aid-ui-customer-page.py) exists, is made from this build and holds no internal word; not_covered until it is generated after a green gate
  copy_review: the page's copy passed the independent copy review (aid-ui-copy.py, recorded by aid-ui-state.sh copy-record) for its current text, facts and approved product context; not_covered until reviewed; a PM exception does not make it pass (finish and the customer page read the exception)
  motion_settled: every finite animation of the page ended, nothing new started for 500 ms and the intro overlay (data-aid-intro, the one contract for an intro) is gone within 10 s; the page is measured and photographed at that moment (P108; design-system-standard "Tokeny - Pohyb")
  motion_fidelity: the built home page carries the reference's motion as the PM saw it listed with the directions - every adopt/replace item of .aid-ui/motion.json was observed to run (load, second load, scroll, hover, page) by aid-ui-motion.mjs over the site itself; no picked reference = N/A (P108)
