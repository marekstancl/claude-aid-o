<!doctype html>
<html lang="cs">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AID studio</title>
<!-- Source: the decision page of Impeccable 4.3.1 (Paul Bakaus, github.com/pbakaus/impeccable),
     licensed under the Apache License 2.0; notice in
     skills/ui-design/references/LICENSES/NOTICE-impeccable.txt.
     Reused: the --ks-* paper/ink/instrument palette, lifts and cap buttons, the tilted snapping
     deck, card faces with the preview on top, kicker badge, chips, tags, swatches, the
     "improved by" box, the sticky footer, the lightbox and the deck arrows.
     Modified by AID: Czech labels, AID payload (studio server contract), question types
     (text, page approval, exception, handover), wordmark removed; P106: the page is the run
     as a pipeline of steps (outcome and who decided per step, Detail with the step's
     decisions, the open question inside its step), derived from /state and /history. -->
<style>
  :root {
    color-scheme: light;
    --ks-kinpaku: oklch(84% 0.19 80.46);
    --ks-patina: oklch(49% 0.11 190);
    --ks-paper: oklch(97.8% 0 0);
    --ks-paper-raised: oklch(99.5% 0 0);
    --ks-paper-deep: oklch(95% 0 0);
    --ks-gray: oklch(92% 0 0);
    --ks-gray-2: oklch(88% 0 0);
    --ks-ink: oklch(13% 0 0);
    --ks-text: oklch(22% 0 0);
    --ks-text-muted: oklch(46% 0 0);
    --ks-rule: oklch(13% 0 0 / 0.12);
    --ks-edge: oklch(13% 0 0 / 0.45);
    --ks-danger: oklch(50% 0.17 28);
    --ks-instrument: oklch(24% 0 0);
    --ks-instrument-raised: oklch(31% 0 0);
    --ks-instrument-text: oklch(93% 0 0);
    --ks-lift: 0 1px 1px oklch(13% 0 0 / 0.05), 0 2px 3px oklch(13% 0 0 / 0.04), 0 6px 12px oklch(13% 0 0 / 0.05);
    --ks-cap-lift: inset 0 1px 0 oklch(100% 0 0 / 0.9), 0 1px 0 oklch(13% 0 0 / 0.14), 0 2px 3px oklch(13% 0 0 / 0.08);
    --ks-cap-press: inset 0 1px 2px oklch(13% 0 0 / 0.14);
    --ks-track-recess: inset 0 1px 3px oklch(13% 0 0 / 0.16), inset 0 -1px 0 oklch(100% 0 0 / 0.7);
    --ks-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ks-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --page-inset: max(clamp(1rem, 5vw, 4rem), calc((100vw - 90rem) / 2));
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ks-paper); color: var(--ks-text); font: 15px/1.55 var(--ks-font); padding: 1.8rem clamp(1rem, 5vw, 4rem) 0; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  header, main, .links { width: 100%; max-width: 90rem; margin: 0 auto; }
  a { color: var(--ks-patina); }
  ::selection { background: oklch(49% 0.11 190 / 0.18); color: var(--ks-ink); }
  :focus-visible { outline: 2px solid var(--ks-patina); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header: the project and the link to its brand page. */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem 2rem; flex-wrap: wrap; }
  .brand { font-size: .95rem; font-weight: 700; letter-spacing: -.01em; color: var(--ks-ink); }
  .brand-link { padding: 7px 14px; border: 1px solid var(--ks-rule); border-radius: 6px; background: var(--ks-paper-raised); box-shadow: var(--ks-cap-lift); font-size: .8125rem; font-weight: 600; color: var(--ks-ink); text-decoration: none; }
  .brand-link:hover { border-color: var(--ks-edge); }
  #notice { margin-top: 1rem; padding: .7rem 1rem; border: 1px solid var(--ks-danger); border-radius: 8px; color: var(--ks-danger); background: var(--ks-paper-raised); }
  #notice[hidden] { display: none; }

  main { flex: 1; padding: 1.4rem 0 2rem; }
  .question { display: flex; flex-direction: column; gap: 1.5rem; }
  .headline { display: flex; align-items: center; gap: .75rem; }
  .headline svg { flex: none; width: 26px; height: 26px; color: var(--ks-ink); }
  .q-title { font-weight: 600; font-size: 2rem; letter-spacing: -0.025em; line-height: 1.2; color: var(--ks-ink); text-wrap: balance; }
  .lede { color: var(--ks-text-muted); margin-top: -.8rem; max-width: 52rem; }
  .head { display: flex; flex-direction: column; gap: .4rem; }
  .tier { font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .24em; text-transform: uppercase; color: var(--ks-text-muted); }
  pre.body-json { font: 12.5px/1.5 var(--ks-mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--ks-paper-deep); border: 1px solid var(--ks-rule); border-radius: 6px; padding: .8rem 1rem; max-height: 22rem; overflow: auto; }
  .detail { color: var(--ks-text); font-size: .95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 7rem 1rem; font-size: 1.4rem; color: var(--ks-ink); text-align: center; }
  /* The run as a pipeline (P106, proposal B): hero, then one row per step. */
  .hero { border-top: 1px solid var(--ks-rule); padding: 28px 0 34px; display: flex; justify-content: space-between; gap: 32px; }
  .hero h1 { font-size: clamp(32px, 5vw, 64px); line-height: .98; letter-spacing: -.055em; max-width: 760px; font-weight: 700; color: var(--ks-ink); text-wrap: balance; }
  .hero p { flex: none; width: 310px; margin-top: 4px; color: var(--ks-text-muted); line-height: 1.5; }
  .step { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 22px; padding-bottom: 18px; }
  .step:not(:last-child)::before { content: ""; position: absolute; left: 27px; top: 38px; bottom: -1px; width: 1px; background: var(--ks-rule); }
  .mark { position: relative; z-index: 1; width: 56px; height: 56px; border: 1px solid var(--ks-rule); border-radius: 50%; display: grid; place-items: center; background: var(--ks-paper); font-weight: 800; color: var(--ks-patina); }
  .step.wait .mark { color: var(--ks-text-muted); }
  .step.active .mark { border: 2px solid var(--ks-kinpaku); color: var(--ks-ink); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ks-kinpaku) 20%, transparent); }
  .stage { min-width: 0; border: 1px solid var(--ks-rule); border-radius: 9px; background: var(--ks-paper-raised); box-shadow: var(--ks-lift); overflow: clip; }
  .summary { padding: 20px 22px; display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr) auto; align-items: start; gap: 20px; }
  .name { font-size: 18px; font-weight: 800; letter-spacing: -.02em; color: var(--ks-ink); }
  .desc { margin-top: 4px; color: var(--ks-text-muted); font-size: 13px; line-height: 1.4; }
  .outcome { line-height: 1.45; color: var(--ks-text); overflow-wrap: anywhere; }
  .step.wait .outcome { color: var(--ks-text-muted); }
  .note { color: var(--ks-text-muted); }
  .who { display: flex; width: max-content; margin-top: 8px; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--ks-patina); text-transform: uppercase; letter-spacing: .06em; }
  .who::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ks-patina); }
  .toggle { border: 1px solid var(--ks-rule); background: var(--ks-paper); border-radius: 5px; padding: 7px 10px; font: inherit; font-size: 13px; color: var(--ks-ink); white-space: nowrap; cursor: pointer; }
  .toggle:hover { border-color: var(--ks-edge); }
  .details { display: none; border-top: 1px solid var(--ks-rule); padding: 20px 22px; }
  .stage.open .details { display: block; }
  .event { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--ks-rule); font-size: 14px; }
  .event:last-child { border-bottom: 0; }
  .actor { font-weight: 800; color: var(--ks-patina); }
  .decision { color: var(--ks-text-muted); text-align: right; overflow-wrap: anywhere; }
  .comment { grid-column: 2 / -1; margin: 4px 0 3px; padding: 10px 12px; background: var(--ks-paper); border-left: 3px solid var(--ks-kinpaku); line-height: 1.45; overflow-wrap: anywhere; }
  .origin { grid-column: 2 / -1; font-size: 12px; color: var(--ks-text-muted); }
  .past { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
  .past-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .past-card { border: 1px solid var(--ks-rule); border-radius: 7px; overflow: hidden; background: var(--ks-paper); }
  .past-card.selected { border: 2px solid var(--ks-patina); }
  .past-card img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; cursor: zoom-in; background: var(--ks-gray); }
  .past-card p { padding: 10px 12px; font-size: 13px; font-weight: 700; color: var(--ks-ink); }
  .past-card.selected p::after { content: " · vybráno"; color: var(--ks-patina); }
  /* The open question sits inside its step: the deck and the bar stay inside the panel. */
  .active-box { padding: 24px 22px 26px; border-top: 1px solid var(--ks-rule); display: flex; flex-direction: column; gap: 3rem; }
  .active-box .deck-shell { width: auto; margin-left: 0; }
  .active-box .grid { padding: 8px 4px; scroll-padding-inline: 0; }
  .active-box .fade-prev { background: linear-gradient(90deg, var(--ks-paper-raised), transparent); }
  .active-box .fade-next { background: linear-gradient(270deg, var(--ks-paper-raised), transparent); }
  .active-box .grid > .card { flex-basis: max(16rem, calc((100% - 3.4rem) / 3)); }
  /* Not sticky here: below the fold a sticky bar would sit over the question's heading. */
  .active-box .bar { position: static; width: auto; margin: 0; padding: .7rem 0 0; background: none; border-top: 0; }

  /* The deck bleeds to the viewport edges while the first card aligns with the column. */
  .deck-shell { position: relative; width: 100vw; margin-left: calc(50% - 50vw); }
  .grid { display: flex; gap: 1.6rem; width: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px var(--page-inset); scroll-padding-inline: var(--page-inset); align-items: stretch; }
  .grid::-webkit-scrollbar { display: none; }
  .grid > .card { flex: 0 0 clamp(24rem, 34vw, 34rem); scroll-snap-align: center; }
  @media (min-aspect-ratio: 1/1) and (max-height: 900px) {
    body { padding-top: 1.1rem; }
    .grid > .card { flex-basis: clamp(20rem, 27vw, 27rem); }
  }
  .nav { position: absolute; z-index: 6; top: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--ks-paper-raised); border: 1px solid var(--ks-edge); color: var(--ks-ink); cursor: pointer; box-shadow: var(--ks-cap-lift); transform: translateY(-50%); transition: border-color .2s, color .2s, opacity .2s; }
  .nav:hover { border-color: var(--ks-ink); color: var(--ks-patina); }
  .nav[disabled] { opacity: .25; cursor: default; }
  .nav[hidden] { display: none; }
  .nav svg { width: 16px; height: 16px; }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }
  .fade { position: absolute; z-index: 5; top: 0; bottom: 0; width: 88px; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
  .fade-prev { left: 0; background: linear-gradient(90deg, var(--ks-paper), transparent); }
  .fade-next { right: 0; background: linear-gradient(270deg, var(--ks-paper), transparent); }
  .deck-shell.can-prev .fade-prev, .deck-shell.can-next .fade-next { opacity: 1; }

  .card { position: relative; perspective: 1400px; transform: rotate(var(--fan, 0deg)); transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
  .card:hover, .card:focus-within { transform: rotate(0deg) translateY(-4px); }
  .card-inner { position: relative; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.16, 1, .3, 1); }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face { background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); border-radius: 8px; box-shadow: var(--ks-lift); overflow: hidden; display: flex; flex-direction: column; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.front { position: relative; height: 100%; }
  .face.back { position: absolute; inset: 0; transform: rotateY(180deg); pointer-events: none; }
  .card.flipped .face.back { pointer-events: auto; }
  .card.flipped .face.front { pointer-events: none; }
  .face.lead { border-color: var(--ks-kinpaku); }
  .card:hover .face { border-color: var(--ks-edge); }
  .card:hover .face.lead { border-color: var(--ks-kinpaku); }
  .kicker.inline { position: static; align-self: flex-start; margin: 14px 0 -4px 1.1rem; }
  .kicker { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 4px 9px; background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); color: var(--ks-ink); font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; }
  .media { position: relative; width: 100%; aspect-ratio: 16/10; min-height: 0; flex: none; overflow: hidden; background: var(--ks-gray); }
  .media img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; position: relative; z-index: 1; cursor: zoom-in; }
  .media img[hidden] { display: none; }
  .media .shimmer { position: absolute; inset: 0; }
  .media:not(.comp-pending) .shimmer { display: none; }
  .shimmer { width: 100%; height: 100%; background: linear-gradient(100deg, var(--ks-gray) 35%, var(--ks-gray-2) 50%, var(--ks-gray) 65%); background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  .comp-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 1rem; font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ks-text-muted); }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -80% 0; } }
  .chips { position: absolute; z-index: 2; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 5px 9px; font: 500 .6875rem var(--ks-font); color: var(--ks-instrument-text); background: var(--ks-instrument); border: 1px solid oklch(100% 0 0 / 0.3); border-radius: 5px; cursor: pointer; transition: background .2s; }
  .chip:hover { background: var(--ks-instrument-raised); }
  .chip[disabled] { opacity: .5; cursor: default; }
  .chip svg { width: 12px; height: 12px; }
  .body { padding: .95rem 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .5rem; flex: 1; }
  .card h3 { font-size: 1.125rem; font-weight: 600; line-height: 1.35; color: var(--ks-ink); }
  .thesis { color: var(--ks-text); font-size: .95rem; line-height: 1.45; }
  .identity { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 2px 0; }
  .swatches { display: inline-flex; gap: 4px; margin-right: 4px; }
  .swatches i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid oklch(100% 0 0 / 0.18); box-shadow: inset 0 0 0 1px oklch(0% 0 0 / 0.25); background: var(--ks-gray); }
  .tag { font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ks-text-muted); border: 1px solid var(--ks-rule); border-radius: 4px; padding: 3px 7px; overflow-wrap: anywhere; }
  .tag b { color: var(--ks-ink); font-weight: 600; }
  .fact { font-size: .8rem; color: var(--ks-text-muted); line-height: 1.45; overflow-wrap: anywhere; }
  .fact-label { display: inline-block; font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ks-text-muted); margin-right: .55em; transform: translateY(-1px); }
  .fact.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .raises { display: flex; flex-direction: column; gap: 4px; margin: 2px 0; padding: 7px 10px 8px; background: oklch(70% 0.12 188 / 0.06); border: 1px solid oklch(70% 0.12 188 / 0.22); border-radius: 8px; }
  .raises .fact-label { color: var(--ks-patina); }
  .raise { font-size: .78rem; color: var(--ks-text-muted); line-height: 1.45; }
  .back-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: 14px 14px 0; }
  .back-head .chip { flex: none; }
  .body.back-body { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ks-edge) var(--ks-paper-deep); }
  .card.skeleton .line { height: 11px; border-radius: 4px; background: linear-gradient(100deg, var(--ks-gray) 35%, var(--ks-gray-2) 50%, var(--ks-gray) 65%); background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  .card.skeleton .line.title { height: 17px; width: 70%; } .card.skeleton .w90 { width: 90%; } .card.skeleton .w60 { width: 60%; }

  button.choose { margin-top: auto; align-self: start; background: var(--ks-instrument); color: var(--ks-instrument-text); border: 0; font: 600 .9375rem/1.35 var(--ks-font); padding: 11px 24px; border-radius: 6px; cursor: pointer; transition: background .15s; }
  button.choose:hover { background: var(--ks-instrument-raised); }
  .reroll-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 14px; font: 500 .8125rem var(--ks-font); color: var(--ks-ink); background: var(--ks-paper-raised); border: 1px solid var(--ks-edge); border-radius: 6px; box-shadow: var(--ks-cap-lift); cursor: pointer; transition: border-color .2s ease, color .2s ease; }
  .reroll-btn:hover { border-color: var(--ks-ink); }
  .reroll-btn:active { box-shadow: var(--ks-cap-press); }
  .reroll-btn svg { width: 15px; height: 15px; }
  .reroll-btn.quiet { color: var(--ks-text-muted); min-height: 38px; align-self: center; }
  .reroll-btn.quiet:hover { color: var(--ks-text); border-color: var(--ks-text-muted); }
  button[disabled] { opacity: .4; cursor: default; }

  /* The round's verbs stay reachable: a full-bleed bar stuck to the viewport bottom. */
  .bar { position: sticky; bottom: 0; z-index: 10; width: 100vw; margin: -.3rem calc(50% - 50vw) 0; padding: .7rem var(--page-inset) calc(.7rem + env(safe-area-inset-bottom, 0px)); display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; background: var(--ks-paper); border-top: 1px solid var(--ks-rule); }
  .steer { flex: 1; min-width: 16rem; }
  input[type=text], textarea { width: 100%; background: var(--ks-paper-raised); color: var(--ks-text); border: 1px solid var(--ks-edge); border-radius: 6px; padding: .7rem .85rem; font: inherit; caret-color: var(--ks-patina); }
  input[type=text]::placeholder, textarea::placeholder { color: var(--ks-text-muted); opacity: 1; }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--ks-patina); outline-offset: 2px; }
  textarea { min-height: 5rem; resize: vertical; }
  .status { flex-basis: 100%; font-size: .875rem; color: var(--ks-danger); }
  .bar .hint { flex-basis: 100%; order: 9; font-size: .8125rem; color: var(--ks-text-muted); }
  .status:empty { display: none; }

  /* Text question, page approval, exception: one panel in the same card chrome. */
  .panel { max-width: 52rem; }
  /* Page approval: the screenshot takes the wide column, the verdict sits beside it. */
  .panel.wide { max-width: none; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(19rem, 1fr); align-items: start; }
  .panel.wide .media { border-bottom: 0; border-right: 1px solid var(--ks-rule); }
  .panel .body { padding: 1.4rem 1.5rem 1.5rem; gap: .9rem; }
  .panel .q-title { font-size: 1.75rem; }
  .panel .media { border-bottom: 1px solid var(--ks-rule); }
  .panel.full { max-width: none; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; margin-top: .4rem; }
  .gallery figure { margin: 0; border: 1px solid var(--ks-rule); border-radius: 6px; overflow: hidden; background: var(--ks-paper-raised); }
  .gallery figcaption { padding: .6rem .8rem .7rem; font-size: .875rem; color: var(--ks-text-muted); }
  .gallery figcaption b { color: var(--ks-ink); }
  .field { display: flex; flex-direction: column; gap: .45rem; margin-top: .3rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .actions button.choose { margin-top: 0; }

  #lightbox { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: oklch(97.8% 0 0 / 0.96); cursor: zoom-out; opacity: 0; transition: opacity .25s ease; }
  #lightbox[hidden] { display: none; }
  #lightbox.open { opacity: 1; }
  #lightbox img { max-width: 94vw; max-height: 94vh; border: 1px solid var(--ks-rule); border-radius: 8px; box-shadow: var(--ks-lift); }
  .links { padding: 1rem 0 1.4rem; border-top: 1px solid var(--ks-rule); font-size: .8125rem; display: flex; gap: 1.2rem; flex-wrap: wrap; }

  /* A tall viewport: the deck becomes a plain vertical list; the bar stays stuck. */
  @media (max-aspect-ratio: 1/1) {
    body { padding-top: 1.2rem; }
    main { gap: 3rem; padding-top: 1.6rem; }
    .q-title, .panel .q-title { font-size: 1.5rem; }
    .deck-shell { width: auto; margin-left: 0; }
    .grid { flex-direction: column; overflow: visible; scroll-snap-type: none; padding: 6px 0; gap: 1.3rem; }
    .grid > .card { flex: 0 0 auto; }
    .nav, .fade { display: none; }
    .bar { gap: .5rem; }
    .steer { min-width: 0; }
    .bar .reroll-btn { flex: 1 1 26%; padding: 0 8px; min-height: 38px; }
    .bar .steer { flex: 1 1 12rem; order: 1; padding: .55rem .75rem; }
    .bar .ret { order: 2; flex: none; }
    .bar .status { order: 3; }
    .step-desc { text-align: left; }
    .long { display: none; }
    .panel.wide { display: flex; }
    .panel.wide .media { border-right: 0; border-bottom: 1px solid var(--ks-rule); }
    .panel .body { padding: 1.1rem 1rem 1.2rem; }
  }
  @media (max-width: 700px) {
    .hero { display: block; padding: 23px 0 27px; }
    .hero h1 { font-size: 39px; }

}

function question(q, cards) {
  const fid = "note-" + q.id;
  const status = el("p", { class: "status", role: "status" });
  const sec = el("section", { class: "question", "aria-labelledby": "h-" + q.id });
  const kind = str(q.eyebrow) || KIND[q.kind] || q.kind;
  const answer = async (decision, choice, prefix) => {
    const f = document.getElementById(fid);
    let comment = f ? f.value.trim() : "";
    if (prefix) comment = prefix + (comment ? ": " + comment : "");
    if ((decision === "return" || (q.kind === "exception" && decision === "approve")) && !comment) {
      status.textContent = q.kind === "exception" ? "Napište důvod." : "Napište, co změnit.";
      if (f) f.focus();
      return;
    }
    sec.querySelectorAll("button:not(.chip):not(.nav)").forEach(b => b.disabled = true);
    try {
      const r = await call("POST", "/answer", { question: q.id, kind: q.kind, target: q.target, decision, choice, comment });
      if (r.status === 200) { last = ""; tick(); return; }
      status.textContent = r.status === 409 ? "Otázka se mezitím změnila nebo už má odpověď. Obnovte stránku."
        : "Odpověď se nepodařilo uložit. Zkuste to prosím znovu.";
    } catch (e) { if (e.message !== "token") status.textContent = "Server neodpovídá."; }
    sec.querySelectorAll("button:not(.chip):not(.nav)").forEach(b => b.disabled = false);
  };
  const title = q.title || kind || q.id;
  // Approvals that show several previews (page wireframes, content per page) get a gallery, not a deck.
  const gallery = ["structure", "task_map", "content_plan"].includes(q.kind);
  const deckKind = cards.length && q.kind !== "approve_page" && !gallery;

  if (deckKind || (!cards.length && q.rerolled_from)) {
    sec.append(el("div", { class: "head" }, el("p", { class: "tier" }, kind),
      el("div", { class: "headline" }, icon("die"), el("h2", { class: "q-title", id: "h-" + q.id }, title))));
    if (str(q.prompt)) sec.append(el("p", { class: "lede" }, q.prompt));
    const lines = bodyLines(q.body); if (lines) sec.append(el("div", { class: "head" }, lines));
    if (!cards.length) {
      sec.append(el("p", { class: "tier" }, "Připravují se nové návrhy…"), deck(q, [0, 1, 2].map(skeleton)));
      return sec;
    }
    sec.append(deck(q, cards.map((c, i) => card(q, c, i, answer))));
    sec.append(el("div", { class: "bar" },
      el("button", { type: "button", class: "reroll-btn quiet", on: { click: () => answer("reroll_safer") } }, "← Bezpečněji"),
      el("button", { type: "button", class: "reroll-btn", on: { click: () => answer("reroll") } }, icon("die"), el("span", {}, "Znovu")),
      el("button", { type: "button", class: "reroll-btn quiet", on: { click: () => answer("reroll_bolder") } }, "Odvážněji →"),
      el("input", { type: "text", id: fid, class: "steer", placeholder: "Napište, co změnit",
        "aria-label": "Napište, co změnit" }),
      el("button", { type: "button", class: "reroll-btn ret", on: { click: () => answer("return") } }, "Chci to jinak"),
      el("p", { class: "hint" }, "Bezpečněji = blíž tomu, co je v oboru běžné. Odvážněji = výraznější a méně obvyklé. Znovu = nové návrhy ve stejném duchu."),
      status));
    return sec;
  }

  // One panel: text question, page approval or exception.
  const page = q.kind === "approve_page", exc = q.kind === "exception";
  const shot = page && cards[0] ? media(q, cards[0], false) : null;
  let meta = null;
  if (page) {
    const t = String(q.target), at = t.lastIndexOf("@");
    // the build file (index.html, kontakt/index.html) as the address a visitor sees (/, /kontakt/)
    const file = at > 0 ? t.slice(0, at) : t;
    const addr = "/" + file.replace(/(^|\/)index\.html$/, "$1").replace(/\.html$/, "");
    meta = el("div", { class: "identity" }, el("span", { class: "tag" }, "adresa ", el("b", {}, addr)));
  }
  const body = el("div", { class: "body" },
    el("p", { class: "tier" }, kind),
    el("h2", { class: "q-title", id: "h-" + q.id }, title),
    str(q.prompt) ? el("p", { class: "detail" }, q.prompt) : null,
    meta, exc ? selectorChips(q.target) : null,
    bodyLines(q.body),
    gallery && cards.length ? el("div", { class: "gallery" }, cards.map(c => el("figure", {},
      str(c.preview) ? media(q, c, false) : null,
      el("figcaption", {}, el("b", {}, c.title || c.id), str(c.thesis) ? " " + c.thesis : "")))) : null);
  sec.append(el("div", { class: "panel face" + (page ? " wide" : "") + (gallery && cards.length ? " full" : "") }, shot, body));
  body.append(
    el("div", { class: "field" }, el("label", { class: "fact-label", for: fid }, exc ? "Důvod" : "Napište, co změnit"),
      el("textarea", { id: fid, placeholder: exc ? "Proč výjimku udělit, nebo proč ne…" : q.kind === "handover" ? "Co chcete před předáním ještě upravit…" : "Co chcete jinak…" })),
    el("div", { class: "actions" },
      el("button", { type: "button", class: "choose", on: { click: () => answer("approve") } },
        exc ? "Udělit výjimku" : page ? "Stránka je v pořádku" : q.kind === "handover" ? "Ano, předat" : "Ano, takhle"),
      el("button", { type: "button", class: "reroll-btn", on: { click: () => answer("return") } },
        exc ? "Neudělit" : page ? "Chci změny" : "Chci to jinak")),
    status);
  return sec;
}

// The page: hero from the data, then one row per step (pipeline-model above derives everything).
const WHO = { pm: "Rozhodl PM", agent: "Rozhodla AI", both: "PM i AI" };
const NUM = ["žádný", "jeden", "dva", "tři", "čtyři", "pět", "šest", "sedm", "osm", "devět", "deset"];
function num(n) { return NUM[n] || String(n); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function hero(m) {
  const h = document.getElementById("headline"), p = document.getElementById("intro");
  const act = m.steps.find(st => st.active);
  if (m.finished) {
    h.replaceChildren("Web je hotový.", el("br"), "Rozhodnutí zůstávají.");
    p.textContent = cap(num(m.steps.length)) + " " + plural(m.steps.length, "krok", "kroky", "kroků")
      + " od zadání po kontrolu. U každého vidíte výsledek i to, kdo jej potvrdil.";
  } else if (act) {
    h.replaceChildren("Teď ladíme", el("br"), "krok " + act.title + ".");
    const d = m.done;
    p.textContent = (d === 0 ? "Zatím není hotový žádný krok." : cap(num(d)) + " "
      + plural(d, "krok je hotový.", "kroky jsou hotové.", "kroků je hotových.")) + " Rozhodněte přímo tady; další kroky navážou.";
  } else if (m.answered.length) {   // every question answered; the agent reads them on the PM's next chat message
    h.replaceChildren("Díky, mám všechno,", el("br"), "co potřebuji.");
    const next = [...m.answered].reverse().find(q => str(q.next) && (q.answer || {}).decision !== "return");
    p.textContent = "Pokračuji sám, do chatu nemusíte nic psát." + (next ? " Co bude dál: " + next.next : "");
  } else {
    const now = S.now && typeof S.now === "object" ? S.now : {};
    h.textContent = str(now.title) || "Pracuji na webu.";
    p.textContent = str(now.text) || "Další otázka se tu objeví sama, stránku nemusíte obnovovat.";
  }
}

function eventRow(e) {
  return el("div", { class: "event" },
    el("span", { class: "actor" }, e.by === "agent" ? "AI" : "PM"),
    el("span", {}, e.title || KIND[e.kind] || "Otázka", e.reconstructed ? el("span", { class: "note" }, " · doplněno zpětně") : null),
    el("span", { class: "decision" }, e.label),
    e.comment ? el("p", { class: "comment" }, e.comment) : null,
    e.why ? el("p", { class: "comment" }, "Proč AI: " + e.why) : null,
    e.foreign != null ? el("p", { class: "origin" }, e.foreign ? "Zapsáno u kroku " + e.foreign : "Zapsáno mimo kroky") : null);
}

// The cards the PM chose from, as they were shown (history copies of the previews).
function pastCards(e) {
  return el("div", { class: "past" }, el("p", { class: "tier" }, e.title || KIND[e.kind] || "Výběr"),
    el("div", { class: "past-cards" }, e.cards.map(c => {
      const img = str(c.preview) ? el("img", { alt: "Náhled: " + (c.title || c.id), loading: "lazy",
        src: "/history/preview?question=" + encodeURIComponent(e.qid) + "&card=" + encodeURIComponent(c.id) }) : null;
      if (img) img.addEventListener("click", () => openLightbox(img));
      return el("div", { class: "past-card" + (c.id === e.choice ? " selected" : "") }, img, el("p", {}, c.title || c.id));
    })));
}

function stepEl(st, i) {
  const cls = st.active || (st.status === "current" && !st.open.length) ? "active" : st.status === "done" ? "done" : "wait";
  const events = hOk ? st.events : [];
  const stage = el("div", { class: "stage" + (openSteps.has(st.title) ? " open" : "") });
  const detail = events.length ? el("button", { type: "button", class: "toggle", "aria-expanded": String(openSteps.has(st.title)),
    on: { click: () => {
      const on = stage.classList.toggle("open");
      if (on) openSteps.add(st.title); else openSteps.delete(st.title);
      detail.setAttribute("aria-expanded", String(on));
      detail.textContent = on ? "Skrýt" : st.active ? "Průběh" : "Detail";
    } } }, openSteps.has(st.title) ? "Skrýt" : st.active ? "Průběh" : "Detail") : null;
  const outcome = st.active ? "Čeká na vaše rozhodnutí."
    : !hOk ? "—" : st.outcome.text;
  stage.append(el("div", { class: "summary" },
    el("div", {}, el("h2", { class: "name" }, st.title), st.description ? el("p", { class: "desc" }, st.description) : null),
    el("div", { class: "outcome" }, outcome,
      !st.active && hOk && st.outcome.reconstructed ? el("span", { class: "note" }, " · doplněno zpětně") : null,
      !st.active && hOk && st.who ? el("span", { class: "who" }, WHO[st.who]) : null),
    detail));
  if (events.length) stage.append(el("div", { class: "details" }, events.map(eventRow),
    events.filter(e => e.answer && e.answer.decision === "choose" && e.cards.length).map(pastCards)));
  if (st.active) stage.append(el("div", { class: "active-box" },
    st.open.map(q => question(q, (S.cards || []).filter(c => c && c.question === q.id)))));
  return el("article", { class: "step " + cls, "aria-current": st.active ? "step" : null },
    el("div", { class: "mark", "aria-hidden": "true" }, cls === "done" ? "✓" : cls === "active" ? String(i + 1) : "—"), stage);
}

function render() {
  // Keep what the PM typed and where the focus was across a re-render.
  const kept = {}; document.querySelectorAll("textarea, input").forEach(i => kept[i.id] = i.value);
  const focus = document.activeElement && document.activeElement.id;
  navs = [];
  const m = model(S, hOk ? H : []);
  document.getElementById("project").textContent = S.project || "";
  hero(m);
  document.getElementById("pipeline").replaceChildren(...m.steps.map(stepEl));
  for (const [id, v] of Object.entries(kept)) { const i = document.getElementById(id); if (i) i.value = v; }
  if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
  requestAnimationFrame(() => navs.forEach(f => f()));
}

async function tick() {
  if (stopped) return;
  try {
    const r = await call("GET", "/state");
    if (r.status !== 200) { notice("Otázky od agenta teď nejde zobrazit, protože v nich je chyba. Dejte agentovi vědět."); return; }
    if (r.data.history_lines !== hCount || !hOk) {   // an answer or a decision was written since the last fetch
      const h = await call("GET", "/history");
      hOk = h.status === 200 && Array.isArray(h.data);
      if (hOk) { H = h.data; hCount = r.data.history_lines; }
    }
    notice(hOk ? "" : "Historie rozhodnutí teď není k dispozici.");
    const key = JSON.stringify(r.data) + "|" + hCount + "|" + hOk;
    if (key !== last) { last = key; S = r.data; render(); }
  } catch (e) { if (e.message !== "token") notice("Server studia neodpovídá, zkouším znovu…"); }
}
tick();
setInterval(tick, 3000);
</script>
</html>
