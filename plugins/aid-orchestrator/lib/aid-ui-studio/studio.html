<!doctype html>
<html lang="cs">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AID studio</title>
<!-- Source: the decision page of Impeccable 4.3.1 (Paul Bakaus, github.com/pbakaus/impeccable),
     licensed under the Apache License 2.0; notice in
     skills/ui-design/references/LICENSES/NOTICE-impeccable.txt.
     Reused: the --ks-* paper/ink/instrument palette, lifts and cap buttons, the tilted snapping
     deck, card faces with the preview on top, kicker badge, chips, tags, swatches, the
     "improved by" box, the sticky footer, the lightbox and the deck arrows.
     Modified by AID: Czech labels, AID payload (studio server contract), question types
     (text, page approval, exception, chapter handover), one page for open questions and the
     decisions so far (steps across the top, topics inside a step), wordmark removed. -->
<style>
  :root {
    color-scheme: light;
    --ks-kinpaku: oklch(84% 0.19 80.46);
    --ks-patina: oklch(49% 0.11 190);
    --ks-paper: oklch(97.8% 0 0);
    --ks-paper-raised: oklch(99.5% 0 0);
    --ks-paper-deep: oklch(95% 0 0);
    --ks-gray: oklch(92% 0 0);
    --ks-gray-2: oklch(88% 0 0);
    --ks-ink: oklch(13% 0 0);
    --ks-text: oklch(22% 0 0);
    --ks-text-muted: oklch(46% 0 0);
    --ks-rule: oklch(13% 0 0 / 0.12);
    --ks-edge: oklch(13% 0 0 / 0.45);
    --ks-danger: oklch(50% 0.17 28);
    --ks-instrument: oklch(24% 0 0);
    --ks-instrument-raised: oklch(31% 0 0);
    --ks-instrument-text: oklch(93% 0 0);
    --ks-lift: 0 1px 1px oklch(13% 0 0 / 0.05), 0 2px 3px oklch(13% 0 0 / 0.04), 0 6px 12px oklch(13% 0 0 / 0.05);
    --ks-cap-lift: inset 0 1px 0 oklch(100% 0 0 / 0.9), 0 1px 0 oklch(13% 0 0 / 0.14), 0 2px 3px oklch(13% 0 0 / 0.08);
    --ks-cap-press: inset 0 1px 2px oklch(13% 0 0 / 0.14);
    --ks-track-recess: inset 0 1px 3px oklch(13% 0 0 / 0.16), inset 0 -1px 0 oklch(100% 0 0 / 0.7);
    --ks-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ks-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --page-inset: max(clamp(1rem, 5vw, 4rem), calc((100vw - 90rem) / 2));
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ks-paper); color: var(--ks-text); font: 15px/1.55 var(--ks-font); min-height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .shell { width: 100%; padding-inline: var(--page-inset); }
  a { color: var(--ks-patina); }
  ::selection { background: oklch(49% 0.11 190 / 0.18); color: var(--ks-ink); }
  :focus-visible { outline: 2px solid var(--ks-patina); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header: project name, the client result link, the six steps of the run, the "now" strip. */
  .mast { background: var(--ks-paper); border-bottom: 1px solid var(--ks-rule); }
  .top { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .brand { font-weight: 800; letter-spacing: -.04em; font-size: 1.1rem; color: var(--ks-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand i { color: var(--ks-patina); font-style: normal; }
  .brand span { font-weight: 400; color: var(--ks-text-muted); }
  .client { flex: none; padding: 7px 14px; border: 1px solid var(--ks-rule); border-radius: 6px; background: var(--ks-paper-raised); box-shadow: var(--ks-cap-lift); font-size: .8125rem; font-weight: 600; text-decoration: none; }
  .steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--ks-rule); list-style: none; padding-top: 0; padding-bottom: 0; }
  .steps[hidden] { display: none; }
  .steps li { display: flex; min-width: 0; }
  .step { position: relative; flex: 1; min-width: 0; border: 0; border-right: 1px solid var(--ks-rule); background: transparent; text-align: left; padding: .8rem .75rem .75rem; font: inherit; color: var(--ks-text-muted); cursor: pointer; }
  .steps li:first-child .step { border-left: 1px solid var(--ks-rule); }
  .step:hover { background: var(--ks-paper-raised); color: var(--ks-ink); }
  .step small { display: flex; align-items: center; gap: .45rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
  .step small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ks-edge); flex: none; }
  .step.done small::before { background: var(--ks-patina); }
  .step.current small::before { background: var(--ks-kinpaku); box-shadow: 0 0 0 3px oklch(84% 0.19 80.46 / .3); }
  .step b { display: block; margin-top: .15rem; font-size: .84rem; color: var(--ks-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.todo b { color: var(--ks-text-muted); }
  .step[aria-current]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--ks-ink); }
  .step.waiting b::after { content: " ●"; color: var(--ks-kinpaku); }
  #now { background: var(--ks-ink); color: oklch(100% 0 0); }
  #now[hidden] { display: none; }
  #now .shell { min-height: 48px; display: flex; align-items: center; gap: .75rem; padding-block: .6rem; }
  #now b { font-size: .82rem; }
  #now-text { color: oklch(100% 0 0 / .72); font-size: .82rem; }
  .pulse { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ks-kinpaku); box-shadow: 0 0 0 5px oklch(84% 0.19 80.46 / .2); }
  #notice { margin-top: 1rem; padding: .7rem 1rem; border: 1px solid var(--ks-danger); border-radius: 8px; color: var(--ks-danger); background: var(--ks-paper-raised); }
  #notice[hidden] { display: none; }

  /* The step: its head, its topics (only when there are two or more), then one topic full width. */
  main { flex: 1; display: flex; flex-direction: column; padding-top: 2rem; padding-bottom: 2rem; }
  .stephead { color: var(--ks-text-muted); margin-bottom: 1rem; }
  .stephead b { color: var(--ks-ink); font-weight: 600; }
  .topics { display: flex; gap: .4rem; flex-wrap: wrap; list-style: none; padding: 0 0 1.6rem; }
  .topics[hidden] { display: none; }
  .topics button { display: inline-flex; align-items: center; gap: .45rem; padding: .5rem .85rem; border-radius: 999px; border: 1px solid var(--ks-rule); background: var(--ks-paper-raised); color: var(--ks-text); cursor: pointer; font: 500 .875rem var(--ks-font); }
  .topics button:hover { border-color: var(--ks-edge); }
  .topics button[aria-current] { background: var(--ks-ink); border-color: var(--ks-ink); color: var(--ks-paper-raised); }
  .topics .st { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .625rem; font-weight: 700; background: oklch(49% 0.11 190 / .14); color: var(--ks-patina); }
  .topics .open .st { background: var(--ks-kinpaku); color: var(--ks-ink); }
  .topics button[aria-current] .st { background: oklch(100% 0 0 / .18); color: inherit; }
  .topic { display: flex; flex-direction: column; gap: 3.5rem; }

  .question { display: flex; flex-direction: column; gap: 1.5rem; }
  .headline { display: flex; align-items: center; gap: .75rem; }
  .headline svg { flex: none; width: 26px; height: 26px; color: var(--ks-ink); }
  .q-title { font-weight: 600; font-size: 2rem; letter-spacing: -0.025em; line-height: 1.2; color: var(--ks-ink); text-wrap: balance; }
  .lede { color: var(--ks-text-muted); margin-top: -.8rem; max-width: 52rem; }
  .head { display: flex; flex-direction: column; gap: .4rem; max-width: 52rem; }
  .tier { font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .24em; text-transform: uppercase; color: var(--ks-text-muted); }
  .waits { display: inline-flex; align-items: center; gap: .5rem; font: 600 .6875rem var(--ks-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ks-ink); }
  .waits::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ks-kinpaku); }
  pre.body-json { font: 12.5px/1.5 var(--ks-mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--ks-paper-deep); border: 1px solid var(--ks-rule); border-radius: 6px; padding: .8rem 1rem; max-height: 22rem; overflow: auto; }
  .detail { color: var(--ks-text); font-size: .95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 7rem 1rem; font-size: 1.4rem; color: var(--ks-ink); text-align: center; }
  /* Nothing waits for the PM here: a calm panel saying what the agent does meanwhile. */
  .calm { max-width: 52rem; padding: 2.4rem 2rem; display: flex; flex-direction: column; gap: .8rem; }
  .calm .q-title { display: flex; align-items: center; gap: .8rem; }
  .calm .detail { font-size: 1.05rem; }
  .calm .hint { color: var(--ks-text-muted); }
  /* A decision already made: the verdict strip on top, then the question exactly as it was asked. */
  .verdict { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .8rem; padding: .8rem 1rem; background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); border-left: 4px solid var(--ks-patina); border-radius: 0 8px 8px 0; overflow-wrap: anywhere; }
  .verdict b { color: var(--ks-patina); font-size: 1.05rem; }
  .verdict .when { font-size: .8125rem; color: var(--ks-text-muted); }
  .verdict .next-up { flex-basis: 100%; color: var(--ks-text); }
  .verdict .next-up b { color: var(--ks-ink); font-size: inherit; }
  .readonly .bar, .readonly .actions, .readonly .field, .readonly button.choose { display: none; }
  .readonly .card:not(.chosen) .face { opacity: .6; }
  .readonly .card:not(.chosen):hover .face { opacity: 1; }
  .rounds { max-width: 52rem; border-top: 1px solid var(--ks-rule); padding-top: 1rem; }
  .rounds h3 { font: .6875rem var(--ks-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ks-text-muted); margin-bottom: .4rem; }
  .rounds ol { list-style: none; padding: 0; }
  .rounds button { width: 100%; text-align: left; padding: .45rem 0; background: none; border: 0; border-bottom: 1px dashed var(--ks-rule); font: inherit; color: var(--ks-text-muted); cursor: pointer; overflow-wrap: anywhere; }
  .rounds button b { color: var(--ks-ink); font-weight: 600; }
  .rounds button[aria-current] b { color: var(--ks-patina); }
  .rounds button:hover b { text-decoration: underline; }
  .reconstructed { font-size: .8rem; color: var(--ks-text-muted); }

  /* The deck bleeds to the viewport edges while the first card aligns with the column. */
  .deck-shell { position: relative; width: 100vw; margin-left: calc(50% - 50vw); }
  .grid { display: flex; gap: 1.6rem; width: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px var(--page-inset); scroll-padding-inline: var(--page-inset); align-items: stretch; }
  .grid::-webkit-scrollbar { display: none; }
  .grid > .card { flex: 0 0 clamp(24rem, 34vw, 34rem); scroll-snap-align: center; }
  @media (min-aspect-ratio: 1/1) and (max-height: 900px) {
    main { padding-top: 1.4rem; }
    .grid > .card { flex-basis: clamp(20rem, 27vw, 27rem); }
  }
  .nav { position: absolute; z-index: 6; top: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--ks-paper-raised); border: 1px solid var(--ks-edge); color: var(--ks-ink); cursor: pointer; box-shadow: var(--ks-cap-lift); transform: translateY(-50%); transition: border-color .2s, color .2s, opacity .2s; }
  .nav:hover { border-color: var(--ks-ink); color: var(--ks-patina); }
  .nav[disabled] { opacity: .25; cursor: default; }
  .nav[hidden] { display: none; }
  .nav svg { width: 16px; height: 16px; }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }
  .fade { position: absolute; z-index: 5; top: 0; bottom: 0; width: 88px; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
  .fade-prev { left: 0; background: linear-gradient(90deg, var(--ks-paper), transparent); }
  .fade-next { right: 0; background: linear-gradient(270deg, var(--ks-paper), transparent); }
  .deck-shell.can-prev .fade-prev, .deck-shell.can-next .fade-next { opacity: 1; }

  .card { position: relative; perspective: 1400px; transform: rotate(var(--fan, 0deg)); transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
  .card:hover, .card:focus-within { transform: rotate(0deg) translateY(-4px); }
  .card-inner { position: relative; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.16, 1, .3, 1); }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face { background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); border-radius: 8px; box-shadow: var(--ks-lift); overflow: hidden; display: flex; flex-direction: column; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.front { position: relative; height: 100%; }
  .face.back { position: absolute; inset: 0; transform: rotateY(180deg); pointer-events: none; }
  .card.flipped .face.back { pointer-events: auto; }
  .card.flipped .face.front { pointer-events: none; }
  .face.lead { border-color: var(--ks-kinpaku); }
  .card.chosen .face.front { box-shadow: 0 0 0 2px var(--ks-kinpaku), var(--ks-lift); }
  .card:hover .face { border-color: var(--ks-edge); }
  .card:hover .face.lead { border-color: var(--ks-kinpaku); }
  .kicker.picked { background: var(--ks-patina); color: var(--ks-paper-raised); border-color: var(--ks-patina); }
  .kicker.inline { position: static; align-self: flex-start; margin: 14px 0 -4px 1.1rem; }
  .kicker { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 4px 9px; background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); color: var(--ks-ink); font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; }
  .media { position: relative; width: 100%; aspect-ratio: 16/10; min-height: 0; flex: none; overflow: hidden; background: var(--ks-gray); }
  .media img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; position: relative; z-index: 1; cursor: zoom-in; }
  .media img[hidden] { display: none; }
  .media .shimmer { position: absolute; inset: 0; }
  .media:not(.comp-pending) .shimmer { display: none; }
  .shimmer { width: 100%; height: 100%; background: linear-gradient(100deg, var(--ks-gray) 35%, var(--ks-gray-2) 50%, var(--ks-gray) 65%); background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  .comp-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 1rem; font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ks-text-muted); }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -80% 0; } }
  .chips { position: absolute; z-index: 2; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 5px 9px; font: 500 .6875rem var(--ks-font); color: var(--ks-instrument-text); background: var(--ks-instrument); border: 1px solid oklch(100% 0 0 / 0.3); border-radius: 5px; cursor: pointer; transition: background .2s; }
  .chip:hover { background: var(--ks-instrument-raised); }
  .chip[disabled] { opacity: .5; cursor: default; }
  .chip svg { width: 12px; height: 12px; }
  .body { padding: .95rem 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .5rem; flex: 1; }
  .card h3 { font-size: 1.125rem; font-weight: 600; line-height: 1.35; color: var(--ks-ink); }
  .thesis { color: var(--ks-text); font-size: .95rem; line-height: 1.45; }
  .identity { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 2px 0; }
  .swatches { display: inline-flex; gap: 4px; margin-right: 4px; }
  .swatches i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid oklch(100% 0 0 / 0.18); box-shadow: inset 0 0 0 1px oklch(0% 0 0 / 0.25); background: var(--ks-gray); }
  .tag { font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ks-text-muted); border: 1px solid var(--ks-rule); border-radius: 4px; padding: 3px 7px; overflow-wrap: anywhere; }
  .tag b { color: var(--ks-ink); font-weight: 600; }
  .fact { font-size: .8rem; color: var(--ks-text-muted); line-height: 1.45; overflow-wrap: anywhere; }
  .fact-label { display: inline-block; font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ks-text-muted); margin-right: .55em; transform: translateY(-1px); }
  .fact.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .raises { display: flex; flex-direction: column; gap: 4px; margin: 2px 0; padding: 7px 10px 8px; background: oklch(70% 0.12 188 / 0.06); border: 1px solid oklch(70% 0.12 188 / 0.22); border-radius: 8px; }
  .raises .fact-label { color: var(--ks-patina); }
  .raise { font-size: .78rem; color: var(--ks-text-muted); line-height: 1.45; }
  .back-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: 14px 14px 0; }
  .back-head .chip { flex: none; }
  .body.back-body { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ks-edge) var(--ks-paper-deep); }
  .card.skeleton .line { height: 11px; border-radius: 4px; background: linear-gradient(100deg, var(--ks-gray) 35%, var(--ks-gray-2) 50%, var(--ks-gray) 65%); background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  .card.skeleton .line.title { height: 17px; width: 70%; } .card.skeleton .w90 { width: 90%; } .card.skeleton .w60 { width: 60%; }

  button.choose { margin-top: auto; align-self: start; background: var(--ks-instrument); color: var(--ks-instrument-text); border: 0; font: 600 .9375rem/1.35 var(--ks-font); padding: 11px 24px; border-radius: 6px; cursor: pointer; transition: background .15s; }
  button.choose:hover { background: var(--ks-instrument-raised); }
  .reroll-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 14px; font: 500 .8125rem var(--ks-font); color: var(--ks-ink); background: var(--ks-paper-raised); border: 1px solid var(--ks-edge); border-radius: 6px; box-shadow: var(--ks-cap-lift); cursor: pointer; transition: border-color .2s ease, color .2s ease; }
  .reroll-btn:hover { border-color: var(--ks-ink); }
  .reroll-btn:active { box-shadow: var(--ks-cap-press); }
  .reroll-btn svg { width: 15px; height: 15px; }
  .reroll-btn.quiet { color: var(--ks-text-muted); min-height: 38px; align-self: center; }
  .reroll-btn.quiet:hover { color: var(--ks-text); border-color: var(--ks-text-muted); }
  button[disabled] { opacity: .4; cursor: default; }

  /* The round's verbs stay reachable: a full-bleed bar stuck to the viewport bottom. */
  .bar { position: sticky; bottom: 0; z-index: 10; width: 100vw; margin: -.3rem calc(50% - 50vw) 0; padding: .7rem var(--page-inset) calc(.7rem + env(safe-area-inset-bottom, 0px)); display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; background: var(--ks-paper); border-top: 1px solid var(--ks-rule); }
  .steer { flex: 1; min-width: 16rem; }
  input[type=text], textarea { width: 100%; background: var(--ks-paper-raised); color: var(--ks-text); border: 1px solid var(--ks-edge); border-radius: 6px; padding: .7rem .85rem; font: inherit; caret-color: var(--ks-patina); }
  input[type=text]::placeholder, textarea::placeholder { color: var(--ks-text-muted); opacity: 1; }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--ks-patina); outline-offset: 2px; }
  textarea { min-height: 5rem; resize: vertical; }
  .status { flex-basis: 100%; font-size: .875rem; color: var(--ks-danger); }
  .bar .hint { flex-basis: 100%; order: 9; font-size: .8125rem; color: var(--ks-text-muted); }
  .status:empty { display: none; }

  /* Text question, page approval, exception: one panel in the same card chrome. */
  .panel { max-width: 52rem; }
  /* Page approval: the screenshot takes the wide column, the verdict sits beside it. */
  .panel.wide { max-width: none; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(19rem, 1fr); align-items: start; }
  .panel.wide .media { border-bottom: 0; border-right: 1px solid var(--ks-rule); }
  .panel .body { padding: 1.4rem 1.5rem 1.5rem; gap: .9rem; }
  .panel .q-title { font-size: 1.75rem; }
  .panel .media { border-bottom: 1px solid var(--ks-rule); }
  .panel.full { max-width: none; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 1rem; margin-top: .4rem; }
  .gallery figure { margin: 0; border: 1px solid var(--ks-rule); border-radius: 6px; overflow: hidden; background: var(--ks-paper-raised); }
  .gallery figcaption { padding: .6rem .8rem .7rem; font-size: .875rem; color: var(--ks-text-muted); display: flex; flex-direction: column; gap: .15rem; }
  .gallery figcaption b { color: var(--ks-ink); }
  .gallery .ok { color: var(--ks-patina); font-weight: 600; }
  .gallery .ret { color: var(--ks-danger); font-weight: 600; }
  .pages .media { aspect-ratio: 4/3; }
  .field { display: flex; flex-direction: column; gap: .45rem; margin-top: .3rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .actions button.choose { margin-top: 0; }
  ul.chapters { columns: 2 14rem; column-gap: 2rem; padding: 0; list-style: none; }
  ul.chapters li { padding: .25rem 0; break-inside: avoid; }

  #lightbox { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: oklch(97.8% 0 0 / 0.96); cursor: zoom-out; opacity: 0; transition: opacity .25s ease; }
  #lightbox[hidden] { display: none; }
  #lightbox.open { opacity: 1; }

      el("button", { type: "button", class: "reroll-btn quiet", on: { click: () => answer("reroll_bolder") } }, "Odvážněji →"),

  body.append(
    el("div", { class: "field" }, el("label", { class: "fact-label", for: fid }, exc ? "Důvod" : "Napište, co změnit"),
      el("textarea", { id: fid, placeholder: exc ? "Proč výjimku udělit, nebo proč ne…" : q.kind === "handover" ? "Kterou kapitolu chcete ještě upravit a jak…" : "Co chcete jinak…" })),
    el("div", { class: "actions" },
      el("button", { type: "button", class: "choose", on: { click: () => answer("approve") } },
        exc ? "Udělit výjimku" : page ? "Stránka je v pořádku" : q.kind === "handover" ? "Převzít všechny" : "Ano, takhle"),
      el("button", { type: "button", class: "reroll-btn", on: { click: () => answer("return") } },
        exc ? "Neudělit" : page ? "Chci změny" : "Chci to jinak")),
    status);
  return sec;
}

// What the PM decided, in words (an answer from /state or /history).
function verdict(q) {
  const a = q.answer || {}, c = str(a.comment), exc = q.kind === "exception";
  const w = { approve: exc ? "Výjimka udělena" : q.kind === "approve_page" ? "Stránka je v pořádku" : q.kind === "handover" ? "Kapitoly převzaty" : "Schváleno",
    return: exc ? "Výjimka neudělena" : "Chcete to jinak", choose: "Vybráno: " + (a.choice_title || a.choice || ""),
    reroll: "Chcete nové návrhy ve stejném duchu", reroll_safer: "Chcete bezpečnější návrhy",
    reroll_bolder: "Chcete odvážnější návrhy" }[a.decision] || "Odpověď uložena";
  return a.decision === "choose" || !c ? w : w + ": " + c;
}

// ---- The model: steps → topics → rounds (past answers from /history) + open questions (/state) ----
const isHandover = q => q.kind === "handover" || /^Převezmete (kapitolu|souhrn)/.test(q.title || "");
function topicOf(q) {
  if (isHandover(q)) return HANDOVER;
  if (q.kind === "approve_page") return PAGES;
  if (q.kind === "variant") return str(q.eyebrow) || KIND.variant;
  return KIND[q.kind] || str(q.eyebrow) || q.kind;
}
function pastOf(h) {   // a history entry as a read-only question
  const cards = h.cards || [], a = h.answer || {};
  return { q: Object.assign({}, h.question, { _history: true, _chosen: a.decision === "choose" ? a.choice : null,
    answer: Object.assign({}, a, { choice_title: (cards.find(c => c.id === a.choice) || {}).title }) }),
    cards: cards.map(c => Object.assign({}, c, { question: h.question.id })), at: a.at, reconstructed: h.reconstructed };
}
function model() {
  const steps = (S.steps || []).map(s => ({ title: s.title || s.id, status: s.status || "todo", description: s.description, topics: [] }));
  const cur = steps.find(s => s.status === "current") || steps[steps.length - 1];
  const topic = (s, name) => { let t = s.topics.find(x => x.name === name); if (!t) s.topics.push(t = { name, past: [], open: [] }); return t; };
  for (const h of H) {
    if (!h || !h.question) continue;
    // chapter handovers belong to the last step (Kontrola), whatever step was current then
    const s = isHandover(h.question) ? steps[steps.length - 1] : steps.find(x => x.title === h.step) || cur;
    if (s) topic(s, topicOf(h.question)).past.push(pastOf(h));
  }
  const qs = S.questions || [];
  for (const q of qs.filter(q => !q.answered)) if (cur) topic(cur, topicOf(q)).open.push(q);
  return { steps, open: qs.filter(q => !q.answered) };
}

function pageRounds(t) {   // page approvals in rounds: a page seen again starts the next round
  const rounds = [];
  for (const p of t.past) {
    if (!rounds.length || rounds[rounds.length - 1].some(x => x.q.title === p.q.title)) rounds.push([]);
    rounds[rounds.length - 1].push(p);
  }
  return rounds;
}
function pagesView(t) {   // one round of page approvals as a gallery, the other rounds as lines
  const rounds = pageRounds(t);
  if (!rounds.length) return null;
  const ri = sel.round != null && rounds[sel.round] ? sel.round : rounds.length - 1, all = rounds[ri];
  const ok = all.every(p => p.q.answer.decision === "approve");
  const sec = el("section", { class: "question readonly" },
    el("div", { class: "verdict" }, el("b", {}, ok ? "✓ Všech " + all.length + " stránek je v pořádku" : "Některé stránky chcete změnit"),
      el("span", { class: "when" }, when(all[all.length - 1].at))),
    el("div", { class: "head" }, el("p", { class: "tier" }, KIND.approve_page), el("h2", { class: "q-title" }, "Stránky webu" + (rounds.length > 1 ? " – " + (ri + 1) + ". kolo" : ""))),
    el("div", { class: "gallery pages" }, all.map(p => el("figure", {},
      p.cards[0] && str(p.cards[0].preview) ? media(p.q, p.cards[0], false) : null,
      el("figcaption", {}, el("b", {}, (p.q.title || "").replace(/^Je stránka (.*) v pořádku\?$/, "$1")),
        el("span", { class: p.q.answer.decision === "approve" ? "ok" : "ret" }, "✓ " + verdict(p.q)))))));
  return [sec, rounds.length < 2 ? null : el("div", { class: "rounds" }, el("h3", {}, "Všechna kola"),
    el("ol", {}, rounds.map((r, i) => ({ r, i })).reverse().map(({ r, i }) => el("li", {}, el("button", { type: "button",
      "aria-current": i === ri ? "true" : null, on: { click: () => { sel.round = i; paint(); } } },
      el("b", {}, (i + 1) + ". kolo"), " – " + r.length + " stránek, " + (r.every(p => p.q.answer.decision === "approve") ? "všechny v pořádku" : "některé ke změně") + " · " + when(r[r.length - 1].at))))))];
}

function pastView(p, t) {
  const sec = question(p.q, p.cards);
  // the PM's latest answer: what the agent does next; older ones: what followed
  const fresh = H.length && (H[H.length - 1].question || {}).id === p.q.id, lab = fresh ? "Co bude dál: " : "Co bylo dál: ";
  const next = str(p.q.next) && p.q.answer.decision !== "return" ? el("p", { class: "next-up" }, el("b", {}, lab), p.q.next)
    : p.q.answer.decision === "return" ? el("p", { class: "next-up" }, el("b", {}, lab), fresh ? "Upravím to podle vás a zeptám se znovu." : "Agent to upravil a zeptal se znovu.") : null;
  sec.prepend(el("div", { class: "verdict" }, el("b", {}, "✓ " + verdict(p.q)), el("span", { class: "when" }, when(p.at)), next));
  if (p.reconstructed) sec.append(el("p", { class: "reconstructed" }, "Otázka dohledaná zpětně ze záznamu agenta."));
  return sec;
}

function handoverOf(q) {   // the one handover question: its chapter list from the body lines
  const lines = Array.isArray(q.body) ? q.body.filter(str) : str(q.body) ? q.body.split("\n").filter(str) : [];
  return Object.assign({}, q, { _chapters: lines.length ? lines : null });
}

function roundsList(t, shown) {
  if (t.past.length < 2 && !(t.open.length && t.past.length)) return null;
  const items = t.past.map((p, i) => ({ p, i })).reverse();
  return el("div", { class: "rounds" }, el("h3", {}, t.open.length ? "Dřívější kola" : "Všechna kola"),
    el("ol", {}, items.map(({ p, i }) => el("li", {}, el("button", { type: "button", "aria-current": i === shown ? "true" : null,
      on: { click: () => { sel.round = i; paint(); } } }, el("b", {}, p.q.title || KIND[p.q.kind]), " – " + verdict(p.q) + " · " + when(p.at))))));
}

function calm(now, answered) {
  return el("section", { class: "panel face calm" },
    el("h2", { class: "q-title" }, el("span", { class: "pulse" }), answered ? "Díky, mám všechno, co potřebuji." : "Teď od vás nic nepotřebuji."),
    answered ? el("p", { class: "detail" }, "Odpověď mám, pokračuji sám. Do chatu nemusíte nic psát.")
      : now && str(now.text) ? el("p", { class: "detail" }, now.text) : null,
    el("p", { class: "hint" }, "Další otázka se tu objeví sama, stránku nemusíte obnovovat."));
}

function paint() {
  const kept = {}; document.querySelectorAll("textarea, input").forEach(i => kept[i.id] = i.value);
  const focus = document.activeElement && document.activeElement.id;
  const m = model();
  if (!m.steps.length) m.steps.push({ title: "Studio", status: "current", topics: [] });
  // A new open question takes the PM to it; otherwise the PM's own navigation stays.
  const key = m.open.map(q => q.id).join(" ");
  if (!sel || (key && key !== openKey)) {
    const ci = m.steps.findIndex(s => s.status === "current"), si = ci >= 0 ? ci : m.steps.length - 1;
    const ti = m.steps[si].topics.findIndex(t => t.open.length);
    sel = { step: si, topic: ti >= 0 ? ti : Math.max(0, m.steps[si].topics.length - 1), round: null };
  }
  openKey = key;
  if (sel.step >= m.steps.length) sel.step = 0;
  const s = m.steps[sel.step];
  if (sel.topic >= s.topics.length) sel.topic = 0;

  document.getElementById("brand").replaceChildren(el("i", {}, "/"), "aid-ui ", str(S.project) ? el("span", {}, S.project) : null);
  const stepsEl = document.getElementById("steps");
  stepsEl.hidden = !(S.steps || []).length;
  stepsEl.replaceChildren(...m.steps.map((st, i) => el("li", {}, el("button", { type: "button",
    class: "step " + st.status + (st.topics.some(t => t.open.length) ? " waiting" : ""),
    "aria-current": i === sel.step ? "step" : null,
    on: { click: () => { sel = { step: i, topic: Math.max(0, st.topics.findIndex(t => t.open.length)), round: null }; paint(); scrollTo(0, 0); } } },
    el("small", {}, { done: "Hotovo", current: "Aktuální" }[st.status] || "Čeká"), el("b", {}, st.title)))));
  const cur = stepsEl.querySelector("[aria-current]"); if (cur) cur.scrollIntoView({ block: "nearest", inline: "nearest" });

  const now = S.now && typeof S.now === "object" ? S.now : null, answeredAll = !m.open.length && (S.questions || []).some(q => q.answered);
  const nowEl = document.getElementById("now");
  document.getElementById("now-title").textContent = answeredAll ? "Díky, mám všechno." : now && str(now.title) || "";
  document.getElementById("now-text").textContent = answeredAll ? "Pokračuji sám, další otázka se tu objeví sama." : now && str(now.text) || "";
  nowEl.hidden = !(answeredAll || (now && (str(now.title) || str(now.text))));

  document.getElementById("stephead").replaceChildren(el("b", {}, (sel.step + 1) + ". " + s.title), str(s.description) ? " – " + s.description : "");
  const tp = document.getElementById("topics");
  tp.hidden = s.topics.length < 2;
  tp.replaceChildren(...s.topics.map((t, i) => el("li", {}, el("button", { type: "button", class: t.open.length ? "open" : "",
    "aria-current": i === sel.topic ? "true" : null, on: { click: () => { sel.topic = i; sel.round = null; paint(); } } },
    el("span", { class: "st", "aria-hidden": "true" }, t.open.length ? "!" : "✓"), t.name))));

  navs = [];
  const t = s.topics[sel.topic], view = document.getElementById("view"), items = [];
  if (!t) items.push(s.status === "current" || (S.steps || []).length === 0 ? calm(now, answeredAll)
    : el("section", { class: "panel face calm" }, el("p", { class: "detail" }, s.status === "todo" ? "Tenhle krok ještě nezačal. Až na něj dojde, objeví se tu jeho otázky." : "V tomhle kroku nebylo co rozhodovat.")));
  else {
    for (const q of t.open) items.push(question(q.kind === "handover" ? handoverOf(q) : q, (S.cards || []).filter(c => c && c.question === q.id)));
    if (t.name === PAGES) { const g = pagesView(t); if (g) items.push(...g); }
    else if (!t.open.length || sel.round != null) {
      const i = sel.round != null && t.past[sel.round] ? sel.round : t.past.length - 1;
      if (t.past[i]) items.push(pastView(t.past[i].q.kind === "handover" ? Object.assign({}, t.past[i], { q: handoverOf(t.past[i].q) }) : t.past[i], t));
    }
    const r = t.name === PAGES ? null : roundsList(t, sel.round != null ? sel.round : t.open.length ? -1 : t.past.length - 1);
    if (r) items.push(r);
  }
  view.replaceChildren(el("div", { class: "topic" }, items));
  for (const [id, v] of Object.entries(kept)) { const i = document.getElementById(id); if (i) i.value = v; }
  if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
  requestAnimationFrame(() => navs.forEach(f => f()));
}

async function tick() {
  if (stopped) return;
  try {
    const r = await call("GET", "/state");
    if (r.status !== 200) { notice("Otázky od agenta teď nejde zobrazit, protože v nich je chyba. Dejte agentovi vědět."); return; }
    notice("");
    const st = JSON.stringify(r.data);
    if (st !== histLen) {   // any change of the round (an answer, a new question) may add to the history
      const h = await call("GET", "/history");
      if (h.status === 200 && Array.isArray(h.data)) { H = h.data; histLen = st; }
    }
    const text = st + H.length;
    if (text !== last) { last = text; S = r.data; paint(); }
  } catch (e) { if (e.message !== "token") notice("Server studia neodpovídá, zkouším znovu…"); }
}
tick();
setInterval(tick, 3000);
</script>
</html>
