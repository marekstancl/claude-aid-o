<!doctype html>
<html lang="cs">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AID studio</title>
<!-- Source: the decision page of Impeccable 4.3.1 (Paul Bakaus, github.com/pbakaus/impeccable),
     licensed under the Apache License 2.0; notice in
     skills/ui-design/references/LICENSES/NOTICE-impeccable.txt.
     Reused: the --ks-* paper/ink/instrument palette, lifts and cap buttons, the tilted snapping
     deck, card faces with the preview on top, kicker badge, chips, tags, swatches, the
     "improved by" box, the sticky footer, the lightbox and the deck arrows.
     Modified by AID: Czech labels, AID payload (studio server contract), question types
     (text, page approval, exception, chapter handover), one page for open questions and the
     decisions so far (steps across the top, topics inside a step), wordmark removed. -->
<style>
  :root {
    color-scheme: light;
    --ks-kinpaku: oklch(84% 0.19 80.46);
    --ks-patina: oklch(49% 0.11 190);
    --ks-paper: oklch(97.8% 0 0);
    --ks-paper-raised: oklch(99.5% 0 0);
    --ks-paper-deep: oklch(95% 0 0);
    --ks-gray: oklch(92% 0 0);
    --ks-gray-2: oklch(88% 0 0);
    --ks-ink: oklch(13% 0 0);
    --ks-text: oklch(22% 0 0);
    --ks-text-muted: oklch(46% 0 0);
    --ks-rule: oklch(13% 0 0 / 0.12);
    --ks-edge: oklch(13% 0 0 / 0.45);
    --ks-danger: oklch(50% 0.17 28);
    --ks-instrument: oklch(24% 0 0);
    --ks-instrument-raised: oklch(31% 0 0);
    --ks-instrument-text: oklch(93% 0 0);
    --ks-lift: 0 1px 1px oklch(13% 0 0 / 0.05), 0 2px 3px oklch(13% 0 0 / 0.04), 0 6px 12px oklch(13% 0 0 / 0.05);
    --ks-cap-lift: inset 0 1px 0 oklch(100% 0 0 / 0.9), 0 1px 0 oklch(13% 0 0 / 0.14), 0 2px 3px oklch(13% 0 0 / 0.08);
    --ks-cap-press: inset 0 1px 2px oklch(13% 0 0 / 0.14);
    --ks-track-recess: inset 0 1px 3px oklch(13% 0 0 / 0.16), inset 0 -1px 0 oklch(100% 0 0 / 0.7);
    --ks-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ks-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --page-inset: max(clamp(1rem, 5vw, 4rem), calc((100vw - 90rem) / 2));
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ks-paper); color: var(--ks-text); font: 15px/1.55 var(--ks-font); min-height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .shell { width: 100%; padding-inline: var(--page-inset); }
  a { color: var(--ks-patina); }
  ::selection { background: oklch(49% 0.11 190 / 0.18); color: var(--ks-ink); }
  :focus-visible { outline: 2px solid var(--ks-patina); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header: the project's name and the client page link; nothing else competes with the content. */
  .mast { background: var(--ks-paper); border-bottom: 1px solid var(--ks-rule); }
  .top { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .brand { font-weight: 700; font-size: 1.05rem; color: var(--ks-ink); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand span { font-weight: 400; color: var(--ks-text-muted); }
  .client { flex: none; font-size: .875rem; font-weight: 600; text-decoration: none; }
  .client:hover { text-decoration: underline; }
  #notice { margin-top: 1rem; padding: .7rem 1rem; border: 1px solid var(--ks-danger); border-radius: 8px; color: var(--ks-danger); background: var(--ks-paper-raised); }
  #notice[hidden] { display: none; }
  main { flex: 1; display: flex; flex-direction: column; gap: 3rem; padding-top: 2rem; padding-bottom: 4rem; }
  .section-h { font-size: 1.25rem; font-weight: 600; color: var(--ks-ink); margin-bottom: 1rem; }

  /* The status: one sentence that says where the web stands, and the one thing to do. */
  .status-block { display: flex; flex-direction: column; gap: .6rem; }
  .status-line { display: flex; align-items: center; gap: .7rem; font-size: clamp(1.6rem, 3.2vw, 2.4rem); font-weight: 650; letter-spacing: -.02em; line-height: 1.15; color: var(--ks-ink); text-wrap: balance; }
  .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ks-patina); }
  .dot.wait { background: var(--ks-kinpaku); }
  .dot.work { background: var(--ks-edge); }
  .status-sub { color: var(--ks-text-muted); font-size: 1.05rem; max-width: 46rem; }
  .cta { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: .6rem; }
  a.primary, button.primary { display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 8px; border: 0; background: var(--ks-instrument); color: var(--ks-instrument-text); font: 600 1rem var(--ks-font); text-decoration: none; cursor: pointer; }
  a.primary:hover, button.primary:hover { background: var(--ks-instrument-raised); }
  a.secondary { display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--ks-edge); background: var(--ks-paper-raised); color: var(--ks-ink); font-weight: 600; text-decoration: none; }

  /* The web itself: one big preview, the other pages as thumbnails that switch it. */
  .web { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(12rem, 1fr); gap: 1.4rem; align-items: start; }
  .web .big { border: 1px solid var(--ks-rule); border-radius: 10px; overflow: hidden; background: var(--ks-paper-raised); box-shadow: var(--ks-lift); }
  .web .big img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; object-position: top; cursor: zoom-in; }
  .web .big p { padding: .6rem .9rem; font-size: .9rem; color: var(--ks-text-muted); }
  .web .big p b { color: var(--ks-ink); }
  .thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; list-style: none; padding: 0; }
  .thumbs button { width: 100%; padding: 0; border: 1px solid var(--ks-rule); border-radius: 6px; overflow: hidden; background: var(--ks-paper-raised); cursor: pointer; text-align: left; font: inherit; }
  .thumbs button[aria-current] { outline: 2px solid var(--ks-ink); outline-offset: 1px; }
  .thumbs img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; object-position: top; }
  .thumbs span { display: block; padding: .3rem .5rem; font-size: .8rem; color: var(--ks-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* What is left for the PM: blocking first, each with how to do it. */
  .todo { list-style: none; padding: 0; display: flex; flex-direction: column; gap: .6rem; max-width: 52rem; }
  .todo li { padding: .8rem 1rem; background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); border-left: 4px solid var(--ks-kinpaku); border-radius: 0 8px 8px 0; }
  .todo li.later { border-left-color: var(--ks-edge); }
  .todo b { display: block; color: var(--ks-ink); font-weight: 600; }
  .todo span { color: var(--ks-text-muted); font-size: .92rem; }
  .todo .cta { margin-top: .5rem; }
  .todo .via-chat.ok { color: var(--ks-patina); }
  .todo .via-chat { display: block; margin-top: .3rem; font-size: .88rem; font-weight: 600; color: var(--ks-text); }
  .road { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; padding: 0; margin-top: .2rem; }
  .road li { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .7rem; border-radius: 999px; border: 1px solid var(--ks-rule); font-size: .88rem; color: var(--ks-text-muted); }
  .road li.done { color: var(--ks-patina); border-color: oklch(49% 0.11 190 / .35); }
  .road li.done::before { content: "✓"; font-weight: 700; }
  .road li.now { color: var(--ks-ink); border-color: var(--ks-kinpaku); background: oklch(84% 0.19 80.46 / .18); font-weight: 600; }
  .road li + li::before { }
  .jump { display: none; flex-wrap: wrap; gap: .5rem; align-items: flex-start; }
  .jump span { flex-basis: 100%; color: var(--ks-text-muted); }
  .jump a { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: .25rem; text-decoration: none; color: var(--ks-ink); font-size: .8rem; }
  .jump a img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; border: 1px solid var(--ks-rule); border-radius: 6px; display: block; }
  .jump a b { font-weight: 600; overflow-wrap: anywhere; }
  .todo .tag-block { display: inline-block; margin-left: .5rem; font-size: .75rem; font-weight: 600; color: var(--ks-ink); background: oklch(84% 0.19 80.46 / .35); border-radius: 4px; padding: 1px 6px; vertical-align: 1px; }

  /* Decisions as results: a tile per area, the result in words, the chosen picture when there is one. */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 1rem; align-items: start; }
  a.tile { display: flex; flex-direction: column; background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); border-radius: 10px; overflow: hidden; color: inherit; text-decoration: none; box-shadow: var(--ks-lift); }
  a.tile:hover { border-color: var(--ks-edge); }
  a.tile img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: top; display: block; background: var(--ks-gray); }
  a.tile div { padding: .8rem 1rem .9rem; display: flex; flex-direction: column; gap: .25rem; }
  a.tile small { font-size: .8rem; font-weight: 600; color: var(--ks-patina); }
  a.tile p { color: var(--ks-ink); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  a.tile.pending small { color: var(--ks-text-muted); }
  a.tile .tile-go { margin-top: .3rem; font-size: .88rem; font-weight: 600; color: var(--ks-patina); }
  a.tile .tile-sub { font-size: .88rem; color: var(--ks-text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .more-link { display: inline-block; margin-top: 1rem; font-weight: 600; }
  .all { list-style: none; padding: 0; max-width: 60rem; }
  .all li a { display: grid; grid-template-columns: 12rem minmax(0, 1fr); gap: 1rem; padding: .75rem 0; border-bottom: 1px solid var(--ks-rule); color: inherit; text-decoration: none; }
  .all li a:hover b { text-decoration: underline; }
  .all li a::after { content: "→"; color: var(--ks-patina); font-weight: 600; justify-self: end; }
  .all li a { grid-template-columns: 12rem minmax(0, 1fr) 1.5rem; }
  .all b { color: var(--ks-ink); font-weight: 600; }
  .all span { color: var(--ks-text); }

  /* A detail: back link, the result big, the chosen proposal big, the rest folded away. */
  .back { font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .detail-head small { font-size: .85rem; font-weight: 600; color: var(--ks-patina); }
  .detail-head h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 650; letter-spacing: -.02em; line-height: 1.2; color: var(--ks-ink); margin-top: .3rem; max-width: 52rem; text-wrap: balance; }
  .chosen-big { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(16rem, 1fr); gap: 1.4rem; align-items: start; background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); border-radius: 10px; overflow: hidden; box-shadow: var(--ks-lift); }
  .chosen-big img { width: 100%; display: block; cursor: zoom-in; }
  .chosen-big .body { padding: 1.2rem 1.4rem; }
  .chosen-big.text-only { grid-template-columns: 1fr; max-width: 52rem; }
  details.fold { max-width: 60rem; border-top: 1px solid var(--ks-rule); padding-top: .8rem; }
  details.fold > summary { cursor: pointer; font-weight: 600; color: var(--ks-ink); padding: .3rem 0; }
  details.fold[open] > summary { margin-bottom: 1rem; }
  .others { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
  .others figure { margin: 0; border: 1px solid var(--ks-rule); border-radius: 8px; overflow: hidden; background: var(--ks-paper-raised); }
  .others img { width: 100%; display: block; aspect-ratio: 16/10; object-fit: cover; object-position: top; cursor: zoom-in; }
  .others figcaption { padding: .6rem .8rem; font-size: .88rem; color: var(--ks-text-muted); }
  .others figcaption b { display: block; color: var(--ks-ink); }
  .round { padding: .8rem 0; border-bottom: 1px dashed var(--ks-rule); }
  .round b { color: var(--ks-ink); }
  .round .ans { color: var(--ks-patina); font-weight: 600; }
  .round .said { margin-top: .3rem; color: var(--ks-text); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .round .said.full { display: block; }
  .round button { margin-top: .2rem; background: none; border: 0; padding: 0; color: var(--ks-patina); font: 600 .88rem var(--ks-font); cursor: pointer; }
  .round .body-text { margin-top: .4rem; color: var(--ks-text-muted); font-size: .92rem; }
  .change-note { color: var(--ks-text-muted); }
  .asking { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--ks-rule); }
  .asking b { font-size: 1.05rem; color: var(--ks-ink); }
  .about { font-size: .8125rem; color: var(--ks-text-muted); }
  .when { font-size: .8125rem; color: var(--ks-text-muted); }
  .about a { color: var(--ks-text-muted); }

  .question { display: flex; flex-direction: column; gap: 1.5rem; }
  .headline { display: flex; align-items: center; gap: .75rem; }
  .headline svg { flex: none; width: 26px; height: 26px; color: var(--ks-ink); }
  .q-title { font-weight: 600; font-size: 2rem; letter-spacing: -0.025em; line-height: 1.2; color: var(--ks-ink); text-wrap: balance; }
  .lede { color: var(--ks-text-muted); margin-top: -.8rem; max-width: 52rem; }
  .head { display: flex; flex-direction: column; gap: .4rem; max-width: 52rem; }
  .tier { font-size: .85rem; font-weight: 600; color: var(--ks-patina); }
  pre.body-json { font: 12.5px/1.5 var(--ks-mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--ks-paper-deep); border: 1px solid var(--ks-rule); border-radius: 6px; padding: .8rem 1rem; max-height: 22rem; overflow: auto; }
  .detail { color: var(--ks-text); font-size: .95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { padding: 7rem 1rem; font-size: 1.4rem; color: var(--ks-ink); text-align: center; }
  .readonly .bar, .readonly .actions, .readonly .field, .readonly button.choose { display: none; }

  /* The deck bleeds to the viewport edges while the first card aligns with the column. */
  .deck-shell { position: relative; width: 100vw; margin-left: calc(50% - 50vw); }
  .grid { display: flex; gap: 1.6rem; width: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px var(--page-inset); scroll-padding-inline: var(--page-inset); align-items: stretch; }
  .grid::-webkit-scrollbar { display: none; }
  .grid > .card { flex: 0 0 clamp(24rem, 34vw, 34rem); scroll-snap-align: center; }
  @media (min-aspect-ratio: 1/1) and (max-height: 900px) {
    main { padding-top: 1.4rem; }
    .grid > .card { flex-basis: clamp(20rem, 27vw, 27rem); }
  }
  .nav { position: absolute; z-index: 6; top: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--ks-paper-raised); border: 1px solid var(--ks-edge); color: var(--ks-ink); cursor: pointer; box-shadow: var(--ks-cap-lift); transform: translateY(-50%); transition: border-color .2s, color .2s, opacity .2s; }
  .nav:hover { border-color: var(--ks-ink); color: var(--ks-patina); }
  .nav[disabled] { opacity: .25; cursor: default; }
  .nav[hidden] { display: none; }
  .nav svg { width: 16px; height: 16px; }
  .nav.prev { left: 14px; }
  .nav.next { right: 14px; }
  .fade { position: absolute; z-index: 5; top: 0; bottom: 0; width: 88px; pointer-events: none; opacity: 0; transition: opacity .3s ease; }
  .fade-prev { left: 0; background: linear-gradient(90deg, var(--ks-paper), transparent); }
  .fade-next { right: 0; background: linear-gradient(270deg, var(--ks-paper), transparent); }
  .deck-shell.can-prev .fade-prev, .deck-shell.can-next .fade-next { opacity: 1; }

  .card { position: relative; perspective: 1400px; transform: rotate(var(--fan, 0deg)); transition: transform .25s cubic-bezier(.16, 1, .3, 1); }
  .card:hover, .card:focus-within { transform: rotate(0deg) translateY(-4px); }
  .card-inner { position: relative; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.16, 1, .3, 1); }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face { background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); border-radius: 8px; box-shadow: var(--ks-lift); overflow: hidden; display: flex; flex-direction: column; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.front { position: relative; height: 100%; }
  .face.back { position: absolute; inset: 0; transform: rotateY(180deg); pointer-events: none; }
  .card.flipped .face.back { pointer-events: auto; }
  .card.flipped .face.front { pointer-events: none; }
  .face.lead { border-color: var(--ks-kinpaku); }
  .card.chosen .face.front { box-shadow: 0 0 0 2px var(--ks-kinpaku), var(--ks-lift); }
  .card:hover .face { border-color: var(--ks-edge); }
  .card:hover .face.lead { border-color: var(--ks-kinpaku); }
  .kicker.picked { background: var(--ks-patina); color: var(--ks-paper-raised); border-color: var(--ks-patina); }
  .kicker.inline { position: static; align-self: flex-start; margin: 14px 0 -4px 1.1rem; }
  .kicker { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 4px 9px; background: var(--ks-paper-raised); border: 1px solid var(--ks-rule); color: var(--ks-ink); font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; }
  .media { position: relative; width: 100%; aspect-ratio: 16/10; min-height: 0; flex: none; overflow: hidden; background: var(--ks-gray); }
  .media img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; position: relative; z-index: 1; cursor: zoom-in; }
  .media img[hidden] { display: none; }
  .media .shimmer { position: absolute; inset: 0; }
  .media:not(.comp-pending) .shimmer { display: none; }
  .shimmer { width: 100%; height: 100%; background: linear-gradient(100deg, var(--ks-gray) 35%, var(--ks-gray-2) 50%, var(--ks-gray) 65%); background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  .comp-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 1rem; font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ks-text-muted); }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -80% 0; } }
  .chips { position: absolute; z-index: 2; right: 10px; bottom: 10px; display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 5px 9px; font: 500 .6875rem var(--ks-font); color: var(--ks-instrument-text); background: var(--ks-instrument); border: 1px solid oklch(100% 0 0 / 0.3); border-radius: 5px; cursor: pointer; transition: background .2s; }
  .chip:hover { background: var(--ks-instrument-raised); }
  .chip[disabled] { opacity: .5; cursor: default; }
  .chip svg { width: 12px; height: 12px; }
  .body { padding: .95rem 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .5rem; flex: 1; }
  .card h3 { font-size: 1.125rem; font-weight: 600; line-height: 1.35; color: var(--ks-ink); }
  .thesis { color: var(--ks-text); font-size: .95rem; line-height: 1.45; }
  .identity { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 2px 0; }
  .swatches { display: inline-flex; gap: 4px; margin-right: 4px; }
  .swatches i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid oklch(100% 0 0 / 0.18); box-shadow: inset 0 0 0 1px oklch(0% 0 0 / 0.25); background: var(--ks-gray); }
  .tag { font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ks-text-muted); border: 1px solid var(--ks-rule); border-radius: 4px; padding: 3px 7px; overflow-wrap: anywhere; }
  .tag b { color: var(--ks-ink); font-weight: 600; }
  .fact { font-size: .8rem; color: var(--ks-text-muted); line-height: 1.45; overflow-wrap: anywhere; }
  .fact-label { display: inline-block; font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ks-text-muted); margin-right: .55em; transform: translateY(-1px); }
  .fact.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .raises { display: flex; flex-direction: column; gap: 4px; margin: 2px 0; padding: 7px 10px 8px; background: oklch(70% 0.12 188 / 0.06); border: 1px solid oklch(70% 0.12 188 / 0.22); border-radius: 8px; }
  .raises .fact-label { color: var(--ks-patina); }
  .raise { font-size: .78rem; color: var(--ks-text-muted); line-height: 1.45; }
  .back-head { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: 14px 14px 0; }
  .back-head .chip { flex: none; }
  .body.back-body { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ks-edge) var(--ks-paper-deep); }

  return [el("div", { class: "asking" }, el("b", {}, m.open.length > 1 ? "Potřebuji od vás " + m.open.length + " rozhodnutí." : "Potřebuji od vás rozhodnutí."),
      el("a", { href: "#prehled" }, "Přehled práce →")),
    ...shown.map(x => question(x.kind === "handover" ? handoverOf(x) : x, (S.cards || []).filter(c => c && c.question === x.id))),
    rest.length ? el("section", {}, el("h2", { class: "section-h" }, "Potom ještě"), el("ul", { class: "todo" }, rest.filter(x => !shown.includes(x)).map(x =>
      el("li", {}, el("b", {}, x.title || areaOf(x)), el("div", { class: "cta" }, el("a", { class: "secondary", href: "#q=" + encodeURIComponent(x.id) }, "Otevřít")))))) : null];
}
function handoverOf(q) {   // the one handover question: its chapter list from the body lines
  const lines = Array.isArray(q.body) ? q.body.filter(str) : str(q.body) ? q.body.split("\n").filter(str) : [];
  return Object.assign({}, q, { _chapters: lines.length ? lines : null });
}

function paint() {
  const kept = {}; document.querySelectorAll("textarea, input").forEach(i => kept[i.id] = i.value);
  const focus = document.activeElement && document.activeElement.id;
  const m = model(), h = location.hash;
  document.getElementById("brand").replaceChildren(str(S.project) || "Studio", el("span", {}, " · studio"));
  navs = [];
  const view = h.startsWith("#o=") ? detailView(m, decodeURIComponent(h.slice(3)))
    : h === "#vse" ? allView(m)
    : h.startsWith("#q=") && m.open.length ? askingView(m, decodeURIComponent(h.slice(3)))
    : m.open.some(q => !m.todo.some(t => t.question === q.id)) && h !== "#prehled" ? askingView(m)
    : overview(m);
  document.getElementById("view").replaceChildren(el("div", { style: "display:flex;flex-direction:column;gap:2.4rem" }, view));
  for (const [id, v] of Object.entries(kept)) { const i = document.getElementById(id); if (i) i.value = v; }
  if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
  requestAnimationFrame(() => navs.forEach(f => f()));
}
// A new open question takes the page to it; the PM's own navigation otherwise stays.
let openKey = "";
addEventListener("hashchange", () => { if (S) { paint(); scrollTo(0, 0); } });

async function tick() {
  if (stopped) return;
  try {
    const r = await call("GET", "/state");
    if (r.status !== 200) { notice("Otázky od agenta teď nejde zobrazit, protože v nich je chyba. Dejte agentovi vědět."); return; }
    notice("");
    const st = JSON.stringify(r.data);
    if (st !== histLen) {   // any change of the round (an answer, a new question) may add to the history
      const h = await call("GET", "/history");
      if (h.status === 200 && Array.isArray(h.data)) { H = h.data; histLen = st; }
    }
    const text = st + H.length;
    if (text !== last) {
      last = text; S = r.data;
      const key = (S.questions || []).filter(q => !q.answered).map(q => q.id).join(" ");
      if (key && key !== openKey && location.hash) history.replaceState(null, "", location.pathname);
      openKey = key; paint();
    }
  } catch (e) { if (e.message !== "token") notice("Server studia neodpovídá, zkouším znovu…"); }
}
tick();
setInterval(tick, 3000);
</script>
