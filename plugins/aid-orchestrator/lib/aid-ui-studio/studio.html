<!doctype html>
<html lang="cs">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AID studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Source: the decision page of Impeccable 4.3.1 (Paul Bakaus, github.com/pbakaus/impeccable),
     licensed under the Apache License 2.0; notice in
     skills/ui-design/references/LICENSES/NOTICE-impeccable.txt.
     Reused: the --ks-* paper/ink/instrument palette, lifts and cap buttons, the tilted snapping
     deck, card faces with the preview on top, kicker badge, chips, tags, swatches, the
     "improved by" box, the sticky footer, the lightbox and the deck arrows.
     Modified by AID: Czech labels, AID payload (studio server contract), question types
     (text, page approval, exception, handover), wordmark removed; P106: the page is the run
     as a pipeline of steps (outcome and who decided per step, Detail with the step's
     decisions, the open question inside its step), derived from /state and /history. -->
<style>
  :root {
    color-scheme: light;
    --ks-kinpaku: oklch(84% 0.19 80.46);
    --ks-patina: oklch(49% 0.11 190);
    --ks-paper: oklch(97.8% 0 0);
    --ks-paper-raised: oklch(99.5% 0 0);
    --ks-paper-deep: oklch(95% 0 0);
    --ks-gray: oklch(92% 0 0);
    --ks-gray-2: oklch(88% 0 0);
    --ks-ink: oklch(13% 0 0);
    --ks-text: oklch(22% 0 0);
    --ks-text-muted: oklch(46% 0 0);
    --ks-rule: oklch(13% 0 0 / 0.12);
    --ks-edge: oklch(13% 0 0 / 0.45);
    --ks-danger: oklch(50% 0.17 28);
    --ks-instrument: oklch(24% 0 0);
    --ks-instrument-raised: oklch(31% 0 0);
    --ks-instrument-text: oklch(93% 0 0);
    --ks-lift: 0 1px 1px oklch(13% 0 0 / 0.05), 0 2px 3px oklch(13% 0 0 / 0.04), 0 6px 12px oklch(13% 0 0 / 0.05);
    --ks-cap-lift: inset 0 1px 0 oklch(100% 0 0 / 0.9), 0 1px 0 oklch(13% 0 0 / 0.14), 0 2px 3px oklch(13% 0 0 / 0.08);
    --ks-cap-press: inset 0 1px 2px oklch(13% 0 0 / 0.14);
    --ks-track-recess: inset 0 1px 3px oklch(13% 0 0 / 0.16), inset 0 -1px 0 oklch(100% 0 0 / 0.7);
    --ks-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ks-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --page-inset: max(clamp(1rem, 5vw, 4rem), calc((100vw - 90rem) / 2));
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ks-paper); color: var(--ks-text); font: 15px/1.55 var(--ks-font); padding: 1.8rem clamp(1rem, 5vw, 4rem) 0; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  header, main, .links { width: 100%; max-width: 90rem; margin: 0 auto; }
  a { color: var(--ks-patina); }
  ::selection { background: oklch(49% 0.11 190 / 0.18); color: var(--ks-ink); }
  :focus-visible { outline: 2px solid var(--ks-patina); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header: the project and the link to its brand page. */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem 2rem; flex-wrap: wrap; }
  .brand { font-size: .95rem; font-weight: 700; letter-spacing: -.01em; color: var(--ks-ink); }
  .brand-link { padding: 7px 14px; border: 1px solid var(--ks-rule); border-radius: 6px; background: var(--ks-paper-raised); box-shadow: var(--ks-cap-lift); font-size: .8125rem; font-weight: 600; color: var(--ks-ink); text-decoration: none; }
  .brand-link:hover { border-color: var(--ks-edge); }
  #notice { margin-top: 1rem; padding: .7rem 1rem; border: 1px solid var(--ks-danger); border-radius: 8px; color: var(--ks-danger); background: var(--ks-paper-raised); }
  #notice[hidden] { display: none; }

  main { flex: 1; padding: 1.4rem 0 2rem; }
  .question { display: flex; flex-direction: column; gap: 1.5rem; }
  .headline { display: flex; align-items: center; gap: .75rem; }
  .headline svg { flex: none; width: 26px; height: 26px; color: var(--ks-ink); }
  .q-title { font-weight: 600; font-size: 1.7rem; letter-spacing: -0.025em; line-height: 1.2; color: var(--ks-ink); text-wrap: balance; }
  .lede { color: var(--ks-text-muted); margin-top: -.8rem; max-width: 52rem; }
  .head { display: flex; flex-direction: column; gap: .4rem; }
  .tier { font-family: var(--ks-mono); font-size: .6875rem; letter-spacing: .24em; text-transform: uppercase; color: var(--ks-text-muted); }
  pre.body-json { font: 12.5px/1.5 var(--ks-mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--ks-paper-deep); border: 1px solid var(--ks-rule); border-radius: 6px; padding: .8rem 1rem; max-height: 22rem; overflow: auto; }
  .detail { color: var(--ks-text); font-size: .95rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .step-brief { padding: 0 22px 18px; }
  .saved { padding: 0 22px 14px; display: flex; flex-direction: column; }
  .saved-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 14px; align-items: center; padding: 9px 10px; border-bottom: 1px solid var(--ks-rule); font-size: 14px; border-radius: 6px; }
  .saved-row .ok { color: var(--ks-patina); font-weight: 700; white-space: nowrap; }
  .saved-q { color: var(--ks-text-muted); }
  .saved-a { color: var(--ks-ink); font-weight: 600; }
  .active-box .saved { padding: 0; }
  .stage > .saved { padding: 14px 22px 6px; }
  .saved-row.fresh { background: color-mix(in srgb, var(--ks-patina) 12%, transparent); }
  @keyframes saved-flash { from { background: color-mix(in srgb, var(--ks-patina) 30%, transparent); } to { background: transparent; } }
  /* Choosing: the whole card is the control; the tick and the outline say which one is picked. */
  .card[data-card] { cursor: pointer; }
  .card[data-card] .media img { cursor: pointer; }
  .card.picked { outline: 3px solid var(--ks-kinpaku); outline-offset: 2px; }
  /* A question on a fact or a consent (PM 9. 10. 2026: A): three answers as rows, the recommended one preselected,
     one sentence each and a small line with the risk and the source; no deck, no flip, no Bezpečněji / Odvážněji */
  .opts { display: grid; gap: .55rem; margin-top: .4rem; }
  .card.opt { display: flex; gap: .9rem; align-items: flex-start; width: auto; padding: .8rem 1rem .8rem .9rem; border: 1.5px solid var(--ks-rule); border-radius: 8px; background: var(--ks-paper-raised); cursor: pointer; text-align: left; font: inherit; color: inherit; transform: none; perspective: none; }
  .card.opt:hover, .card.opt:focus-within { transform: none; border-color: var(--ks-edge); }
  .card.opt.picked { outline: none; border-color: var(--ks-kinpaku); box-shadow: inset 0 0 0 1.5px var(--ks-kinpaku); }
  .card.opt .tick { position: static; width: 22px; height: 22px; flex: none; margin-top: .15rem; transform: scale(1); box-shadow: none; font-size: .75rem; }
  .card.opt .opt-body { min-width: 0; } .card.opt .opt-body b { display: block; font-size: 1rem; }
  .card.opt .opt-body .kicker { position: static; display: inline-block; margin-left: .5rem; vertical-align: middle; }
  .card.opt .opt-t { margin: .15rem 0 0; } .card.opt .opt-m { margin: .3rem 0 0; font-size: .8rem; color: var(--ks-text-muted); }
  .tick { position: absolute; z-index: 7; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; padding: 0; border: 1px solid var(--ks-edge); background: var(--ks-paper-raised); color: transparent; font-weight: 800; box-shadow: var(--ks-lift); cursor: pointer; transform: scale(0); transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .card:hover .tick, .tick:focus-visible, .card.picked .tick { transform: scale(1); }
  .card.picked .tick { background: var(--ks-kinpaku); border-color: var(--ks-kinpaku); color: var(--ks-ink); }
  .info { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ks-text-muted); font-size: 14px; padding: 12px 14px; border: 1px dashed var(--ks-rule); border-radius: 8px; }
  .q-meta .toggle { margin-left: 4px; }
  .back-now { align-self: flex-start; }
  /* The parts of the step as tabs: done, the one being worked on, waiting, left out. */
  .tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 22px 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 6px; border: 1px solid var(--ks-rule); border-radius: 999px; background: var(--ks-paper-raised); cursor: pointer; font: inherit; font-size: 12.5px; color: var(--ks-text-muted); white-space: nowrap; }
  .tab:hover { border-color: var(--ks-edge); color: var(--ks-ink); }
  .tab-n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--ks-gray); color: var(--ks-text-muted); }
  .tab.done .tab-n { background: var(--ks-patina); color: var(--ks-paper-raised); }
  .tab.current { color: var(--ks-ink); }
  .tab.current .tab-n { background: var(--ks-kinpaku); color: var(--ks-ink); }
  .tab.skipped { opacity: .6; }
  .tab[aria-current] { background: var(--ks-instrument); border-color: var(--ks-instrument); color: var(--ks-instrument-text); }
  .tab[aria-current] .tab-n { background: var(--ks-kinpaku); color: var(--ks-ink); }
  /* The six steps stay on top; below them only the step the PM looks at. */
  .strip { position: sticky; top: 0; z-index: 20; display: flex; gap: 2px; background: var(--ks-paper); border-bottom: 1px solid var(--ks-rule); margin-bottom: 10px; }
  .stp { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 7px 10px 8px; border: 0; border-bottom: 3px solid var(--ks-rule); background: none; cursor: pointer; text-align: left; font: inherit; color: var(--ks-text-muted); }
  .stp-c { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--ks-rule); display: grid; place-items: center; font-weight: 800; font-size: 11px; background: var(--ks-paper-raised); color: var(--ks-text-muted); }
  .stp-w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stp-w b { font-size: 13px; font-weight: 600; }
  .stp.active .stp-w b { font-weight: 800; }
  .stp.done { border-bottom-color: var(--ks-patina); }
  .stp.done .stp-c { background: var(--ks-patina); border-color: var(--ks-patina); color: var(--ks-paper-raised); }
  .stp.active { color: var(--ks-ink); border-bottom-color: var(--ks-kinpaku); }
  .stp.active .stp-c { border: 2px solid var(--ks-kinpaku); color: var(--ks-ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ks-kinpaku) 20%, transparent); }
  .stp[aria-current] { background: var(--ks-paper-raised); color: var(--ks-ink); border-radius: 8px 8px 0 0; }
  .step.solo { grid-template-columns: minmax(0, 1fr); }
  /* one left edge for everything in the step: summary, tabs, part, question */
  .step.solo .summary { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; align-items: center; padding: 18px 22px; }
  .step.solo .summary .desc { font-size: 15px; color: var(--ks-text); margin-top: 0; }
  .step.solo .active-box { gap: 1rem; padding-top: 12px; border-top: 0; }
  .step.solo .part-box { border-left: 0; padding: 0; gap: 6px; }
  .step.solo .question { gap: 1.1rem; }
  .step.solo .lede { margin-top: -.3rem; }
  .question .q-head { flex-direction: row; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; }
  .q-meta { order: 2; display: flex; align-items: baseline; gap: 12px; }
  .q-count { font-size: 13px; color: var(--ks-text-muted); }
  /* The part's questions: the one on screen as a row above it, the answered ones under the work with Změnit. */
  .q-rail { display: flex; flex-direction: column; border: 1px solid var(--ks-rule); border-radius: 8px; overflow: hidden; }
  .q-rail.has-now { border-color: var(--ks-kinpaku); }
  .q-row { display: grid; grid-template-columns: 26px minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px; font-size: 14px; border-bottom: 1px solid var(--ks-rule); background: var(--ks-paper-raised); }
  .q-row:last-child { border-bottom: 0; }
  .q-n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--ks-gray); color: var(--ks-text-muted); }
  .q-row.done .q-n { background: var(--ks-patina); color: var(--ks-paper-raised); }
  .q-row.now { background: color-mix(in srgb, var(--ks-kinpaku) 18%, var(--ks-paper-raised)); border-left: 4px solid var(--ks-kinpaku); }
  .q-row.now .q-n { background: var(--ks-kinpaku); color: var(--ks-ink); }
  .q-row.now .q-t { font-weight: 700; color: var(--ks-ink); }
  .q-row.wait { color: var(--ks-text-muted); }
  .q-t { color: var(--ks-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-a { color: var(--ks-ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-row.now .q-a, .q-row.changing .q-a { color: var(--ks-text-muted); font-weight: 400; }
  .q-row .toggle { padding: 4px 9px; font-size: 12px; }
  .done-box { display: flex; flex-direction: column; gap: 8px; }
  /* The agent works and the PM waits: a live indicator, what is being done and what comes next. */
  .working { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; align-items: center; padding: 18px 20px; border: 1px solid var(--ks-rule); border-radius: 10px; background: var(--ks-paper-raised); box-shadow: var(--ks-lift); }
  .working-gear { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--ks-rule); border-top-color: var(--ks-kinpaku); animation: spin 1.1s linear infinite; }
  .working b { display: block; font-size: 16px; color: var(--ks-ink); margin-bottom: 2px; }
  .working p { color: var(--ks-text-muted); font-size: 14px; }
  .working .bar-track { margin-top: 10px; height: 6px; border-radius: 3px; background: var(--ks-gray); overflow: hidden; }
  .working .bar-fill { height: 100%; width: 35%; border-radius: 3px; background: var(--ks-kinpaku); animation: slide 1.6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .working-gear, .working .bar-fill { animation: none; } }
  .step.solo::before { display: none; }
  .step-back { padding: 0 22px 16px; }
  .step-info { padding: 0 22px 20px; }
  .part-note { max-width: 62rem; color: var(--ks-text-muted); font-size: 14px; }
  .step.solo .tabs.slim { justify-content: space-between; flex-wrap: nowrap; align-items: flex-start; padding-top: 14px; }
  .step.solo .tabs.slim .tabs-r { display: flex; gap: 8px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; align-items: center; }
  /* "Chci to jinak": the text goes into a window, not into the row. */
  dialog.ask { border: 1px solid var(--ks-rule); border-radius: 10px; padding: 24px; width: min(34rem, 92vw); margin: auto; background: var(--ks-paper-raised); color: var(--ks-text); box-shadow: var(--ks-lift); }
  dialog.ask::backdrop { background: color-mix(in srgb, var(--ks-ink) 45%, transparent); }
  dialog.ask h3 { font-size: 1.25rem; color: var(--ks-ink); margin-bottom: 4px; }
  dialog.ask p { color: var(--ks-text-muted); font-size: 14px; margin-bottom: 14px; }
  dialog.ask textarea { min-height: 7rem; }
  dialog.ask .actions { justify-content: flex-end; margin-top: 14px; }
  /* What just happened: the answered question leaves upwards, its saved row drops in, the next one comes from the side. */
  @media (prefers-reduced-motion: no-preference) {
    .question.leaving { animation: q-leave .45s ease-in forwards; }
    .question.arriving, .active-box.slide-fwd, .stage.slide-fwd { animation: q-arrive .5s cubic-bezier(.16, 1, .3, 1); }
    .active-box.slide-back, .stage.slide-back { animation: q-arrive-back .4s cubic-bezier(.16, 1, .3, 1); }
    .saved-row.fresh, .q-row.fresh { background: none; animation: saved-drop .5s cubic-bezier(.16, 1, .3, 1), saved-flash 2.6s ease-out; }
    .q-row.now.arriving { animation: row-up .5s cubic-bezier(.16, 1, .3, 1); }
    .q-row.leaving { animation: row-lift .4s ease-in forwards; }
    @keyframes row-up { from { opacity: 0; transform: translateY(40px); } }
    @keyframes row-lift { to { opacity: 0; transform: translateY(-40px); } }
    .stp.just .stp-c, .tab-n.pop { animation: mark-pop .6s cubic-bezier(.3, 1.6, .5, 1); }
    .step.active.just .stage { animation: stage-ring 1.6s ease-out; }
    @keyframes q-leave { to { opacity: 0; transform: translateY(-60px) scale(.96); } }
    @keyframes q-arrive { from { opacity: 0; transform: translateX(60px); } }
    @keyframes q-arrive-back { from { opacity: 0; transform: translateX(-60px); } }
    @keyframes saved-drop { from { opacity: 0; transform: translateY(40px); } }
    @keyframes mark-pop { from { transform: scale(.4); } }
    @keyframes stage-ring { from { box-shadow: 0 0 0 6px color-mix(in srgb, var(--ks-kinpaku) 55%, transparent); } }
  }
  .brief { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; line-height: 1.45; }
  .brief dt { color: var(--ks-text-muted); font-size: 13px; }
  .brief dd { margin: 0; color: var(--ks-text); }
  .part-box { border-left: 2px solid var(--ks-kinpaku); padding: 2px 0 2px 16px; display: flex; flex-direction: column; gap: 10px; }
  .part-head { font-size: 15px; font-weight: 700; color: var(--ks-ink); }
  .detail-h { font-size: 1.02rem; margin: .9rem 0 .1rem; color: var(--ks-text); }
  .detail-li { padding-left: 1.1rem; text-indent: -.7rem; }
  .empty { padding: 7rem 1rem; font-size: 1.4rem; color: var(--ks-ink); text-align: center; }
  /* The run as a pipeline (P106, proposal B): hero, then one row per step. */
  .hero { border-top: 1px solid var(--ks-rule); padding: 14px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
  .hero h1 { font-size: 30px; line-height: 1.1; letter-spacing: -.03em; max-width: 760px; font-weight: 700; color: var(--ks-ink); text-wrap: balance; }
  .hero p { flex: none; max-width: 36rem; margin: 0; font-size: 13px; color: var(--ks-text-muted); line-height: 1.5; }
  .step { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 22px; padding-bottom: 18px; }
  .step:not(:last-child)::before { content: ""; position: absolute; left: 27px; top: 38px; bottom: -1px; width: 1px; background: var(--ks-rule); }
  .mark { position: relative; z-index: 1; width: 56px; height: 56px; border: 1px solid var(--ks-rule); border-radius: 50%; display: grid; place-items: center; background: var(--ks-paper); font-weight: 800; color: var(--ks-patina); }
  .step.wait .mark { color: var(--ks-text-muted); }
  .step.active .mark { border: 2px solid var(--ks-kinpaku); color: var(--ks-ink); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ks-kinpaku) 20%, transparent); }
  .stage { min-width: 0; border: 1px solid var(--ks-rule); border-radius: 9px; background: var(--ks-paper-raised); box-shadow: var(--ks-lift); overflow: clip; }
  .summary { padding: 20px 22px; display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr) auto; align-items: start; gap: 20px; }
  .name { font-size: 18px; font-weight: 800; letter-spacing: -.02em; color: var(--ks-ink); }
  .desc { margin-top: 4px; color: var(--ks-text-muted); font-size: 13px; line-height: 1.4; }
  .outcome { line-height: 1.45; color: var(--ks-text); overflow-wrap: anywhere; }
  .step.wait .outcome { color: var(--ks-text-muted); }
  .note { color: var(--ks-text-muted); }
  .who { display: flex; width: max-content; margin-top: 8px; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--ks-patina); text-transform: uppercase; letter-spacing: .06em; }
  .who::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ks-patina); }
  .toggle { border: 1px solid var(--ks-rule); background: var(--ks-paper); border-radius: 5px; padding: 7px 10px; font: inherit; font-size: 13px; color: var(--ks-ink); white-space: nowrap; cursor: pointer; }
  .toggle:hover { border-color: var(--ks-edge); }
  .details { display: none; border-top: 1px solid var(--ks-rule); padding: 20px 22px; }
  .stage.open .details { display: block; }
  .event { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--ks-rule); font-size: 14px; }
  .event:last-child { border-bottom: 0; }
  .actor { font-weight: 800; color: var(--ks-patina); }
  .decision { color: var(--ks-text-muted); text-align: right; overflow-wrap: anywhere; }
  .comment { grid-column: 2 / -1; margin: 4px 0 3px; padding: 10px 12px; background: var(--ks-paper); border-left: 3px solid var(--ks-kinpaku); line-height: 1.45; overflow-wrap: anywhere; }
  .origin { grid-column: 2 / -1; font-size: 12px; color: var(--ks-text-muted); }
  .past { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
  .past-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .past-card { border: 1px solid var(--ks-rule); border-radius: 7px; overflow: hidden; background: var(--ks-paper); }

    el("div", { class: "working-gear", "aria-hidden": "true" }),
    el("div", {}, el("b", {}, title), el("p", {}, text),
      el("p", {}, "Hotové výstupy (dokumenty, vize, logo) najdete na stránce ", el("a", { href: "/brand/" }, "Značka a produkt"), "; " + where + "."),
      el("div", { class: "bar-track", "aria-hidden": "true" }, el("div", { class: "bar-fill" })), detail ? el("div", { class: "actions", style: "margin-top:10px" }, detail) : null));
}
function partPanel(st, vid, d, detail) {   // detail: the step's Detail button when the step has no pills row
  const p = st.parts.find(x => x.id === vid), i = st.parts.indexOf(p), di = st.parts.findIndex(x => x.id === d);
  const saved = (st.saved || []).filter(q => q.part === vid), open = st.open.filter(q => q.part === vid);
  const stray = st.open.filter(q => !st.parts.some(x => x.id === q.part));   // never hidden behind a tab
  const q = open.find(x => x.changed_from) || open[0];   // a reopened answer goes first
  const back = () => { slide = di < i ? "back" : "fwd"; delete VIEW[st.id]; render(); };
  const where = st.open.length ? "otázku, která čeká" : "část, na které pracuji";
  return el("div", { class: "active-box" + (slide ? " slide-" + slide : "") },
    d && d !== vid ? el("button", { type: "button", class: "reroll-btn back-now", on: { click: back } }, di < i ? "← Zpět na " + where : "Zpět na " + where + " →") : null,
    q ? null : partBox(st, p),
    q && (saved.length || open.length > 1 || q.changed_from) ? qRail(saved, open, q, true) : null,
    q ? question(q, cardsOf(q), null, el("p", { class: "part-note" }, partText(p)), detail)
      : p.status === "current" ? workingEl(detail, st, p, saved)
      : el("p", { class: "info" }, (PART_INFO[p.status] || "") + (p.status === "done" && saved.length ? " Odpověď změníte tlačítkem Změnit - otevře se stejná otázka znovu." : ""), detail),
    stray.map(x => question(x, cardsOf(x))),
    saved.length ? el("div", { class: "done-box" }, el("p", { class: "tier" }, "Hotové v této části"), qRail(saved, [], null, false)) : null);
}

// The parts of the step: number, title and status; the part being worked on shows why, goal, what it feeds
// and what the PM does, from the tool's map (never written by the agent per question).
function closeInfo() { document.querySelectorAll(".info-pop:not([hidden])").forEach(p => { p.hidden = true; p.previousSibling.setAttribute("aria-expanded", "false"); }); }
document.addEventListener("click", e => { if (!e.target.closest(".stp-wrap")) closeInfo(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeInfo(); });
const PART_STATUS = { done: "hotovo", current: "teď", waiting: "čeká", skipped: "není potřeba" };
// The PM's saved answers in the step: what was chosen, a short highlight when just saved, and Změnit
// (the server opens the same question again as a new one; the agent takes the new answer).
function savedText(q) {
  const a = q.answer;
  if (!a) return str(q.answer_title) || "uloženo";
  if (a.decision === "choose") return a.choice_title || a.choice || "vybráno";
  if (a.decision === "approve") return "Ano";
  if (a.decision === "return") return "Vráceno: " + (a.comment || "");
  return a.decision;
}
function savedEl(list) {
  return el("div", { class: "saved" }, list.map(q => {
    const key = "a:" + q.id + "@" + (q.answer || {}).at;
    const fresh = !first && !SEEN.has(key) && q.answer && Date.now() - Date.parse(q.answer.at) < 15000;
    drawn.push(key);
    const change = async b => {
      b.disabled = true;
      const r = await call("POST", "/change", { question: q.id }).catch(() => ({ status: 0 }));
      if (r.status === 200) { last = ""; tick(); return; }
      b.disabled = false; notice(r.status === 409 ? "Změna této odpovědi už čeká níže." : "Změnu se nepodařilo otevřít.");
    };
    const finished = Boolean(S.finish && typeof S.finish === "object");
    const btn = q.changed_to ? el("span", { class: "note" }, "Měníte - odpovězte níže")
      : finished ? null : el("button", { type: "button", class: "reroll-btn quiet", on: { click: e => change(e.currentTarget) } }, "Změnit");
    // Zobrazit: the question as the PM saw it (text, the cards shown, his answer), read only, from the studio's own history (PM 11. 10. 2026: A)
    const view = el("div", { class: "saved-view", hidden: true });
    const show = el("button", { type: "button", class: "reroll-btn quiet", "aria-expanded": "false", on: { click: () => {
      const on = view.hidden; view.hidden = !on; show.textContent = on ? "Skrýt" : "Zobrazit"; show.setAttribute("aria-expanded", String(on));
      if (on && !view.childNodes.length) view.append(...savedView(q));
    } } }, "Zobrazit");
    return el("div", { class: "saved-wrap" }, el("div", { class: "saved-row" + (fresh ? " fresh" : "") },
      el("span", { class: "ok" }, "✓ Uloženo"), el("span", { class: "saved-q" }, q.title || KIND[q.kind] || q.id),
      el("span", { class: "saved-a" }, savedText(q)), el("span", { class: "saved-btns" }, show, btn)), view);
  }));
}
// what the PM saw and answered, from history.jsonl (the latest line of this question): body, cards, answer
function savedView(q) {
  const lines = (hOk ? H : []).filter(h => h && h.by === "pm" && h.question && h.question.id === q.id);
  const e = lines.length ? lines[lines.length - 1] : null;
  if (!e) return [el("p", { class: "muted" }, "Záznam této odpovědi studio nemá (odpověď přišla mimo něj).")];
  const body = bodyLines(e.question.body) || [];
  const cards = Array.isArray(e.cards) ? e.cards : [];
  const a = e.answer || {};
  const chosen = cards.find(c => c.id === a.choice);
  return [el("div", { class: "head" }, body),
    cards.length ? pastCards({ qid: q.id, title: "Co jste viděl", cards, choice: a.choice }) : null,
    el("p", { class: "saved-answer" }, el("b", {}, "Vaše odpověď: "), savedText(q), chosen ? " (" + (chosen.title || chosen.id) + ")" : "", a.comment ? el("span", {}, " · „" + a.comment + "“") : null)].filter(Boolean);
}

function brief(rows) {   // label left, text right - the same grid as the decision history
  return el("dl", { class: "brief" }, rows.filter(r => r[1]).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)]));
}
function partBox(st, p) {
  const i = st.parts.indexOf(p);
  return el("div", { class: "part-box" },
    el("p", { class: "part-head sr" }, st.parts.length > 1 ? "Část " + (i + 1) + " z " + st.parts.length + ": " + p.title : p.title),
    el("p", { class: "part-note" }, partText(p)));
}
// The parts of the step as tabs: number (a tick when done), title, status for a screen reader.
function partsEl(st, vid, popped, pick) {
  if (st.parts.length < 2) return null;
  return el("div", { class: "tabs" }, st.parts.map((p, i) =>
    el("button", { type: "button", class: "tab " + p.status, "aria-current": p.id === vid ? "true" : null,
      on: { click: () => { if (p.id !== vid && pick) pick(p.id); } } },
      el("span", { class: "tab-n" + (popped && popped.has(p.id) ? " pop" : "") }, p.status === "done" ? "✓" : String(i + 1)),
      el("span", { class: "tab-t" }, p.title), el("span", { class: "sr" }, PART_STATUS[p.status] || p.status))));
}

function render() {
  // Keep what the PM typed and where the focus was across a re-render.
  const kept = {}; document.querySelectorAll("textarea, input").forEach(i => kept[i.id] = i.value);
  const focus = document.activeElement && document.activeElement.id;
  navs = []; drawn = []; arrived = null;
  const m = model(S, hOk ? H : []);
  document.getElementById("project").textContent = S.project || "";
  hero(m);
  // the step that waits for the PM (or is being worked on); the one the PM opened stays until that changes
  const dflt = (m.steps.find(s => s.active) || m.steps.find(s => s.status === "current") || [...m.steps].reverse().find(s => s.status === "done") || m.steps[0] || {}).id;
  let sv = VIEW["/step"];
  if (!(sv && sv.auto === dflt && m.steps.some(s => s.id === sv.part))) { delete VIEW["/step"]; sv = { part: dflt }; }
  const vi = m.steps.findIndex(s => s.id === sv.part), di = m.steps.findIndex(s => s.id === dflt);
  stepMove = slide === "step-back" ? "back" : slide === "step-fwd" ? "fwd" : "";
  if (stepMove) slide = "";
  const back = vi !== di ? { label: di < vi ? "← Zpět na krok, na kterém se pracuje" : "Zpět na krok, na kterém se pracuje →",
    go: () => { slide = di < vi ? "step-back" : "step-fwd"; delete VIEW["/step"]; render(); } } : null;
  const st = m.steps[vi];
  const pickStep = (id, i) => { slide = i < vi ? "step-back" : "step-fwd"; VIEW["/step"] = { part: id, auto: dflt }; render(); };
  const finished = Boolean(m.finished || (S.finish && typeof S.finish === "object"));
  const pipe = document.getElementById("pipeline");
  pipe.replaceChildren(...(m.steps.length ? [stripEl(m, sv.part, pickStep), stepEl(st, vi, back)] : []));
  document.getElementById("fold")?.remove();
  if (finished && !SHOW_STEPS) {   // one card is the page; the steps and the PM's decisions stay a click away (companion A, PM 11. 10. 2026)
    pipe.hidden = true;
    const n = (S.questions || []).filter(q => q.answered).length;
    pipe.before(el("p", { id: "fold", class: "foldline" }, cap(num(m.steps.length)) + " " + plural(m.steps.length, "krok", "kroky", "kroků") + " a " + n + " vašich rozhodnutí zůstává k nahlédnutí · ",
      el("a", { href: "#", on: { click: e => { e.preventDefault(); SHOW_STEPS = true; render(); } } }, "Zobrazit")));
  } else pipe.hidden = false;
  m.steps.forEach(st => drawn.push(["s:" + st.id, stepCls(st)]));
  for (const [id, v] of Object.entries(kept)) { const i = document.getElementById(id); if (i) i.value = v; }
  if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
  requestAnimationFrame(() => navs.forEach(f => f()));
  // on a narrow screen the opened part's tab may sit outside the strip
  document.querySelectorAll(".tab[aria-current]").forEach(t => { t.parentNode.scrollLeft = t.offsetLeft - 24; });
  for (const d of drawn) { if (Array.isArray(d)) WAS[d[0]] = d[1]; else SEEN.add(d); }
  if (arrived) arrived.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  first = false; slide = "";
}

async function tick() {
  if (stopped) return;
  try {
    const r = await call("GET", "/state");
    if (r.status !== 200) { notice("Otázky od agenta teď nejde zobrazit, protože v nich je chyba. Dejte agentovi vědět."); return; }
    if (r.data.history_lines !== hCount || !hOk) {   // an answer or a decision was written since the last fetch
      const h = await call("GET", "/history");
      hOk = h.status === 200 && Array.isArray(h.data);
      if (hOk) { H = h.data; hCount = r.data.history_lines; }
    }
    notice(hOk ? "" : "Historie rozhodnutí teď není k dispozici.");
    const key = JSON.stringify(r.data) + "|" + hCount + "|" + hOk;
    if (key !== last) { last = key; S = r.data; render(); }
  } catch (e) { if (e.message !== "token") notice("Server studia neodpovídá, zkouším znovu…"); }
}
tick();
setInterval(tick, 3000);
</script>
</html>
