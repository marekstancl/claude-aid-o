# Severity registry — single source of truth for which compliance checks block
# release vs which only log advisory failures. Edited by PM either manually or
# via `aid-fsm.sh promote-check <name> --reason "..."`. Read by aid-fsm.sh at
# done-advance precondition time and at compliance.json write time.
#
# Per AID-v3-principles.md §1 tiered severity caveat:
# - New checks default to severity: advisory (logged, not blocking)
# - Auto-promote criterion: force_override_rate[check] < 0.05 across N=5
#   consecutive EPICs OR explicit PM promotion with reason
# - All severity changes append a `check_promoted` event to audit-log.jsonl
#
# When this file is missing (e.g., fresh project before /aid-init upgrade):
# all checks treated as severity: advisory (safe no-op default).

version: 1
