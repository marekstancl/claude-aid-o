# AID Integrations Configuration (v2)
# Consolidated from: slack-config.yaml, memory-config.yaml
#
# Controls: Slack MCP integration, Qdrant memory, knowledge acquisition.
# Both integrations are optional — disabled by default.

# ─── Slack ───────────────────────────────────────────────────────────────
# See: skills/slack-mcp.md for protocol details.
# Requires: slack-mcp-server by @korotovsky in .mcp.json
slack:
  enabled: false
  channel: "#aid-orchestrator"
  pm_user_id: ""

  timeouts:
    plan_approval_minutes: 1440
    escalation_minutes: 480
    merge_approval_minutes: 1440
    proposal_minutes: 4320

  reminders:
    enabled: true
    interval_minutes: 60
    max_reminders: 3

  timeout_actions:
    plan_approval: wait
    escalation: wait
    merge_approval: wait
    proposal: defer

# ─── Memory (Qdrant) ────────────────────────────────────────────────────
# See: skills/memory-mcp.md for protocol details.
# Requires: Qdrant MCP server configured in .mcp.json
memory:
  enabled: false
  collection_name: "aid-agent-memory"

  scanner:
    full_budget: 150            # max entries for full scan (hard cap)
    incremental_budget: 50      # max entries for incremental scan (25 create + 25 update)
    refactoring_budget: 100     # raised budget for refactoring EPICs (50+50)
    categories:                 # toggle per-category (all enabled by default)
      architecture: true
      api: true
      data: true
      ui: true                  # auto-skipped for backend-only projects
      config: true
      testing: true
      conventions: true
      security: true
      devops: true
      cross_cutting: true
    exclude_paths:              # never scan these
      - "**/generated/**"
      - "**/dist/**"
      - "**/node_modules/**"
      - "**/__generated__/**"
      - "**/vendor/**"
      - "**/.next/**"

  search:
    top_k: 10                   # max results returned per query
    top_k_detailed: 3           # results with full code_example included
    timeout_seconds: 5
    min_score: 0.4
    max_context_tokens: 1500    # token budget for memory context injection
    pre_step_search: true

  quality:
    min_summary_words: 20
    min_code_example_lines: 3
    max_code_example_lines: 15
    min_tags: 3

  cross_project:
    enabled: false              # disabled by default for MVP
    max_results: 3

# ─── Knowledge Acquisition ──────────────────────────────────────────────
# See: skills/knowledge-acquisition.md for protocol details.
# Primary source: Context7 MCP; fallback: WebSearch
knowledge:
  enabled: false
  primary_source: context7
  fallback_source: websearch

  context7:
    available: false
    scope: user

  research:
    default_depth: quick
    deep_on_demand_only: true
    max_frameworks_per_scan: 5
    max_urls_per_framework: 3
    max_chunks_per_source: 15

  quality:
    min_chunk_words: 50
    max_chunk_tokens: 2000
    dedup_threshold: 0.85
    merge_threshold: 0.70

  aging:
    documentation_ttl_days: 90
    pattern_ttl_days: 180
    lesson_ttl_days: 365
    stale_weight: 0.7
    expired_weight: 0.3
    exclude_after_days: 180
