# Dispatch Strategy — Configuration
# Controls how AID Orchestrator isolates parallel agent work.
#
# Strategies:
#   worktrees  — Git worktrees (recommended). Each agent gets a dedicated
#                worktree under .aid-o/worktrees/<step_id>/. Full filesystem
#                isolation; agents can run builds and tests without conflicts.
#                Requires git 2.15+.
#   branches   — Git branches only. Agents share the working tree but operate
#                on separate branches. Lighter weight but risk of file
#                collisions during concurrent writes. Use when filesystem
#                space is constrained.
#   sequential — No parallelism. Steps execute one at a time in the current
#                working tree. Safest option; use for small EPICs or CI
#                environments where parallel isolation is unnecessary.
#
# Worktree settings only apply when strategy: worktrees.
# Branch settings apply to both worktrees and branches strategies.

dispatch:
  strategy: "worktrees"                   # Isolation mode: worktrees | branches | sequential

  worktrees:
    base_dir: ".aid-o/worktrees"          # Root directory for worktree checkouts
    cleanup_on_merge: true                # Remove worktree after successful merge to main
    cleanup_on_failure: false             # Remove worktree after failed step (keep for debug)
    max_parallel: 4                       # Max concurrent worktrees (0 = unlimited)

  branches:
    prefix: "aid/"                        # Branch name prefix: aid/<epic_id>/<step_id>
    include_epic_id: true                 # Include EPIC ID in branch name
    delete_on_merge: true                 # Delete feature branch after merge to main
    base_branch: "main"                   # Branch to fork from and merge back into

  sequential:
    stash_before_step: true               # Git stash uncommitted changes before each step
    restore_on_failure: true              # Restore stash if step fails

  fallback:
    on_worktree_failure: "branches"       # Fallback if worktree creation fails: branches | sequential | abort
    on_branch_failure: "sequential"       # Fallback if branch creation fails: sequential | abort
    log_fallback: true                    # Log a warning event when fallback triggers
