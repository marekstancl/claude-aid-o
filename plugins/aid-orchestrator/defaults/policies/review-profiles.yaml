version: "1.0"
enforcement: observe
unknown_surface_profile: unverifiable

# Surfaces describe KINDS of files, never one repository's layout: the same file
# ships to every project. A project names its own surfaces in
# .aid-o/config/policies/review-profiles.yaml, which is merged on top of this
# file; the effective verdict is the stricter of "this file alone" and "this
# file with the project's", so a project can raise its review and never lower it.
# A changed file that no matched surface and no docs glob names makes the verdict
# `unknown_surface_profile`.
docs_allowlist:
  - "docs/**"
  - "**/*.md"
  - "LICENSE"
  # AID's own workspace: plans, tasks, backlog and evidence are documents.
  # .aid-o/config is not here: it is the `configuration` surface below.
  - ".aid-o/plans/**"
  - ".aid-o/tasks/**"
  - ".aid-o/work/**"

surfaces:
  control_instruction:
    match:
      path_globs:
        - "**/commands/**/*.md"
        - "**/skills/**/*.md"
        - "**/agents/**/*.md"
        - "**/templates/**/*.md"
        - "**/CLAUDE.md"
        - "**/AGENTS.md"
    risk: medium
    lenses: [behavior_trace, ac_to_test_identity]

  scripts_core:
    match:
      path_globs: ["**/*.sh"]
    risk: high
    lenses: [behavior_trace, negative_case, ac_to_test_identity, security_threat_model]

  source_code:
    match:
      path_globs:
        - "**/*.py"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.vue"
        - "**/*.svelte"
        - "**/*.go"
        - "**/*.rs"
        - "**/*.java"
        - "**/*.kt"
        - "**/*.swift"
        - "**/*.php"
        - "**/*.rb"
        - "**/*.cs"
        - "**/*.c"
        - "**/*.h"
        - "**/*.cpp"
        - "**/*.html"
        - "**/*.css"
    risk: medium
    lenses: [behavior_trace, ac_to_test_identity, negative_case]

  data_migrations:
    match:
      path_globs: ["**/migrations/**", "**/*.sql"]
    risk: high
    lenses: [behavior_trace, negative_case, field_lineage]

  auth_security:
    match:
      path_globs: ["**/auth/**", "**/security/**", "**/*auth*.*"]
    risk: high
    lenses: [behavior_trace, negative_case, security_threat_model]

  dependency_manifests:
    match:
      path_globs:
        - "**/package.json"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
        - "**/requirements*.txt"
        - "**/pyproject.toml"
        - "**/poetry.lock"
        - "**/go.mod"
        - "**/go.sum"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "**/Dockerfile*"
        - "**/docker-compose*.yml"
    risk: medium
    lenses: [behavior_trace, security_threat_model]

  configuration:
    match:
      path_globs: ["**/*.yaml", "**/*.yml", "**/*.toml", "**/*.json", "**/*.ini", "**/*.env.example"]
    risk: medium
    lenses: [behavior_trace, negative_case]

  ci_workflows:
    match:
      path_globs: [".github/workflows/**", ".gitlab-ci.yml"]
    risk: medium
    lenses: [behavior_trace, negative_case]

  test_harness:
    match:
      path_globs:
        - "**/tests/**"
        - "**/test/**"
        - "**/*.bats"
        - "**/test_*.py"
        - "**/*_test.*"
        - "**/*.test.*"
        - "**/*.spec.*"
    risk: low
    lenses: [behavior_trace, requirement_test_drift]

  schemas_and_policies:
    match:
      path_globs:
        - "**/schemas/**/*.json"
        - "**/*.schema.json"
        - "**/policies/**/*.yaml"
        - "**/templates/**/*.json"
    risk: medium
    lenses: [behavior_trace, ac_to_test_identity, field_lineage]

  fixtures:
    match:
      path_globs: ["**/fixtures/**"]
    risk: low
    lenses: [requirement_test_drift]

  docs_content:
    match:
      path_globs: ["docs/**", "**/*.md"]
    risk: docs_trivial
    lenses: []

risk_profiles:
  docs_trivial:
    mandatory_lenses: []
    c2_authorities_max: 0
    llm_authorities_total_max: 0
    ir_cadence: 1

  low:
    mandatory_lenses:
      - behavior_trace
    c2_authorities_max: 1
    llm_authorities_total_max: 2
    ir_cadence: 1

  medium:
    mandatory_lenses:
      - behavior_trace
      - ac_to_test_identity
    c2_authorities_max: 2
    llm_authorities_total_max: 3
    ir_cadence: 2

  high:
    mandatory_lenses:
      - behavior_trace
      - ac_to_test_identity
      - negative_case
      - security_threat_model
    c2_authorities_max: 3
    llm_authorities_total_max: 5
    ir_cadence: 3

  unverifiable:
    mandatory_lenses:
      - behavior_trace
      - ac_to_test_identity
      - negative_case
      - security_threat_model
    c2_authorities_max: 3
    llm_authorities_total_max: 5
    ir_cadence: 3
