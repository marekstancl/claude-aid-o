# FIRST AID Auto-Mode Permissions
# Default permission template for autonomous orchestration (/aid-first-aid).
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │  DISCLAIMER — USE AT YOUR OWN RISK                                  │
# │                                                                      │
# │  These permissions allow Claude Code to execute commands WITHOUT      │
# │  confirmation prompts during FIRST AID autonomous mode. This         │
# │  includes file edits, shell commands, git push, package installs,    │
# │  GitHub releases, and MCP tool calls.                                │
# │                                                                      │
# │  A hard-deny list (see deny[] below) blocks the most dangerous       │
# │  operations, but autonomous AI execution can produce unexpected      │
# │  results. Review this file carefully before starting FIRST AID.      │
# │  You are responsible for all actions performed in your environment.   │
# └──────────────────────────────────────────────────────────────────────┘
#
# Purpose:
#   This file defines what Claude Code auto-allows during FIRST AID mode.
#   It is the "elevated" permission set in the Permission Sandwich pattern:
#     1. BACKUP  — save .claude/settings.json AND .claude/settings.local.json
#     2. ELEVATE — write allow[] + deny[] to settings.json, neutralize settings.local.json
#     3. RESTORE — restore both original files when auto-mode ends
#
# How it works:
#   - The Controller reads this file during /aid-first-aid initialization.
#   - allow[] entries → .claude/settings.json → permissions.allow[]
#   - deny[] entries → .claude/settings.json → permissions.deny[]
#     (CC deny ALWAYS overrides allow — hard enforcement by Claude Code itself)
#   - .claude/settings.local.json is backed up and neutralized (empty permissions)
#     to prevent project-level learned permissions from interfering with elevation.
#   - The hard-deny list is enforced REGARDLESS of this file's contents.
#     Even if someone adds a hard-deny pattern to allow[], the Controller strips it.
#
# Resolution order:
#   1. Project-specific: .aid-o/03-config/permissions-auto.yaml
#   2. Plugin defaults:  defaults/policies/permissions-auto.yaml (this file)
#
# Customization:
#   - Copy this file to .aid-o/03-config/permissions-auto.yaml
#   - Add or remove entries as needed for your project
#   - The learned[] section is auto-managed by the Permission Learning Protocol
#
# Relationship to permissions.yaml presets:
#   This template is a SUPERSET of the "recommended" preset. It adds:
#   - git push/tag (needed for release sub-phase)
#   - Package install (npm install, pip install)
#   - GitHub CLI (gh — needed for GitHub release creation)
#   - Security scanners (bandit, npm audit, pip-audit)
#   - MCP tools (GitHub, Minio, Docker, Playwright, Qdrant, Context7)
#
# See: Architect design — Permission Sandwich Flow (EPIC E-20260224-fa01, Section 3)

# ─── ALLOW LIST ──────────────────────────────────────────────────────────
# Permissions granted to agents during FIRST AID autonomous execution.
#
# Design principle: Bash(*) allows ALL shell commands. Safety is enforced
# by the deny[] list below, which is written to CC's permissions.deny[]
# and ALWAYS overrides allow (CC hard enforcement, not just instructions).
#
# Why Bash(*) instead of granular patterns:
#   - Granular patterns like "Bash(git add:*)" fail when commands are
#     prefixed (e.g., "cd foo && git add .") or use flags in unexpected
#     order (e.g., "git -C path add .").
#   - Every missing pattern causes a permission prompt that blocks
#     autonomous execution — defeating the purpose of FIRST AID.
#   - The deny list is the correct place to enforce safety, not omission
#     from the allow list.

allow:
  # --- Claude Code Built-in Tools ---
  - "Glob(*)"
  - "Grep(*)"
  - "Read(*)"
  - "Edit(*)"
  - "Write(*)"
  - "NotebookEdit(*)"
  - "Task(*)"
  - "TodoWrite(*)"
  - "WebSearch(*)"
  - "WebFetch(*)"

  # --- All Bash Commands ---
  # Safety: dangerous commands are blocked by deny[] below.
  # CC deny always overrides allow — this is safe.
  - "Bash(*)"

  # --- MCP Tools ---
  # Wildcard patterns allow all operations within each MCP server's scope.
  # Each MCP server has its own authentication and access controls.
  - "mcp__qdrant-memory__qdrant-store(*)"
  - "mcp__qdrant-memory__qdrant-find(*)"
  - "mcp__shared-github__*(*)"
  - "mcp__shared-minio__*(*)"
  - "mcp__shared-docker__*(*)"
  - "mcp__shared-playwright__*(*)"
  - "mcp__plugin_context7_context7__*(*)"

# ─── DENY LIST ───────────────────────────────────────────────────────────
# Written to .claude/settings.json → permissions.deny[] during elevation.
# CC deny ALWAYS overrides allow — these are hard-enforced by Claude Code
# itself, not just by AID instructions. This is the primary safety mechanism.
#
# Categories:
#   1. HARD DENY — Irreversible/destructive commands
#   2. PRIVILEGE DENY — Escalation beyond project scope
#   3. PATH DENY — System directories (defense-in-depth)

deny:
  # --- Destructive filesystem ---
  # rm: all flag-order variants are listed explicitly so that reordering short
  # or long flags cannot bypass the substring match used by the Controller.
  - "Bash(rm -rf /:*)"                    # Standard recursive force on root
  - "Bash(rm -rf /*:*)"                   # Glob root variant
  - "Bash(rm -r -f:*)"                    # Separated flags variant
  - "Bash(rm --recursive --force:*)"      # Long-form flags variant
  - "Bash(rm -fr:*)"                      # Reversed short flags variant
  - "Bash(find / -delete:*)"              # Recursive delete via find
  - "Bash(mkfs:*)"                        # Format filesystem (any mkfs variant)
  - "Bash(dd if=/dev/zero:*)"             # Overwrite disk with zeros
  - "Bash(dd if=/dev/random:*)"           # Overwrite disk with random data
  - "Bash(dd if=/dev/urandom:*)"          # Overwrite disk with urandom data

  # --- Destructive git ---
  - "Bash(git push --force:*)"
  - "Bash(git push -f:*)"
  - "Bash(git reset --hard:*)"

  # --- Privilege escalation ---
  - "Bash(sudo:*)"
  - "Bash(su:*)"

  # --- Dangerous permissions ---
  - "Bash(chmod 777:*)"
  - "Bash(chown:*)"

  # --- System directories (defense-in-depth) ---
  - path: "/etc/*"
  - path: "/usr/*"
  - path: "~/.ssh/*"
  - path: "~/.aws/*"
  - path: "~/.gnupg/*"
  - path: "~/.config/claude/*"

# ─── LEARNED PERMISSIONS ─────────────────────────────────────────────────
# Auto-managed by the Permission Learning Protocol (see Architect design 3.5).
#
# When PM manually grants a new permission during an auto-mode session
# (by clicking "Allow" on a Claude Code prompt), the Controller:
#   1. Detects the new entry by diffing settings.json against applied permissions
#   2. Validates the entry is NOT on the hard-deny list
#   3. Appends it here with a timestamp comment
#   4. Updates the applied permissions in auto-mode-state.yaml
#
# On the next /aid-first-aid invocation, learned entries are included
# automatically, so PM does not have to grant the same permission twice.
#
# Learned entries persist across sessions. To reset, clear this list manually
# or delete the project-specific .aid-o/03-config/permissions-auto.yaml.
#
# Format of learned entries (appended by Controller, not edited manually):
#   - "Bash(some-command:*)"   # Learned: session FA-YYYYMMDDTHHMMSSZ, YYYY-MM-DD
learned: []
