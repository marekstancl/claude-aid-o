# AID Permission Presets
# Two targets: (1) agent dispatch prompts, (2) .claude/settings.local.json
# Selected via /aid-setup, customizable per project
#
# How it works:
# - permissions.yaml tells agents what they're ALLOWED to do (prompt-level)
# - .claude/settings.local.json tells Claude Code what to AUTO-ALLOW without prompting (enforcement-level)
# - /aid-setup writes BOTH files simultaneously (dual-write)

active_preset: "aspirin"  # aspirin | steroids

presets:
  aspirin:
    description: "Mirni bolest, ale na vsechno se zepta. Bezpecny default."
    claude_code_permissions:
      # Tools
      - "Glob"
      - "Grep"
      - "Read"
      - "Edit"
      - "Write"
      - "NotebookEdit"
      - "Task"
      - "TodoWrite"
      - "WebSearch"
      - "WebFetch"
      # Git (local only)
      - "Bash(git add:*)"
      - "Bash(git commit:*)"
      - "Bash(git branch:*)"
      - "Bash(git checkout:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(git status:*)"
      - "Bash(git stash:*)"
      - "Bash(git merge:*)"
      - "Bash(git worktree:*)"
      # Testing & Linting
      - "Bash(pytest:*)"
      - "Bash(python -m pytest:*)"
      - "Bash(ruff check:*)"
      - "Bash(ruff format:*)"
      - "Bash(npm test:*)"
      - "Bash(npm run build:*)"
      - "Bash(npx vitest:*)"
      - "Bash(npx tsc:*)"
      # Filesystem (read + basic write)
      - "Bash(ls:*)"
      - "Bash(mkdir:*)"
      - "Bash(cp:*)"
      - "Bash(mv:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(find:*)"
      - "Bash(grep:*)"
      - "Bash(wc:*)"
      - "Bash(diff:*)"
      # MCP tools
      - "mcp__plugin_context7_context7__*"
    notes: "No git push, no package install, no rm, no network commands"

  steroids:
    description: "Plny vykon, zadne otazky. Required for First Aid. Destruktivni prikazy jsou zakazany."
    claude_code_permissions:
      - "Glob"
      - "Grep"
      - "Read"
      - "Edit"
      - "Write"
      - "NotebookEdit"
      - "Task"
      - "TodoWrite"
      - "WebSearch"
      - "WebFetch"
      - "Bash(*:*)"
      # MCP tools — explicit patterns for Claude Code auto-allow
      - "mcp__qdrant-memory__qdrant-store(*)"
      - "mcp__qdrant-memory__qdrant-find(*)"
      - "mcp__shared-github__*(*)"
      - "mcp__shared-minio__*(*)"
      - "mcp__shared-docker__*(*)"
      - "mcp__shared-playwright__*(*)"
      - "mcp__plugin_context7_context7__*(*)"
    notes: |
      ⚠ USE AT YOUR OWN RISK — This preset grants unrestricted access. Agents can execute
      arbitrary commands, install packages, send messages via Slack/MCP, and access all
      filesystem paths. Destructive commands are ALWAYS denied (deny-list in settings.local.json).
      Required for /aid-first-aid autonomous mode.
      PM should explicitly confirm this choice during /aid-setup.

# Role-specific overrides (merged with active_preset)
role_overrides:
  security:
    additional_permissions:
      - "Bash(bandit:*)"
      - "Bash(npm audit:*)"
      - "Bash(pip-audit:*)"
  qa:
    additional_permissions:
      - "Bash(pytest:*)"
      - "Bash(coverage:*)"
  release:
    additional_permissions:
      - "Bash(git tag:*)"
      - "Bash(git push:*)"
