# AID Permission Presets
# Two targets: (1) agent dispatch prompts, (2) .claude/settings.local.json
# Selected via /aid-setup, customizable per project
#
# How it works:
# - permissions.yaml tells agents what they're ALLOWED to do (prompt-level)
# - .claude/settings.local.json tells Claude Code what to AUTO-ALLOW without prompting (enforcement-level)
# - /aid-setup writes BOTH files simultaneously (dual-write)

active_preset: "autonomous"  # autonomous | custom

presets:
  autonomous:
    description: "Max autonomy without destructive operations. Recommended default."
    claude_code_permissions:
      # Core tools
      - "Glob"
      - "Grep"
      - "Read"
      - "Edit"
      - "Write"
      - "NotebookEdit"
      - "Task"
      - "TodoWrite"
      - "WebSearch"
      - "WebFetch"
      - "Bash(*)"
      # ── Qdrant Memory ──
      - "mcp__qdrant-memory__qdrant-find"
      - "mcp__qdrant-memory__qdrant-store"
      # ── Qdrant Brain ──
      - "mcp__qdrant-brain__qdrant-find"
      - "mcp__qdrant-brain__qdrant-store"
      # ── Context7 ──
      - "mcp__plugin_context7_context7__resolve-library-id"
      - "mcp__plugin_context7_context7__query-docs"
      # ── Docker ──
      - "mcp__shared-docker__create-container"
      - "mcp__shared-docker__deploy-compose"
      - "mcp__shared-docker__get-logs"
      - "mcp__shared-docker__list-containers"
      # ── GitHub (non-destructive) ──
      - "mcp__shared-github__add_comment_to_pending_review"
      - "mcp__shared-github__add_issue_comment"
      - "mcp__shared-github__add_reply_to_pull_request_comment"
      - "mcp__shared-github__assign_copilot_to_issue"
      - "mcp__shared-github__create_branch"
      - "mcp__shared-github__create_or_update_file"
      - "mcp__shared-github__create_pull_request"
      - "mcp__shared-github__create_repository"
      - "mcp__shared-github__fork_repository"
      - "mcp__shared-github__get_commit"
      - "mcp__shared-github__get_file_contents"
      - "mcp__shared-github__get_label"
      - "mcp__shared-github__get_latest_release"
      - "mcp__shared-github__get_release_by_tag"
      - "mcp__shared-github__get_tag"
      - "mcp__shared-github__get_team_members"
      - "mcp__shared-github__get_teams"
      - "mcp__shared-github__get_me"
      - "mcp__shared-github__issue_read"
      - "mcp__shared-github__issue_write"
      - "mcp__shared-github__list_branches"
      - "mcp__shared-github__list_commits"
      - "mcp__shared-github__list_issue_types"
      - "mcp__shared-github__list_issues"
      - "mcp__shared-github__list_pull_requests"
      - "mcp__shared-github__list_releases"
      - "mcp__shared-github__list_tags"
      - "mcp__shared-github__merge_pull_request"
      - "mcp__shared-github__pull_request_read"
      - "mcp__shared-github__pull_request_review_write"
      - "mcp__shared-github__push_files"
      - "mcp__shared-github__request_copilot_review"
      - "mcp__shared-github__search_code"
      - "mcp__shared-github__search_issues"
      - "mcp__shared-github__search_pull_requests"
      - "mcp__shared-github__search_repositories"
      - "mcp__shared-github__search_users"
      - "mcp__shared-github__sub_issue_write"
      - "mcp__shared-github__update_pull_request"
      - "mcp__shared-github__update_pull_request_branch"
      # ── GitHub (destructive — excluded) ──
      # - "mcp__shared-github__delete_file"
      # ── MinIO (non-destructive) ──
      - "mcp__shared-minio__ask_object"
      - "mcp__shared-minio__copy_object"
      - "mcp__shared-minio__create_bucket"
      - "mcp__shared-minio__download_object"
      - "mcp__shared-minio__get_bucket_lifecycle"
      - "mcp__shared-minio__get_bucket_replication"
      - "mcp__shared-minio__get_bucket_tags"
      - "mcp__shared-minio__get_bucket_versioning"
      - "mcp__shared-minio__get_object_metadata"
      - "mcp__shared-minio__get_object_presigned_url"
      - "mcp__shared-minio__get_object_tags"
      - "mcp__shared-minio__get_object_versions"
      - "mcp__shared-minio__list_allowed_directories"
      - "mcp__shared-minio__list_bucket_contents"
      - "mcp__shared-minio__list_buckets"
      - "mcp__shared-minio__list_local_files"
      - "mcp__shared-minio__move_object"
      - "mcp__shared-minio__set_bucket_tags"
      - "mcp__shared-minio__set_bucket_versioning"
      - "mcp__shared-minio__set_object_tags"
      - "mcp__shared-minio__text_to_object"
      - "mcp__shared-minio__upload_object"
      # ── MinIO (destructive — excluded) ──
      # - "mcp__shared-minio__delete_bucket"
      # - "mcp__shared-minio__delete_object"
      # ── Playwright ──
      - "mcp__shared-playwright__browser_click"
      - "mcp__shared-playwright__browser_close"
      - "mcp__shared-playwright__browser_console_messages"
      - "mcp__shared-playwright__browser_drag"
      - "mcp__shared-playwright__browser_evaluate"
      - "mcp__shared-playwright__browser_file_upload"
      - "mcp__shared-playwright__browser_fill_form"
      - "mcp__shared-playwright__browser_handle_dialog"
      - "mcp__shared-playwright__browser_hover"
      - "mcp__shared-playwright__browser_install"
      - "mcp__shared-playwright__browser_navigate"
      - "mcp__shared-playwright__browser_navigate_back"
      - "mcp__shared-playwright__browser_network_requests"
      - "mcp__shared-playwright__browser_press_key"
      - "mcp__shared-playwright__browser_resize"
      - "mcp__shared-playwright__browser_run_code"
      - "mcp__shared-playwright__browser_select_option"
      - "mcp__shared-playwright__browser_snapshot"
      - "mcp__shared-playwright__browser_tabs"
      - "mcp__shared-playwright__browser_take_screenshot"
      - "mcp__shared-playwright__browser_type"
      - "mcp__shared-playwright__browser_wait_for"
      # ── Postgres ──
      - "mcp__shared-postgres__query"
      # ── Sequential Thinking ──
      - "mcp__shared-sequential-thinking__sequentialthinking"
      # ── Telegram alerts (P032 v2.16.0 — replaces legacy shared-telegram MCP) ──
      # svc-mcp-tg-bot exposes a single AID-internal alert tool;
      # general-purpose Telegram interaction is no longer in scope for AID dispatch.
      - "mcp__svc-mcp-tg-bot__send_message"
    claude_code_deny:
      - "Bash(rm -rf:*)"
      - "Bash(git push --force:*)"
      - "Bash(git push -f:*)"
      - "Bash(git reset --hard:*)"
      - "Bash(git clean -fd:*)"
      - "Bash(DROP TABLE:*)"
      - "Bash(DELETE FROM:*)"
      - "Bash(kill -9:*)"
      - "Bash(chmod 777:*)"
    notes: |
      Autonomous but safe. Agents can do anything except destructive operations.
      auto_commit: true, auto_push: false. PM reviews before push.
      All MCP tools listed explicitly — wildcards not supported by Claude Code.
      Destructive MCP ops (delete_*, drop) are commented out and excluded.

# Role-specific overrides (merged with active_preset)
role_overrides:
  security:
    additional_permissions:
      - "Bash(bandit:*)"
      - "Bash(npm audit:*)"
      - "Bash(pip-audit:*)"
  qa:
    additional_permissions:
      - "Bash(pytest:*)"
      - "Bash(coverage:*)"
  release:
    additional_permissions:
      - "Bash(git tag:*)"
      - "Bash(git push:*)"
