# =============================================================================
# release-decision-policy.yaml — C4 release-decision dual-run enforcement toggle
# =============================================================================
# Read by the FSM done-advance review→release C4 dual-run hook
# (scripts/aid-fsm.sh, grep: 'release_policy_dual_run'). Controls whether the
# C4 release aggregator's release_ready verdict only *observes* the legacy
# verdict or actively *blocks* the transition.
#
# NOT to be confused with defaults/policies/release-policy.yaml — that file is
# the version-bump / release-registry config consumed by aid-release.sh. This
# file governs the C4 (release controller) dual-run comparison only.
#
#   observe  → the hook runs aid-release-policy.sh, logs a release_policy_dual_run
#              telemetry event (match / divergence_class / head_sha) comparing the
#              C4 release_ready verdict to the COMPLETE legacy verdict, and lets the
#              transition follow the legacy tally. The transition is UNAFFECTED.
#              (default — staged-wake, mirrors the DG-07 / C3 observe rows.)
#   blocking → additionally, a C4 release_ready=false blocks review→release
#              (counts toward the done-advance error tally → exit 1). E10 path.
#
# Fail-safe: a missing or unreadable policy file, or missing yq, degrades to
# observe (never blocks). An aggregator CRASH is always non-blocking regardless
# of enforcement (the transition follows the legacy verdict, result=crash logged).
#
# Test/CI seam: RELEASE_DECISION_POLICY=<path> overrides this file's location.
#
# head_match_policy (E-060-2_2 Step 8) — governs the per-input at-HEAD staleness signal
# (the `c4_head_match_policy` enforcement, registered in the enforcement registry). SEPARATE
# from `enforcement` above (which is the release_ready dual-run toggle).
#
#   observe  → the aggregator already downgrades a stale OUT-OF-PACK input (gates_report,
#              plan_review, reporter/simplifier delivery reports) with head_match==false to a
#              `blocked` inputs[] row + blocker (net-new, deterministic in the artifact), and the
#              FSM hook emits c4_head_match_divergence / c4_head_match_unknown telemetry. An
#              `unknown` basis NEVER counts as at-head but does not block; it is surfaced in the
#              PM brief's "At-HEAD verification warnings" section. (default until E10.)
#   blocking → reserved for E10: promote the head_match signal into a transition-level hard fail.
#
# evidence_pack_freshness_policy (P062 Step 3, IMP-201) — the TRAILING-COMMIT class, held
# separate from head_match_policy above so it can be promoted, or refused promotion, on its
# own evidence.
#
#   The defect: aid-fsm.sh's CP3 freshness check has a narrow, audited exception (the D4
#   `CP3-Freshness-Exception` trailer plus a path scope) for a trailing cosmetic commit.
#   `_artifact_head_match` in aid-release-policy.sh has no counterpart — it compares the
#   stamped head_sha to HEAD for exact equality — so the SAME commit that CP3 adjudicated
#   cosmetic still stamps gates_report.json one commit behind and reads as a hard blocker.
#
#   Adjudicated 2026-08-15 (cross-model, escalated per PM instruction): HOLD, do not fix
#   under E10. The fix means extracting the D4 classifier into a shared function and
#   calling it from a blocking precondition inside aid-fsm.sh, and it BROADENS a permissive
#   exception on a release gate. That is the kind of gap that should PREVENT a promotion,
#   not ride along inside one.
#
#   Consequence, stated rather than hidden: C4 freshness CANNOT be promoted to blocking for
#   this class in E10. The decision table records it as
#   `cannot_promote_runtime_budget`'s sibling case — an explicit non-promotion with a named
#   closure condition (IMP-201), not a silent observe.
#
#   WHAT THIS KEY IS, EXACTLY (final audit, 2026-08-15 — the earlier wording
#   claimed more): it is a RECORD of a refused promotion, not a runtime switch.
#   `aid-release-policy.sh` does not read it, and saying otherwise was an
#   over-claim. The E10 calibration/promotion tooling that used to guard this
#   key was removed on 2026-08-29 (E10 cancelled); the key stays so the refusal
#   is visible where the policy lives, and so a future `blocking` here cannot
#   be set quietly.
#
#   observe  → stale-by-trailing-commit is reported and never blocks. (current)
#   blocking → forbidden until IMP-201 is closed by the shared classifier, at
#              which point this key gains a reader along with the fix.
# =============================================================================
# content_verdict_policy (P062 Step 8) — whether a required input that is present and
# parseable but whose OWN CONTENT reports a failure may block the release.
#
#   The gap it closes: C4 verified that an artifact was there and readable and never
#   asked what it said, so an audit report full of blocking findings satisfied
#   "present and parseable" and the release read as ready.
#
#   observe  → the inputs[] row records `verdict: fail` + `input_state:
#              present_but_failing` and NO blocker is added, so release_ready is
#              unchanged and no in-flight run changes behaviour. (default)
#   blocking → the row becomes `blocked` and adds a blocker. E10's promotion step
#              flips this, and only for a control its decision table approved.
#
#   Its own key, not part of `enforcement` above, so the content verdict can be promoted
#   without also flipping the release_ready dual-run toggle.
version: 1
enforcement: observe
head_match_policy: observe
evidence_pack_freshness_policy: observe
content_verdict_policy: observe
