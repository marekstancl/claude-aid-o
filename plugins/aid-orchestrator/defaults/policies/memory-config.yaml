# Memory MCP Integration — Configuration
# See: skills/memory-mcp.md for protocol details
#
# To enable Qdrant memory:
# 1. Install Qdrant MCP server: claude mcp add qdrant-memory \
#      -e QDRANT_URL="http://localhost:6333" \
#      -e COLLECTION_NAME="aid-memory" \
#      -- uvx mcp-server-qdrant
# 2. Set enabled: true below
#
# When disabled, all memory operations are silently skipped.
# File-based memory (active-work.md, lessons-learned.md, etc.) always works.

memory:
  enabled: false                          # Set to true to enable Qdrant vector memory
  collection_name: "aid-memory"           # Qdrant collection name

  # What gets auto-indexed
  auto_index:
    session_end: true                     # Decisions, lessons, commands from completed sessions
    epic_done: true                       # EPIC summary, arch decisions, patterns, audit findings
    gate_results: false                   # Gate pass/fail details (verbose, opt-in)

  # Search configuration — controls pre-step context retrieval
  search:
    top_k: 5                              # Max results per query
    timeout_seconds: 5                    # Max wait for Qdrant response
    min_score: 0.4                        # Minimum similarity score (0-1) to include result
    pre_step_search: true                 # Search memory before agent dispatch in EXECUTING

  # Document types indexed (see skills/memory-mcp.md for schemas)
  # These are informational — all 5 types are always supported when enabled
  document_types:
    - decision                            # Architectural, technical, process decisions
    - lesson                              # Lessons learned, gotchas, tips
    - pattern                             # Code, architecture, workflow patterns
    - command                             # Working build/test/deploy commands
    - audit_finding                       # Post-EPIC audit findings
