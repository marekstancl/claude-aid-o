# Skill Conflict Registry
# Known conflicts between plugins/skills that cause duplicate or competing behavior.
# Used by /aid-setup (Option 11) to auto-deny conflicting skills in .claude/settings.json.
#
# How it works:
# - /aid-setup scans installed plugins and matches against this registry
# - For each detected conflict, the "deny" skill is added to permissions.deny
# - The "prefer" skill remains active
# - PM can reverse any deny by editing .claude/settings.json manually
#
# Adding new conflicts:
# - Each entry lists two (or more) skills that provide overlapping functionality
# - "prefer" is the AID-integrated skill that should remain active
# - "deny" is the skill to disable (added to permissions.deny)
# - "reason" explains the conflict to the PM
# - "detection" describes how to identify if the conflicting skill is installed

conflicts:
  - id: "brainstorming-duplicate"
    skills:
      - "superpowers:brainstorming"
      - "aid-orchestrator:aid-brainstorm"
    prefer: "aid-orchestrator:aid-brainstorm"
    deny: "superpowers:brainstorming"
    reason: "Both provide brainstorming workflow. AID version is integrated with the orchestration pipeline and produces structured plan output."
    detection:
      method: "skill_name"
      pattern: "superpowers:brainstorming"
    severity: "high"

  # Template for adding new conflicts:
  #
  # - id: "short-identifier"
  #   skills:
  #     - "plugin-a:skill-name"
  #     - "plugin-b:skill-name"
  #   prefer: "plugin-b:skill-name"
  #   deny: "plugin-a:skill-name"
  #   reason: "Why these conflict and which is better."
  #   detection:
  #     method: "skill_name"
  #     pattern: "plugin-a:skill-name"
  #   severity: "high|medium|low"

# Deny rule format:
# The deny entry written to .claude/settings.json is:
#   "Skill({deny_skill} *)"
# This prevents Claude Code from invoking the denied skill.
#
# Example .claude/settings.json after conflict resolution:
#   {
#     "permissions": {
#       "deny": [
#         "Skill(superpowers:brainstorming *)"
#       ]
#     }
#   }
