# AID Quality Gates Configuration
# These gates run after step execution and before PM approval.
# All required gates must pass for the EPIC to proceed.

gates:
  tests_pass:
    description: "All tests pass via project test runner (unit + integration)"
    required: true
    command: "./plugins/aid-orchestrator/scripts/tests/run-all-tests.sh"
    timeout_seconds: 300
    pass_criteria: "exit code 0"

  lint_pass:
    description: "Code passes linting and formatting checks"
    required: false
    command: "ruff check . && ruff format --check ."
    timeout_seconds: 120
    pass_criteria: "exit code 0"
    when: "linting tools (ruff, eslint, etc.) are configured in the project"

  security_scan_pass:
    description: "No high/critical security findings"
    required: true
    command: "bandit -q -r . -ll"
    timeout_seconds: 180
    pass_criteria: "exit code 0, no HIGH or CRITICAL findings"
    when: "security scanning tools (bandit, snyk, etc.) are configured in the project"
    # Making this required: any future EPIC must pass security scan before DONE state

  docs_updated:
    description: "Documentation updated for all changed APIs/models"
    required: true
    rule: "{project.docs.path} or CHANGELOG.md must be updated if code changes affect public API"
    pass_criteria: "manual or automated check that relevant docs are current"

  type_check:
    description: "TypeScript type checking passes"
    required: false
    command: "npx tsc --noEmit"
    timeout_seconds: 120
    pass_criteria: "exit code 0"
    when: "frontend files changed"

  build_pass:
    description: "Frontend builds without errors"
    required: false
    command: "npm run build"
    timeout_seconds: 180
    pass_criteria: "exit code 0"
    when: "frontend files changed"

# Retry configuration
retry:
  max_attempts: 3
  backoff:
    strategy: "fixed"
    delay_seconds: 5
  on_failure: "escalate"

# After max_attempts failures, the Controller escalates to PM
escalation:
  method: "inline"
  message_template: |
    GATE FAILURE — Escalation to PM
    Gate: {gate_name}
    EPIC: {epic_id}
    Attempts: {attempt_count}/{max_attempts}
    Last error: {last_error}
    Action needed: Review and decide (fix / skip / abort)

# Budget constraints
budget:
  max_llm_cost_per_epic_usd: 50
  warn_at_percentage: 80

# Evidence requirements
evidence:
  store_gate_results: true
  store_command_output: true
  store_retry_history: true
  output_dir: "evidence/{epic_id}/{run_id}/gates/"
