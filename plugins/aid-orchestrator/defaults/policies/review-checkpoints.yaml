# Review Checkpoint Configuration
# Controls automatic verifier dispatch at pipeline milestones.
# See skills/pipeline.md §13 for full protocol documentation.

review_checkpoints:
  enabled: true                    # master switch — disables all checkpoints when false

  # Per-checkpoint toggles
  cp1_plan_review: true            # post-brainstorm plan quality (verifier:docs-review)
  cp2_step_review: true            # per-step code review (verifier:code-review)
  cp3_integration_review: true     # pre-GATES integration review (code-review + security)
  cp4_curator_validation: true     # curator proposal validation (verifier:code-review)
  cp5_critical_gate: true          # auditor critical findings block DONE
  cp6_fast_mode_review: true       # post-/aid-do review (verifier:code-review)
  simplifier_pass: true            # plan-boundary Simplifier proposal pass (gate-fixer applies S/M)
  delivery_report: true            # plan-boundary Reporter delivery report generation

  # Fix loop settings
  fix_loop:
    max_iterations: 2              # max fix→re-verify cycles before escalation
    auto_fix_severities:           # severities that trigger gate-fixer dispatch
      - critical
      - high

  # C0 cross-provider (Codex) plan review — bounded fix->reverify loop at
  # plan level, mirrors c3-audit-policy.yaml's c3_fix_loop shape. Governs
  # scripts/lib/aid-c0-plan-review.sh + the CP1 ledger
  # (scripts/lib/aid-cp1-ledger.sh) + the aid-cp1-gate.sh enforcement wired
  # in P065 E-065-7_7 Step 20 — see skills/review-checkpoint-contracts.md
  # "C0 Cross-Provider Plan Review" for the full contract.
  cp1_codex_review:
    enabled_for: [high]            # DOCUMENTATION ONLY — nobody reads this key
                                    # (`grep -rn enabled_for` over scripts/ and
                                    # skills/ finds no consumer). The operative
                                    # authority is `ceremony_bands` above: band
                                    # `full` owes this review, `medium` and
                                    # `light` do not. The phrase it used to
                                    # carry — "no high-risk pattern match" —
                                    # described the whole-document scan P084
                                    # deleted; it is kept as a name only so an
                                    # older consumer reading it still sees the
                                    # strictest value.
    max_rechecks: 4                # initial review + up to 4 rechecks = 5 Codex runs max.
                                    # DOCUMENTATION of the shipped budget, not a consumed
                                    # override: the CP1/C0 loop's mechanical authority is
                                    # MAX_ATTEMPTS in scripts/lib/aid-cp1-ledger.sh, and no
                                    # consumer reads this key. Editing it here changes
                                    # nothing (P073 Step 1).

  # Ceremony bands (P084 Step 2) — what each band of plan actually runs.
  #
  # The band comes from aid-cp1-gate.sh's classification of the paths the plan
  # DECLARES (defaults/policies/risk-paths.yaml). This table is READ by that
  # gate — it is the requirement list, not a description of one:
  #   cp1_deep_lenses   — the L1/L2/L3 lens files AND the adjudicator verdict
  #                       must exist and be clean (they are one evidence set;
  #                       an adjudicator without lenses adjudicates nothing).
  #   c0_cross_provider — a verified c0-plan-review.json must exist.
  #   cp1_ledger        — the CP1 revision-limit ledger must have budget.
  #
  # Fail-closed everywhere: a band missing from this table, a missing table, a
  # missing yq or a value that is not true/false all read as `true`, i.e. the
  # full ceremony. A band is only ever LOWERED by what the plan declares.
  #
  # `medium` drops the C0 loop and with it the ledger, deliberately and
  # together: the ledger counts C0 revision attempts and is initialised by the
  # C0 loop itself (commands/aid-plan.md §C0), so requiring it where that loop
  # never runs would block every medium plan on a file nothing creates.
  ceremony_bands:
    full:
      cp1_deep_lenses: true
      c0_cross_provider: true
      cp1_ledger: true
    medium:
      cp1_deep_lenses: true
      c0_cross_provider: false
      cp1_ledger: false
    light:
      cp1_deep_lenses: false
      c0_cross_provider: false
      cp1_ledger: false

  # Trivial skip — skip CP2/CP6 for small changes
  skip_trivial: true
  trivial_threshold:
    max_files: 1                   # skip if changed files <= this
    max_lines: 50                  # skip if total changed lines <= this

  # Pre-filter — deterministic bash regex checks before LLM dispatch (CP2/CP3/CP6)
  # Runs on git diff output (new/changed lines only)
  pre_filter:
    enabled: true
    scan_target: diff_only         # only scan new/changed lines from git diff
    # NOTE (AID-052): the pre-filter REGEX RULES are NOT defined here. aid-prefilter.sh reads
    # `defaults/pre-filter-rules.yaml` (skip_rules + fail_rules) as the single source of truth.
    # A former `fail_patterns:` list in this block was an UNREAD duplicate that drifted from the
    # operative file (e.g. it failed on bare `print(`, which the operative file deliberately omits)
    # — removed 2026-06-03 to single-source it. This block only toggles the pre-filter and its scope.
