# Review Checkpoint Configuration
# Controls the review rounds at pipeline milestones.
# See skills/pipeline.md §13 for full protocol documentation.

review_checkpoints:
  enabled: true                    # master switch — disables all checkpoints when false

  # Per-checkpoint toggles
  cp1_plan_review: true            # plan review before EPIC generation (plan_review below)
  cp2_step_review: true            # per-step code review (verifier:code-review)
  cp3_integration_review: true     # pre-GATES integration review (code-review + security)
  cp6_fast_mode_review: true       # post-/aid-do review (verifier:code-review)
  cp7_plan_final_review: true      # the whole plan read once before the merge decision (final_review below);
                                   # switched off, plan-finalize --stage decide blocks until the PM waives it

  # Plan review (CP1): six reviewer roles, one round plus a confirmation round.
  # Read only by scripts/lib/aid-review-config.sh, which refuses a role set
  # other than the six of skills/plan-review-roles.md, a duplicate, a provider
  # other than claude/codex and a model listed in banned_models. A project
  # override is .aid-o/config/policies/review-checkpoints.yaml with its own
  # plan_review block. Claude models are the Agent tool's model names; the
  # codex model is passed to `codex exec -m`. `effort` (low|medium|high,
  # default medium) is a claude role's agent type (low: reviewer-light) and a
  # codex role's reasoning effort. When both generalists use the same model
  # the round is recorded as degraded.
  plan_review:
    rounds_default: 2            # a third round, or only one, needs the PM's recorded override
    min_answers: 4               # a round with fewer valid answers is invalid
    docs_type_reviewers: [generalist_a, generalist_b]   # plans with frontmatter type: docs
    banned_models: [haiku, gpt-5-mini, gpt-4o-mini]
    stand_in_model: opus       # a codex role unreachable: a claude agent answers the same brief
    reviewers:
      - {role: generalist_a,      provider: claude, model: opus}
      - {role: generalist_b,      provider: codex,  model: gpt-5.6-terra, effort: high}
      - {role: behaviour_edges,   provider: claude, model: opus}
      - {role: feasibility_deps,  provider: claude, model: opus}
      - {role: reuse,             provider: claude, model: opus}
      - {role: enforcement_tests, provider: claude, model: opus}

  # Step review (CP2), EPIC review (CP3) and fast-mode review (CP6): reviewer
  # roles of skills/step-review-roles.md, read by scripts/lib/aid-review-config.sh
  # (P094). `when: review+security` marks a role that runs only when
  # aid-step-check.sh reports a security pattern. skip_threshold is what the
  # step check calls small: a diff at or under both limits, inside the step's
  # scope, with no pattern matched, is `skip` and needs no reviewer.
  step_review:
    rounds_default: 2
    skip_threshold: {max_files: 1, max_lines: 50}
    banned_models: [haiku, gpt-5-mini, gpt-4o-mini]
    stand_in_model: opus       # a codex role unreachable: a claude agent answers the same brief
    reviewers:
      - {role: step_generalist, provider: claude, model: opus, effort: low}
      - {role: step_security,   provider: claude, model: opus, effort: low, when: review+security}
  epic_review:
    rounds_default: 2
    banned_models: [haiku, gpt-5-mini, gpt-4o-mini]
    stand_in_model: opus       # a codex role unreachable: a claude agent answers the same brief
    reviewers:
      - {role: epic_generalist, provider: claude, model: opus, effort: low}
      - {role: epic_behaviour,  provider: claude, model: opus, effort: low}
      - {role: epic_security,   provider: codex,  model: gpt-5.6-terra, effort: high}
  # Whole-plan review (CP7): one round over plan_base_commit..candidate before
  # plan-finalize --stage decide. A fix moves the candidate, so its confirmation
  # is round 1 of the next attempt (carrying what stayed open and the fix diff).
  final_review:
    rounds_default: 1
    banned_models: [haiku, gpt-5-mini, gpt-4o-mini]
    stand_in_model: opus
    reviewers:
      - {role: final_criteria,   provider: claude, model: opus}
      - {role: final_claims,     provider: claude, model: opus, effort: low}
      - {role: final_generalist, provider: codex,  model: gpt-5.6-terra, effort: high}

  # The fix loop, the trivial-skip thresholds and the pre-filter left with
  # P094: a step is skipped by aid-step-check.sh (size, scope, no pattern), the
  # security rules of defaults/pre-filter-rules.yaml add the security reviewer,
  # and a failed round is fixed by the step's role within rounds_default.
