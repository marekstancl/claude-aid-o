# AID Execution Configuration (v2)
# Consolidated from: gates.yaml, decision-policies.yaml
#
# Controls: quality gates, retry/escalation, decision policies, budget,
#           content quality, discovered issues triage, and acceptable debt.

# ─── Quality Gates ───────────────────────────────────────────────────────
#
# Per-gate keys (all optional unless noted):
#   description      — human-readable purpose of the gate
#   required         — true blocks GATES→DONE on failure; false is advisory
#   command          — the shell command the gate runs
#   timeout_seconds  — wall-clock budget for the command (default 60)
#   max_retries      — retry attempts after a failure (default from policy)
#   pass_criteria    — human-readable success definition
#   when             — human-readable applicability condition
#   run_mode         — foreground | background (default: foreground)
#   needs_services   — list of declared service names this gate requires healthy
#
# needs_services: [name, ...]
#   The services (declared in the `services:` block below) that must be HEALTHY
#   before this gate is allowed to run. Every name is checked against the
#   declarations at run-all entry — a name no service declares is a hard error
#   that names the gate, never a silent wait on nothing.
#   At gate start the runner asks the service registry (and the declared probe)
#   whether each named service is healthy; if one is not, THIS gate fails fast
#   with reason `service_unhealthy` and the other gates still run. It is a check,
#   never a repair: services are acquired ONCE for the whole run before the first
#   gate and released ONCE after the report is written, so no gate ever starts or
#   stops one. A gate that omits the key is unaffected in every way.
#
# run_mode: foreground|background
#   foreground (default, and the behaviour of every gate that omits the key)
#     runs the command inline under a plain timeout, exactly as AID always has.
#   background runs the command as a supervised job owned by
#     `aid-job.sh` (process-group ownership, PID-reuse defeat, a durable
#     HEAD/tree-bound result record). The gate runner still waits for the job
#     to finish inside the same invocation — this is not fire-and-forget — but
#     if the run is interrupted (crash, killed session, disconnected host) the
#     job survives and the next run RE-ATTACHES to it by command fingerprint
#     instead of starting the expensive suite a second time.
#   Anything other than these two words is a hard error naming the gate: a
#   typo like `backgroud` must never fall back silently to foreground.
#   No gate in this template sets run_mode — nothing changes for a project
#   until its own PM edits `.aid-o/config/execution.yaml`. A project learns
#   which of its gates would benefit from the flip from its own telemetry:
#   the gate runner emits an observe-only `gate_run_mode_advice` timeline
#   event (with the exact one-line edit) whenever measured runtimes recommend
#   background for a gate that declares no run_mode. See also
#   `aid-gate-runtime-report.sh`, which prints the same recommendation.
#
# TEST TIERS (P081). A suite declares its tier in a header comment,
# `# aid-tier: t0|t1|t2`, and the runner filters on it:
#   t0  under 2 s per case   — the pulse, whole tier under 2 min
#   t1  under 30 s per case  — what blocks a merge, whole tier under 10 min
#   t2  everything else, and anything cross-component — runs nightly
# The merge-path gate below therefore runs T0+T1 and NOT the whole portfolio.
# A project that has adopted NO tiers must run this runner WITHOUT `--tier`:
# with no suite carrying a tag, a tier selects NOTHING, and since 2026-08-11
# the runner refuses an empty selection rather than reporting a green gate
# that executed nothing. Adopt tiers with `aid-test-tier-assign.sh` (assign
# from measured cost), stamp them, and keep them honest with
# `aid-test-tier-lint.sh` — only then point a gate at `--tier`.
gates:
  tests_pass:
    description: "Merge-path tests pass — the T0 and T1 tiers, not the whole portfolio"
    required: true
    command: "bash -c './plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t0 && ./plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t1'"
    timeout_seconds: 900
    pass_criteria: "exit code 0"

  # The rest of the portfolio, off the merge path. A key such as `nightly: true`
  # on a gate is IGNORED by aid-run-gates.sh — the gate profile (`--profile`) is
  # the only thing that decides what runs, and plan-finalize does not read the
  # key either. Do not put a nightly suite into `gates:` at all; wire it to a scheduled CI
  # job rather than to a gate profile — see .github/workflows/nightly-tests.yml
  # in the aid-orchestrator repo for the shape, including the result artifact
  # and the red-only report.
  #
  # nightly_tests:
  #   description: "The full portfolio, once a night, blocking nobody"
  #   required: false
  #   command: "./plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --timing"
  #   timeout_seconds: 18000
  #   run_mode: background

  security_scan_pass:
    description: "No high/critical security findings"
    required: true
    command: "bandit -q -r . -ll"
    timeout_seconds: 180
    pass_criteria: "exit code 0"

  docs_updated:
    description: "Documentation updated for changed APIs/models"
    required: false
    type: deterministic
    command: |
      api_changed=$(git diff --name-only {base_commit}..HEAD | grep -cE 'routes/|api/|endpoints/|models/|schemas/|openapi/' || true)
      doc_changed=$(git diff --name-only {base_commit}..HEAD | grep -cE 'README|docs/|CHANGELOG|\.md$' || true)
      if [[ $api_changed -gt 0 && $doc_changed -eq 0 ]]; then
        echo "WARN: API files changed ($api_changed) but no docs updated"; exit 1
      fi

  scope_check:
    description: "Verify changes are within EPIC scope"
    command: "plugins/aid-orchestrator/scripts/gates/scope-check.sh .aid-o/work/evidence/{epic_id}/allowed_paths.txt {base_commit}"
    required: true
    type: deterministic
    max_retries: 0

  plan_diff:
    description: "Plan AC blocks materially satisfied in codebase HEAD"
    required: true
    type: deterministic
    command: "plugins/aid-orchestrator/scripts/aid-plan-diff.sh --plan {plan_path} --evidence-dir .aid-o/work/evidence/{epic_id}/{run_id} --base-commit {base_commit}"
    timeout_seconds: 120
    pass_criteria: "exit 0 (all present) or exit 2 (legacy plan / Fast Mode graceful skip)"
    max_retries: 0

  lint_pass:
    description: "Code passes linting and formatting checks"
    required: false
    command: "ruff check . && ruff format --check ."
    timeout_seconds: 120
    when: "linting tools configured"

  standards_compliance:
    description: "Project standards compliance check (deterministic rules only)"
    required: false
    type: llm_evaluated
    when: "standards.active != 'none' in project.yaml"
    rule: "Load active standard set, run pattern/structural/file-exists rules against git diff"
    pass_criteria: "No gate_blocking violations found in changed files"
    # NOTE: No bash command — evaluated by LLM auditor during DONE state review

  type_check:
    description: "TypeScript type checking passes"
    required: false
    command: "npx tsc --noEmit"
    timeout_seconds: 120
    when: "frontend files changed"

  build_pass:
    description: "Project builds without errors"
    required: false
    command: "npm run build"
    timeout_seconds: 180
    when: "frontend files changed"

  ui_calibration_result:
    description: "Calibration evidence verified: 5 cases pass/fail, all artifacts present on disk, D-desktop/D-mobile prove real ScreenG capture. Skips automatically when no calibration record is present (non-E7-CAL EPICs)."
    required: true
    type: deterministic
    command: "test ! -f .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json || bash plugins/aid-orchestrator/scripts/tests/ui-calibration-verify.sh .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json .aid-o/work/evidence/{epic_id}/{run_id}"
    timeout_seconds: 30
    pass_criteria: "exit code 0 (no record present → auto-pass; record present → all verification checks pass)"
    max_retries: 0

  ui_calibration_signoff:
    description: "PM has manually signed off on E7-CAL calibration results after reviewing 5-case evidence pack. Skips automatically when no calibration record is present (non-E7-CAL EPICs)."
    required: true
    type: deterministic
    command: "test ! -f .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json || jq -e '.calibration.pm_signoff.confirmed_by | length > 0' .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json"
    timeout_seconds: 10
    pass_criteria: "exit code 0 (no record present → auto-pass; record present → confirmed_by is non-empty string)"
    max_retries: 0

# Python project gates (language-specific override example)
# Uncomment and customize for Python-heavy projects:
# gates_python:
#   tests_pass:
#     command: "pytest -q --tb=short tests/"
#     required: true
#     max_retries: 2
#     language: python
#   lint_pass:
