# AID Execution Configuration (v2)
# Consolidated from: gates.yaml, decision-policies.yaml
#
# Controls: quality gates, retry/escalation, decision policies, budget,
#           content quality, discovered issues triage, and acceptable debt.

# ─── Quality Gates ───────────────────────────────────────────────────────
#
# Per-gate keys (all optional unless noted):
#   description      — human-readable purpose of the gate
#   required         — true blocks GATES→DONE on failure; false is advisory
#   command          — the shell command the gate runs
#   timeout_seconds  — the gate's deadline, the only one it has (default 60).
#                      Derivation rule: 2 × p95 of the last 20 runs, rounded
#                      up to 30 s, 60–3 600 s; `aid-gate-runtime-report.sh`
#                      (`gate_baseline_propose`) prints that number from the
#                      recorded gates_rows history and never writes it here.
#   max_retries      — retry attempts after a failure (default from policy)
#   pass_criteria    — human-readable success definition
#   when             — human-readable applicability condition
#   run_mode         — foreground | background (default: foreground)
#
# run_mode: foreground|background
#   foreground (default, and the behaviour of every gate that omits the key)
#     runs the command inline under a plain timeout, exactly as AID always has.
#   background runs the command as a supervised job owned by
#     `aid-job.sh` (process-group ownership, PID-reuse defeat, a durable
#     HEAD/tree-bound result record). The gate runner still waits for the job
#     to finish inside the same invocation — this is not fire-and-forget — but
#     if the run is interrupted (crash, killed session, disconnected host) the
#     job survives and the next run RE-ATTACHES to it by command fingerprint
#     instead of starting the expensive suite a second time.
#   Anything other than these two words is a hard error naming the gate: a
#   typo like `backgroud` must never fall back silently to foreground.
#   No gate in this template sets run_mode — nothing changes for a project
#   until its own PM edits `.aid-o/config/execution.yaml`. A project learns
#   which of its gates would benefit from the flip from its own telemetry:
#   the gate runner emits an observe-only `gate_run_mode_advice` timeline
#   event (with the exact one-line edit) whenever measured runtimes recommend
#   background for a gate that declares no run_mode. See also
#   `aid-gate-runtime-report.sh`, which prints the same recommendation.
#
# TEST TIERS (P081). A suite declares its tier in a header comment,
# `# aid-tier: t0|t1|t2`, and the runner filters on it:
#   t0  under 2 s per case   — the pulse, whole tier under 2 min
#   t1  under 30 s per case  — what blocks a merge, whole tier under 10 min
#   t2  everything else, and anything cross-component — runs nightly
# The merge-path gate below therefore runs T0+T1 and NOT the whole portfolio.
# A project that has adopted NO tiers must run this runner WITHOUT `--tier`:
# with no suite carrying a tag, a tier selects NOTHING, and since 2026-08-11
# the runner refuses an empty selection rather than reporting a green gate
# that executed nothing. Adopt tiers with `aid-test-tier-assign.sh` (assign
# from measured cost), stamp them, and keep them honest with
# `aid-test-tier-lint.sh` — only then point a gate at `--tier`.
#
# `inputs:` (optional, any gate) — the paths a gate's result depends on, as glob
# pathspecs; a leading `!` excludes. At plan close a gate that passed in the
# previous attempt is copied forward instead of executed when nothing under its
# inputs changed between the two candidates and its definition is the same. A
# gate without `inputs:` depends on the whole tree, so it is copied only when
# the tree did not change at all. Declare inputs only when they are true: a
# test gate that lists `["**", "!docs/**"]` says docs cannot break its tests.
gates:
  tests_pass:
    description: "Merge-path tests pass — the T0 and T1 tiers, not the whole portfolio"
    required: true
    command: "bash -c './plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t0 && ./plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --tier t1'"
    timeout_seconds: 900
    pass_criteria: "exit code 0"

  # The rest of the portfolio, off the merge path. A key such as `nightly: true`
  # on a gate is IGNORED by aid-run-gates.sh — the gate profile (`--profile`) is
  # the only thing that decides what runs, and plan-finalize does not read the
  # key either. Do not put a nightly suite into `gates:` at all; wire it to a scheduled CI
  # job rather than to a gate profile — see .github/workflows/nightly-tests.yml
  # in the aid-orchestrator repo for the shape, including the result artifact
  # and the red-only report.
  #
  # nightly_tests:
  #   description: "The full portfolio, once a night, blocking nobody"
  #   required: false
  #   command: "./plugins/aid-orchestrator/scripts/tests/run-all-tests.sh --timing"
  #   timeout_seconds: 18000
  #   run_mode: background

  security_scan_pass:
    description: "No high/critical security findings"
    required: true
    command: "bandit -q -r . -ll"
    timeout_seconds: 180
    pass_criteria: "exit code 0"

  docs_updated:
    description: "Documentation updated for changed APIs/models"
    required: false
    type: deterministic
    command: |
      api_changed=$(git diff --name-only {base_commit}..HEAD | grep -cE 'routes/|api/|endpoints/|models/|schemas/|openapi/' || true)
      doc_changed=$(git diff --name-only {base_commit}..HEAD | grep -cE 'README|docs/|CHANGELOG|\.md$' || true)
      if [[ $api_changed -gt 0 && $doc_changed -eq 0 ]]; then
        echo "WARN: API files changed ($api_changed) but no docs updated"; exit 1
      fi

  scope_check:
    description: "Verify changes are within EPIC scope"
    command: "plugins/aid-orchestrator/scripts/gates/scope-check.sh .aid-o/work/evidence/{epic_id}/allowed_paths.txt {base_commit}"
    required: true
    type: deterministic
    max_retries: 0

  plan_diff:
    description: "Plan AC blocks materially satisfied in codebase HEAD"
    required: true
    type: deterministic
    command: "plugins/aid-orchestrator/scripts/aid-plan-diff.sh --plan {plan_path} --evidence-dir .aid-o/work/evidence/{epic_id}/{run_id} --base-commit {base_commit}"
    timeout_seconds: 120
    pass_criteria: "exit 0 (all present) or exit 2 (legacy plan / Fast Mode graceful skip)"
    max_retries: 0

  lint_pass:
    description: "Code passes linting and formatting checks"
    required: false
    command: "ruff check . && ruff format --check ."
    timeout_seconds: 120
    when: "linting tools configured"

  standards_compliance:
    description: "Project standards compliance check (deterministic rules only)"
    required: false
    type: llm_evaluated
    when: "standards.active != 'none' in project.yaml"
    rule: "Load active standard set, run pattern/structural/file-exists rules against git diff"
    pass_criteria: "No gate_blocking violations found in changed files"
    # NOTE: No bash command — evaluated by LLM auditor during DONE state review

  type_check:
    description: "TypeScript type checking passes"
    required: false
    command: "npx tsc --noEmit"
    timeout_seconds: 120
    when: "frontend files changed"

  build_pass:
    description: "Project builds without errors"
    required: false
    command: "npm run build"
    timeout_seconds: 180
    when: "frontend files changed"

  ui_calibration_result:
    description: "Calibration evidence verified: 5 cases pass/fail, all artifacts present on disk, D-desktop/D-mobile prove real ScreenG capture. Skips automatically when no calibration record is present (non-E7-CAL EPICs)."
    required: true
    type: deterministic
    command: "test ! -f .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json || bash plugins/aid-orchestrator/scripts/tests/ui-calibration-verify.sh .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json .aid-o/work/evidence/{epic_id}/{run_id}"
    timeout_seconds: 30
    pass_criteria: "exit code 0 (no record present → auto-pass; record present → all verification checks pass)"
    max_retries: 0

  ui_calibration_signoff:
    description: "PM has manually signed off on E7-CAL calibration results after reviewing 5-case evidence pack. Skips automatically when no calibration record is present (non-E7-CAL EPICs)."
    required: true
    type: deterministic
    command: "test ! -f .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json || jq -e '.calibration.pm_signoff.confirmed_by | length > 0' .aid-o/work/evidence/{epic_id}/{run_id}/ui-cal/ui-calibration-record.json"
    timeout_seconds: 10
    pass_criteria: "exit code 0 (no record present → auto-pass; record present → confirmed_by is non-empty string)"
    max_retries: 0

# Python project gates (language-specific override example)
# Uncomment and customize for Python-heavy projects:
# gates_python:
#   tests_pass:
#     command: "pytest -q --tb=short tests/"
#     required: true
#     max_retries: 2
#     language: python
#   lint_pass:
#     command: "ruff check . --fix && black ."
#     required: true
#     max_retries: 0
#     language: python
#   type_check:
#     command: "mypy src/ --ignore-missing-imports"
#     required: true
#     max_retries: 1
#     language: python
#   security_scan:
#     command: "bandit -r src/ -ll"
#     required: true
#     max_retries: 2
#     language: python

# ─── Retry & Escalation ─────────────────────────────────────────────────
# Retry is PER-GATE only: each gate's own `max_retries` (see gate definitions above)
# is the single retry knob, read by aid-run-gates.sh. There is no project-wide retry
# block — a former global `retry.max_attempts` was unread dead config (removed 2026-06-03,
# AID-052); aid-run-gates.sh defaults `max_retries` to 1 when a gate omits it.

escalation:
  method: inline
  message_template: |
    GATE FAILURE — Escalation to PM
    Gate: {gate_name}
    EPIC: {epic_id}
    Attempts: {attempt_count}/{max_attempts}
    Last error: {last_error}
    Action needed: Review and decide (fix / skip / abort)

# ─── Budget ──────────────────────────────────────────────────────────────
budget:
  max_llm_cost_per_epic_usd: 50
  warn_at_percentage: 80

# ─── Evidence ────────────────────────────────────────────────────────────
evidence:
  store_gate_results: true
  store_command_output: true
  store_retry_history: true
  output_dir: "evidence/{epic_id}/{run_id}/gates/"

# ─── Quality Thresholds ─────────────────────────────────────────────────
quality_thresholds:
  min_test_coverage_percent: 80
  min_review_score: 7
  max_todo_count: 0
  max_security_findings_high: 0
  max_security_findings_medium: 3

# ─── Auto-Decisions (Controller decides without PM) ──────────────────────
auto_decisions:
  - condition: "all gate results = pass"
    action: "proceed to next state"
  - condition: "gate fails AND retry_count < max_attempts"
    action: "generate fix instructions, dispatch retry"
  - condition: "step produces expected outputs"
    action: "proceed to next step"
  - condition: "agent modifies only allowed_paths"
    action: "accept changes"
  - condition: "agent modifies forbidden_paths"
    action: "reject changes, re-dispatch with warning"
  - condition: "LLM cost < budget.warn_at_percentage"
    action: "continue execution"

# ─── Escalation Triggers ────────────────────────────────────────────────
# Authoritative escalation triggers live in pipeline.md (the "Escalation triggers" table),
# which is what the orchestrator actually follows. A parallel `escalation_triggers:` list here
# drifted from that table and was read by nothing, so it was removed 2026-06-03 (AID-052) to
# single-source it. Add or change triggers in pipeline.md.

# ─── Content Quality ────────────────────────────────────────────────────
content_quality:
  auto_accept_when:
    - "step role is: docs-writer, config, release"
    - "step has <= 3 acceptance criteria"
  review_required_when:
    - "step role is: architect, backend, frontend, security"
    - "step has 5+ acceptance criteria"
  review_agent: code-reviewer
  max_review_fix_cycles: 2

# ─── Discovered Issues Triage ───────────────────────────────────────────
discovered_issues:
  critical:
    auto_fix_patterns:
      - { pattern: "migration.*fail", dispatch: backend }
      - { pattern: "dependency.*conflict", dispatch: backend }
      - { pattern: "security.*critical", dispatch: security }
    default_action: escalate_to_pm
    blocks_current_step: true
  high:
    forward_to_later_step: true
    create_backlog_entry: true
    blocks_current_step: false
  medium:
    log_to_improvement_notes: true
    blocks_current_step: false

# ─── Acceptable / Not-Acceptable Debt ────────────────────────────────────
acceptable_debt:
  - "TODO with issue reference (tracked in backlog)"
  - "missing edge case tests (core path tested)"
  - "placeholder error messages (replaced before release)"

# Review-quality guidance honored by the reviewers. Enforcement routing (AID-052, 2026-06-03):
#   HARD-GATED by the step check (defaults/pre-filter-rules.yaml, via aid-step-check.sh):
#     hardcoded credentials → hardcoded_secret_pattern; disabled security checks →
#     disabled_security_check; skipped tests → skipped_test; console.log/debugger → debug_leftover
#     (bare print() intentionally NOT gated — too common in legit code).
#   SCOPE LAYER: scope-check.sh gate enforces allowed_paths (anything outside fails); the
#     verifier dispatch context additionally flags writes to a step's forbidden_paths.
#   ADVISORY ONLY (regex-unreliable, left to reviewer judgment): "TODO/FIXME without issue
#     reference", "empty catch blocks".
not_acceptable:
  - "TODO/FIXME without issue reference"      # advisory
  - "hardcoded credentials or API keys"       # gated: pre-filter hardcoded_secret_pattern
  - "disabled security checks"                # gated: pre-filter disabled_security_check
  - "skipped tests without documented reason" # gated: pre-filter skipped_test
  - "changes to forbidden paths"              # gated: scope-check.sh (allowed_paths) + verifier (forbidden_paths)
  - "console.log / print() in production code" # console.log gated (debug_leftover); print() advisory
  - "empty catch blocks"                      # advisory

# ─── Gate profiles (P097 Step 4) ─────────────────────────────────────────
# `/aid-init` (fresh or upgrade) appends a `default_profile:` + `gate_profiles:`
# block here, composed from the gates above. Profiles are an ORDERED LIST,
# declared narrowest first: the declaration index IS the rank — there is no
# other ordering anywhere. `aid-run-gates.sh --profile <name>` runs exactly
# that profile's `include[]`; an unknown name, or a profile whose include[]
# names no required gate, is refused before any gate runs.
#
# Selection (`lib/aid-gate-profile-select.sh`): an EPIC run gets the LAST
# declared profile whose `when_paths:` matches any changed path, else
# `default_profile:`. A profile without `when_paths:` is never auto-selected;
# `release` is the plan-final boundary's explicit name. The GATES:DONE floor
# refuses a report that names no profile, one narrower (lower index) than the
# resolver's answer, or one recorded against a table that has since changed
# (`profile_table_changed`).
#
#   default_profile: standard
#   gate_profiles:
#     targeted:
#       include: [tests_pass]
#     standard:
#       include: [tests_pass, security_scan_pass, docs_updated]
#     full:
#       include: [tests_pass, security_scan_pass, docs_updated]
#       when_paths: ["*/aid-fsm.sh", "defaults/schemas/*"]
#     release:
#       include: [tests_pass, security_scan_pass, docs_updated]
