# ─── Services (optional — commentary only, nothing active) ───────────────
#
# A `services:` map declares the long-lived processes a run may need standing
# up before its gates can mean anything — a database, a dev server, a queue.
# It exists because AID starts no service anywhere on its own authority: until
# a project writes this block, "infrastructure startup" is prose in a role card
# with no mechanism behind it, and an agent left to improvise reaches for the
# one thing it must not use (a blind `sleep`) because nothing else is offered.
#
# THE BLOCK IS OPTIONAL AND THIS TEMPLATE DECLARES NO SERVICES. A project with
# no `services:` key behaves exactly as it always has — same gates, same report,
# byte for byte. Nothing auto-starts for a consumer project; a PM opts in by
# uncommenting and editing `.aid-o/config/execution.yaml`. This repository, for
# instance, declares nothing: its tests need no running infrastructure.
#
# Shape authority: defaults/schemas/service-declaration.schema.json.
# Runtime enforcement: `_validate_services_config` in aid-run-gates.sh, which
# mirrors the schema and runs at run-all entry, BEFORE any service or gate
# action, naming the offending service and field on violation.
#
# Per-service keys:
#   start_cmd                 (required) the command that starts the service.
#                             It MUST remain the FOREGROUND process of its job
#                             — no `&`, no `nohup`, no self-daemonising fork.
#                             The supervisor owns the process group; a command
#                             that backgrounds itself returns a pid owning
#                             nothing and the run can no longer stop what it
#                             started.
#   probe_cmd                 (required) health probe; exit 0 = healthy. It is
#                             polled, so keep it cheap and side-effect free.
#   startup_deadline_seconds  (required) the HEALTH-PROBE budget only: absent →
#                             starting must reach healthy within this many
#                             seconds. It is NOT the process lifetime.
#   max_lifetime_seconds      (default 86400) the aid-job whole-process
#                             deadline — a run-lifetime ceiling kept
#                             deliberately SEPARATE from the startup budget, so
#                             one number never has to mean both "how long may it
#                             take to come up" and "how long may it live".
#   stop_cmd                  (optional) graceful shutdown. Absent → teardown
#                             relies on job cancel alone (process-group kill),
#                             which is fine for a process with no external state
#                             to flush.
#   log_hint                  (optional) where this service's own logs land —
#                             for the human diagnosing a failed startup.
#   restart_authorized        (default false) may an automated run restart it
#                             after it dies? Repairs are opt-in authority.
#   port_env                  (optional) the env var carrying the per-run
#                             allocated port. Its absence is the shared-resource
#                             escape hatch, honestly named: a service on a fixed
#                             external port (an existing shared database)
#                             declares no port_env and allocation is skipped for
#                             it. Two services may never name the same port_env
#                             — one env var, one owner; the runner refuses.
#
# Worked example (a project whose e2e gate needs its own Postgres):
#
# services:
#   postgres:
#     start_cmd: "docker compose up postgres"
#     probe_cmd: "pg_isready -h 127.0.0.1 -p \"$PGPORT_E2E\""
#     stop_cmd: "docker compose stop postgres"
#     startup_deadline_seconds: 60
#     max_lifetime_seconds: 3600
#     log_hint: "docker compose logs postgres"
#     restart_authorized: false
#     port_env: PGPORT_E2E
#
# ... and the gate that needs it says so by name (see `needs_services` in the
# per-gate key list at the top of this file):
#
# gates:
#   e2e:
#     command: "npm run test:e2e"
#     needs_services: [postgres]

# ─── Retry & Escalation ─────────────────────────────────────────────────
# Retry is PER-GATE only: each gate's own `max_retries` (see gate definitions above)
# is the single retry knob, read by aid-run-gates.sh. There is no project-wide retry
# block — a former global `retry.max_attempts` was unread dead config (removed 2026-06-03,
# AID-052); aid-run-gates.sh defaults `max_retries` to 1 when a gate omits it.

escalation:
  method: inline
  message_template: |
    GATE FAILURE — Escalation to PM
    Gate: {gate_name}
    EPIC: {epic_id}
    Attempts: {attempt_count}/{max_attempts}
    Last error: {last_error}
    Action needed: Review and decide (fix / skip / abort)

# ─── Budget ──────────────────────────────────────────────────────────────
budget:
  max_llm_cost_per_epic_usd: 50
  warn_at_percentage: 80

# ─── Evidence ────────────────────────────────────────────────────────────
evidence:
  store_gate_results: true
  store_command_output: true
  store_retry_history: true
  output_dir: "evidence/{epic_id}/{run_id}/gates/"

# ─── Quality Thresholds ─────────────────────────────────────────────────
quality_thresholds:
  min_test_coverage_percent: 80
  min_review_score: 7
  max_todo_count: 0
  max_security_findings_high: 0
  max_security_findings_medium: 3

# ─── Auto-Decisions (Controller decides without PM) ──────────────────────
auto_decisions:
  - condition: "all gate results = pass"
    action: "proceed to next state"
  - condition: "gate fails AND retry_count < max_attempts"
    action: "generate fix instructions, dispatch retry"
  - condition: "step produces expected outputs"
    action: "proceed to next step"
  - condition: "agent modifies only allowed_paths"
    action: "accept changes"
  - condition: "agent modifies forbidden_paths"
    action: "reject changes, re-dispatch with warning"
  - condition: "LLM cost < budget.warn_at_percentage"
    action: "continue execution"

# ─── Escalation Triggers ────────────────────────────────────────────────
# Authoritative escalation triggers live in pipeline.md (the "Escalation triggers" table),
# which is what the orchestrator actually follows. A parallel `escalation_triggers:` list here
# drifted from that table and was read by nothing, so it was removed 2026-06-03 (AID-052) to
# single-source it. Add or change triggers in pipeline.md.

# ─── Content Quality ────────────────────────────────────────────────────
content_quality:
  auto_accept_when:
    - "step role is: docs-writer, config, release"
    - "step has <= 3 acceptance criteria"
  review_required_when:
    - "step role is: architect, backend, frontend, security"
    - "step has 5+ acceptance criteria"
  review_agent: code-reviewer
  max_review_fix_cycles: 2

# ─── Discovered Issues Triage ───────────────────────────────────────────
discovered_issues:
  critical:
    auto_fix_patterns:
      - { pattern: "migration.*fail", dispatch: backend }
      - { pattern: "dependency.*conflict", dispatch: backend }
      - { pattern: "security.*critical", dispatch: security }
    default_action: escalate_to_pm
    blocks_current_step: true
  high:
    forward_to_later_step: true
    create_backlog_entry: true
    blocks_current_step: false
  medium:
    log_to_improvement_notes: true
    blocks_current_step: false

# ─── Acceptable / Not-Acceptable Debt ────────────────────────────────────
acceptable_debt:
  - "TODO with issue reference (tracked in backlog)"
  - "missing edge case tests (core path tested)"
  - "placeholder error messages (replaced before release)"

# Review-quality guidance honored by curator/auditor. Enforcement routing (AID-052, 2026-06-03):
#   HARD-GATED in the pre-filter (defaults/pre-filter-rules.yaml, via aid-prefilter.sh):
#     hardcoded credentials → hardcoded_secret_pattern; disabled security checks →
#     disabled_security_check; skipped tests → skipped_test; console.log/debugger → debug_leftover
#     (bare print() intentionally NOT gated — too common in legit code).
#   SCOPE LAYER: scope-check.sh gate enforces allowed_paths (anything outside fails); the
#     verifier dispatch context additionally flags writes to a step's forbidden_paths.
#   ADVISORY ONLY (regex-unreliable, left to reviewer judgment): "TODO/FIXME without issue
#     reference", "empty catch blocks".
not_acceptable:
  - "TODO/FIXME without issue reference"      # advisory
  - "hardcoded credentials or API keys"       # gated: pre-filter hardcoded_secret_pattern
  - "disabled security checks"                # gated: pre-filter disabled_security_check
  - "skipped tests without documented reason" # gated: pre-filter skipped_test
  - "changes to forbidden paths"              # gated: scope-check.sh (allowed_paths) + verifier (forbidden_paths)
  - "console.log / print() in production code" # console.log gated (debug_leftover); print() advisory
  - "empty catch blocks"                      # advisory

# ─── Curator Auto-Resolution ────────────────────────────────────────────
curator_auto_rules:
  always_approve:
    - { type: dx }
    - { type: security, priority: high }
    - { area: "docs/*" }
    - { source_type: standards, effort: S }
  always_defer:
    - { type: architecture }
    - { source_type: standards, effort: L }
  default_action: approve
  learning:
    enabled: true
    similarity_threshold: 0.80
    min_decisions: 3

# ─── CP4 Curator-Validation Enforcement (P040 Component C) ───────────────────
# P040 Component C: production-code path glob for CP4 enforcement trigger.
# Format: pipe-separated regex alternation; matched as left-anchored prefix
# against `git diff --name-only` output.
cp4_production_paths: "plugins/|scripts/|src/|lib/|api/"

# ─── Plan-Boundary Specialists (P045) ─────────────────────────────────────
simplifier:
  # Default-on. To disable, set enabled: false + add PM rationale comment explaining why.
  enabled: true
  model: opus
  defer_effort: [L]

reporter:
  # Default-on. To disable, set enabled: false + add PM rationale comment explaining why.
  enabled: true
  model: sonnet
  report_dir: ".aid-o/reports"
  dispatch_mode_override: null
