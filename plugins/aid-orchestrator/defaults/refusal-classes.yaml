# refusal-classes.yaml — every refusal code the plugin prints, with who acts on it in an --auto run (P117).
# Read by aid-fsm.sh _fsm_refusal_next (prints "class:") and by the delegation (lib/aid-delegate.sh): an
# --auto run never stops on a PM question for a code whose class is not pm. Classes:
#   agent_fix                 the agent fixes the cause and goes on — never a question
#   agent_fix_then_stand_in   the agent fixes; after a repeated failure the stand-in decides
#   prevent                   caught earlier (plan check, run start) or a targeted repair instead of --force
#   stand_in                  the independent stand-in decides (Codex, Claude when Codex is out)
#   pm                        a protected impact: the brief, money, live data, security, production,
#                             a new foreign API or repository, lowering a required gate
#   incident                  a broken environment: the run stops with the cause, nothing to decide
#   not_in_run                plan writing, the plan review (CP1), or the EPIC path removed in 3.0.0
# test-refusal-classes.bats refuses a printed code missing here. Source: .aid-o/plans/P117-registr.md.
codes:
  REVIEW_EXHAUSTED: {class: stand_in, how: "delegate (P112), opakování po novém důkazu (12)"}
  abandon_needs_reason: {class: pm, how: "opuštění běhu je rozhodnutí PM"}
