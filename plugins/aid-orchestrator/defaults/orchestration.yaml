# AID Orchestration Configuration (v2)
# Consolidated from: language.yaml, dispatch-config.yaml, dispatch-strategy.yaml,
#                    release-policy.yaml, skill-conflicts.yaml
#
# Controls: language, model tiers, dispatch strategy, escalation, FSM,
#           release policy, and skill conflict resolution.

# ─── Language ────────────────────────────────────────────────────────────
language:
  document_language: EN
  conversation_language: auto  # detected from PM input

# ─── Models ──────────────────────────────────────────────────────────────
# Model tier per role is defined in skills/role-cards.md (single source of truth) —
# step roles carry a `**Model:**` field; controller agents (auditor/curator/gate-fixer/
# verifier) carry model in their own agent-file frontmatter. An optional `step.model`
# in plan.json overrides the card for that one step. See pipeline.md §4 for dispatch.

# ─── Dispatch ────────────────────────────────────────────────────────────
dispatch:
  strategy: sequential          # TEMPORARY: force sequential until Agent SDK migration
  max_parallel: 1               # ONE agent at a time — prevents mega-commits and placeholder verify
  worktree_base: .claude/worktrees
  # Verifier dispatch configuration (Phase 1 — P037 v2.20.1)
  mode: subagent  # subagent | inline
                  # subagent: pipeline.md flow dispatches Agent() subagents; the verifier output's
                  #           _generated_at must fall within the dispatch start..complete interval
                  #           for its focus in timeline.jsonl (± timeline_window_seconds tolerance).
                  # inline:   LLM writes verifier-output-*.md directly in main context;
                  #           _generated_by must match inline_signature_format with valid git SHA.
  inline_signature_format: "main-context@<commit-sha>"  # required _generated_by format when mode=inline
  timeline_window_seconds: 60  # clock-skew tolerance (seconds) added to each side of the
                               # start..complete dispatch interval — NOT a window around _generated_at

# ─── Escalation ─────────────────────────────────────────────────────────
escalation:
  max_per_session: 3
  triggers:
    - gate_retry_exhausted
    - security_required_fail
    - scope_violation

# ─── FSM ─────────────────────────────────────────────────────────────────
fsm:
  states: [READY, EXECUTE, GATES, ESCALATION, DONE, ERROR]
  state_file: .aid-o/work/evidence/{epic_id}/{run_id}/fsm-state.yaml
  timeline_file: .aid-o/work/evidence/{epic_id}/{run_id}/timeline.jsonl

# ─── Release Policy ─────────────────────────────────────────────────────
# Versioning, SemVer rules, and release automation settings.
release:
  versioning:
    mode: single
    changelog: CHANGELOG.md

  version_files:
    - path: ".claude-plugin/marketplace.json"
      field: "metadata.version"
      update_method: json_field
    - path: ".claude-plugin/marketplace.json"
      field: "plugins[0].version"
      update_method: json_field
    - path: "plugins/aid-orchestrator/.claude-plugin/plugin.json"
      field: "version"
      update_method: json_field
    - path: "plugins/aid-orchestrator/README.md"
      field: "plugin_version"
      update_method: regex
      pattern: '^\- \*\*Plugin:\*\* [\d.]+'
      replacement: '- **Plugin:** ${version}'
    - path: "README.md"
      field: "roadmap_current"
      update_method: regex
      pattern: '^\- \*\*v[\d.]+\*\* \(current\)'
      replacement: '- **v${version}** (current)'

  semver:
    pre_release: true
    changelog_header_pattern: '## \[(\d+\.\d+\.\d+)\]'

  multi_phase:
    last_epic: mandatory
    intermediate_epic: pm_choice
    standalone_epic: mandatory

  first_aid:
    intermediate_action: defer
    last_epic_action: release
    on_error: escalate

  settings:
    git_tag: true
    github_release: true
    draft_release: false
    auto_tag: true
    auto_release: true

  commit:
    message_template: "release: v${version} — ${summary}"

  skip_when:
    no_changelog_version: true
    versions_current: true

# ─── Skill Conflicts ────────────────────────────────────────────────────
# Known conflicts between plugins/skills. Used by /aid-setup.
skill_conflicts:
  - id: "brainstorming-duplicate"
    prefer: "aid-orchestrator:aid-plan"
    deny: "superpowers:brainstorming"
    reason: "Both provide brainstorming workflow. AID version is integrated with orchestration pipeline."
    severity: high
  - id: "writing-plans-duplicate"
    prefer: "aid-orchestrator:aid-plan"
    deny: "superpowers:writing-plans"
    reason: "AID plan-writing skill is integrated with orchestration pipeline."
    severity: high
  - id: "executing-plans-duplicate"
    prefer: "aid-orchestrator:aid-run"
    deny: "superpowers:executing-plans"
    reason: "AID /aid-run provides FSM, gates, and evidence tracking."
    severity: high
