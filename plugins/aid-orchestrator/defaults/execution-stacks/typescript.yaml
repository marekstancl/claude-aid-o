gates:
# project_tests: ["**/*.test.*"]
ts_test:
  # DEPENDENCY: package.json scripts.test must exist
  command: "bash {plugin_path}/scripts/aid-run-gates.sh record-tests --glob '**/*.test.*' --evidence-file {evidence_dir}/gates/ts_test.evidence.json -- npm test"
  runs_project_tests: true   # P110: it runs the project's tests and proves it (evidence file)
  required: true
ts_lint:
  # DEPENDENCY: eslint must be installed (npm install --save-dev eslint)
  command: "npx eslint . --ext .ts,.tsx"
  required: true
ts_type_check:
  # DEPENDENCY: typescript must be installed (npm install --save-dev typescript)
  command: "npx tsc --noEmit"
  required: true
