gates:
go_test:
  # DEPENDENCY: go toolchain (go test is built-in)
  command: "go test ./..."
  required: true
go_lint:
  # DEPENDENCY: golangci-lint must be installed (https://golangci-lint.run/usage/install)
  command: "golangci-lint run"
  required: true
go_build:
  # DEPENDENCY: go toolchain (go build is built-in)
  command: "go build ./..."
  required: true
