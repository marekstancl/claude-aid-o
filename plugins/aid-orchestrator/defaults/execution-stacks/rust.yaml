gates:
# project_tests: ["**/tests/**/*.rs"]
rust_test:
  # DEPENDENCY: cargo (rustup toolchain)
  command: "bash {plugin_path}/scripts/aid-run-gates.sh record-tests --glob '**/tests/**/*.rs' --evidence-file {evidence_dir}/gates/rust_test.evidence.json -- cargo test"
  runs_project_tests: true   # P110: it runs the project's tests and proves it (evidence file)
  required: true
rust_clippy:
  # DEPENDENCY: clippy (rustup component add clippy)
  command: "cargo clippy -- -D warnings"
  required: true
rust_build:
  # DEPENDENCY: cargo (rustup toolchain)
  command: "cargo build --release"
  required: true
