# prices.yaml — what a token costs, USD per million, for the models the review
# checkpoints name (defaults/policies/review-checkpoints.yaml). Read by
# scripts/lib/aid-review-summary.sh (aid_review_usd, aid_review_usd_blended).
# A project may override it with .aid-o/config/prices.yaml (the project file
# wins, and the status tile names it). An unlisted model costs "unknown", never
# zero. Every row says where its price came from and when it was read.
#
# `blended` is for a figure the Agent tool reports as ONE total (input, output
# and cache reads together): the measured blend of a real run, or an estimate
# scaled from the measured one — `blended_basis` says which. Codex reports
# input / cached input / output separately, so it needs no blend.
version: 1
models:
  opus:
    vendor_name: "Claude Opus 5 (the Agent tool's `opus`)"
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25
    blended: 16.4
    blended_basis: "measured: P093 hand run 2026-09-18, 2.14 M subagent tokens for about 35 USD (cache reads dominate)"
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
    as_of: "2026-09-19"
  sonnet:
    vendor_name: "Claude Sonnet 5 (the Agent tool's `sonnet`)"
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
    blended: 6.56
    blended_basis: "estimated: the opus blend scaled by the input-price ratio 2/5. P095 was to replace this with a measured figure from its own cp2 rounds; it was built OUTSIDE the AID pipeline on the PM's instruction (2026-09-20), so ZERO rounds were priced and the estimate stands. Since P099 the defaults run step reviewers on opus, so only a project that pins sonnet measures it."
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
    as_of: "2026-09-19"
  gpt-6-sol:
    vendor_name: "gpt-6-sol (codex exec -m)"
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 0
    source: "https://developers.openai.com/api/docs/pricing"
    as_of: "2026-09-24"
  gpt-5.6-terra:
    vendor_name: "gpt-5.6-terra (codex exec -m)"
    input: 2.00
    output: 12.00
    cache_read: 0.20
    cache_write: 0
    source: "https://developers.openai.com/api/docs/pricing"
    as_of: "2026-09-19"
# P115: the image models the /aid-ui studio pays per image (aid-ui-logo-gen.py through lib/aid_ui_costs.image_prices),
# USD per 1024x1024 image by quality, plus ref_usd per reference image sent with it. The studio's token costs read
# `models:` above like the revisions do (one table; a project's .aid-o/config/prices.yaml overrides both).
images:
  as_of: "2026-10-08"
  source: "OpenAI image pricing, read 2026-10-07; the token-billed models estimated at 30 USD per 1M image-output tokens (measured 2026-10-08: sunburst high 1756 tokens, gpt-image-2 high 7024 tokens)"
  ref_usd: 0.006
  models:
    gpt-image-1: {low: 0.011, medium: 0.042, high: 0.167}
    gpt-image-2: {low: 0.06, medium: 0.12, high: 0.21}
    gpt-image-2.5-sunburst: {low: 0.02, medium: 0.04, high: 0.06}
    gpt-image-2.5-flare: {low: 0.02, medium: 0.03, high: 0.05}
