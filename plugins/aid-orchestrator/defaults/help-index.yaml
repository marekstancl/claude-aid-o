# help-index.yaml — the authority file for AID's public surfaces.
#
# CHECKED-IN ONLY. /aid-init never copies this into .aid-o/ — one source of
# truth, no init idempotency complication.
#
# COLUMNS (all 8 required on every row; `writes` may be an empty list):
#   command     slash name of the surface
#   file        repo-relative path to its source file
#   purpose     one line, taken from the surface's own frontmatter/prose
#   topic       /aid-help topic route, or `none`
#   audience    beginner | regular | power | internal
#   disposition current | update | index_only | intentionally_internal
#               | remove_or_deprecate
#   writes      config files this surface may write; [] = read-only.
#               Each entry carries an ownership prefix:
#                 creates:<path>  this surface writes the file's initial content
#                 mutates:<path>  this surface owns changes AFTER creation
#               A path may appear as `creates:` on one surface and `mutates:` on
#               another; that pair IS the ownership statement. One surface carrying
#               BOTH prefixes for the same path means it creates the file and is also
#               its only later writer. Two surfaces both claiming `creates:` for one
#               path is a defect.
#   final_turn  the OUTPUT-CONTRACT INVENTORY entry: what this surface leaves the PM
#               with at its last turn. Exactly one of three forms:
#                 renderer:<plugin-root-relative script>
#                       a deterministic renderer owns the final message. The script
#                       MUST exist AND the surface's own file MUST name it (that is
#                       the wiring; a row naming a renderer nothing sources is a
#                       claim with no mechanism behind it). Both are asserted.
#                 card:<type>  one of the four cards of `skills/communication.md`:
#                       finished | decision-required | blocked | progress
#                       (card 1 Finished, 2 Decision required, 3 Blocked or failed,
#                       4 Progress / handoff). The vocabulary is CLOSED — a typo or
#                       an invented fifth card fails the suite.
#                 internal    the surface has no PM-facing final turn at all. Only
#                       legal on an `intentionally_internal` row: a surface a user
#                       can reach owes the user a card.
#               A renderer row does not mean the surface never uses cards elsewhere
#               — /aid-run renders cards at other boundaries too. The column names
#               the LAST turn's owner, which is what `skills/communication.md`'s
#               inventory rule is about: a path absent from this inventory cannot
#               quietly emit a final technical dump instead of a card.
#               WHAT IS AND IS NOT CHECKED (say it plainly rather than let a reader
#               over-trust the column): for `renderer:` rows the value's CONTENT is
#               checked — wrong script name, missing file or missing wiring all fail.
#               For `card:` rows only the vocabulary and the public/internal split
#               are mechanical; that a surface truly emits THAT card at runtime is
#               prose evidence recorded in this file, not something a bats suite
#               can observe. Making that mechanical needs a runtime capture harness,
#               which this plan deliberately does not build.
#
# DISPOSITION SEMANTICS (exact):
#   current                 surface is correct as shipped; REQUIRES a topic route.
#   update                  surface is correct but its prose changes in this plan;
#                           REQUIRES a topic route.
#   index_only              indexed here without a topic route. TRANSITIONAL, not a
#                           resting place: NO indexed public surface may rest here
#                           once Step 3 lands — Step 3 flips every one to `current`
#                           with a real topic. The rule covers ANY indexed surface,
#                           not only files under `commands/`: /visual-companion is
#                           `user_invocable: true` without being a command file, and
#                           a rule phrased around "command" would strand it unrouted.
#   intentionally_internal  MUST NOT appear in /aid-help output. Internal commands are
#                           still given a row, so the classification is explicit rather
#                           than an accidental omission. FOURTH REQUIREMENT: the command
#                           file must itself declare `user_invocable: false` — otherwise
#                           the enumerator sees the surface, the bijection reports it as
#                           shipped-but-not-indexed, and the row asserts something false
#                           about the product.
#   remove_or_deprecate     may appear in help with a deprecation note; takes no topic route.
#
# AUTHORITY OF THIS FILE vs. THE HELP PROSE (decided at P080 EPIC 2 Step 5).
#   This file is the AUTHORITY for the `writes` column. `commands/aid-help.md` restates
#   parts of it in prose (e.g. the "Creates: …" block under `### Topic: init`). That
#   prose is a HUMAN SUMMARY: it is NOT authoritative, and NOTHING CHECKS IT against
#   this file — `test-help-index-coverage.bats` asserts the column's presence and TYPE,
#   never its content against the prose. When the two disagree, THIS FILE WINS and the
#   prose is the thing to fix.
#   HONEST PROVENANCE: this divergence is not inherited housekeeping — Step 5 CREATED it.
#   Before this commit the filenames in the help prose and in this column matched.
#   The divergence is WIDER than "shape only", and the earlier wording here
#   understated it (CP3): besides the `creates:`/`mutates:` prefixes, this column now
#   carries TWO filenames the prose does not — the later writers found by the
#   mutation-shaped sweep. So the follow-up is not a cosmetic realignment; the two
#   statements differ in CONTENT as well as form. A regression this step introduced
#   knowingly, recorded at its real size rather than filed under pre-existing drift.
#   This is a written-down stopgap, not the intended end state. The intended end state is
#   to delete the duplication — have the help prose point here instead of restating the
#   list, so one copy cannot diverge from itself. That edit lands in `commands/aid-help.md`,
#   which is outside Step 5's allowed paths; see the plan's follow-up item.
#   Do NOT "fix" this by adding a naive prose-vs-index assertion to the bats suite: the
#   prose lists live inside code fences and that suite's helpers strip fenced content, so
#   such a check inspects nothing and passes green. Any real check must read fences on
#   purpose and compare file-to-index, not file-to-topic (`queue.yaml` is documented under
#   the `config` topic, not under `status`).
#
# ONE NAMED EXEMPTION: `/aid-help` carries `topic: none` though it is `update` — the
# router cannot route to itself. Step 2 encodes this by command name, not as a general
# loophole; any OTHER current/update row without a topic is a violation.
#
# THIS INDEX IS THE AUTHORITY: `commands/aid-help.md` is regenerated FROM it, never the
# other way round. A topic named here that does not exist there yet is a gap in the help
# file, and the coverage suite says so. Change a route here first, then make help match.
#
# ENUMERATION CONTRACT (what a surface is, mechanically):
#   1. Frontmatter scan of `plugins/aid-orchestrator/commands/*.md` — indexed iff
#      `user_invocable: true`. The flag value is the key: a future command with
#      `user_invocable: false` is indexed as `intentionally_internal`, never dropped.
#   2. The glob `plugins/aid-orchestrator/skills/*/SKILL.md`.
#   Flat `skills/*.md` files are NOT surfaces — they are agent-loaded reference
#   documents, and any `user_invocable` key on them is inert metadata. A skills
#   directory without SKILL.md (e.g. `skills/setup/`) is likewise not a surface.

# FINAL_TURN EVIDENCE (why each row carries the value it does — the prose half the
# suite cannot observe, kept next to the claim rather than in a commit message):
#   /aid-run     commands/aid-run.md sources aid-gate-outcome-summary.sh at the
#                GATES→DONE boundary and on the failing branch alike; the DONE card
#                below it is that renderer's output, not a hand-written summary.
#   /aid-plan    commands/aid-plan.md sources aid-plan-close-summary.sh at the
#                plan-final / close boundary — the last turn of a plan stream.
#   /aid-audit-tests  commands/aid-audit-tests.md finalizes through
#                lib/aid-test-audit-chat-summary.sh (via scripts/aid-audit-tests-finalize.sh).
#   /aid-do, /aid-verify-implementation  their own files name the Finished card.
#   /aid-verify-plan, /visual-companion  end on a PM choice (relay the verdict for
#                a go/no-go; per-question visual decision) → decision-required.
#   /aid-status  a read-only readout of work in flight → the progress/handoff card.
#   /aid-audit, /aid-init, /aid-setup, /aid-stop, /aid-help  no renderer exists;
#                each ends by reporting completed work or requested content → finished.
#                Any of these growing a deterministic renderer must move to `renderer:`.

surfaces:
  - { command: /aid-do, file: plugins/aid-orchestrator/commands/aid-do.md,
      purpose: "Fast Mode — implement small tasks with minimal overhead (<2 min)",
      topic: do, audience: beginner, disposition: current,
      writes: [], final_turn: "card:finished" }

  - { command: /aid-run, file: plugins/aid-orchestrator/commands/aid-run.md,
      purpose: "Execute EPIC pipeline — 6-state FSM with optional autonomous mode",
      topic: run, audience: beginner, disposition: current,
      writes: ["mutates:.aid-o/config/plugin.yaml"], final_turn: "renderer:scripts/lib/aid-gate-outcome-summary.sh" }

  - { command: /aid-status, file: plugins/aid-orchestrator/commands/aid-status.md,
      purpose: "Show EPIC status, queue, and pipeline overview",
      topic: status, audience: beginner, disposition: current,
      writes: ["creates:.aid-o/config/queue.yaml", "mutates:.aid-o/config/queue.yaml"], final_turn: "card:progress" }

  - { command: /aid-stop, file: plugins/aid-orchestrator/commands/aid-stop.md,
      purpose: "Emergency stop — disengage FIRST AID auto-mode immediately",
      topic: recovery, audience: regular, disposition: current,
      writes: [], final_turn: "card:finished" }

  - { command: /aid-audit, file: plugins/aid-orchestrator/commands/aid-audit.md,
      purpose: "Project health audit (0-100 score) across categories A–J",
      topic: audit, audience: power, disposition: current,
      writes: [], final_turn: "card:finished" }

  - { command: /aid-help, file: plugins/aid-orchestrator/commands/aid-help.md,
      purpose: "AID help with progressive disclosure (Level 0–3)",
      topic: none, audience: beginner, disposition: update,
      writes: [], final_turn: "card:finished" }

  - { command: /aid-init, file: plugins/aid-orchestrator/commands/aid-init.md,
      purpose: "Create or upgrade the .aid-o/ workspace (base manifest, idempotent)",
      topic: init, audience: beginner, disposition: update,
      writes: ["creates:.aid-o/config/project.yaml",
               "creates:.aid-o/config/permissions.yaml",
               "creates:.aid-o/config/execution.yaml",
               "creates:.aid-o/config/plugin.yaml",
               "creates:.aid-o/config/check-severity.yaml",
               "creates:.aid-o/config/test-audit.yaml",
               "creates:.aid-o/config/integrations.yaml",
               "mutates:.aid-o/config/execution.yaml"],
      final_turn: "card:finished" }

  - { command: /aid-setup, file: plugins/aid-orchestrator/commands/aid-setup.md,
      purpose: "Modular project configuration — permissions, integrations, CLAUDE.md, stack scan",
      topic: setup, audience: regular, disposition: update,
      writes: ["mutates:.aid-o/config/permissions.yaml",
               "mutates:.aid-o/config/integrations.yaml",
               "mutates:.aid-o/config/project.yaml",
               "creates:CLAUDE.md", "mutates:CLAUDE.md"],
      final_turn: "card:finished" }

  - { command: /aid-plan, file: plugins/aid-orchestrator/commands/aid-plan.md,
      purpose: "Plan a task — brainstorm, write plan, or generate EPIC (auto-detected or forced)",
      topic: plan, audience: regular, disposition: update,
      writes: [], final_turn: "renderer:scripts/lib/aid-plan-close-summary.sh" }

  - { command: /aid-verify-plan, file: plugins/aid-orchestrator/commands/aid-verify-plan.md,
      purpose: "Independent adversarial review of an implementation plan before it goes to execution",
      topic: plan-lifecycle, audience: power, disposition: current,
      writes: [], final_turn: "card:decision-required" }

  - { command: /aid-verify-implementation, file: plugins/aid-orchestrator/commands/aid-verify-implementation.md,
      purpose: "Independent adversarial DONE review of an implementation before it is trusted as complete",
      topic: plan-lifecycle, audience: power, disposition: current,
      writes: [], final_turn: "card:finished" }

  - { command: /aid-audit-tests, file: plugins/aid-orchestrator/commands/aid-audit-tests.md,
      purpose: "Test portfolio audit — inventory, safe measurement, and a plain-language recommendation",
      topic: tests, audience: power, disposition: current,
      writes: [], final_turn: "renderer:scripts/lib/aid-test-audit-chat-summary.sh" }

  - { command: /visual-companion, file: plugins/aid-orchestrator/skills/visual-companion/SKILL.md,
      purpose: "Browser-based visual brainstorming companion — interactive mockups, per-question visual/text decision",
      topic: plan, audience: power, disposition: current,
      writes: [], final_turn: "card:decision-required" }
