    status: active
    verdict: ALIGNED
    tier: t1
    enforcement_degree: 1
    not_guaranteed: "That a harness calls it at all. That is what the canary (hook_canary_verdict) answers, and until it does, no fail-closed rule in this registry is in force."
    description: "P086 Step 1 — the single entry point every AID harness hook goes through. A rule is a row in defaults/hook-registry.yaml: an event, an owner, a degree and a failure mode. Only `failure: closed` may stop a turn; a `failure: open` row that exits 2 is a misdeclaration, recorded and ignored. Per-rule clocks are capped to what is left of the whole-dispatch budget, an unreadable registry runs NO rule (never all of them), and the three escape hatches (AID_HOOKS_OFF, AID_HOOKS_OFF_RULES, disabled: true) are all audited."
    recovery: "AID_HOOKS_OFF_RULES=<id> switches one rule off; AID_HOOKS_OFF=1 is the emergency brake. Both are written to the audit trail in the session store with their reason."
