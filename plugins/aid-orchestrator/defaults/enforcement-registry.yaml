    not_guaranteed: "Only while the canary has verified this installation (fail-closed rows degrade to open without it) and never on a turn already continued by a hook (stop_hook_active). Only steps THIS session dispatched (contract newer than the transcript's first timestamp). A hand-over is recognised by the Decision and Blocked card labels; a turn that ends on prose in no card shape while a step is open is refused, which is the intent, but a turn that FAKES a Blocked card passes — the label is a shape, not a truth. Stop does not exist in Codex review modes and never arrives from a killed session; the FSM precondition (dispatch_contract_return) is the later catch."
    description: "P087 Step 5 — a turn may not end while a step this session dispatched under a contract has not been advanced. The refusal names the step and the transition to make (validate the return, commit, step-verify, increment-step) or the two explicit hand-overs (a Decision card, a Blocked card)."
    recovery: "Finish the step or hand over with a card; AID_HOOKS_OFF_RULES=turn_step_open is the audited escape."
    test: "scripts/tests/bats/test-hook-rules-turn.bats"

  - id: turn_write_scope
    type: 12
    source: "scripts/lib/aid-hook-rules-turn.sh (aid_hook_rule_turn_write_scope) + defaults/hook-registry.yaml (rule turn_write_scope) + hooks/hooks.json (PreToolUse)"
    instruction: "skills/pipeline.md (§4 Output verification)"
    severity: advisory
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    enforcement_degree: 3
    not_guaranteed: "Anything. This is DELIVERY, not a guard, and the plan's re-grounding says why: the catch sees Write/Edit and never a shell redirection (measured by the ecosystem sheet and by P086), so a rule that blocked here would be sold as protection with a hole the size of `bash`. It names the path and the allowed list before the edit lands, as context; what refuses is the contract validation at return time (dispatch_contract_return), which reads the disk."
    description: "P087 Step 5 — a Write/Edit that lands outside EVERY open step's allowed paths is named before it lands, with the path and each open step's list, as injected context under PreToolUse (owner any, so it reaches a role agent too). In a concurrent wave several steps are open at once and the hook cannot tell which agent is writing, so it judges against the union and the return validation of the right step settles it."
    recovery: "Nothing to recover; the notice is feedback. The return validation is the enforcement."
    test: "scripts/tests/bats/test-hook-rules-turn.bats"
    not_guaranteed: "that an out-of-scope write is PREVENTED — this rule names it before it lands and does not stop it; a shell redirection is not seen at all. The refusal happens at return time, in the dispatch contract, which compares the declared file list against the disk"


  - id: gate_script_in_tree
    type: 1
    source: "scripts/aid-run-gates.sh (_gate_scripts_missing_in_tree, reason gate_script_missing_in_tree)"
    instruction: "n/a"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t0
    enforcement_degree: 1
    not_guaranteed: "Configuration from the branch — deliberately, see gate_config_from_branch: execution.yaml stays at the state root because `.aid-o/` never reaches a worktree and configuration read out of a working tree would let a downloaded repository run code (agent-hooks rule 3). Also not judged: absolute paths and {plugin_path} scripts (the installed plugin's business), and a script named indirectly (through another script, a Makefile target, an env variable)."
    description: "P087 Step 6 (narrowed, PM proxy decision 2026-08-25) — every repo-relative script a gate command names must exist in the tree the gate runs in, the candidate branch. A missing one fails the gate BY NAME, with the tree, and there is no fallback to the primary checkout's copy: a gate that ran main's script would certify a branch that does not carry it (IMP-497's drift, one level down)."
