    description: "P074 Step 16 — the audited recovery for an incomplete transaction whose plan changed underneath it, kept as a SEPARATE deliberate invocation rather than an automatic behaviour of the pipeline. It archives the transaction/authority PAIR to `.superseded-<epoch>` siblings with a forensic record plus timeline and audit-log entries, and it DELETES NOTHING — cleanup of already-generated EPICs and queue entries stays with plan-rollback and queue removal, where it is visible. Refuses: a reason under 20 characters, a --plan naming a different plan than the transaction records, a missing transaction, and a COMPLETE transaction (which rolls over automatically instead). A half-archived pair from an interrupted run is completed under the ORIGINAL epoch rather than re-archived under a new one — and that recovery path writes the SAME three records, idempotently, so a retry can never produce an unaudited supersession (whole-diff review, BLOCKER 2). The whole invocation runs under the SAME per-plan generation lock the pipeline takes (BLOCKER 1): archiving is a mutation of exactly the state that lock protects, so a held lock refuses by name with the holder pid and archives nothing, instead of renaming a running generation's live transaction out from under it. Because the audit trail IS this mechanism's enforcement surface, the three records are fail-closed and verified by reading them back, and the sinks are probed BEFORE anything is renamed (two of the three are append-only, so a refusal has to happen while nothing has moved) — no path prints an audit-record path it did not verify. Every verification is keyed on plan_id AND epoch AND event and PARSES each line rather than pattern-matching it: the audit log is cross-plan and the epoch is second-resolution, so an epoch-only key let one plan's entry satisfy another's check and skip its own append."
