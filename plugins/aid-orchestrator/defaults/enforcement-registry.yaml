    status: active
    description: "P061 E2 Step 2 (\"Step 8\"): D4 — a high-risk changed path (aid-fsm.sh, aid-run-gates.sh, aid-release-policy.sh, aid-evidence-verify.sh, defaults/schemas/*, defaults/policies/*, agents/*.md) upgrades the REQUIRED gate profile for this EPIC's diff, and the GATES:DONE precondition VERIFIES AND ENFORCES that floor, not just recommends it (AID-v3-principles.md §1 — Detector without Enforcement is Decoration, the P026/WAN anchor). check_preconditions recomputes the risk-required profile at transition time (via the Step 1 shared resolver, gate_profile_resolve, against this run's actual base_commit..HEAD diff) — it does NOT trust advance-to-gates' earlier auto-resolve suggestion, because gates could have been re-run manually with a weaker --profile afterward. Two blocking outcomes: (1) Compares ranks via gate_profile_rank; active < required refuses the transition with reason risk_profile_below_required (e.g. active='quick' < required='full'). (2) If active profile name is unrecognized (not in the canonical 5: quick/targeted/standard/full/release) and required is high-risk (> quick), refuses the transition with reason risk_profile_unresolvable — fail-closed, because we cannot verify the active profile meets the requirement (E-061-2_6 Step 2 fix). A missing gates_report.json.profile field (no --profile ever used — legacy execution.yaml without gate_profiles, D9) is a no-op, matching pre-P061 behavior exactly. advance-to-gates itself auto-resolves and passes --profile <resolved> to aid-run-gates.sh, but ONLY when the resolved name is an actual key under execution.yaml.gate_profiles (same D9 legacy guard) — an explicit --profile from advance-to-gates' own caller always wins over auto-resolve. --force + reason>=20 chars remains the only override, same as sibling GATES:DONE checks"
