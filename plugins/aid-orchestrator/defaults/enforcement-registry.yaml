    description: "TRANSITION half — BUILT AND TESTED, NOT YET WIRED. queue_set_status validates against the seven-value enum (exit 2, nothing written, for anything else — including the read-only legacy `queued`/`completed`), refuses to leave a terminal status, and rejects a `reason` outside its charset allowlist; queue_claim_next performs read-and-claim inside ONE hold of <queue>.lock so two concurrent callers cannot both win an entry, and records a durable blocked reason or reports rc 3. As of this row's creation these three functions have ZERO production callers outside the library, its own CLI and the bats suite — every non-`queued` status in the live queue still got there by hand, which is the very failure this is meant to abolish. Recorded `planned` rather than `active` so the registry does not overclaim: promotion to active requires aid-plan-fsm.sh's epic-start / epic-merge-to-plan / plan-merge-to-main to drive them (E-064-2_2 Step 4, else P068). Deadline aligned with the rest of the plan-boundary cohort."
    test: "scripts/tests/bats/test-aid-plan-release-boundary.bats"

