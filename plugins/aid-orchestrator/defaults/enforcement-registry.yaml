  - id: plan_ceremony_band
    type: 4
    source: "scripts/lib/aid-plan-band.sh (aid_plan_band) + scripts/aid-cp1-gate.sh (Step 2/2b)"
    instruction: "commands/aid-plan.md (CP1 Mode Selection — Band classification)"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t0
    description: "P084 Step 1-2 — the CP1 gate no longer decides ceremony by grepping the whole plan document (measured 2026-08-16: 5-33 pattern hits on each of six live plans, so every plan was high-risk and the ceremony was proportional to nothing). It classifies a BAND (full|medium|light) from the paths the plan's steps declare in their **Files:** blocks, read with the shared parser (lib/aid-scoping.sh) against the curated map defaults/policies/risk-paths.yaml, and reads what that band OWES from defaults/policies/review-checkpoints.yaml -> review_checkpoints.ceremony_bands. Release/ceremony files (CHANGELOG.md, README.md, marketplace.json, plugin.json) are excluded before matching, because a file present in every plan is not a signal of reach. Frontmatter `risk: high` raises a band and nothing lowers one except changing the declared paths. Every uncertainty resolves to `full`: no declared path (no_files_declared), no map (no_risk_map), an unparseable map (unreadable_risk_map), no yq (no_yq), an unknown band in the table. There is deliberately NO prose-guessing fallback — the scan this replaced answers `light` for a plan that declares aid-run-gates.sh but says nothing alarming, which is the one direction that must never happen."
    recovery: "The gate names the band and the reason on stderr (band=<b> (<reason>)). To raise a band, set `risk: high` in the plan frontmatter; to lower one, change what the plan declares it will touch. A project may ship its own map at .aid-o/config/policies/risk-paths.yaml."
    test: "scripts/tests/bats/test-cp1-gate-risk.bats"

  - id: plan_band_obligations
    type: 4
    source: "scripts/aid-plan-lint.sh (_plan_band + _missing_step_fields)"
    instruction: "skills/plan-writing.md (Obligations by ceremony band)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t2
    description: "P084 Step 3 — the per-step fields a plan owes now follow its band. `full` and `medium` owe **Architecture Context**, **Error Handling** and **Edge Cases** per step; `light` owes none of them, and a light plan that omits all three is complete. The rule is enforced where the plan is checked (aid-plan-lint.sh, reached by generation through aid-generation-readiness.sh), on the SAME classification the gate uses — the lint sources lib/aid-plan-band.sh rather than shelling out to the gate, because 'the CP1 gate is consulted exactly once per plan' is an invariant the generation suites assert by counting gate invocations. A bare `**Field:**` label with nothing after it does not satisfy the obligation. STRICT tier: blocking for a lifecycle_strict plan, a loud advisory for a legacy one."
    recovery: "The finding names the step's line, its heading and which fields are missing. Add the fields, or lower the band by changing what the plan declares it touches."
    test: "scripts/tests/bats/test-plan-writing-rules.bats"

  - id: plan_reuse_evidence
    type: 4
    source: "scripts/aid-plan-lint.sh (Reuse evidence pass) + scripts/lib/aid-reuse-verdict.sh"
    instruction: "skills/plan-writing.md (Reuse-check grammar)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    description: "P085 Steps 1-2 — a step that founds something new (any `Create:` bullet in its Files block) owes a **Reuse check:** field: the read-only search it ran and which of four results it got (none / one match / several matching / several conflicting). The field is REPLAYED, not read — the lint re-runs the declared command from the project root and compares the hit count with the claim, so `none` over a command that finds something today is a blocking finding, and a command that no longer runs is refused as stale evidence. Only grep/rg/ls/find/git grep run, and nothing that pipes, redirects or chains: the replay is the one place a plan's own text becomes something the lint executes. The obligation holds in EVERY band including `light`, because founding a duplicate component is exactly what a small plan does and the price is one command, not a dispatch. STRICT tier: blocking for a lifecycle_strict plan, a loud advisory for a legacy one."
    limits: "The replay proves the declared result matches what the command returns — NOT that the search was wide enough. A narrowly aimed grep with an honest `none` passes here; width is judged by the `reuse_evidence` C0 lens, and only in the `full` band. A result other than `none` additionally owes a stated reason why what exists does not suffice (the machine grades SUBSTANCE, not the connective: demanding the word `because` would grade grammar rather than reasoning), and whether that reason is a good one is again the lens's call. The four results are not turned into hard verdicts on the step's verb — `one match` alongside a `Create:` is the normal shape of reusing a helper INSIDE a new file, and refusing it would fire on correct input."
    runtime_check: "Post-generation: none needed — the obligation is about the PLAN text, which is frozen once generation reads it. Development runtime: the lint runs again inside aid-generation-readiness.sh, so a plan edited after CP1 is re-checked before EPICs are cut."
    recovery: "The finding names the step's line and heading. Run the search again, write the command and the result it actually returns, and say why what exists does not suffice."
    test: "scripts/tests/bats/test-plan-reuse-check.bats"

  - id: plan_standards_named
    type: 4
    source: "scripts/aid-plan-lint.sh (Standards named against the map) + scripts/lib/aid-standards-map.sh + the map's own `tag_paths` block"
    instruction: "skills/plan-writing.md (Obligations by ceremony band) + commands/aid-init.md (Where the standards map lives)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    description: "P085 Step 4 — a `full` or `medium` plan names the ecosystem standards binding the areas its declared paths reach, or says where it departs from one and why. The binding is derived from the LIVE map (/ecosystem/specs/standards-map, path in project.yaml -> standards.map_path), never from a copy in this repo. PER TAG, not per standard: the map's tags are areas and one area carries several standards, so the plan names at least one standard from each area it reaches. Three states, deliberately: no map configured = the project has no standards and owes nothing (recorded by the lint, so the silence does not read as an omission); a map configured but unreadable, unparseable, or with no yq = a broken environment, reported loudly and blocking for a strict plan; a map that binds nothing to these paths = no section owed. A tag missing from the map's own vocabulary is a defect OF THE MAP: reported, never blocking."
    limits: "What binds is derived PER TAG, and a tag that cannot be told from a path (governance, produkt, llm-naklady, paralelni-zpracovani) carries no patterns in the map and is never asked — a wrong obligation costs more than a missing one. The patterns themselves live in the MAP (`tag_paths`), not in this reader, so a project with its own map is judged by its own layout; a map configured WITHOUT `tag_paths`, or declaring a schema_version this reader does not know, is refused as a broken configuration rather than read as `no standards`."
    runtime_check: "Post-generation: none — the obligation is about plan text, frozen once generation reads it. Development runtime: `aid-standards-map.sh --self-test` re-checks that the derivation still agrees with the live map for three control paths, because the map is edited by people who never run AID. It has a caller: test-standards-map.bats runs it and SKIPS when no map is reachable, so an unreachable foreign document never fails a contributor's suite while a real derivation drift does."
    recovery: "The finding names the area and lists the standards carrying it. Name the one you checked in the `## Standards` section, or state the deviation WITH its reason."
    test: "scripts/tests/bats/test-standards-map.bats"

  - id: plan_parallel_group_disjoint
    type: 4
    source: "scripts/aid-plan-parallel-check.sh (called by scripts/aid-generation-readiness.sh)"
    instruction: "skills/plan-writing.md (Declaring what can run at the same time)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    description: "P085 Step 7 — each step declares a **Parallel group** (a wave name, or `---` for a step that runs alone), and two steps in the SAME wave must not name the same file. `Parallel Group` has existed in the EPIC table since P039 and aid-epic-to-json.sh writes it into plan.json, but nothing ever produced a value and nothing ever checked one; this is the producer's other half. Required in `full` and `medium`, where concurrency is declared deliberately; in `light` an absent field defaults to `---`. Two severities, the same two-stage model the Files grammar has: advisory while writing (--advisory), blocking inside aid-generation-readiness.sh, which is the last point before the plan becomes EPICs."
    limits: "The check VERIFIES a schedule and does not produce one — the plan computes its waves by hand. Since P087 Step 3 it judges two dimensions: shared files AND shared declared interfaces (`**Shared interfaces:**`, optional, absent = none). What it cannot see is a shared EFFECT nobody declared: disjoint files and disjoint declared interfaces do not guarantee disjoint impact, and such a collision can merge cleanly — nothing in this row or in parallel_dispatch_wave_check detects it; CP3 and the gates are where it surfaces."
    runtime_check: "Post-generation: the disjointness is a property of the SOURCE plan, and the generated plan.json inherits the groups verbatim (aid-epic-to-json.sh). Development runtime (P087 Step 4): the dispatcher IS the runtime consumer — aid_parallel_decide runs this check with --group over the plan as it is at dispatch time, and a wave that fails it runs in sequence with the reason recorded (row parallel_dispatch_wave_check)."
    recovery: "The finding names both steps and every shared path. Move one step to another wave, or mark it `---`."
    test: "scripts/tests/bats/test-plan-parallel-check.bats"

  - id: plan_documentation_step_required
    type: 4
    source: "scripts/aid-plan-lint.sh (Documentation and help)"
    instruction: "skills/plan-writing.md (Documentation, help and screenshots) + commands/aid-init.md (What the project has to document with) + skills/setup/project-scan.md"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t2
    description: "P085 Step 6 — a `full` or `medium` plan that changes behaviour a user meets must declare a path under the project's in-app help or documentation site, in a Files bullet like any other work: the file and the section, not the sentence 'update the documentation'. What the project HAS is recorded once by /aid-init or /aid-setup in project.yaml -> documentation.{in_app_help,docusaurus,screenshot_tool}; the plan reads the answer rather than rediscovering it. A project with neither surface owes nothing and the lint records that it asked nothing; a project with one owes only that half."
    limits: "The check grades the PATH, not the prose: a step declaring `docs/foo.md` satisfies it even if the sentence about what changes there is thin. Naming the file is the half a machine can hold; whether the section text is right is a review question. 'Changes behaviour a user meets' is read from the plan's own frontmatter `type:` — refactor and docs are exempt by definition. A proxy, deliberately: the alternative is a regex guessing at intent. A plan that changes behaviour and writes `type: refactor` defeats the check, and does so in a field a reviewer can see. The screenshot tool is documented, never enforced: blocking a plan for a missing tool would block acquiring it."
    runtime_check: "Post-generation: none — the obligation is about plan text. Development runtime: none. Whether the documentation the plan PROMISED was actually written is a DONE-boundary question about the diff, not a plan-time one, and it has no owner yet; recorded here so the gap is visible rather than assumed covered."
    recovery: "The finding lists the surfaces this project has. Add a step naming the file and section, or state honestly that the plan changes nothing user-visible by setting `type: refactor`."
    test: "scripts/tests/bats/test-plan-writing-rules.bats"

  - id: plan_summary_reuse_and_standards
    type: 11
    source: "scripts/lib/aid-plan-summary.sh (_aps_standards + _aps_reuse)"
    instruction: "commands/aid-plan.md (Mode: Write Plan)"
    severity: advisory
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    description: "P085 Step 8 — the PM page rendered from a new plan carries two more counted facts: the standards the plan NAMES, and how many of its founding steps carry a reuse search (evidenced/founding, per step). Both are read out of the plan, never asserted, and both rows are ABSENT rather than empty when there is nothing to say. They sit above `roles` and `status` because the renderer caps the list at five items and an appended row would never be shown."
    runtime_check: "Post-generation: none — the page is a plan-time artifact. Development runtime: none. It is advisory because publishing the page is an instruction to the session (see plan_summary_page_rendered), and a row on a page nobody is forced to render inherits that strength."
    test: "scripts/tests/bats/test-aid-plan-summary.bats"

  - id: plan_testing_strategy_required
    type: 4
    source: "scripts/aid-plan-lint.sh (_has_testing_strategy)"
    instruction: "skills/plan-writing.md (Tests are designed, not counted)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t2
    description: "P084 Step 4 — the obligation 'a Test: bullet in every step' is retired and replaced by one `## Testing Strategy` section with content, answering which behaviour the plan verifies, why that one, and where the verification goes. Counting test items measured coverage by step count rather than by behaviour at risk (six live plans ran at ~1:1 whatever they changed). A heading alone is not a strategy: a section whose only content is a sub-heading is refused. Unchanged, deliberately: a Test: bullet naming a suite that does not exist yet still MUST declare its tier (aid-plan-to-epic.sh), because making tests optional and letting untiered suites in are two different things."
    recovery: "The finding names the plan. Add a `## Testing Strategy` section with at least one content line; 'no new verification, reason: ...' is a valid answer for a plan that changes no behaviour."
    test: "scripts/tests/bats/test-plan-tier-declaration.bats"

  - id: plan_human_sections_reported
    type: 4
    source: "scripts/aid-plan-lint.sh (_AID_HUMAN_SECTIONS)"
    instruction: "skills/plan-writing.md (MUST rule 17)"
    severity: blocking
    surface: llm-facing
    status: active
