    type: 1
    source: "scripts/lib/aid-dispatch-contract.sh (aid_dispatch_contract_commit) + scripts/aid-fsm.sh (cmd_step_evidence_dir)"
    instruction: "skills/pipeline.md (§4 Per-step commit + Parallel groups) + commands/aid-run.md (rules 15-16)"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t0
    enforcement_degree: 2
    description: "P087 Step 2 — one step, one evidence subdirectory (`steps/<step_id>/`, resolved at the state root), one commit made by the controller after the return is accepted, returns taken one at a time in arrival order. The commit function validates first and refuses a rejected return; an agent that changed nothing produces no commit."
    not_guaranteed: "That the controller CALLS the function: it is a library the pipeline instructs the controller to use, and the FSM precondition (dispatch_contract_return) is what makes skipping it visible — a step cannot advance on an unvalidated return, but a validated return committed by hand in one big commit is not detected here."
    recovery: "Nothing to recover; a refused commit names the reasons. A mega-commit made by hand is a review finding."
    test: "scripts/tests/bats/test-parallel-evidence.bats"

  - id: parallel_dispatch_wave_check
    type: 9
    source: "scripts/lib/aid-parallel-dispatch.sh (aid_parallel_decide, aid_parallel_step_worktree, aid_parallel_step_reset, aid_parallel_merge) + scripts/aid-plan-parallel-check.sh (--group) + defaults/orchestration.yaml (dispatch.max_parallel, dispatch.strategy, dispatch.worktree_base)"
    instruction: "skills/pipeline.md (§4 Parallel groups, §10)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    enforcement_degree: 2
    description: "P087 Steps 3-4 — the brake is lifted. Before a wave the controller asks code: `concurrent slots=N` only when max_parallel > 1, strategy is worktrees, git hands out worktrees and the wave (this wave, --group) is disjoint in files and declared interfaces; anything else is `serial: <reason>`, never a refusal. Each step runs in its own worktree on step/<step_id> at the current base (a leftover branch is reset, never reused); returns are merged one at a time; a conflict is aborted, the tree left untouched, the step's tree reset onto the new base and the step repeated."
    not_guaranteed: "KNOWN BOUNDARY: disjoint paths and disjoint declared interfaces do NOT guarantee disjoint effect — two steps can change the same behaviour through different files and undeclared interfaces, and git will merge them cleanly. Isolation turns a collision into a merge conflict, never into a corrupted tree; it does not turn an undeclared semantic collision into anything at all. That residue belongs to CP3 and the gates. Also not guaranteed: slot enforcement — `slots=N` is a number the controller is told, the library does not count agents in flight. And the CALL itself: no FSM precondition forces the controller to ask `aid_parallel_decide` before a wave — the decision is by code once asked, the asking is an instruction (pipeline.md §4), and a controller that dispatches a wave without asking is not detected here; what it gets is the same merge-conflict-and-retry path, because the isolation does not depend on the decision."
    recovery: "A conflict names the files; reset the step (aid_parallel_step_reset) and dispatch it again. Two failures of the same step go to defaults/policies/auto-recovery.yaml. A dirty step tree is kept and named, never removed."
    test: "scripts/tests/bats/test-parallel-dispatch.bats + scripts/tests/bats/test-plan-parallel-check.bats"

