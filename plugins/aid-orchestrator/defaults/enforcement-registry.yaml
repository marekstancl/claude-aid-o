  - id: ui_proposal_basis
    type: 1
    source: "scripts/lib/aid-ui-proposal.sh (aid_ui_proposal_build, aid_ui_proposal_check)"
    instruction: "skills/visual-companion/SKILL.md (A Proposal Is Built From the Application)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    enforcement_degree: 2
    not_guaranteed: "That the proposal drawn ON the basis is good, or that the two models' proposals differ usefully — the basis is built by code, the drawing is still a model's. That the skill is followed: a session can draw from memory and never call the library; what catches that is the PM seeing no proposal.json and no `marked` line, which is exactly the situation this exists to make visible. That fixture data is REALISTIC — only that it is a fixture."
    description: "P087 Step 8 — a UI proposal's basis is either the application's real screen (captured with the regression tool, per viewport, on FIXTURE data — a capture without a fixture file never happens, so production data is never photographed) or the application's own design system inventoried from the tree, and the proposal is MARKED as such; it never claims a screenshot it does not have. Both models get the same brief (lib/aid-brainstorm-opponent.sh), the PM decides."
    recovery: "A failed capture names the viewport; a marked proposal says why it has no live basis."
    test: "scripts/tests/bats/test-ui-proposal.bats"

  - id: ui_responsive_viewports
    type: 1
    source: "scripts/lib/aid-ui-proposal.sh (aid_ui_proposal_viewports, aid_ui_proposal_check)"
    instruction: "commands/aid-init.md (Whether the UI is responsive) + skills/setup/project-scan.md + skills/plan-writing.md (UI Change Contract, viewports)"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    tier: t0
    enforcement_degree: 2
    not_guaranteed: "Coverage of anything beyond the two minimum viewports (desktop 1280×720, mobile 390×844); tablets are the plan's to add. That `ui.responsive` is TRUE of the product — it is a declared fact, default true, and a project that sets false to dodge the mobile shot has lied in a field a reviewer can read. The `viewports` token of the UI Change Contract is NOT carried into plan.json by the generators (they keep path | sha256 | schema_version) — the controller reads it from the plan text, and the EXECUTE-phase capture per viewport is instructed, not gated; the gate is aid_ui_proposal_check on the proposal."
    description: "P087 Step 9 — responsiveness is a fact of the project (`ui.responsive`, default true), read once: a responsive project owes desktop AND mobile in every UI proposal and check, `false` owes desktop alone, a project without UI is not asked. A missing viewport stops the build or fails the check naming that viewport."
    recovery: "Capture the named viewport, or set ui.responsive: false deliberately for a desktop-only product."
    test: "scripts/tests/bats/test-ui-proposal.bats"
