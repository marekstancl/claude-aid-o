    description: "P076 Step 5 — `aid-fsm.sh resume <epic>` claims the continuation artifact EXACTLY ONCE and only then consumes the job's terminal result, so two racing resumes cannot both record a row for the same job. The primitive is the one the shipped pm-override path already uses, not a second implementation: `mv -n` with a mandatory source-gone post-check, because on the installed coreutils a SKIPPED `mv -n` still exits 0 — the check is the enforcement, not the mv. Every loser prints the WINNER's claim file, so a race names who took it instead of failing anonymously. SINGLE-WRITER: a status look at a still-live job claims nothing and leaves the artifact byte-identical; only the terminal-collect path claims."
    recovery: "A losing resume exits 0 and names the winner's `.claimed-<epoch>` file; nothing is left half-consumed."
