  - id: gate_timeout_policy_block
    type: 1
    source: "scripts/aid-fsm.sh (grep: 'timeout_policy_block' inside check_preconditions GATES:EXECUTE)"
    instruction: "scripts/lib/aid-gate-runtime-baseline.sh (grep: 'gate_baseline_policy_check|gate_baseline_mark_policy_block') producer"
    severity: blocking
    surface: "GATES:EXECUTE precondition"
    status: active
    description: "P063 Step 3: closes the gap between aid-run-gates.sh's retry loop detecting a repeated-timeout streak (Step 1's gate_baseline_policy_check — block iff the last 3 recorded samples for a gate are ALL censored/timeout AND each sample's OWN recorded timeout_seconds >= the currently-configured value) and that verdict actually changing orchestrator behavior. When the retry loop hits 'block' it calls gate_baseline_mark_policy_block (sets gates_report.json.gates.<gate>.runtime_baseline.retryable:false + operator_action + policy_result:timeout_policy_block) and stops retrying instead of consuming another attempt (result stays the unchanged literal 'fail'; reason:timeout_policy_block + recommendation:increase_timeout_or_background are additive). Without THIS precondition that verdict was only a report field nobody reads before the orchestrator naturally re-enters GATES:EXECUTE for the gate-fixer retry cycle (AID-v3-principles.md §1 — Detector without Enforcement is Decoration, the P026/WAN anchor). check_preconditions now reads gates_report.json at GATES:EXECUTE and refuses the transition (naming the specific blocking gate + its operator_action) whenever ANY gate has runtime_baseline.retryable==false — required-ness is irrelevant (gate-fixer has nothing to act on either way). A gate whose CURRENT attempt just passed is never affected (gate_baseline_update never re-arms retryable:true itself; only a fresh mark_policy_block or gate_baseline's own reset-on-fingerprint-change path clears it). Same override convention as every sibling precondition: --force --reason '<>=20 chars>', audited via fsm_force_override/waiver."
    test: "scripts/tests/bats/test-aid-fsm.bats (grep: 'AC11'), scripts/tests/bats/test-aid-run-gates.bats (grep: 'AC6|AC10')"
