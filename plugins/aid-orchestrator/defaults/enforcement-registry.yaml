    tier: t2
    description: "P080 Step 13 — the rule that turns the FSM's 0-based current_step into a human 'Plan Step N of T' existed as six full prose copies across five files, and P076 had already shown them drifting. skills/pipeline.md now holds the ONLY full definition; the other five sites carry a one-line reference. The regression asserts the single-authority shape itself: exactly one file may carry the full rule, all five must carry the reference, and no seam may emit the pre-P080 wording. The human form is APPENDED after the machine values, so every machine-parsed seam is byte-unchanged — verify-state's JSON, the status=advanced stdout line the controller parses, the CP2 verdict JSON, and every step-N-verify.md binding diagnostic, which deliberately keeps speaking 0-based because that is the evidence filename an operator must create. TIER: t2 — NIGHTLY-ONLY. This row is advisory and off the merge path; it is a drift detector, not a merge blocker, and it is registered saying so."
