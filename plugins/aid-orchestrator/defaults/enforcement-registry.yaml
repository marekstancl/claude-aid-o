#
# TTL fields (optional per row — only meaningful on status: planned rows):
#   deadline       ISO 8601 date (YYYY-MM-DD). When today >= deadline and no
#                  valid deferred_until, aid-registry-ttl-guard.sh exits 1.
#   deferred_until ISO 8601 date (YYYY-MM-DD). If present and today <
#                  deferred_until the row is NOT stale regardless of deadline.
#   deferred_by    Free text; author of deferral decision (informational).
#   deferred_reason Free text; why this was deferred (informational).
#
# Coverage: E01–E86 carry full Phase-2 verdicts + evidence.
# E87–E177 carry a convention-derived instruction home + verdict: unmapped
# (a Phase-2 extension is the backfill task).
