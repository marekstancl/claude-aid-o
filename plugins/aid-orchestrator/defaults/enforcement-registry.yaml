  - id: epic_supersede_bound_reinit
    type: 1
    source: "scripts/aid-plan-fsm.sh:_pfsm_plan_state_supersede (producer); scripts/aid-fsm.sh cmd_init (the narrow supersede exception to the unconditional duplicate-init rejection)"
    instruction: "docs/extending-aid.md — PM force backdoor and lifecycle preflights (P073)"
    severity: blocking
