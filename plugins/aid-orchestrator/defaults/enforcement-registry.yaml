    status: active
    verdict: ALIGNED
    description: "P073 Step 13 — a PM-audited transaction that retires a stale EPIC FSM run and authorises exactly ONE re-initialisation. `aid-fsm.sh init` rejects a duplicate init unconditionally, which is correct — silently re-initialising over a live run loses its history — but it left a PM whose run went stale with no supported way forward except hand-deleting state, the unaudited surgery this plan exists to replace. `plan-state --supersede-epic` archives the state file to `.superseded-<epoch>` and writes a record binding FIVE fields: plan_id, epic_id, the run directory the archive sits in, the archived file's content hash, and the hash of the plan.json the re-init must present. Init re-derives all five from disk rather than trusting the record, so a stale record (a second supersede leaving the first lying around), a forged one, or one written for a different package authorises nothing and the unconditional rejection simply stands. Consumption renames the record to `.consumed-<epoch>`, so one PM decision authorises one init and never a second. The record is written BEFORE the archive: a record with no archive authorises nothing, while an archive with no record would strand the run. Evidence ARTIFACTS are never touched; the state file is archived in place beside them, never removed. The record is VERIFIED before the remaining init gates run but CONSUMED only once the new state file exists, so a later gate failure cannot burn the PM's one authorisation. Deliberately NOT forceable — this IS the audited transaction a force would otherwise be used to fake, and a forceable repair tool could fabricate the very records other commands trust."
    recovery: "The refusal names which binding failed. Re-run 'aid-plan-fsm.sh plan-state <plan_id> --supersede-epic <epic_id> --reason ...' against the CURRENT package; the record binds one exact transition by design."
