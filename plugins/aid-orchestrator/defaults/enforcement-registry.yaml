    description: "IMP-270: a gate-scoped PM waiver authorizes exactly ONE failed gate's result to be reported as `waived` (NEVER `pass`) for one exact (project, epic, run, HEAD, gate id, command fingerprint) tuple — unlike --force, which skips EVERY precondition of a transition. aid-gate-waiver.sh issue writes a single-use waiver bound by head_sha + command_sha256 (sha256 of the gate's execution.yaml command) with a deterministic payload_sha256 self-hash over the 13 bound fields (excluding the hash field and the mutable consumed block); check emits one verdict (valid|missing|expired|consumed|head_mismatch|command_mismatch|forged, forged also covering a genuine-but-out-of-context/cross-run copy) and exits 0 only on valid; consume atomically marks it consumed (flock + mktemp+mv) and idempotently returns already_consumed on replay. TWO enforcement teeth: (1) aid-run-gates.sh only turns a failing gate into result:waived (+ waiver_ref, recorded in top-level waived_gates[]) when check returns valid at the current HEAD+command, then consumes it — a waiver file alone changes nothing and a rejected waiver leaves result:fail + waiver_rejected:<verdict>; (2) the FSM GATES:DONE precondition re-validates EVERY waived row at read time against the report's own revision.head_sha and requires a non-empty waiver_ref — it never trusts a bare result:waived on the report's word (defense in depth against a forged report), failing closed with waived_row_no_ref or waiver_revalidation_failed. Fail-closed hardening (PM review 2026-07-24): when a report declares any waived gate but its .revision.head_sha is missing or not a 40-hex sha, the FSM fails closed immediately (waiver_report_head_missing) BEFORE delegating to aid-gate-waiver.sh — closing the gap where an empty report HEAD was passed as --head and the tool fell back to the CURRENT HEAD, silently validating the waiver against whatever was checked out instead of the report's reviewed revision. All unrelated gates and every OTHER FSM precondition (plan-gate floor, risk profile, cp3 freshness) stay fully enforced; --force is unchanged and remains the only path for genuinely non-gate preconditions. AID-v3-principles.md §1 — the detector (waiver file) is inert without the two enforcement teeth."
