  # ── P087 — concurrent agents, the four missing hook rules, credible UI proposals ──
  - id: dispatch_contract_return
    type: 1
    source: "scripts/lib/aid-dispatch-contract.sh (aid_dispatch_contract_validate) + scripts/aid-fsm.sh (cmd_increment_step, contract_return_missing / contract_return_rejected)"
    instruction: "skills/pipeline.md (§4 Step dispatch + Output verification)"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t0
    enforcement_degree: 2
    description: "P087 Step 1 — every dispatched step gets a PACKET built by code from plan.json (objective, allowed paths, dependencies, expected artifacts, acceptance criteria, UI contract, its own evidence dir) with a VERSION; the agent returns an `aid-return` block. The return is judged against the packet AND the disk: the version must match, every promised artifact must exist, every file git sees changed must be declared, every file outside the allowed paths is named, evidence in another step's directory is refused. increment-step re-runs the validation and will not advance a contracted step without an accepted return."
    not_guaranteed: "That the agent did the RIGHT thing inside the allowed paths — the contract proves receipt, scope and artifacts, not correctness; CP2 and the gates own that. The disk check has no baseline: a tree that was already dirty before dispatch is a rejection naming those files, not a pass — a step is dispatched from a clean tree (the FSM's dirty-tree guards, the per-step worktrees), and the reason says so. A step that declares no paths owes no contract (a plan decision), so a pure-analysis step is verified by its step-verify file alone."
    recovery: "Re-dispatch the step with the current packet; the report names every missing artifact, undeclared change and out-of-scope path."
    test: "scripts/tests/bats/test-dispatch-contract.bats + scripts/tests/bats/test-parallel-evidence.bats"

