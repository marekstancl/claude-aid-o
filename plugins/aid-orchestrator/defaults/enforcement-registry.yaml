  # ── P064 E-064-2_2 Step 2 (plan Step 7): plan-aware queue ──────────────────
  # THREE rows, deliberately split by what is actually WIRED today (CP2
  # finding 6, and AID-v3-principles.md §1 "Detector without Enforcement is
  # Decoration"): the READER half runs on every dependency check, the APPEND
  # half runs on every `aid-queue-add.sh`, and the TRANSITION half
  # (queue_set_status / queue_set_plan / queue_claim_next) has no production
  # caller yet — it must not be recorded as active enforcement until it does.
  - id: plan_branch_merge_target
    type: 1
    source: "scripts/aid-fsm.sh (grep: '_queue_entry_merge_target')"
    instruction: n/a
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    description: "READER half — wired: aid-fsm.sh `queue-revalidate` / `init` run it on every dependency check. Dependency readiness resolves ancestry against the ref the dependency's queue entry DECLARES in merge_target (plan/<plan_id> while its plan is open, the target branch once released) instead of _queue_merge_target()'s main|master|HEAD guess, which reported an EPIC merged into plan/Pxxx but not yet released as blocked forever. For an entry that carries a merge_target the evidence-based fallback chain is UNAVAILABLE: queue `status: completed`, an evidence `state: DONE` and the merge-log grep are all claims ABOUT a merge rather than the merge itself, and `completed` in particular has only ever been written by hand — a queue entry is a derived view, never evidence. A deleted task branch therefore yields `blocked` (reason no_ancestry_proof), and a declared merge_target that does not resolve yields fail-loud `failed` (reason merge_target_missing) rather than a comfortable blocked. Entries with no merge_target keep the pre-P064 behaviour byte for byte. Branch resolution (_resolve_dep_branch) is a CONTRACT TWIN of lib/aid-queue-write.sh:_queue_resolve_dep_branch — both halves must answer the same question the same way, or a dependent is unclaimable through the queue while the FSM reports it ready. The ref-charset half of that twin is now ONE predicate whose authority is `git check-ref-format` (aid-fsm.sh:_dep_valid_branch_ref == aid-queue-write.sh:_queue_valid_branch_ref, plus a leading-`-` and quote/control-character refusal): a hand-rolled regex on the writer with NOTHING on the reader made the two halves give opposite answers for every git-legal name outside the regex (repro: a dependency merged from branch `_wip` — reader `unblocked`, writer `dependency_no_ancestry_proof`). A merge_target read back out of the hand-editable queue file goes through the same predicate before it reaches git as an argv element."
    test: "scripts/tests/bats/test-aid-plan-release-boundary.bats"

  - id: plan_queue_append_locked
    type: 4
    source: "scripts/aid-queue-add.sh:529 (queue_append_entry)"
    instruction: n/a
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    description: "APPEND half — wired: aid-queue-add.sh delegates its only write to lib/aid-queue-write.sh:queue_append_entry, so the append and every later transition happen under the same <queue>.lock sidecar, and the duplicate check is re-run INSIDE the hold (aid-queue-add.sh's own pre-lock check cannot stop two concurrent adds). The write is mktemp-in-place + mv, so a crash never leaves a half-written queue."
    test: "scripts/tests/bats/test-aid-plan-release-boundary.bats"

  - id: plan_queue_entry_block_structure
    type: 4
    source: "scripts/lib/aid-queue-write.sh (_queue_validate_entry_block) + scripts/aid-queue-add.sh charset guards"
    instruction: n/a
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    description: "APPEND-DOOR INTEGRITY — wired: runs on every aid-queue-add.sh invocation. The locking row above covers HOW the append is written; this row covers WHAT may be written. queue_append_entry used to emit its caller's pre-rendered YAML block byte-for-byte with no validation, while aid-queue-add.sh interpolated six argument-reachable values (epic_id, epic_path, plan_ref, plan_id, merge_target, each depends_on element) into that block with no charset guard, so a single value carrying a newline appended extra `key: value` lines to the entry. A smuggled second `status:` line split the two queue readers apart — queue_get_field is first-key-wins, aid-fsm.sh:_queue_parse_to_json is last-key-wins — and made `queue-revalidate` report `unblocked` for an EPIC with no branch, no evidence and no merge commit, i.e. a queue status substituting for git ancestry proof, arriving through a script. Two layers now: aid-queue-add.sh REJECTS (usage error, nothing written) any of the six values outside its charset (ids by _queue_valid_id, paths by the exhaustive double-quoted-scalar guard _queue_valid_scalar, refs by _queue_valid_branch_ref), and the library independently re-derives the block's STRUCTURE — every non-blank line must be the single leading `  - epic_id: \"<id>\"` or a `    <key>: <value>` whose value is one of the four shapes this library writes, exactly one epic_id line, no repeated key, and the declared id must equal the id the duplicate check ran against. The library layer is the class closer: it does not depend on any caller validating first, which is how this defect arrived twice."
    test: "scripts/tests/bats/test-aid-plan-release-boundary.bats"

