#
# TTL guard: scripts/aid-registry-ttl-guard.sh exits non-zero when a
# `status: planned` row is past its `deadline` without a valid future
# `deferred_until`. Run this guard in CI to prevent enforcement-decay.
#
# Schema per entry:
#   id             snake_case (matches check-severity.yaml keys where they exist),
#                  else the audit E-id as a stable handle.
#   type           1–15 enforcement taxonomy (see docs/plans/AID-audit-2026-06/
#                  01-enforcement-inventory.md).
#   source         "file:line" of the enforcing code/config (primary anchor).
#   description    one line.
#   instruction    "file:line" of the human/LLM-facing rule, or n/a (internal
#                  guard), or planned (instruction exists, enforcement not wired).
#   severity       blocking | advisory | n/a
#   surface        llm-facing | internal-guard
#   status         active | planned | dead   (dead = present but never triggered)
#   verdict        ALIGNED | GAP | ORPHAN | CONTRADICTORY | UNREACHABLE | unmapped
#   test           regression gate file, if any
#
# TTL fields (optional per row — only meaningful on status: planned rows):
#   deadline       ISO 8601 date (YYYY-MM-DD). When today >= deadline and no
#                  valid deferred_until, aid-registry-ttl-guard.sh exits 1.
#   deferred_until ISO 8601 date (YYYY-MM-DD). If present and today <
#                  deferred_until the row is NOT stale regardless of deadline.
#   deferred_by    Free text; author of deferral decision (informational).
#   deferred_reason Free text; why this was deferred (informational).
#
# Coverage: E01–E86 carry full Phase-2 verdicts + evidence.
# E87–E177 carry a convention-derived instruction home + verdict: unmapped
# (a Phase-2 extension is the backfill task).
# =============================================================================
