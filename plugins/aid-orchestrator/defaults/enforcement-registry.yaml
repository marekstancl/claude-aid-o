    instruction: "defaults/execution.yaml (the `run_mode:` key and its comment) + docs/extending-aid.md (### The owned-job contract, grep: 'run_mode')"
    severity: blocking
    surface: llm-facing
    status: active
    verdict: ALIGNED
    description: "P076 Step 1-2 — `run_mode: foreground|background` is a per-gate key in execution.yaml, defaulting to foreground. The load-bearing property is that it is a CONTRACT, not a hint: every gate's value is validated UP FRONT, so a typo on the last gate refuses the run before the first gate's command is spawned, and a `background` declaration never silently degrades to the foreground path — a missing aid-job.sh supervisor or a missing evidence directory refuses the gate by name rather than running it unowned. Both refusals name the gate, the offending value and both accepted forms."
