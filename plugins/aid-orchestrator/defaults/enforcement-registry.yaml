    enforcement_degree: 3
    not_guaranteed: "That anyone acts on the notice. The registration itself is P074's (plan-state worktree_path, written by plan-start, cleared by plan-close/plan-rollback); this row is the READER: at every session start, and on `aid-plan-fsm.sh worktrees`, a recorded tree that is gone is reported with `--recreate-worktree`, and a terminal plan's tree still on disk with `plan-close`. NOTHING here ever removes a tree — a tree may hold work nobody has looked at — and the suite asserts the library contains no removal at all."
