sent/out-of-tree log or hash mismatch fails closed, so the receipt is consistent with its named command, reviewed HEAD, and named log rather than carrying a free 64-hex string. This is consistency-checking within the LOCAL AID trust model, NOT cryptographic provenance against an actor who can directly edit the evidence files (plan.json, verify files, the log, the receipt) — such an actor is out of scope here."
