  # ── IMP-262: controller-owned background job supervisor + AUTO liveness ──────
  - id: job_supervisor_liveness
    type: 3
    source: "scripts/aid-job.sh (run/status/collect/cancel/watchdog/redgreen)"
    instruction: "skills/pipeline.md Controller ownership and AUTO liveness; commands/aid-run.md AUTO liveness and ownership contract"
    severity: advisory
    surface: internal-guard
    status: active
    verdict: ALIGNED
    description: "IMP-262: standalone, OPT-IN controller-boundary supervisor for long-running commands/dispatches. `run` starts a command via setsid in its own process group and atomically writes a durable job record (id, PID + /proc starttime + child cookie, command-fingerprint sha256, start HEAD/tree, timestamps, hard deadline) before exec; `status` derives state from the owned process + terminal result ONLY (started/running/terminal_pass/terminal_fail/timed_out/cancelled/lost) and is PID-reuse-safe (an alive-but-reused PID whose /proc starttime no longer matches is lost, never running; a surviving tail -f is never liveness); `collect` is idempotent, never relaunches, exits 3 on a non-terminal job (a started/in-flight job is not test evidence) and marks a moved-tree result stale (exit 4) under --require-current; `cancel` signals the recorded PGID so no child is orphaned and writes a terminal cancellation result — and, per the PM review 2026-07-24 cancel-before-PID handshake, a cancel landing in the pre-PID window is never lost: cancel first drops a .cancel_requested marker (then signals a live group with a bounded retry), and the wrapper checks that marker (or an existing terminal result) at entry AND again after recording pid/pgid, immediately before exec, self-cancelling (terminal cancelled result, command never runs) — so a job can never START after a cancel is recorded; `watchdog` answers resume_needed when no owned job is live and no repo/evidence progress occurred within the interval; `redgreen` accepts only paired baseline-fail/fixed-pass receipts at different revisions with the same command fingerprint. Deliberately NOT a hard FSM/gate precondition and NOT release-blocking (no dogfood) — hence severity advisory. The .aid-o/ workspace is excluded from the tree fingerprint so the supervisor writing its own records never registers as drift."
    test: "scripts/tests/bats/test-aid-job.bats"

