    tier: t1
    description: "P080 Step 10 — the ecosystem artifact standard's brevity ceilings are enforced IN CODE at the renderer boundary, never asked for in prose: 5 result items, 3 'jak pokračovat' steps, 5 related links, ~220 chars per sentence, and per-block caps on the model-written prose (summary 320, core 300, ask 220). Overflow is never silent — it emits the declared overflow literal carrying the TRUE remaining count, so a truncated list reads as truncated rather than as the whole story. Blocks 1-4 and 6 always render; block 6 in particular is never omitted, because a silently absent ask block reads to a PM as 'nothing is required of me'. Blocks 5 and 7 render only when links, or an EXPLICIT detail target, are given — the library never infers a detail target. TIER: t1 (merge path)."
    recovery: "A cap breach is not a failure mode at run time — the renderer clips and reports the remainder. The test fails when a cap is removed, changed without the standard changing, or when overflow stops being counted; restore the constant rather than raising it to fit one caller."
    test: "scripts/tests/bats/test-aid-artifact-render.bats"

  - id: artifact_secret_redaction
    type: 4
    source: "scripts/lib/aid-artifact-render.sh (grep: '_aid_artifact_redact')"
    instruction: "/ecosystem/specs/artifact-standard"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t1
    description: "P080 Step 10 — the artifact standard forbids passwords, tokens, keys and FRAGMENTS of them in any artifact, and gate `output` fields carry arbitrary command output straight out of a run, so escaping alone is not a policy. Every input the library renders — facts_json, prose_json and any command output embedded in them — is scanned BEFORE a byte is written. Matches are REDACTED (<redacted:NAME>), not failed on: failing closed at the presentation layer would swallow the very message telling the PM a run broke. The redaction is COUNTED and the count is rendered in the provenance footer, so a redaction can never be silent, and escaping is applied AFTER redaction, never instead of it. Proven rather than asserted: the handoff harness ships fixtures deliberately carrying secret-shaped strings (all synthetic — a counting sequence, AWS's published documentation example, the bash.org joke password) and checks the page, the card AND the fallback card."
    recovery: "The failure shows the secret shape that reached the output. Add the pattern to the redaction table; never exempt a caller, and never move redaction after escaping."
    test: "scripts/tests/bats/test-aid-artifact-render.bats"

  - id: config_summary_read_only
    type: 4
    source: "scripts/aid-config-summary.sh (header: 'READ-ONLY CONTRACT')"
    instruction: "commands/aid-init.md (section: 'Closing output') + commands/aid-setup.md"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t0
    description: "P080 Step 7 — one script renders the effective AID configuration and BOTH /aid-init (as its closing output) and /aid-setup (before its module menu) present it verbatim, so a PM sees the same block from both commands instead of two improvised descriptions that drift. The read-only contract is the load-bearing half and it is PROVED, not declared: the suite snapshots the whole project tree around an invocation, runs the script against a write-protected tree, checks TMPDIR is left clean, and greps the source for any write operation. A missing workspace, a missing config file and an unparseable config file are REPORT LINES, not errors — a summary must be able to summarize a broken configuration rather than crash on it. No rendered value is ever empty; every absence renders as an explicit word. TIER: t0 (merge path)."
