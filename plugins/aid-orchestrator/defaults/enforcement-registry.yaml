  # ── P086: the harness hook layer ─────────────────────────────────────────
  # Every row below carries `enforcement_degree` on the ecosystem scale
  # (/ecosystem/specs/agent-hooks/): 1 = code decides and the model has no
  # vote; 2 = code checks the answer and refuses it; 3 = code DELIVERS data
  # into the prompt, which is a delivery and NOT a guarantee; 4 = prose.
  # A row without a degree is a row whose author has not said whether it
  # enforces or merely delivers, and `not_guaranteed` is where the honest
  # remainder goes.

