  - id: version_registry_sync
    type: 4
    source: "scripts/tests/verify-version-files.sh"
    instruction: "CLAUDE.md (section: 'Version File Registry')"
    severity: advisory
    surface: internal-guard
    status: active
    description: "P080 Step 16 — this repo's release convention is that 8 named locations are checked at the release boundary: seven carry the version and must agree, the eighth is the fixed AGPL licence line in README.md, asserted for PRESENCE only (it holds no version and therefore cannot 'agree' with one). verify-version-files.sh has existed since P079 and CP1 found it had no ceremony caller anywhere: it falls outside the test-*.sh glob that scripts/tests/run-all-tests.sh uses, aid-release.sh never calls it, and .github/workflows/version-sync.yml has the plugin check commented out ('Plugin has independent versioning'). Step 16 makes its invocation an explicit RELEASE-CEREMONY command in CLAUDE.md's pre-push check, replacing four eyeball greps. SURFACE AND SEVERITY, STATED HONESTLY: invocation-time at the release boundary — NOT a CI gate and NOT a suite member. That is a deliberate decision, not an omission: the version-carrying locations legitimately diverge mid-development, so a suite-wide run would fail every non-release commit. SEVERITY IS THEREFORE advisory, NOT blocking, and this is the correction of a real contradiction in the first version of this row: `blocking` is read by consumers as a claim that something refuses to proceed, and nothing here refuses anything — no gate runs this and no suite calls it. A row cannot describe its own unenforced surface in prose and still wear the severity of an enforced one; `verdict: GAP` records the absent enforcement, it does not license a severity the surface cannot back. If this ever gains a release-ceremony caller that fails closed, raise the severity in the same change that adds the caller — never before it. Its LOGIC is regression-tested (test-aid-release-seal.bats drives it over fixtures, including the two-CHANGELOGs-differ case); what is unenforced is that a human runs it, and this row says so rather than implying a gate. Note also what aid-release.sh itself covers in THIS repo: location 1 (root CHANGELOG.md) plus, through its no-config fallback, any other CHANGELOG.md it finds — there is no .aid-o/config/project.yaml here, so the versioning.files[] loop never runs and locations 3-8 stay MANUAL."
    verdict: GAP
    tier: n/a
    recovery: "Run `bash plugins/aid-orchestrator/scripts/tests/verify-version-files.sh <new_version> --baseline <old_version>` from the repo root before pushing a release. Exit 1 prints one FAIL line per FAILED CHECK (several checks are not about a location at all — the two CHANGELOG sections differing, a missing CHANGELOG entry, the optional baseline assertion); exit 2 is a usage error and prints no FAIL line, because nothing was checked. Fix the file, never the script."
    test: "scripts/tests/bats/test-aid-release-seal.bats"
  - id: worktree_report
    type: 6
    source: "scripts/aid-worktree-report.sh"
    instruction: "commands/aid-status.md (recipe: worktree-line)"
    severity: advisory
    surface: pm-facing
    status: active
    verdict: ALIGNED
    description: "2026-08-11 — the first version of this finding was wrong and the correction is the point. AID DOES tear down the worktree it creates: `_pfsm_teardown_worktree` is careful, locked and idempotent, and deliberately deletes nothing when it cannot take the lock. What nobody owns is everything created OUTSIDE `<root>/.aid-worktrees/plan-<id>` — hand-made trees (two sat in /opt/eco/projects since 2 and 10 August, merged and clean) and the frozen CP3 copies, whose name appears in NO script and NO skill of this plugin because a controller freezes them by hand to give CP3's two reviews one commit to agree on. Not merely disk: an orphan took down the shell-suite adapter that morning, because that suite scans the real repository and refused the dotted path, killing discovery for the whole portfolio. The report CLASSIFIES and never deletes — a foreign tree may be somebody's live work and a frozen tree is review evidence; automatic removal stays with the code that created the tree and knows it is done."
    recovery: "A line in /aid-status when something is stale, naming the count; the tool prints the verbatim cleanup command per class and states which class must not be deleted yet."
    test: "scripts/tests/bats/test-worktree-report.bats"

  - id: negative_assertion_soundness
    type: 4
    source: "scripts/tests/bats/test-helpers.bash (refute_grep)"
    instruction: "scripts/tests/bats/test-bats-test-helpers.bats"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t0
    description: "2026-08-12 - bash exempts a !-inverted command from set -e and bats' ERR trap inherits the exemption, so `! grep -q needle file` reports ok with the needle present. Ninety such lines were found across 24 suites, carrying exactly the assertions whose whole value is the negative: no secret leaks, no external URL, no pass label on a waived gate. refute_grep replaces the idiom and this suite guards the replacement, because the first hardened version treated grep's exit 2 as a successful refutation - the same defect under a better name, which is why an error must fail loudly rather than read as absence. 59 occurrences remain in 21 other suites (IMP-504)."
    recovery: "The failure prints grep's own stderr and the status it returned. Never widen refute_grep to accept a nonzero status it does not understand; add the case that explains the status instead."
    test: "scripts/tests/bats/test-bats-test-helpers.bats"

  - id: gate_command_required
    type: 4
    source: "scripts/aid-run-gates.sh (upfront profile-validation block)"
    instruction: "n/a"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t1
    description: "P083 Step 5 — a gate with no `command:` in a profile's `include[]` used to record `skip/no_command` and never touch `overall`, so a profile could carry a row that verifies nothing and no run would ever notice. Verified against this repository's own execution.yaml: `plan_diff` sat in five profiles (standard, full, release, bats_all_quarantine, release_quarantine) with no command for an unknown history — `git log -S 'aid-plan-diff.sh --plan'` over 16 tracked commits since 2026-08-04 shows the command was never present, not merely lost. The runner now refuses, by name, any active profile that includes a command-less gate, checked upfront (before any gate runs) against the ACTIVE profile's include[] only — a gate absent from every profile, or run with no --profile at all, is unaffected (unchanged backward-compatibility contract)."
    recovery: "The refusal names the gate, the profile and the config file. Add a `command:` to the named gate, or remove it from the profile's include[]."
    test: "scripts/tests/bats/test-gate-command-required.bats"

  - id: review_signal_toggle_fail_closed
    type: 4
    source: "scripts/lib/aid-review-signals.sh (_aid_read_toggle)"
    instruction: "n/a"
    severity: blocking
    surface: internal-guard
    status: active
    verdict: ALIGNED
    tier: t1
    description: "P083 Step 6 — `_aid_read_toggle` used `grep -qP` twice; on any grep without PCRE support, both calls exit 2 (error), the surrounding `if` reads that as false, and the function fell through to 'enabled' — a fail-open on production library code (aid-fsm.sh's plan-boundary checks, aid-release-policy.sh's C4 aggregator), invisible to the repository's own no-`grep -oP` guard because that guard never scanned this file. Rewritten in bash's own `[[ =~ ]]` with POSIX bracket classes only (no `\\s`/`\\b` PCRE shorthand, which bash's ERE genuinely rejects) — no external grep dependency for this check at all. The function now returns a THIRD state (rc=2, unreadable/malformed) distinct from both enabled(0) and disabled(1), and every call site was audited to make sure the distinction survives: aid-fsm.sh's two call sites fail CLOSED to enabled (rc=2 does not disable a plan-boundary check), and aid-release-policy.sh's two call sites report a distinct `toggle_unreadable` status rather than being flattened into `disabled`."
    recovery: "The refusal names the config file and the section. Fix the file's permissions (unreadable) or its `enabled:` value (malformed — must be exactly true or false)."
    test: "scripts/tests/bats/test-review-signal-toggle.bats"

  - id: gate_baseline_sequential_only
