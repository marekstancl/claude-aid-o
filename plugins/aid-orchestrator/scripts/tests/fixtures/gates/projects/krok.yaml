gates:
  typecheck-frontend:
    command: docker run --rm -v /opt/eco/projects/krok/frontend:/app -w /app krok-frontend:latest
      sh -c 'npx tsc --noEmit'
    max_retries: 2
    timeout_seconds: 300
    required: true
  build-frontend:
    command: docker run --rm -v /opt/eco/projects/krok/frontend:/app -w /app krok-frontend:latest
      sh -c 'rm -rf dist && npm run build'
    max_retries: 1
    timeout_seconds: 300
    required: true
  lint-backend:
    command: docker run --rm -v /opt/eco/projects/krok/backend:/app -w /app krok-backend:latest
      sh -c 'pip install -q ruff 2>/dev/null && ruff check .'
    max_retries: 1
    timeout_seconds: 300
    required: true
  test-backend:
    command: docker run --rm --network host -v /opt/eco/projects/krok/backend:/app
      -v /opt/eco/projects/krok/frontend:/frontend
      -w /app krok-backend:latest sh -c 'pip install -q pytest pytest-asyncio 2>/dev/null
      && pytest tests/ -q --deselect tests/test_api_departments.py::test_delete_department
      --deselect tests/test_auth.py::test_api_key_set_rejects_missing_header --deselect
      tests/test_auth.py::test_api_key_set_accepts_correct_header'
    max_retries: 1
    timeout_seconds: 600
    required: true
